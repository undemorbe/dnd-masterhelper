<title>Город, который нарисовали</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: master's reference desk — section rail on the left, the page in the middle, a notebook on the right. Prussian blue = Silas's eye, madder = blood/warnings. */
:root{
  --bg:#E7E6EB; --panel:#F3F2F6; --raised:#FFFFFF; --ink:#1B1922; --muted:#5E5A6B; --line:#CDCAD5;
  --accent:#1E4C7A; --accent-soft:#D6E1EE; --blood:#8E2424; --blood-soft:#F3DEDC;
  --tip:#2F6B52; --tip-soft:#DDEDE4; --spoil:#5A4A8A; --spoil-soft:#E6E1F2; --gold:#8A6A2A; --gold-soft:#F1E8D3;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --rail:270px; --notes:310px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121118; --panel:#1A1922; --raised:#211F2B; --ink:#E6E3EC; --muted:#9C97AA; --line:#302D3C;
  --accent:#86ABDB; --accent-soft:#1F2C40; --blood:#E07A72; --blood-soft:#3A1D1E; --tip:#78C49E; --tip-soft:#18302A;
  --spoil:#B0A2E6; --spoil-soft:#272240; --gold:#D6B46A; --gold-soft:#2E2718; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --panel:#1A1922; --raised:#211F2B; --ink:#E6E3EC; --muted:#9C97AA; --line:#302D3C;
  --accent:#86ABDB; --accent-soft:#1F2C40; --blood:#E07A72; --blood-soft:#3A1D1E; --tip:#78C49E; --tip-soft:#18302A;
  --spoil:#B0A2E6; --spoil-soft:#272240; --gold:#D6B46A; --gold-soft:#2E2718; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .eye{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--raised);border-color:var(--line);color:var(--ink);font-weight:500}
.search{flex:1 1 220px;min-width:0;display:flex}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.chip-btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--spoil-soft);border-color:var(--spoil);color:var(--spoil)}
.menu-btn{display:none}
.save-state{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--notes);min-height:calc(100% - 58px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:12px 10px 40px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.rail details{margin-bottom:4px}
.rail summary{cursor:pointer;list-style:none;font-family:var(--display);font-size:1.02rem;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.rail summary::-webkit-details-marker{display:none}
.rail summary:hover{background:var(--raised)}
.rail summary .count{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.nav-item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:5px 8px 5px 14px;border-radius:6px;cursor:pointer;font-size:.92rem;color:var(--ink)}
.nav-item:hover{background:var(--raised)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-item .num{font-family:var(--mono);font-size:.72rem;color:var(--muted);min-width:1.6em}
.nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;align-self:center}
.nav-item .pin{margin-left:auto;color:var(--gold);font-size:.8rem}
.rail .pinned-head{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}

main{min-width:0;padding:24px clamp(16px,3vw,40px) 80px}
.page{max-width:820px;margin:0 auto}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page h1{font-family:var(--display);font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.15;margin:.3em 0 .4em;color:var(--blood);text-wrap:balance}
.page h2{font-family:var(--display);font-size:1.45rem;margin:1.6em 0 .5em;padding-bottom:.2em;border-bottom:1px solid var(--line);text-wrap:balance;scroll-margin-top:80px}
.page h3{font-size:1.15rem;margin:1.3em 0 .4em;color:var(--accent)}
.page h4{font-size:1rem;margin:1em 0 .3em;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
.page p{margin:.5em 0}
.page ul,.page ol{padding-left:1.4em;margin:.5em 0}
.page li{margin:.2em 0}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.otoc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0 16px;font-size:.92rem}
.otoc b{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.otoc a{display:inline-block;margin:2px 12px 2px 0;text-decoration:none}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;background:var(--panel);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.rolled td{background:var(--gold-soft)}
.roll-row{display:flex;justify-content:flex-end;margin-top:-6px}
.box{border-radius:8px;padding:10px 14px;margin:12px 0;border-left:4px solid}
.box p{margin:.3em 0}
.box .box-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-right:4px}
.box-li{padding-left:1em;text-indent:-.8em}
.box-li::before{content:"— "}
.box.imp{background:var(--blood-soft);border-color:var(--blood)} .box.imp .box-label{color:var(--blood)}
.box.tip{background:var(--tip-soft);border-color:var(--tip)} .box.tip .box-label{color:var(--tip)}
.box.spoil{background:var(--spoil-soft);border-color:var(--spoil)} .box.spoil .box-label{color:var(--spoil)}
.box.quote{background:var(--gold-soft);border-color:var(--gold);font-style:italic;font-size:1.05rem}
body.players .box.spoil{display:none}
body.players .notes{display:none}
mark{background:var(--gold-soft);color:inherit;outline:1px solid var(--gold);border-radius:2px}

.notes{border-left:1px solid var(--line);background:var(--panel);padding:16px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.notes h3{font-family:var(--display);font-size:1.1rem;margin:0}
.notes .for{font-size:.85rem;color:var(--muted);margin-top:-6px}
.notes textarea{flex:1;min-height:260px;resize:vertical;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);line-height:1.5}
.notes .recent{font-size:.85rem}
.notes .recent button{display:block;background:none;border:0;padding:3px 0;color:var(--accent);cursor:pointer;text-align:left}
.hint{font-size:.82rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--blood);border-color:var(--blood)}
.btn.small{padding:3px 9px;font-size:.85rem}

/* trackers */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.card .sub{font-size:.85rem;color:var(--muted);margin:-4px 0 8px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap}
.trow label{font-size:.92rem}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;padding:0}
.pip.on{background:var(--accent);border-color:var(--accent)}
.pips.red .pip.on{background:var(--blood);border-color:var(--blood)}
.pips.gold .pip.on{background:var(--gold);border-color:var(--gold)}
.pips.violet .pip.on{background:var(--spoil);border-color:var(--spoil)}
.val{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:2.5em;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer;background:var(--panel)}
.chip[data-s="clean"],.chip[data-s="party"]{background:var(--tip-soft);border-color:var(--tip);color:var(--tip)}
.chip[data-s="cracked"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.chip[data-s="enemy"],.chip[data-s="cult"]{background:var(--blood-soft);border-color:var(--blood);color:var(--blood)}
.legend{font-size:.8rem;color:var(--muted);margin-top:6px}
.echo{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:4px 10px;align-items:center;font-size:.85rem}
.echo .pip{width:16px;height:16px}
select.inp,input.inp{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-width:100%}
.section-title{font-family:var(--display);font-size:1.6rem;margin:.2em 0 .6em;color:var(--blood)}

/* journal */
.entry{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.entry header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry .date{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.entry h4{margin:0;font-size:1.05rem}
.entry .txt{white-space:pre-wrap;margin:.4em 0}
.form{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form .row input{flex:1 1 160px;min-width:0}
.form textarea{min-height:120px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}

/* tools */
.dice{display:flex;gap:6px;flex-wrap:wrap}
.die{font-family:var(--mono);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer}
.die:hover{border-color:var(--accent);color:var(--accent)}
.result{font-family:var(--mono);font-size:2rem;color:var(--accent);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.hist{font-family:var(--mono);font-size:.8rem;color:var(--muted);max-height:140px;overflow:auto}
.init-list{list-style:none;padding:0;margin:8px 0}
.init-list li{display:grid;grid-template-columns:2.4em 1fr 4.5em auto;gap:6px;align-items:center;padding:5px 6px;border-radius:6px}
.init-list li.turn{background:var(--accent-soft)}
.init-list input{width:100%;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-family:var(--mono)}
.music a{display:block;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none}
.music small{display:block;color:var(--muted)}

.results .res{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.results .res b{font-family:var(--display);font-size:1.05rem}
.results .res .snip{font-size:.88rem;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-style:italic}

@media (max-width:1200px){
  .app{grid-template-columns:var(--rail) minmax(0,1fr)}
  .notes{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .menu-btn{display:inline-block}
  .topbar{position:static}
  .trow .pips .pip{width:20px;height:20px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .notes{grid-column:1}
  .brand{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
  <button class="btn small menu-btn" id="menuBtn" aria-label="Открыть список разделов">Разделы</button>
  <div class="brand"><span class="eye" aria-hidden="true"></span>Город, который нарисовали</div>
  <nav class="tabs" role="tablist" aria-label="Режимы">
    <button class="tab" role="tab" data-view="ref" aria-selected="true">Методичка</button>
    <button class="tab" role="tab" data-view="track" aria-selected="false">Трекеры</button>
    <button class="tab" role="tab" data-view="journal" aria-selected="false">Журнал</button>
    <button class="tab" role="tab" data-view="tools" aria-selected="false">Инструменты</button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Поиск по методичке: Корвин, Мазки, ловушки…" aria-label="Поиск"></div>
  <button class="chip-btn" id="playersBtn" aria-pressed="false" title="Скрывает тайны и заметки, чтобы можно было показать экран игрокам">Экран для игроков</button>
  <span class="save-state" id="saveState">загрузка…</span>
</header>

<div class="app">
  <aside class="rail" id="rail" aria-label="Разделы методички"></aside>
  <main id="main"><div class="page" id="page"></div></main>
  <aside class="notes" id="notes" aria-label="Заметки мастера">
    <h3>Заметки к разделу</h3>
    <div class="for" id="notesFor"></div>
    <textarea id="noteText" placeholder="Что случилось на сессии, что поменять, что игроки уже знают…"></textarea>
    <div class="hint" id="noteHint">Сохраняется автоматически.</div>
    <div class="recent" id="recentNotes"></div>
  </aside>
</div>

<script id="data" type="application/json">/*DATA*/</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.sections;
const byId = Object.fromEntries(S.map(s=>[s.id,s]));
const $ = (sel,root=document)=>root.querySelector(sel);
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function key(title){let h=0;for(const c of title){h=(h*31+c.codePointAt(0))>>>0}return 'k'+h.toString(36)}
S.forEach(s=>s.key=key(s.title));

/* ---------- storage: db capability, localStorage fallback ---------- */
const local = {
  get(k,d){try{const v=localStorage.getItem('gkn.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('gkn.'+k,JSON.stringify(v));return true}catch(e){return false}}
};
const store = {mode:'local', db:null, notes:local.get('notes',{}), trackers:local.get('trackers',null), journal:local.get('journal',[]), prefs:local.get('prefs',{pinned:[]})};
const saveState = $('#saveState');
function setStatus(t){saveState.textContent=t}
function modeLabel(){return store.mode==='db'?'сохранено в артефакте':store.mode==='file'?'сохранено в папке dnd':'только в этом браузере'}

const chains = {};
function queueWrite(path, data){
  if(store.mode==='file'){
    const prev=chains[path]||Promise.resolve(); setStatus('сохраняю…');
    chains[path]=prev.then(()=>fetch('api/store?path='+encodeURIComponent(path),{method:data===null?'DELETE':'PUT',headers:{'Content-Type':'application/json'},body:data===null?undefined:JSON.stringify(data)}))
      .then(r=>{if(!r.ok) throw {code:r.status}; setStatus(modeLabel())}).catch(e=>setStatus('не сохранилось: сервер не отвечает'));
    return;
  }
  if(store.mode!=='db') return;
  const prev = chains[path]||Promise.resolve();
  setStatus('сохраняю…');
  chains[path] = prev.then(()=>store.db.doc(path).set(data)).then(()=>setStatus(modeLabel())).catch(e=>{setStatus('не сохранилось: '+(e&&e.code||'ошибка'))});
}
function persistLocal(){local.set('notes',store.notes);local.set('trackers',store.trackers);local.set('journal',store.journal);local.set('prefs',store.prefs)}
const timers={};
function debounce(id,fn,ms){clearTimeout(timers[id]);timers[id]=setTimeout(fn,ms)}

function saveNote(k,text){
  store.notes[k]={text,updatedAt:Date.now()};
  if(store.mode==='db'||store.mode==='file') debounce('n'+k,()=>queueWrite('notes/'+k,store.notes[k]),700);
  else {local.set('notes',store.notes);setStatus(modeLabel())}
  renderRailDots(); renderRecent();
}
function saveTrackers(){
  if(store.mode==='db'||store.mode==='file') debounce('trk',()=>queueWrite('state/trackers',store.trackers),500);
  else {local.set('trackers',store.trackers);setStatus(modeLabel())}
}
function savePrefs(){
  if(store.mode==='db'||store.mode==='file') queueWrite('state/prefs',store.prefs);
  else local.set('prefs',store.prefs);
}
function saveEntry(e){
  const i=store.journal.findIndex(x=>x.id===e.id); if(i>=0) store.journal[i]=e; else store.journal.push(e);
  if(store.mode==='db'||store.mode==='file') queueWrite('journal/'+e.id,e); else {local.set('journal',store.journal);setStatus(modeLabel())}
}
function deleteEntry(id){
  store.journal=store.journal.filter(x=>x.id!==id);
  if(store.mode==='db'){store.db.doc('journal/'+id).delete().catch(()=>setStatus('не удалилось'))} else if(store.mode==='file') queueWrite('journal/'+id,null); else local.set('journal',store.journal);
}

async function connect(){
  let db=null;
  try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){db=null}
  if(!db){ await connectFile(); return; }
  store.db=db; store.mode='db'; setStatus(modeLabel());
  db.collection('notes').onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{const v=d.data(); if(v) m[d.id]=v});
    store.notes=m; renderRailDots(); renderRecent();
    const ta=$('#noteText'); if(document.activeElement!==ta && ta.dataset.key){ ta.value=(m[ta.dataset.key]||{}).text||'' }
  }, ()=>setStatus('заметки недоступны'));
  db.doc('state/trackers').onSnapshot(s=>{
    if(s.exists){ store.trackers=mergeDefaults(s.data()); if(view==='track' && !trackerFocus()) renderTrackers(); }
  }, ()=>{});
  db.doc('state/prefs').onSnapshot(s=>{ if(s.exists){ store.prefs=Object.assign({pinned:[]},s.data()); renderRail(); } }, ()=>{});
  db.collection('journal').onSnapshot(snap=>{
    store.journal=snap.docs.map(d=>d.data()).filter(Boolean);
    if(view==='journal' && !editingEntry) renderJournal();
  }, ()=>{});
}
async function connectFile(){
  if(location.protocol==='file:'){setStatus(modeLabel());return}
  try{
    const r=await fetch('api/store',{cache:'no-store'}); if(!r.ok) throw 0;
    const all=await r.json(); store.mode='file';
    const notes={},journal=[];
    for(const [p,v] of Object.entries(all)){
      const [c,id]=p.split('/');
      if(c==='notes') notes[id]=v; else if(c==='journal') journal.push(v);
      else if(p==='state/trackers') store.trackers=mergeDefaults(v);
      else if(p==='state/prefs') store.prefs=Object.assign({pinned:[]},v);
    }
    store.notes=notes; store.journal=journal;
    setStatus(modeLabel()); renderRail();
    if(view==='ref') go(current); else setView(view);
  }catch(e){ setStatus(modeLabel()) }
}
function trackerFocus(){const a=document.activeElement;return a && a.closest && a.closest('#page') && (a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA')}

/* ---------- trackers model ---------- */
const EMOTIONS=['Тоска','Скрытность','Зависть','Обжорство','Гнев','Страх','Гордыня','Оцепенение','Желание','Нежность'];
const WORDS=[['Тоска','Вы'],['Скрытность','несовершенны'],['Нежность','и'],['Страх','поэтому'],['Желание','живы'],['Гордыня','Совершенное'],['Зависть','не'],['Обжорство','меняется'],['Гнев','Неизменное'],['Оцепенение','мертво']];
const ARTS=['Картина','Фотография','Записи','Клетка со зверьком','Кинжал'];
function defaults(){return {
  act:'Акт I', location:'Мастерская художника',
  clocks:{canvas:0,cult:0,fear:0,feast:0}, flask:5,
  words:Object.fromEntries(WORDS.map(w=>[w[0],'none'])),
  arts:Object.fromEntries(ARTS.map(a=>[a,'none'])),
  pcs:{
    estel:{mazki:0,seal:'Тихая',thaw:0,echo:{}},
    velissa:{mazki:2,choice:'Не решено',echo:{}},
    uma:{mazki:0,distrust:0,kids:0,rank:'Лейтенант',echo:{}},
    tesori:{status:'В Картине'}
  },
  bonds:{ev:0,vu:0,ue:0,portrait:'Не создан'}
}}
function mergeDefaults(v){const d=defaults(); if(!v) return d;
  const out=Object.assign(d,JSON.parse(JSON.stringify(v)));
  for(const k of ['clocks','words','arts','bonds']) out[k]=Object.assign(defaults()[k],v[k]||{});
  out.pcs=Object.assign(defaults().pcs,v.pcs||{});
  for(const p of Object.keys(defaults().pcs)) out.pcs[p]=Object.assign(defaults().pcs[p],(v.pcs||{})[p]||{});
  return out}
store.trackers=mergeDefaults(store.trackers);

/* ---------- navigation ---------- */
const GROUP_ORDER=[]; S.forEach(s=>{if(!GROUP_ORDER.includes(s.group)) GROUP_ORDER.push(s.group)});
let current=null, view='ref', editingEntry=null;
const rail=$('#rail');
function renderRail(){
  const open=new Set([...rail.querySelectorAll('details[open]')].map(d=>d.dataset.g));
  const curGroup=current?byId[current].group:'Основы';
  let h='';
  const pins=(store.prefs.pinned||[]).filter(id=>byId[id]);
  if(pins.length){h+='<div class="pinned-head">Закреплено</div>'+pins.map(id=>navBtn(byId[id],true)).join('')}
  GROUP_ORDER.forEach(g=>{
    const items=S.filter(s=>s.group===g);
    const isOpen=open.size?open.has(g)||g===curGroup:g===curGroup;
    h+=`<details data-g="${esc(g)}" ${isOpen?'open':''}><summary>${esc(g)} <span class="count">${items.length}</span></summary>${items.map(s=>navBtn(s,false)).join('')}</details>`;
  });
  rail.innerHTML=h; renderRailDots();
}
function navBtn(s,pin){
  return `<button class="nav-item" data-id="${s.id}" ${s.id===current?'aria-current="true"':''}><span class="num">${s.n}</span><span>${esc(cap(s.title))}</span>${pin?'<span class="pin" aria-hidden="true">★</span>':'<span class="dot" hidden></span>'}</button>`;
}
const DISP=Object.fromEntries(S.map(s=>[s.title,s.disp]));
function cap(t){return DISP[t]||t}
function renderRailDots(){rail.querySelectorAll('.nav-item').forEach(b=>{const s=byId[b.dataset.id];const d=b.querySelector('.dot');if(d) d.hidden=!((store.notes[s.key]||{}).text||'').trim()})}
rail.addEventListener('click',e=>{const b=e.target.closest('.nav-item');if(b){go(b.dataset.id);rail.classList.remove('open')}});
$('#menuBtn').addEventListener('click',e=>{e.stopPropagation();rail.classList.toggle('open')});
document.addEventListener('click',e=>{if(rail.classList.contains('open')&&!e.target.closest('#rail')&&e.target.id!=='menuBtn') rail.classList.remove('open')});

function setView(v){
  view=v; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===v)));
  if(v==='ref') renderSection(current||S[0].id);
  if(v==='track') renderTrackers();
  if(v==='journal') renderJournal();
  if(v==='tools') renderTools();
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ $('#q').value=''; setView(t.dataset.view)}));

function go(id,highlight){
  if(!byId[id]) id=S[0].id;
  current=id; view='ref';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view==='ref')));
  renderSection(id,highlight); renderRail();
  try{history.replaceState(null,'','#'+id)}catch(e){}
  local.set('last',id);
}

const page=$('#page');
function renderSection(id,highlight){
  const s=byId[id]; current=id;
  const pinned=(store.prefs.pinned||[]).includes(id);
  const idx=S.indexOf(s), prev=S[idx-1], next=S[idx+1];
  page.innerHTML=`<div class="crumbs">${esc(s.group)} · раздел ${s.n}</div>
    <h1>${esc(cap(s.title))}</h1>
    <div class="page-actions">
      <button class="btn small" id="pinBtn">${pinned?'★ Открепить':'☆ Закрепить'}</button>
      ${prev?`<button class="btn small" data-go="${prev.id}">← ${esc(cap(prev.title))}</button>`:''}
      ${next?`<button class="btn small" data-go="${next.id}">${esc(cap(next.title))} →</button>`:''}
    </div>
    ${s.toc.length>2?`<nav class="otoc"><b>На странице</b>${s.toc.map(t=>`<a href="#${t[0]}" data-anchor="${t[0]}">${esc(t[1])}</a>`).join('')}</nav>`:''}
    <article id="article">${s.html}</article>`;
  addRollButtons(page);
  $('#pinBtn').addEventListener('click',()=>{const p=new Set(store.prefs.pinned||[]);p.has(id)?p.delete(id):p.add(id);store.prefs.pinned=[...p];savePrefs();renderSection(id);renderRail()});
  page.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.go);window.scrollTo(0,0)}));

  $('#notesFor').textContent=cap(s.title);

  renderRecent();
  if(highlight) markText($('#article'),highlight);
}
$('#noteText').addEventListener('input',e=>saveNote(e.target.dataset.key,e.target.value));

function renderRecent(){
  const items=S.filter(s=>((store.notes[s.key]||{}).text||'').trim()).sort((a,b)=>(store.notes[b.key].updatedAt||0)-(store.notes[a.key].updatedAt||0)).slice(0,8);
  $('#recentNotes').innerHTML=items.length?'<div class="hint">Заметки есть в разделах:</div>'+items.map(s=>`<button data-id="${s.id}">${esc(cap(s.title))}</button>`).join(''):'';
}
$('#recentNotes').addEventListener('click',e=>{const b=e.target.closest('button');if(b) go(b.dataset.id)});

/* roll on dX tables */
function addRollButtons(root){
  root.querySelectorAll('.tbl').forEach(t=>{
    const th=t.querySelector('th'); if(!th) return;
    const m=th.textContent.trim().match(/^(?:1?d)(\d+)$/i); if(!m) return;
    const sides=+m[1]; const rows=[...t.querySelectorAll('tbody tr')];
    const wrap=document.createElement('div'); wrap.className='roll-row';
    const b=document.createElement('button'); b.className='btn small'; b.textContent='Бросить d'+sides;
    b.addEventListener('click',()=>{const r=1+Math.floor(Math.random()*sides);rows.forEach(x=>x.classList.remove('rolled'));
      const row=rows.find(x=>{const c=x.cells[0].textContent.trim();if(c==String(r))return true;const mm=c.match(/^(\d+)\D+(\d+)$/);return mm&&r>=+mm[1]&&r<=+mm[2]});
      b.textContent='Выпало '+r+' · бросить ещё'; if(row){row.classList.add('rolled');row.scrollIntoView({block:'nearest',behavior:'smooth'})}});
    wrap.appendChild(b); t.after(wrap);
  });
}

/* ---------- search ---------- */
const q=$('#q');
q.addEventListener('input',()=>debounce('search',runSearch,180));
function norm(t){return t.toLowerCase().replace(/ё/g,'е')}
function runSearch(){
  const term=q.value.trim(); if(term.length<2){ if(view==='ref') renderSection(current||S[0].id); return }
  const nt=norm(term);
  const res=[];
  S.forEach(s=>{const hay=norm(s.title+' '+s.text);let i=hay.indexOf(nt),c=0,first=-1;while(i>=0){c++;if(first<0)first=i;i=hay.indexOf(nt,i+nt.length)}
    const note=((store.notes[s.key]||{}).text||''); const inNote=norm(note).includes(nt);
    if(c||inNote){const src=s.title+' '+s.text;const st=Math.max(0,first-70);res.push({s,c,inNote,snip:first>=0?(st?'…':'')+src.slice(st,first+nt.length+90)+'…':''})}});
  res.sort((a,b)=>b.c-a.c);
  view='ref'; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view==='ref')));
  page.innerHTML=`<div class="crumbs">Поиск</div><h1>«${esc(term)}»</h1><div class="hint">${res.length?`Найдено в ${res.length} разделах`:'Ничего не найдено. Попробуйте другое слово или часть слова.'}</div>
   <div class="results">${res.map(r=>`<button class="res" data-id="${r.s.id}"><b>${esc(cap(r.s.title))}</b> <span class="hint">${r.c} совп.${r.inNote?' · есть в заметках':''}</span><div class="snip">${hl(esc(r.snip),term)}</div></button>`).join('')}</div>`;
  page.querySelectorAll('.res').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.id,term);const m=page.querySelector('mark');if(m) m.scrollIntoView({block:'center'})}));
}
function hl(html,term){const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[её]/gi,'[её]'),'gi');return html.replace(re,m=>'<mark>'+m+'</mark>')}
function markText(root,term){
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[её]/gi,'[её]'),'gi');
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode()) if(re.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
  nodes.forEach(n=>{re.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;const v=n.nodeValue;while((m=re.exec(v))){f.append(v.slice(last,m.index));const mk=document.createElement('mark');mk.textContent=m[0];f.append(mk);last=m.index+m[0].length}f.append(v.slice(last));n.replaceWith(f)});
  const first=root.querySelector('mark'); if(first) setTimeout(()=>first.scrollIntoView({block:'center'}),30);
}

function pips(path,max,val,cls){let h=`<div class="pips ${cls||''}" data-path="${path}" data-max="${max}">`;for(let i=1;i<=max;i++)h+=`<button class="pip ${i<=val?'on':''}" data-v="${i}" aria-label="${i}"></button>`;return h+`</div><span class="val">${val}/${max}</span>`}
function getP(path){return path.split('.').reduce((o,k)=>o?o[k]:undefined,store.trackers)}
function setP(path,v){const ks=path.split('.');let o=store.trackers;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]]}o[ks.at(-1)]=v}
const WSTATES=['none','cracked','clean','enemy'], WLAB={none:'нет',cracked:'надтреснуто',clean:'чисто',enemy:'у врага'};
const ASTATES=['none','party','cult'], ALAB={none:'не найден',party:'у героев',cult:'у культа'};
function echoGrid(pc){const e=store.trackers.pcs[pc].echo||{};return `<div class="echo">${EMOTIONS.map(m=>`<span>${m}</span>${pips('pcs.'+pc+'.echo.'+m,3,e[m]||0,'violet')}`.replace('<span class="val">','<span class="val" hidden>')).join('')}</div>`}

  page.querySelectorAll('.pips').forEach(p=>p.addEventListener('click',e=>{const b=e.target.closest('.pip');if(!b)return;const cur=getP(p.dataset.path)||0;let v=+b.dataset.v;if(v===cur)v=cur-1;setP(p.dataset.path,v);saveTrackers();renderTrackers()}));

/* ---------- journal ---------- */
function today(){const d=new Date();return d.toISOString().slice(0,10)}
function renderJournal(){
  const list=[...store.journal].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
  page.innerHTML=`<div class="crumbs">Журнал сессий</div><h1>Журнал</h1>
  <form class="form" id="jForm"><div class="row"><input class="inp" id="jTitle" placeholder="Название сессии, например «Разделённый холст»" required><input class="inp" id="jDate" type="date" value="${today()}" style="flex:0 1 170px"></div>
  <textarea id="jText" placeholder="Что произошло, какие решения приняли игроки, какие крючки остались открытыми…"></textarea>
  <div class="row"><button class="btn primary" type="submit">Добавить запись</button></div></form>
  <div id="jList">${list.length?list.map(entryHtml).join(''):'<p class="empty">Записей пока нет. Добавьте первую после ближайшей сессии: так будет проще вспомнить, на чём остановились.</p>'}</div>`;
  $('#jForm').addEventListener('submit',e=>{e.preventDefault();const t=$('#jTitle').value.trim();if(!t)return;const id='e'+Date.now().toString(36);saveEntry({id,title:t,date:$('#jDate').value||today(),text:$('#jText').value,createdAt:Date.now()});renderJournal()});
  $('#jList').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;const en=store.journal.find(x=>x.id===id);
    if(b.dataset.act==='edit'){editingEntry=id;const box=b.closest('.entry');box.innerHTML=`<div class="form"><div class="row"><input class="inp" id="eT" value="${esc(en.title)}"><input class="inp" id="eD" type="date" value="${esc(en.date||'')}" style="flex:0 1 170px"></div><textarea id="eX">${esc(en.text||'')}</textarea><div class="row"><button class="btn primary" data-act="save" data-id="${id}">Сохранить</button><button class="btn" data-act="cancel">Отмена</button></div></div>`}
    if(b.dataset.act==='save'){editingEntry=null;saveEntry(Object.assign({},en,{title:$('#eT').value,date:$('#eD').value,text:$('#eX').value}));renderJournal()}
    if(b.dataset.act==='cancel'){editingEntry=null;renderJournal()}
    if(b.dataset.act==='del'){b.outerHTML=`<span class="hint">Удалить запись?</span> <button class="btn small danger" data-act="del2" data-id="${id}">Да, удалить</button> <button class="btn small" data-act="cancel">Нет</button>`}
    if(b.dataset.act==='del2'){deleteEntry(id);renderJournal()}
  });
  $('#notesFor').textContent='Общие заметки кампании'; const ta=$('#noteText'); ta.dataset.key='general'; ta.value=(store.notes.general||{}).text||'';
}
function entryHtml(en){return `<article class="entry"><header><span class="date">${esc(en.date||'')}</span><h4>${esc(en.title)}</h4></header><div class="txt">${esc(en.text||'')}</div><div class="row" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" data-act="edit" data-id="${en.id}">Изменить</button><button class="btn small" data-act="del" data-id="${en.id}">Удалить</button></div></article>`}

/* ---------- tools ---------- */
let diceHist=local.get('dice',[]); let init=local.get('init',[]); let turn=local.get('turn',0);
function roll(n){return 1+Math.floor(Math.random()*n)}
function evalDice(expr){
  const s=expr.replace(/\s+/g,'').toLowerCase().replace(/д/g,'d'); if(!/^[0-9d+\-]+$/.test(s)) return null;
  let total=0,parts=[];const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;let m,used=0;
  while((m=re.exec(s))){used+=m[0].length;if(m[3]){const c=+(m[2]||1),f=+m[3];if(c>100||f>1000)return null;const r=[];for(let i=0;i<c;i++)r.push(roll(f));const sum=r.reduce((a,b)=>a+b,0);const sg=m[1]==='-'?-1:1;total+=sg*sum;parts.push((m[1]||'')+c+'d'+f+'['+r.join(',')+']')}else{const sg=m[4]==='-'?-1:1;total+=sg*(+m[5]);parts.push((m[4]||'+')+m[5])}}
  if(used!==s.length) return null; return {total,detail:parts.join(' ')};
}
function pushHist(label,res){diceHist.unshift(label+' → '+res);diceHist=diceHist.slice(0,20);local.set('dice',diceHist)}
function renderTools(){
  const cheat=S.find(s=>s.title.startsWith('ШПАРГАЛКА'));
  page.innerHTML=`<div class="crumbs">За столом</div><h1>Инструменты</h1>
  <div class="grid">
    <section class="card"><h3>Кости</h3>
      <div class="dice">${[4,6,8,10,12,20,100].map(n=>`<button class="die" data-d="${n}">d${n}</button>`).join('')}</div>
      <div class="dice" style="margin-top:8px"><button class="die" data-adv="1">d20 с преимуществом</button><button class="die" data-adv="-1">d20 с помехой</button></div>
      <form id="exprF" class="row" style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="expr" placeholder="2d6+3" style="flex:1;min-width:0" aria-label="Формула броска"><button class="btn">Бросить</button></form>
      <div class="result" id="dRes">—</div><div class="hint" id="dDet">&nbsp;</div>
      <div class="hist" id="dHist">${diceHist.map(esc).join('<br>')}</div>
    </section>
    <section class="card"><h3>Инициатива</h3>
      <form id="iniF" style="display:flex;gap:6px;flex-wrap:wrap"><input class="inp" id="iniN" placeholder="Имя" style="flex:1 1 120px;min-width:0" aria-label="Имя"><input class="inp" id="iniV" type="number" placeholder="Иниц." style="width:5.5em" aria-label="Инициатива"><button class="btn">Добавить</button></form>
      <ul class="init-list" id="iniL"></ul>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" id="iniNext">Следующий ход</button><button class="btn small" id="iniSort">Сортировать</button><button class="btn small" id="iniClr">Очистить</button></div>
      <div class="hint" style="margin-top:6px">Хиты можно править прямо в списке.</div>
    </section>
    <section class="card music"><h3>Музыка</h3>${D.music.map(m=>`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.scene)}<small>${esc(m.where)}</small></a>`).join('')}</section>
  </div>
  ${cheat?`<h2 class="section-title" style="margin-top:28px">Шпаргалка мастера</h2><div>${cheat.html}</div>`:''}`;
  page.querySelectorAll('.die').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.d){const n=+b.dataset.d,r=roll(n);$('#dRes').textContent=r;$('#dDet').textContent='d'+n;pushHist('d'+n,r)}
    else{const a=roll(20),c=roll(20),adv=b.dataset.adv==='1';const r=adv?Math.max(a,c):Math.min(a,c);$('#dRes').textContent=r;$('#dDet').textContent=(adv?'преимущество':'помеха')+' ['+a+', '+c+']';pushHist('d20 '+(adv?'преим.':'помеха'),r)}
    $('#dHist').innerHTML=diceHist.map(esc).join('<br>')}));
  $('#exprF').addEventListener('submit',e=>{e.preventDefault();const x=$('#expr').value;const r=evalDice(x);if(!r){$('#dDet').textContent='Не понял формулу. Пример: 2d6+3 или 1d20-1';return}$('#dRes').textContent=r.total;$('#dDet').textContent=r.detail;pushHist(x,r.total);$('#dHist').innerHTML=diceHist.map(esc).join('<br>')});
  const L=$('#iniL');
  function drawInit(){L.innerHTML=init.map((c,i)=>`<li class="${i===turn?'turn':''}"><span class="val" style="text-align:left">${esc(c.v)}</span><span>${esc(c.n)}</span><input type="text" value="${esc(c.hp||'')}" data-i="${i}" placeholder="хиты" aria-label="Хиты ${esc(c.n)}"><button class="btn small" data-rm="${i}" aria-label="Убрать ${esc(c.n)}">×</button></li>`).join('')||'<li class="empty">Добавьте участников боя.</li>';local.set('init',init);local.set('turn',turn)}
  drawInit();
  $('#iniF').addEventListener('submit',e=>{e.preventDefault();const n=$('#iniN').value.trim();if(!n)return;init.push({n,v:$('#iniV').value||roll(20),hp:''});$('#iniN').value='';$('#iniV').value='';drawInit()});
  L.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){init.splice(+b.dataset.rm,1);if(turn>=init.length)turn=0;drawInit()}});
  L.addEventListener('input',e=>{const i=e.target.dataset.i;if(i!=null){init[+i].hp=e.target.value;local.set('init',init)}});
  $('#iniNext').addEventListener('click',()=>{if(init.length){turn=(turn+1)%init.length;drawInit()}});
  $('#iniSort').addEventListener('click',()=>{init.sort((a,b)=>(+b.v)-(+a.v));turn=0;drawInit()});
  $('#iniClr').addEventListener('click',()=>{init=[];turn=0;drawInit()});
  addRollButtons(page);
  $('#notesFor').textContent='Общие заметки кампании'; const ta=$('#noteText'); ta.dataset.key='general'; ta.value=(store.notes.general||{}).text||'';
}

/* ---------- players mode ---------- */
const pb=$('#playersBtn');
function setPlayers(on){document.body.classList.toggle('players',on);pb.setAttribute('aria-pressed',String(on));local.set('players',on)}
pb.addEventListener('click',()=>setPlayers(pb.getAttribute('aria-pressed')!=='true'));
setPlayers(!!local.get('players',false));

/* ---------- boot ---------- */
const start=(location.hash||'').slice(1);
current=byId[start]?start:(local.get('last',null)&&byId[local.get('last',null)]?local.get('last',null):(S.find(s=>s.title.startsWith('МАСТЕРСКАЯ'))||S[0]).id);
go(current);
setStatus(modeLabel());
connect();
})();
</script>
