щество, живущее и в картине, и в мире, она сможет «съесть» саму Картину — и весь город внутри. Атмосфера Запах жареного мяса, сахарной ваты и гнили одновременно. Музыка шарманки не прекращается ни на минуту. Если она смолкнет — значит, кто-то кого-то ест. Артисты улыбаются, но у всех одинаково округлившиеся животы и пустые глаза. Шатры «переваривают» то, что в них оставили: забытые вещи наутро исчезают. Правило локации: Голод Важно Каждый раз, когда персонаж ест или пьёт в зверинце (а угощают постоянно и отказ — оскорбление), он восстанавливает 1d6 хитов, но проходит спасбросок Телосложения СЛ 13. Провал — 1 Отголосок Обжорства . Персонаж с Отголоском Обжорства должен съедать двойной паёк, иначе получает 1 уровень истощения за долгую передышку. Отказ от угощения без причины — −1 отношение артистов и шанс, что Лукреция заметит гостей. Зоны Зона Что там Опасность Ворота-пасть Арка в форме открытого рта; билетёр-клоун Кто не платит — платит собой (1 предмет «съедает» арка) Аллея клеток Экзотические звери, часть — люди в костюмах зверей Голодные звери; клетки открываются по звуку шарманки Игорный шатёр Карты, кости, Buckshot Ставки на предметы, хиты и воспоминания Шатёр кривых зеркал Отражения показывают героев толстыми, голодными, съеденными Отражение может выйти наружу Пиршественный шатёр Бесконечный стол, Пир каждую ночь Голод; обжоры-гости Шатёр-желудок Внутренний шатёр, стены тёплые и влажные Кислота, переваривание Кухня Гуго Огромные котлы, разделочные столы Повар и его подмастерья Личная коллекция Вагон Лукреции, чёрные клетки Клетка с Кисточкой Ключевые NPC Лукреция Морвейл — хозяйка, Сосуд Обжорства Человек, огромная, в платье из сшитых занавесов. Ест изящно, маленькой серебряной вилкой — но непрерывно. Обаятельна, щедра, остроумна. Обожает гостей — как блюда. Съела уже: огненную саламандру (дышит дымом), сирену (её голос гипнотичен), мимика (может растягиваться). Что хочет: съесть Кисточку и через него — Картину. Насытиться наконец. Реплика: «Голод — это просто любовь, у которой нет терпения.» Шаэл Найтблум — дрессировщица Дроу, в шрамах от когтей. Единственная, кто любит зверей , а не хочет их съесть. Тайно кормит Кисточку и знает, что он «просится к холсту» — тянется к любому рисунку. Что хочет: освободить всех зверей. Будет союзником, если герои пообещают выпустить не только Кисточку. Зерик Нокт — акробат Тифлинг, худой как тень — единственный, кто не ест (его Обжорство вывернулось наизнанку: он не может проглотить ни кусочка). Хочет сбежать. Знает все ходы между шатрами. Крючок: у него татуировка с символом культа. Он был культистом и сбежал. Знает, где Нерисса держит лагерь. Второстепенные NPC NPC Кто Крючок / функция Толстый Гуго Повар, полуогр Готовит всё, что принесут. Если принести ему «правильный ингредиент» (растворитель, соль, полынь) — приготовит блюдо, вызывающее у Лукреции тошноту (прерывание подготовки). Кайрон Пепельный Ворон Метатель ножей Информатор культа. Ставит на героев в Игорном шатре и продаёт сведения о них Нериссе. Билетёр-клоун Пип-Пип Клоун у ворот Безобиден, но рот у него — до ушей. Говорит загадками; его загадки — подсказки по шатрам. «Человек-медведь» Пленник в клетке Охотник из Бастиона, зашитый в медвежью шкуру. Знает Дрейвена Нокса. Крючок к карьеру. Мадам Тасса Гадалка Гадает на картах, которые «съедают» неверные ответы. Раз за визит даёт правдивый ответ — за еду. Мини-игра: ставки в Игорном шатре Здесь работает Buckshot (см. раздел Мини-игры). Ставки: Ставка героя Ставка заведения Предмет Предмет того же уровня (или ключ от личной коллекции) 1d6 хитов максимума до долгой передышки Сведения о Лукреции Одно воспоминание (как в Мглине) Свободный проход к Кисточке на 10 минут «Место за столом» (герой будет блюдом на Пиру) Клетка с Кисточкой — финальная ставка Совет мастеру Финальная игра против самой Лукреции — отличная альтернатива боссу. Если герои выиграют, она отдаёт клетку (Обжорство не может нарушить уговор за едой). Проигрыш — герой становится главным блюдом Пира, и остальные должны его спасать. Ловушки Ловушка Описание Обход Арка-пасть Каждый проходящий без билета теряет 1 предмет (случайный) Купить билет (едой); пролезть через шатры с Зериком Шарманка Пока играет — звери спят. Если смолкнет — клетки открываются на Аллее Охранять шарманщика; крутить ручку самому Кривые зеркала Отражение героя выходит наружу «голодным»: двойник с теми же хитами, атакует владельца Разбить зеркало до выхода; не смотреть дольше раунда Пиршественный стол Сел — не можешь встать, пока не съешь всё (спасбросок Силы СЛ 14 каждый раунд) Не садиться; привязать себя верёвкой Шатёр-желудок Стены сокращаются: 2d6 кислоты в начале хода в центре шатра; выход «закрывается» через 3 раунда Двигаться вдоль стенки; огнём заставить шатёр «срыгнуть» Пол-батут Над ямой с «обитателями» (живые отбросы Пира) натянута ткань Внимательность СЛ 14; идти по шестам Сюжетные линии Последнее блюдо. Лукреция назначила Пир на третью ночь после прихода героев. В эту ночь она съест Кисточку. Таймер локации. Освобождение зверей. Шаэл хочет выпустить всех. Если выпустить всех — в топях появятся новые опасности (и союзники), Лукреция слабеет (−20 хитов). Кисточка тянется к холсту. Если герои пронесут Картину рядом с личной коллекцией — Кисточка начнёт рваться к ней; клетка из чёрного железа его удерживает. Без клетки он убежит в Картину, и достать его придётся изнутри города (линия с Тесори и Сайласом). Охотник в шкуре. «Человек-медведь» — разведчик Бастиона. Спасти его — получить союзника для карьера и знание о кинжале. Квесты Квест Кто даёт Суть Награда «Последнее блюдо» (основной) — Забрать Кисточку в клетке до третьей ночи Клетка со зверьком (артефакт) «Открытые клетки» Шаэл Выпустить всех зверей Шаэл — союзник; зверь-компаньон «Лёгкий как тень» Зерик Вывести его из зверинца Карта лагеря Нериссы; Зерик — проводник «Блюдо от шефа» Толстый Гуго Принести три редких ингредиента Отравленное блюдо (прерывание «Великого глотка») «Человек-медведь» Пленник Освободить и вылечить его Союзник-охотник; пропуск в Бастион Босс: Лукреция Морвейл, «Ненасытная» Параметр Значение Хиты 120 (уровень 6) / 160 (уровень 7+) КД 13 Особенность Поглощённые дары: дыхание дымом (конус 4,5 м, 3d6 огня), голос сирены (спасбросок Мудрости СЛ 14 или очарован 1 раунд), растяжение (досягаемость 4,5 м) Атака Удар вилкой-трезубцем: 2d10 колющего; Укус: 3d8 колющего, восстанавливает половину нанесённого урона Подготовка «Великий глоток» — она раскрывает рот до пола. Если не прервать — проглатывает героя: тот ослеплён, опутан, 3d6 кислоты в начале своего хода, может атаковать изнутри (КД 10); выйдет, если нанести 25 урона изнутри Прерывание Скормить ей что-то другое (бросить предмет, еду, зелье — она рефлекторно глотает), отравленное блюдо Гуго, 20+ урона за раунд Надлом Каждое прерывание «Великого глотка» вызывает тошноту: она выплёвывает один из поглощённых даров и теряет его до конца боя Тайна · только для мастера Лукреция по-настоящему никогда не была сыта. Если герои дадут ей что-то, что насыщает не тело — например, честный рассказ, песню, обед, разделённый за одним столом без голода, — Обжорство отступит. Мирное завершение возможно, но требует, чтобы кто-то из героев сел с ней за стол и не стал есть. Награды локации Клетка со зверьком (артефакт ритуала): Кисточка в клетке из чёрного железа. Вилка-трезубец Лукреции (оружие поздних уровней, см. раздел оружия), Гарпун дрессировщицы (уровень 3). Зверь-компаньон (если клетки открыты): по выбору мастера. Личные крючки героев Эстел — сестра. В Аллее клеток сидит девочка-табакси лет двенадцати с табличкой «Дикая кошка-оборотень. Не кормить с руки». Шаэл зовёт её Искоркой . Она не помнит ни родителей, ни брата — её продали младенцем после налёта на клан. На шее — детский шнурок с клановым узлом, таким же, как Эстел видел у матери. Лукреция бережёт её «на десерт после Последнего блюда». Если героям не до неё — она станет следующей ставкой в Игорном шатре. Ума — ребёнок, который не летит. В личной коллекции Лукреции — фэйри-ребёнок с подрезанными крыльями (Лукреция ест крылья фэйри как сладость). Девочка боится высоты и плачет, когда видит Уму в форме. Научить её снова летать (несколько проверок, сцена на шестах над Полом-батутом) — прямое искупление старой ошибки Умы. Велисса — «питомцы». Лукреция предлагает купить Велиссу в коллекцию: «Нарисованная фея — я такого ещё не пробовала». Её Голод отзывается на Желание в Велиссе: каждый раз, когда Велисса использует очарование в зверинце, Лукреция чувствует, где она. Тайна · только для мастера Кисточка несёт Нежность — одну из тихих эмоций Посланца (см. раздел 21). Поэтому он живой, поэтому к нему тянутся дети и звери, и поэтому Лукреция хочет его съесть: Обжорство — это Нежность, которой не хватило терпения. Находки Зверинца Предмет Где Эффект Гарпун дрессировщицы Шаэл / Аллея клеток Оружие 3 уровня Горелка лампадаря Кухня Гуго Оружие 3 уровня Вилка-трезубец Лукреции Лукреция Оружие поздних уровней (+1) Клетка из чёрного железа Личная коллекция Часть артефакта: удерживает нарисованных существ Ключ без замка (из списка предметов) Открывает клетку из чёрного железа без шума Ремешок укротителя Шаэл Преимущество на Уход за животными; 1 раз в день успокоить зверя Пирог Гуго (3) Кухня +2d6 хитов, но бросок Голода Фишки Игорного шатра Выигрыш в Buckshot Обмен на любой предмет зверинца Кривое зеркальце Шатёр кривых зеркал Показывает, чем существо «голодно»: его главное желание Перо сирены Трофейный шкаф Лукреции 1 раз: заклинание «Внушение» без ячейки Кровь чудовища (2) Лукреция Материал для уникальных улучшений Тяжёлые выборы Зверинца Выбор Почему тяжело Кого спасать до Пира В ночь Последнего блюда стража стоит у трёх клеток: Кисточка (артефакт), Искорка (сестра Эстела) и фэйри-ребёнок (искупление Умы). Успеть ко всем трём можно, только разделив партию — и рискуя всеми Открыть все клетки Шаэл просит выпустить всех. Тогда в Солёных топях появятся голодные хищники, и ближайшая деревня окажется под угрозой Сесть за стол с Лукрецией Мирное завершение требует, чтобы кто-то сел с ней и не ел весь Пир. Провал — герой становится блюдом Финальная ставка в Buckshot Можно выиграть клетку без боя, поставив на кон самого себя"}, {"id": "s17", "n": 17, "title": "КАРЬЕР «ГЛОТКА» И БАСТИОН ОХОТНИКОВ", "disp": "Карьер «Глотка» и бастион охотников", "group": "Акт II", "html": "<p><strong>Артефакт:<\/strong> Кинжал. <strong>Эмоция:<\/strong> Гнев. <strong>Рекомендуемый уровень:<\/strong> 6–8. <strong>Музыка:<\/strong> Сильный бой, Hunter Nightmare, Крыса / Iron Crown.<\/p><p>На краю Кратера, где земля до сих пор горячая, стоит <strong>Бастион Охотников<\/strong> — крепость из чёрного камня. Под ним — карьер <strong>«Глотка»<\/strong>, где рабы добывают <strong>небесное железо<\/strong> из обломков Посланца. Сорок лет назад охотники защищали остров от чудовищ. Теперь они охотятся на людей.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Сосуд Гнева — <strong>лорд-охотник Корвин Блэкторн<\/strong>. Он носит ритуальный кинжал <strong>Мастихин Звёздного Железа<\/strong>, выкованный из первого найденного обломка Посланца. Кинжал режет <strong>всё<\/strong>: плоть, краску, пространство. Им же Ирена Вейл разрезала оболочку Посланца сорок лет назад. Гнев здесь двусторонний: охотники пьянеют от власти, а рабы — от ненависти. Оба гнева кормят друг друга.<\/p><\/div><h2 id=\"s17-1\">Атмосфера<\/h2><ul><li>Звон кирок и цепей, крики надсмотрщиков. Небо красное от пыли.<\/li><li>Камни небесного железа светятся тусклым синим, как глаз Сайласа.<\/li><li>В Бастионе — трофеи: головы чудовищ, но среди них и человеческие.<\/li><li>Рабы молчат днём и поют ночью. Песня становится всё злее.<\/li><\/ul><h2 id=\"s17-2\">Правило локации: Ярость<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый раз, когда персонаж получает урон в бою, он получает <strong>1 жетон Ярости<\/strong>. При 3 жетонах персонаж в свой ход <strong>обязан<\/strong> атаковать ближайшее существо (даже союзника, если оно ближе всех), если не пройдёт спасбросок Мудрости СЛ 14. Персонаж с жетонами получает +1 к урону за каждый жетон. Жетоны сбрасываются после короткой передышки. Если персонаж закончил бой с 3 жетонами — <strong>1 Отголосок Гнева<\/strong>.<\/p><\/div><h2 id=\"s17-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Дорога Черепов<\/td><td>Подъём к Бастиону, колья с черепами<\/td><td>Патрули охотников<\/td><\/tr><tr><td>Ворота Бастиона<\/td><td>Подъёмный мост, требуется пропуск или «добыча»<\/td><td>Стража, баллисты<\/td><\/tr><tr><td>Двор Охоты<\/td><td>Тренировочная арена, псарни<\/td><td>Охотничьи псы-чудовища<\/td><\/tr><tr><td>Часовня Мастихина<\/td><td>Алтарь, где хранится кинжал между охотами<\/td><td>Освящённая ловушка<\/td><\/tr><tr><td>Зал Трофеев<\/td><td>Головы чудовищ — и людей<\/td><td>Трофей Посланца (оживает)<\/td><\/tr><tr><td>Карьер «Глотка»<\/td><td>Спиральная яма до дна Кратера<\/td><td>Обвалы, рабочие, газ<\/td><\/tr><tr><td>Арена Ям<\/td><td>Бои рабов на потеху охотникам<\/td><td>Рагнар Костолом<\/td><\/tr><tr><td>Бараки рабов<\/td><td>Тайный штаб восстания<\/td><td>Гракс и его люди<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s17-4\">Ключевые NPC<\/h2><h3>Корвин Блэкторн — лорд-охотник, Сосуд Гнева<\/h3><ul><li>Человек, около 45 лет. Огромный, сложен как кулачный боец; руки и шея в старых ожогах. Взгляд всегда «в самую душу» собеседника, привычка облизывать губы, оценивая «товар». Изысканно вежлив — до первого возражения.<\/li><li><strong>Бывший хозяин Эстела.<\/strong> Именно он купил котёнка-табакси у гоблина-работорговца и поставил на него печать. На поясе — <strong>один серп<\/strong> из именной пары. Второй забрал раб, который сбросил его со стены в пепел.<\/li><li>Покупает рабов для Арены Ям и ценит тех, кто <strong>сопротивляется<\/strong>: «Покорных ломать скучно. С этим можно поработать.»<\/li><li>Верит, что без страха мир развалится: «Я держу этот остров в кулаке. Разожми его — и его разорвут.»<\/li><li>Владеет Мастихином; никогда с ним не расстаётся. Рабские печати Бастиона <strong>режутся этим кинжалом<\/strong> — поэтому на клинке тот же знак, что и на телах рабов.<\/li><li><strong>Что хочет:<\/strong> чтобы его боялись <strong>все<\/strong>. Культ обещал ему, что после ритуала страх станет законом природы.<\/li><\/ul><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Почему печать Эстела замолчала.<\/strong> Печать питается жизненной силой хозяина. Упав в горящий пепел, Корвин должен был умереть — но его подхватил <strong>Гнев Посланца<\/strong>. С тех пор Корвин живёт не своей жизнью, а Гневом, и печать «уснула»: ей нечем питаться. Рядом с Корвином (и вообще рядом с сильным Гневом) печать <strong>просыпается<\/strong> — колет, жжёт, тянет. Эстел видел возле трактира именно Корвина с Мастихином; забытая деталь — <strong>одинокий серп на поясе<\/strong>, пара к его трофею.<\/p><\/div><h3>Гракс Кровавый Шрам — лидер восстания<\/h3><ul><li>Полуорк, бывший гладиатор Ям. Весь в шрамах, один из которых светится синим — в нём осколок небесного железа.<\/li><li>Ведёт подготовку восстания уже три года. Гнев в нём растёт: он хочет не свободы, а <strong>резни<\/strong>.<\/li><li><strong>Дилемма:<\/strong> без Гракса восстание не победит. С ним — победит, но охотников вырежут вместе с семьями.<\/li><li><strong>Реплика:<\/strong> «Ты говоришь “справедливость”. Я говорю “очередь”. Теперь их очередь.»<\/li><\/ul><h3>Дрейвен Нокс — беглец с меткой<\/h3><ul><li>Человек из Акта I. Его метка охотника на рабов горит, когда рядом Гнев.<\/li><li><strong>Правда:<\/strong> Дрейвен не раб — он <strong>охотник<\/strong>, носивший метку как знак отличия, и сбежал, когда ему приказали убить ребёнка. Рабы считают его предателем, охотники — дезертиром.<\/li><li>Его линия — искупление. Может погибнуть, защищая тех, кого когда-то ловил.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Рагнар Костолом<\/td><td>Полуорк, чемпион Ям<\/td><td>Не раб и не охотник — просто любит драться. Можно нанять, можно победить на Арене (пропуск в Бастион).<\/td><\/tr><tr><td>Торвальд Грейстоун<\/td><td>Дварф-инженер карьера<\/td><td>Знает, где под Бастионом проходят старые шахты. Ненавидит Корвина, но боится.<\/td><\/tr><tr><td>Сестра Агна<\/td><td>Капеллан охотников<\/td><td>Освящает кинжал перед каждой охотой. Знает ритуал, которым Ирена Вейл резала Посланца.<\/td><\/tr><tr><td>Малыш Тим<\/td><td>Мальчик-раб<\/td><td>Тот ребёнок, которого Дрейвен не убил. Теперь он в восстании и хочет убить Дрейвена.<\/td><\/tr><tr><td>Охотник-гонец<\/td><td>Курьер Бастиона<\/td><td>Носит письма культа Корвину. Перехватить — узнать, когда Нерисса придёт за кинжалом.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s17-5\">Ловушки<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Дробилка<\/td><td>Каменная дробилка на дне карьера; падение в неё — 4d10 дробящего<\/td><td>Атлетика СЛ 14 для перебежки по цепям<\/td><\/tr><tr><td>Огненная пыль<\/td><td>Пыль небесного железа взрывается от искры: 4d6 огня в радиусе 6 м, спасбросок Ловкости СЛ 15<\/td><td>Внимательность СЛ 13 — блеск в воздухе; гасить свет<\/td><\/tr><tr><td>Кандалы-капканы<\/td><td>Кандалы на полу смыкаются на ноге: опутан, спасбросок Силы СЛ 15<\/td><td>Кусачки, отмычки (СЛ 14)<\/td><\/tr><tr><td>Гневные камни<\/td><td>Светящиеся куски железа: прикоснувшийся получает 1 жетон Ярости<\/td><td>Перчатки, ткань<\/td><\/tr><tr><td>Освящённый алтарь<\/td><td>Взявший кинжал без благословения Агны получает 3d10 излучения и 2 жетона Ярости<\/td><td>Благословение Агны; украсть Корвина, а не алтарь<\/td><\/tr><tr><td>Обвал спирали<\/td><td>Шумный бой в карьере вызывает обвал верхнего уровня: 3d10 дробящего, путь назад закрыт<\/td><td>Не шуметь; уйти через шахты Торвальда<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s17-6\">Сюжетные линии<\/h2><ol><li><strong>Восстание.<\/strong> Гракс готов поднять рабов. Герои решают: поддержать, сдержать (уговорить не резать семьи), предать или использовать как отвлечение, чтобы добраться до кинжала.<\/li><li><strong>Искупление Дрейвена.<\/strong> Дрейвен хочет вернуться и освободить хотя бы детей. Малыш Тим хочет его смерти. Сможет ли Дрейвен посмотреть ему в глаза?<\/li><li><strong>Охота на охотников.<\/strong> Корвин узнаёт о героях и объявляет на них <strong>Охоту<\/strong>: в течение локации героев преследует отряд Охотников, каждый с новым трофеем.<\/li><li><strong>Прошлое Веспера.<\/strong> Веспер Мор сбежал отсюда 20 лет назад, и в Бараках его до сих пор помнят как «того, кто ушёл и не вернулся за нами». Если Веспер с героями — сцена.<\/li><\/ol><h2 id=\"s17-7\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Мастихин» (основной)<\/td><td>—<\/td><td>Забрать кинжал у Корвина<\/td><td><strong>Кинжал<\/strong> (артефакт)<\/td><\/tr><tr><td>«Ночь цепей»<\/td><td>Гракс<\/td><td>Поднять восстание<\/td><td>Союз рабов; доступ в Бастион через Бараки<\/td><\/tr><tr><td>«Только не детей»<\/td><td>Дрейвен<\/td><td>Вывести детей до начала резни<\/td><td>Дрейвен выживает; Малыш Тим прощает (или нет)<\/td><\/tr><tr><td>«Король Ям»<\/td><td>Рагнар<\/td><td>Победить его на Арене (бой один на один)<\/td><td>Пропуск в Бастион; Рагнар — наёмник<\/td><\/tr><tr><td>«Благословение»<\/td><td>Сестра Агна<\/td><td>Принести ей голову чудовища для освящения<\/td><td>Кинжал можно взять без кары алтаря<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s17-8\">Босс: Корвин Блэкторн, «Последний Охотник»<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>150 (уровень 7) / 190 (уровень 8+)<\/td><\/tr><tr><td>КД<\/td><td>16<\/td><\/tr><tr><td>Фаза 1<\/td><td>Охотник: <strong>Серп Жнеца<\/strong> (2d8 рубящего) и Мастихин (1d4 + 2d6 по нарисованным); пистоль (2d6, прерывает подготовку героев). Если у него окажутся <strong>оба серпа<\/strong> — они складываются в косу: досягаемость 3 м, 2d10 рубящего<\/td><\/tr><tr><td>Подготовка 2<\/td><td>«Зов печати» — Корвин сжимает Мастихин. Каждый носитель печати Бастиона в 18 м (Эстел, Дрейвен, рабы) — спасбросок Телосложения СЛ 15, провал: ошеломлён до конца следующего хода<\/td><\/tr><tr><td>Прерывание 2<\/td><td>Выбить Мастихин (атака по оружию, КД 18, или проверка Ловкости рук против его Атлетики); Эстел заявляет «Я больше не твой» и проходит спасбросок с преимуществом (раз за бой)<\/td><\/tr><tr><td>Подготовка<\/td><td>«Казнь» — замах на сбитого с ног героя; при попадании урон удваивается и персонаж получает <strong>сильную травму<\/strong><\/td><\/tr><tr><td>Прерывание<\/td><td>Выстрел/удар в момент замаха при уроне 15+; оглушение; Дрейвен встаёт между ним и жертвой (сюжетно)<\/td><\/tr><tr><td>Фаза 2<\/td><td>При 50% хитов Корвин вонзает Мастихин себе в ладонь — Гнев выходит наружу: становится огромным (Большой), получает сопротивление физическому урону, каждая его атака даёт цели 1 жетон Ярости<\/td><\/tr><tr><td>Надлом<\/td><td>Если герои отказываются от атаки и заканчивают ход без жетонов Ярости — Корвин теряет реакцию. Гнев слабеет, когда его не кормят.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Корвин — сын раба. Его мать умерла в «Глотке», и он поклялся, что сам никогда не будет слабым. Это можно найти в Зале Трофеев: среди голов — женская, с той же меткой, что у рабов. Если показать ему правду, он может остановиться — но лишь на мгновение. Мирный финал здесь — самый трудный в кампании.<\/p><\/div><h2 id=\"s17-9\">Награды локации<\/h2><ul><li><strong>Кинжал «Мастихин Звёздного Железа»<\/strong> (артефакт ритуала). Как оружие: 1d4 + 2d6 против нарисованных и существ-эмоций; режет пространство (1 раз в день — разрез-проход длиной 3 м).<\/li><li><strong>Серп Жнеца<\/strong> — вторая половина пары Эстела (см. раздел 33); вместе — коса-трансформер. Оружие поздних уровней, материалы <strong>небесного железа<\/strong> для улучшений у Дургара.<\/li><\/ul><h2 id=\"s17-10\">Личные крючки героев<\/h2><ul><li><strong>Эстел.<\/strong> Печать начинает колоть уже на Дороге Черепов. В Бараках его узнают по рыжей шерсти: здесь держали других табакси из его клана. <strong>Отец Эстела<\/strong> — боец Арены Ям по кличке <strong>Рыжий<\/strong>, седой и полуслепой; Рагнар Костолом — его надсмотрщик. Встреча с Корвином — кульминация личной линии (см. раздел 33).<\/li><li><strong>Ума.<\/strong> Гнев здесь — её зеркало: вспыльчивость, приказ, давление. В Зале Трофеев висят <strong>крылья фэйри<\/strong> — охотники Бастиона уже ходили за Белую чащу. Значит, часть «чудовищ», нападающих на страну фэйри, — это <strong>охотники<\/strong>.<\/li><li><strong>Велисса.<\/strong> Мастихин режет краску. Одного касания кинжала достаточно, чтобы на её коже проступил незаконченный мазок. Корвин узнаёт в ней «работу Вейла» и хочет её в коллекцию трофеев.<\/li><\/ul><h2 id=\"s17-11\">Находки Карьера и Бастиона<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Мастихин Звёздного Железа<\/strong><\/td><td>Корвин Блэкторн<\/td><td>Артефакт ритуала<\/td><\/tr><tr><td><strong>Серп Жнеца (вторая половина)<\/strong><\/td><td>Корвин<\/td><td>Пара к серпу Эстела: коса-трансформер<\/td><\/tr><tr><td><strong>Вдовий пистоль<\/strong><\/td><td>Оружейная Бастиона<\/td><td>Оружие 3 уровня<\/td><\/tr><tr><td><strong>Клинок-пила Дрейвена<\/strong><\/td><td>Дрейвен<\/td><td>Оружие 4 уровня<\/td><\/tr><tr><td><strong>Небесное железо<\/strong> (3)<\/td><td>Дно карьера<\/td><td>Материал для улучшения +4<\/td><\/tr><tr><td><strong>Охотничий плащ из шкуры<\/strong><\/td><td>Зал Трофеев<\/td><td>Средняя броня +1; сопротивление холоду<\/td><\/tr><tr><td><strong>Шлем охотника<\/strong><\/td><td>Оружейная<\/td><td>Травмы головы на ступень легче<\/td><\/tr><tr><td><strong>Кандальный ключ Бастиона<\/strong><\/td><td>Надсмотрщик<\/td><td>Открывает кандалы всех рабов карьера<\/td><\/tr><tr><td><strong>Ярость в склянке<\/strong> (2)<\/td><td>Капеллан Агна<\/td><td>Выпивший получает 3 жетона Ярости сразу и +2 к урону до конца боя<\/td><\/tr><tr><td><strong>Благословение Агны<\/strong><\/td><td>Квест «Благословение»<\/td><td>Позволяет взять кинжал без кары алтаря<\/td><\/tr><tr><td><strong>Кровь Сосуда Гнева<\/strong><\/td><td>Корвин<\/td><td>Сюжетный материал +4<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s17-12\">Тяжёлые выборы Карьера<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Восстание Гракса<\/strong><\/td><td>Без Гракса рабы не победят. С ним победят, но вырежут семьи охотников, включая детей<\/td><\/tr><tr><td><strong>Дрейвен и Малыш Тим<\/strong><\/td><td>Тим хочет убить Дрейвена — человека, который его пощадил. Помешать — предать Тима. Позволить — потерять Дрейвена<\/td><\/tr><tr><td><strong>Отец Эстела на Арене<\/strong><\/td><td>Рыжий сражается в Ямах сегодня ночью. Спасти его — сорвать скрытное проникновение. Не спасать — Эстел может опоздать навсегда<\/td><\/tr><tr><td><strong>Мастихин: печать или ритуал<\/strong><\/td><td>Эстел может разрезать печать прямо сейчас, но кинжал после этого «напьётся» его крови. Сестра Агна говорит, что для ритуала он станет слабее<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s17-1", "Атмосфера"], ["s17-2", "Правило локации: Ярость"], ["s17-3", "Зоны"], ["s17-4", "Ключевые NPC"], ["s17-5", "Ловушки"], ["s17-6", "Сюжетные линии"], ["s17-7", "Квесты"], ["s17-8", "Босс: Корвин Блэкторн, «Последний Охотник»"], ["s17-9", "Награды локации"], ["s17-10", "Личные крючки героев"], ["s17-11", "Находки Карьера и Бастиона"], ["s17-12", "Тяжёлые выборы Карьера"]], "text": "Артефакт: Кинжал. Эмоция: Гнев. Рекомендуемый уровень: 6–8. Музыка: Сильный бой, Hunter Nightmare, Крыса / Iron Crown. На краю Кратера, где земля до сих пор горячая, стоит Бастион Охотников — крепость из чёрного камня. Под ним — карьер «Глотка» , где рабы добывают небесное железо из обломков Посланца. Сорок лет назад охотники защищали остров от чудовищ. Теперь они охотятся на людей. Тайна · только для мастера Сосуд Гнева — лорд-охотник Корвин Блэкторн . Он носит ритуальный кинжал Мастихин Звёздного Железа , выкованный из первого найденного обломка Посланца. Кинжал режет всё : плоть, краску, пространство. Им же Ирена Вейл разрезала оболочку Посланца сорок лет назад. Гнев здесь двусторонний: охотники пьянеют от власти, а рабы — от ненависти. Оба гнева кормят друг друга. Атмосфера Звон кирок и цепей, крики надсмотрщиков. Небо красное от пыли. Камни небесного железа светятся тусклым синим, как глаз Сайласа. В Бастионе — трофеи: головы чудовищ, но среди них и человеческие. Рабы молчат днём и поют ночью. Песня становится всё злее. Правило локации: Ярость Важно Каждый раз, когда персонаж получает урон в бою, он получает 1 жетон Ярости . При 3 жетонах персонаж в свой ход обязан атаковать ближайшее существо (даже союзника, если оно ближе всех), если не пройдёт спасбросок Мудрости СЛ 14. Персонаж с жетонами получает +1 к урону за каждый жетон. Жетоны сбрасываются после короткой передышки. Если персонаж закончил бой с 3 жетонами — 1 Отголосок Гнева . Зоны Зона Что там Опасность Дорога Черепов Подъём к Бастиону, колья с черепами Патрули охотников Ворота Бастиона Подъёмный мост, требуется пропуск или «добыча» Стража, баллисты Двор Охоты Тренировочная арена, псарни Охотничьи псы-чудовища Часовня Мастихина Алтарь, где хранится кинжал между охотами Освящённая ловушка Зал Трофеев Головы чудовищ — и людей Трофей Посланца (оживает) Карьер «Глотка» Спиральная яма до дна Кратера Обвалы, рабочие, газ Арена Ям Бои рабов на потеху охотникам Рагнар Костолом Бараки рабов Тайный штаб восстания Гракс и его люди Ключевые NPC Корвин Блэкторн — лорд-охотник, Сосуд Гнева Человек, около 45 лет. Огромный, сложен как кулачный боец; руки и шея в старых ожогах. Взгляд всегда «в самую душу» собеседника, привычка облизывать губы, оценивая «товар». Изысканно вежлив — до первого возражения. Бывший хозяин Эстела. Именно он купил котёнка-табакси у гоблина-работорговца и поставил на него печать. На поясе — один серп из именной пары. Второй забрал раб, который сбросил его со стены в пепел. Покупает рабов для Арены Ям и ценит тех, кто сопротивляется : «Покорных ломать скучно. С этим можно поработать.» Верит, что без страха мир развалится: «Я держу этот остров в кулаке. Разожми его — и его разорвут.» Владеет Мастихином; никогда с ним не расстаётся. Рабские печати Бастиона режутся этим кинжалом — поэтому на клинке тот же знак, что и на телах рабов. Что хочет: чтобы его боялись все . Культ обещал ему, что после ритуала страх станет законом природы. Тайна · только для мастера Почему печать Эстела замолчала. Печать питается жизненной силой хозяина. Упав в горящий пепел, Корвин должен был умереть — но его подхватил Гнев Посланца . С тех пор Корвин живёт не своей жизнью, а Гневом, и печать «уснула»: ей нечем питаться. Рядом с Корвином (и вообще рядом с сильным Гневом) печать просыпается — колет, жжёт, тянет. Эстел видел возле трактира именно Корвина с Мастихином; забытая деталь — одинокий серп на поясе , пара к его трофею. Гракс Кровавый Шрам — лидер восстания Полуорк, бывший гладиатор Ям. Весь в шрамах, один из которых светится синим — в нём осколок небесного железа. Ведёт подготовку восстания уже три года. Гнев в нём растёт: он хочет не свободы, а резни . Дилемма: без Гракса восстание не победит. С ним — победит, но охотников вырежут вместе с семьями. Реплика: «Ты говоришь “справедливость”. Я говорю “очередь”. Теперь их очередь.» Дрейвен Нокс — беглец с меткой Человек из Акта I. Его метка охотника на рабов горит, когда рядом Гнев. Правда: Дрейвен не раб — он охотник , носивший метку как знак отличия, и сбежал, когда ему приказали убить ребёнка. Рабы считают его предателем, охотники — дезертиром. Его линия — искупление. Может погибнуть, защищая тех, кого когда-то ловил. Второстепенные NPC NPC Кто Крючок / функция Рагнар Костолом Полуорк, чемпион Ям Не раб и не охотник — просто любит драться. Можно нанять, можно победить на Арене (пропуск в Бастион). Торвальд Грейстоун Дварф-инженер карьера Знает, где под Бастионом проходят старые шахты. Ненавидит Корвина, но боится. Сестра Агна Капеллан охотников Освящает кинжал перед каждой охотой. Знает ритуал, которым Ирена Вейл резала Посланца. Малыш Тим Мальчик-раб Тот ребёнок, которого Дрейвен не убил. Теперь он в восстании и хочет убить Дрейвена. Охотник-гонец Курьер Бастиона Носит письма культа Корвину. Перехватить — узнать, когда Нерисса придёт за кинжалом. Ловушки Ловушка Описание Обход Дробилка Каменная дробилка на дне карьера; падение в неё — 4d10 дробящего Атлетика СЛ 14 для перебежки по цепям Огненная пыль Пыль небесного железа взрывается от искры: 4d6 огня в радиусе 6 м, спасбросок Ловкости СЛ 15 Внимательность СЛ 13 — блеск в воздухе; гасить свет Кандалы-капканы Кандалы на полу смыкаются на ноге: опутан, спасбросок Силы СЛ 15 Кусачки, отмычки (СЛ 14) Гневные камни Светящиеся куски железа: прикоснувшийся получает 1 жетон Ярости Перчатки, ткань Освящённый алтарь Взявший кинжал без благословения Агны получает 3d10 излучения и 2 жетона Ярости Благословение Агны; украсть Корвина, а не алтарь Обвал спирали Шумный бой в карьере вызывает обвал верхнего уровня: 3d10 дробящего, путь назад закрыт Не шуметь; уйти через шахты Торвальда Сюжетные линии Восстание. Гракс готов поднять рабов. Герои решают: поддержать, сдержать (уговорить не резать семьи), предать или использовать как отвлечение, чтобы добраться до кинжала. Искупление Дрейвена. Дрейвен хочет вернуться и освободить хотя бы детей. Малыш Тим хочет его смерти. Сможет ли Дрейвен посмотреть ему в глаза? Охота на охотников. Корвин узнаёт о героях и объявляет на них Охоту : в течение локации героев преследует отряд Охотников, каждый с новым трофеем. Прошлое Веспера. Веспер Мор сбежал отсюда 20 лет назад, и в Бараках его до сих пор помнят как «того, кто ушёл и не вернулся за нами». Если Веспер с героями — сцена. Квесты Квест Кто даёт Суть Награда «Мастихин» (основной) — Забрать кинжал у Корвина Кинжал (артефакт) «Ночь цепей» Гракс Поднять восстание Союз рабов; доступ в Бастион через Бараки «Только не детей» Дрейвен Вывести детей до начала резни Дрейвен выживает; Малыш Тим прощает (или нет) «Король Ям» Рагнар Победить его на Арене (бой один на один) Пропуск в Бастион; Рагнар — наёмник «Благословение» Сестра Агна Принести ей голову чудовища для освящения Кинжал можно взять без кары алтаря Босс: Корвин Блэкторн, «Последний Охотник» Параметр Значение Хиты 150 (уровень 7) / 190 (уровень 8+) КД 16 Фаза 1 Охотник: Серп Жнеца (2d8 рубящего) и Мастихин (1d4 + 2d6 по нарисованным); пистоль (2d6, прерывает подготовку героев). Если у него окажутся оба серпа — они складываются в косу: досягаемость 3 м, 2d10 рубящего Подготовка 2 «Зов печати» — Корвин сжимает Мастихин. Каждый носитель печати Бастиона в 18 м (Эстел, Дрейвен, рабы) — спасбросок Телосложения СЛ 15, провал: ошеломлён до конца следующего хода Прерывание 2 Выбить Мастихин (атака по оружию, КД 18, или проверка Ловкости рук против его Атлетики); Эстел заявляет «Я больше не твой» и проходит спасбросок с преимуществом (раз за бой) Подготовка «Казнь» — замах на сбитого с ног героя; при попадании урон удваивается и персонаж получает сильную травму Прерывание Выстрел/удар в момент замаха при уроне 15+; оглушение; Дрейвен встаёт между ним и жертвой (сюжетно) Фаза 2 При 50% хитов Корвин вонзает Мастихин себе в ладонь — Гнев выходит наружу: становится огромным (Большой), получает сопротивление физическому урону, каждая его атака даёт цели 1 жетон Ярости Надлом Если герои отказываются от атаки и заканчивают ход без жетонов Ярости — Корвин теряет реакцию. Гнев слабеет, когда его не кормят. Тайна · только для мастера Корвин — сын раба. Его мать умерла в «Глотке», и он поклялся, что сам никогда не будет слабым. Это можно найти в Зале Трофеев: среди голов — женская, с той же меткой, что у рабов. Если показать ему правду, он может остановиться — но лишь на мгновение. Мирный финал здесь — самый трудный в кампании. Награды локации Кинжал «Мастихин Звёздного Железа» (артефакт ритуала). Как оружие: 1d4 + 2d6 против нарисованных и существ-эмоций; режет пространство (1 раз в день — разрез-проход длиной 3 м). Серп Жнеца — вторая половина пары Эстела (см. раздел 33); вместе — коса-трансформер. Оружие поздних уровней, материалы небесного железа для улучшений у Дургара. Личные крючки героев Эстел. Печать начинает колоть уже на Дороге Черепов. В Бараках его узнают по рыжей шерсти: здесь держали других табакси из его клана. Отец Эстела — боец Арены Ям по кличке Рыжий , седой и полуслепой; Рагнар Костолом — его надсмотрщик. Встреча с Корвином — кульминация личной линии (см. раздел 33). Ума. Гнев здесь — её зеркало: вспыльчивость, приказ, давление. В Зале Трофеев висят крылья фэйри — охотники Бастиона уже ходили за Белую чащу. Значит, часть «чудовищ», нападающих на страну фэйри, — это охотники . Велисса. Мастихин режет краску. Одного касания кинжала достаточно, чтобы на её коже проступил незаконченный мазок. Корвин узнаёт в ней «работу Вейла» и хочет её в коллекцию трофеев. Находки Карьера и Бастиона Предмет Где Эффект Мастихин Звёздного Железа Корвин Блэкторн Артефакт ритуала Серп Жнеца (вторая половина) Корвин Пара к серпу Эстела: коса-трансформер Вдовий пистоль Оружейная Бастиона Оружие 3 уровня Клинок-пила Дрейвена Дрейвен Оружие 4 уровня Небесное железо (3) Дно карьера Материал для улучшения +4 Охотничий плащ из шкуры Зал Трофеев Средняя броня +1; сопротивление холоду Шлем охотника Оружейная Травмы головы на ступень легче Кандальный ключ Бастиона Надсмотрщик Открывает кандалы всех рабов карьера Ярость в склянке (2) Капеллан Агна Выпивший получает 3 жетона Ярости сразу и +2 к урону до конца боя Благословение Агны Квест «Благословение» Позволяет взять кинжал без кары алтаря Кровь Сосуда Гнева Корвин Сюжетный материал +4 Тяжёлые выборы Карьера Выбор Почему тяжело Восстание Гракса Без Гракса рабы не победят. С ним победят, но вырежут семьи охотников, включая детей Дрейвен и Малыш Тим Тим хочет убить Дрейвена — человека, который его пощадил. Помешать — предать Тима. Позволить — потерять Дрейвена Отец Эстела на Арене Рыжий сражается в Ямах сегодня ночью. Спасти его — сорвать скрытное проникновение. Не спасать — Эстел может опоздать навсегда Мастихин: печать или ритуал Эстел может разрезать печать прямо сейчас, но кинжал после этого «напьётся» его крови. Сестра Агна говорит, что для ритуала он станет слабее"}, {"id": "s18", "n": 18, "title": "ФАБРИКА «ПРОГРЕСС»", "disp": "Фабрика «Прогресс»", "group": "Акт II", "html": "<p><strong>Тип:<\/strong> большая локация Акта II (без артефакта ритуала, но с ключом к финалу). <strong>Эмоции:<\/strong> все понемногу — фабрика их <strong>добывает<\/strong>. <strong>Рекомендуемый уровень:<\/strong> 7–9. <strong>Музыка:<\/strong> Сильный бой, Пещеры, Ambient набор; для кабинета Офелии — любая опера.<\/p><p>На восточном берегу полуострова, где раньше был рыбацкий посёлок, за десять лет вырос город <strong>Копоть<\/strong>: трубы, рельсы, газовые фонари, кирпичные бараки, вечный гул. В центре — <strong>Фабрика «Прогресс»<\/strong>, собор из стали и стекла. Здесь делают то, чего полуостров никогда не видел: паровозы, электрические лампы, механические протезы, счётные машины, ружья, консервы. Всё это придумала одна женщина — <strong>Офелия Дарквуд<\/strong>.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Машины «Прогресса» работают на <strong>небесном железе<\/strong> из карьера «Глотка». Металл Посланца резонирует с эмоциями, и Офелия открыла, что котлы на нём <strong>разгоняются от человеческих чувств<\/strong>. Рабочие у станков злятся, боятся, тоскуют, а котёл «Сердце» втягивает это и превращает в давление. После смены рабочие выходят пустыми и тихими. Офелия знает. Она называет это «допустимыми потерями — четыре процента».<\/p><p>Её главная тайна — разностная машина <strong>«Пифия»<\/strong> в башне фабрики. Пифия по колебаниям небесного железа <strong>расшифровывает весть Посланца<\/strong>. Расшифровано семь слов из десяти. Офелия прочитала их по-своему: «Совершенное не меняется. Неизменное — мертво». Вывод: <strong>совершенство — это бесконечное улучшение<\/strong>. Мир надо поставить на конвейер и никогда не останавливать.<\/p><\/div><h2 id=\"s18-1\">Офелия Дарквуд — гений<\/h2><p><strong>Кто она.<\/strong> Человек, около 50 лет. Изобретательница железной дороги, электрической лампы и механической руки. Самый умный человек на полуострове, и знает это.<\/p><p><strong>Эксцентричность (используйте щедро):<\/strong><\/p><ul><li>В 30 лет <strong>сама ампутировала себе здоровую левую руку<\/strong>: «Природа сделала её на 73% эффективной. Я сделала на 94%.» Латунный протез с семью сменными насадками.<\/li><li>Носит <strong>монокль с семью линзами<\/strong> и переключает их во время разговора, «чтобы увидеть собеседника под разными углами».<\/li><li>Говорит в процентах и секундах: «Вы опоздали на 340 секунд. Это 6% моего утра. Я вас прощаю на 80%.»<\/li><li>Ездит по цехам <strong>на роликовых коньках<\/strong> собственной конструкции и не любит стоять на месте.<\/li><li>Спит четыре часа <strong>стоя<\/strong> в «камере покоя» — шкафу с паровым подогревом.<\/li><li>Даёт рабочим номера <strong>из нежности<\/strong>: «Имя можно забыть. Номер — никогда.» Машинам даёт имена людей, которыми восхищается.<\/li><li>Кормит голубей шурупами и искренне удивляется, что они не едят.<\/li><li>Во время смен по трубам фабрики играет опера. Свою любимую арию она поёт сама, фальшиво и громко.<\/li><li>На всех стенах кабинета мелом написаны уравнения. Убирать их запрещено под страхом увольнения.<\/li><li>Питомец — <strong>механический ворон Эврика<\/strong>. Он повторяет её последние слова с опозданием в 10 секунд.<\/li><\/ul><p><strong>Чего хочет.<\/strong> Поставить мир на конвейер: накормить, осветить, вылечить всех, без чудес и без случайностей. Дочитать весть до конца.<\/p><p><strong>Чего боится.<\/strong> Остановиться. Если «Прогресс» встанет хотя бы на час, она считает, что всё развалится.<\/p><p><strong>Как говорит.<\/strong> «Ручная работа — это брак, которому дали красивое имя.» «Чудо — это машина, чертежи которой потеряли.» «Сайлас Вейл рисует мир. Я его собираю. Угадайте, чей переживёт зиму.»<\/p><p><strong>Отношение к другим силам<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>Сила<\/th><th>Отношение Офелии<\/th><\/tr><\/thead><tbody><tr><td>Сайлас<\/td><td>Презирает: «Краска — это неточность.» Тайно восхищается тем, что Картина работает без единой шестерёнки<\/td><\/tr><tr><td>Культ Равных<\/td><td>Продаёт им <strong>эмоциональные конденсаторы<\/strong>. Считает их «мистиками с плохой логистикой». Малрик в восторге от конвейера: для него это и есть равенство<\/td><\/tr><tr><td>Корвин Блэкторн<\/td><td>Покупает у него небесное железо. Делает для Бастиона <strong>кандалы<\/strong> — те самые, которыми ставят печати<\/td><\/tr><tr><td>Элиас<\/td><td>Уважает как «единственного эмпирика на острове». Её протезы лечат то, что он не может<\/td><\/tr><tr><td>Дургар Ночной Молот (хаб)<\/td><td>Её бывший мастер-литейщик. Ушёл, когда увидел котёл «Сердце». Не говорит о ней без мата<\/td><\/tr><tr><td>Страна фэйри<\/td><td>Её железная дорога идёт к Белой чаще. Холодное железо для фэйри — яд<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-2\">Атмосфера<\/h2><ul><li>Гудок четыре раза в сутки. Между гудками город замирает и смотрит на трубы.<\/li><li>Жёлтый смог, газовые фонари, первые на полуострове <strong>электрические лампы<\/strong>: ровный свет, от которого не спрятаться.<\/li><li>Рабочие в одинаковых комбинезонах с номерами на груди. После смены — очень тихие.<\/li><li>Автоматоны на перфокартах метут улицы, чинят рельсы, патрулируют.<\/li><li>Плакаты: «Каждый винтик важен!» «Норма — это свобода!» «Улыбайтесь: 12% к производительности!»<\/li><\/ul><h2 id=\"s18-3\">Правило локации: Гудок и Конденсат<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> <strong>Гудок.<\/strong> Сутки делятся на четыре смены. <strong>Во время смены<\/strong> фабрика работает: конвейеры движутся, котлы под давлением, автоматоны заняты делом и не обращают внимания на людей в комбинезонах. <strong>Между сменами<\/strong> (30 минут после гудка) автоматоны переходят в режим патруля и проверяют номера у всех.<\/p><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> <strong>Конденсат.<\/strong> Рядом с котлами фабрика тянет из людей эмоции. Каждый час в цехах — спасбросок Мудрости СЛ 14. Провал: персонаж теряет <strong>1 Отголосок<\/strong> любой эмоции (на выбор мастера), но и <strong>1 вдохновение<\/strong>. Если нет ни того, ни другого — получает 1 уровень истощения («выжат»). Из потерянного Отголоска фабрика делает <strong>банку эмоции<\/strong> (см. находки).<\/p><\/div><p><strong>Сдать эмоцию добровольно.<\/strong> В проходной есть «Пункт приёма»: персонаж может сдать 1 Отголосок за 20 зм. Это способ избавиться от Одержимости. Но каждая сданная банка уходит культу (Часы Культа +1 за каждые 3 банки).<\/p><p><strong>Смог.<\/strong> Вне помещений без маски или противогаза — спасбросок Телосложения СЛ 12 раз в 4 часа или помеха на проверки Внимательности до отдыха.<\/p><h2 id=\"s18-4\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Город Копоть<\/td><td>Бараки, лавка компании, бар «Ровный шов», вокзал<\/td><td>Шпики фабрики, долговые надсмотрщики<\/td><\/tr><tr><td>Проходная<\/td><td>Турникеты, «Пункт приёма» эмоций, выдача номеров<\/td><td>Без номера — проход только между сменами (с риском)<\/td><\/tr><tr><td>Литейный цех<\/td><td>Плавка небесного железа<\/td><td>Брызги металла, жар, Гневные камни<\/td><\/tr><tr><td>Главный конвейер<\/td><td>Километр движущихся лент<\/td><td>Затягивает; рабочие не могут отойти от места<\/td><\/tr><tr><td>Цех мелкой сборки<\/td><td>Часовые механизмы, протезы<\/td><td>Здесь работают <strong>дети<\/strong>: у них маленькие пальцы<\/td><\/tr><tr><td>Сборочная автоматонов<\/td><td>Ряды механических людей, перфокарты<\/td><td>Пробуждённые автоматоны<\/td><\/tr><tr><td>Котельная «Сердце»<\/td><td>Огромный котёл, трубы-вены, стеклянные баки с эмоциями<\/td><td>Конденсат ×2; взрывоопасно<\/td><\/tr><tr><td>Депо<\/td><td>Паровозы, броневагон<\/td><td>Охрана, механики<\/td><\/tr><tr><td>Башня «Пифии»<\/td><td>Разностная машина размером с церковь<\/td><td>Перфокарты-ловушки; Офелия<\/td><\/tr><tr><td>Оранжерея-кабинет<\/td><td>Латунные цветы, которые раскрываются по таймеру; уравнения на стенах; ворон Эврика<\/td><td>Офелия, её «камера покоя»<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-5\">Ключевые NPC<\/h2><h3>Азраэль Вейн — лидер рабочих<\/h3><ul><li>Тифлинг, инженер, бывший любимый ученик Офелии. Номер 001.<\/li><li>Организует <strong>забастовку<\/strong>. Знает про котёл «Сердце» и хочет его остановить.<\/li><li>Не хочет разрушать фабрику: «Машины — это хорошо. Плохо то, на чём они работают.»<\/li><li><strong>Дилемма:<\/strong> без остановки котла рабочие продолжат выгорать. С остановкой встанет весь город: свет, поезда, протезы, консервы для голодных деревень.<\/li><\/ul><h3>Номер Девятнадцать — пробудившийся автоматон<\/h3><ul><li>Автоматон-уборщик. Конденсат годами проходил сквозь его корпус, и он <strong>начал чувствовать<\/strong>: всего понемногу, по крупице от каждого рабочего.<\/li><li>Скрывает это. Пишет стихи на обратной стороне перфокарт.<\/li><li>Хочет, чтобы его признали <strong>человеком<\/strong>. Или хотя бы не переплавили.<\/li><li>Ключ к Пифии: он единственный, кто может войти в башню, не сбив перфокарты.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Мастер Бруно Кнут<\/td><td>Старший мастер конвейера<\/td><td>Жесток к нормам, добр к людям. Тайно отпускает больных раньше гудка. Если его разоблачить, уволят<\/td><\/tr><tr><td>Шплинт<\/td><td>Мальчишка 11 лет из цеха мелкой сборки<\/td><td>Знает все вентиляционные ходы. Хочет стать инженером, «как госпожа Дарквуд»<\/td><\/tr><tr><td>Ханна Ржа<\/td><td>Лидер «Ломателей»<\/td><td>Хочет взорвать котёл. Готова к тому, что погибнут рабочие ночной смены<\/td><\/tr><tr><td>Серый покупатель<\/td><td>Агент культа Равных<\/td><td>Принимает партию из 100 конденсаторов. Если сделка состоится, Часы Культа +2<\/td><\/tr><tr><td>Машинист Олаф<\/td><td>Водитель паровоза «Неутомимая»<\/td><td>Может довезти героев куда угодно на полуострове за ночь<\/td><\/tr><tr><td>Эврика<\/td><td>Механический ворон Офелии<\/td><td>Повторяет всё, что слышит, с опозданием. Идеальный шпион, и для Офелии, и против неё<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-6\">Ловушки и опасности<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Конвейер<\/td><td>Упавший на ленту уезжает к прессу: каждый раунд спасбросок Силы СЛ 14, третий провал — пресс, 6d10 дробящего<\/td><td>Рычаг аварийной остановки (Расследование СЛ 13), но тогда гудок тревоги<\/td><\/tr><tr><td>Паровой выброс<\/td><td>Клапаны сбрасывают пар по таймеру: 4d6 огня в линии 9 м, спасбросок Ловкости СЛ 15<\/td><td>Внимательность СЛ 14 — свист перед выбросом<\/td><\/tr><tr><td>Электрический пол<\/td><td>В депо и башне: 3d8 электричества при наступании в металлической обуви или доспехе<\/td><td>Резина, дерево, прыжки по изоляторам<\/td><\/tr><tr><td>Перфокарты патруля<\/td><td>Автоматоны действуют по картам. Чужак без номера — цель<\/td><td>Подменить карту в патрульном (Ловкость рук СЛ 15): автоматон выполнит новый приказ<\/td><\/tr><tr><td>Котёл «Сердце»<\/td><td>Касание бака с эмоцией: спасбросок Мудрости СЛ 16 или получить эту эмоцию целиком (3 Отголоска) на час<\/td><td>Перчатки, изоляция, Номер 19<\/td><\/tr><tr><td>Литейный ковш<\/td><td>Брызги расплавленного небесного железа: 3d10 огня<\/td><td>Щит; держаться в 6 м от ковша<\/td><\/tr><tr><td>Смог<\/td><td>См. правило<\/td><td>Противогаз, маска чумного доктора<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-7\">Сюжетные линии<\/h2><ol><li><strong>Забастовка.<\/strong> Азраэль готовит забастовку на следующий гудок. Офелия готовит автоматонов-штрейкбрехеров. Ханна Ржа готовит бомбу. Герои могут оказаться посредниками, взрывателями, охраной или забастовщиками.<\/li><li><strong>Котёл «Сердце».<\/strong> В баках хранятся годы чужих эмоций. Если котёл взорвётся, всё вырвется наружу: Копоть на неделю станет Тихим очагом всех эмоций сразу.<\/li><li><strong>Пифия.<\/strong> Машина расшифровала семь слов вести. Ей не хватает Тоски («Вы»), Нежности («и») и Желания («живы»): именно этих трёх у культа тоже нет. Офелия хочет «измерить» Велиссу и Кисточку. Взамен Пифия может стать <strong>заменой Уха Посланца<\/strong> для концовки «Услышать Весть».<\/li><li><strong>Номер Девятнадцать.<\/strong> Если он человек, значит, у автоматонов есть право на жизнь. Тогда Офелия построила рабство. Если нет — его можно переплавить.<\/li><li><strong>Сделка культа.<\/strong> Сто конденсаторов уходят Серому покупателю ночным поездом. Ограбление поезда или срыв отгрузки — отличная экшен-сцена.<\/li><\/ol><h2 id=\"s18-8\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Пифия» (основной)<\/td><td>Офелия / Номер 19<\/td><td>Попасть в башню и получить расшифровку вести<\/td><td>Семь слов вести; Пифия как замена Уха Посланца (при договоре с Офелией)<\/td><\/tr><tr><td>«Гудок»<\/td><td>Азраэль Вейн<\/td><td>Помочь забастовке: обеспечить остановку котла без взрыва<\/td><td>Рабочие Копоти — союзники в Акте V; Часы Культа −1<\/td><\/tr><tr><td>«Ломатели»<\/td><td>Ханна Ржа<\/td><td>Заложить бомбу в котёл<\/td><td>Котёл уничтожен; цена — ночная смена и Тихий очаг в Копоти<\/td><\/tr><tr><td>«Ночной поезд»<\/td><td>Машинист Олаф или Азраэль<\/td><td>Перехватить поезд с конденсаторами<\/td><td>Часы Культа −2; 10 банок эмоций<\/td><\/tr><tr><td>«Стихи на перфокартах»<\/td><td>Номер 19<\/td><td>Доказать Офелии, что он чувствует<\/td><td>Номер 19 — компаньон (40 хитов, КД 16, ремонт за 1 час)<\/td><\/tr><tr><td>«Шплинт»<\/td><td>Мастер Кнут<\/td><td>Вывести детей из цеха мелкой сборки или добиться для них школы<\/td><td>Шплинт — проводник по вентиляции; Оттепель Эстела +1<\/td><\/tr><tr><td>«Заказ Бастиона»<\/td><td>—<\/td><td>Найти на складе партию кандалов для Корвина<\/td><td>Эстел узнаёт, где их делают; кандалы можно испортить: все печати новой партии будут ложными<\/td><\/tr><tr><td>«Билет»<\/td><td>Офелия<\/td><td>Выполнить для неё любое поручение<\/td><td>Пожизненный билет на «Неутомимую» (быстрые перемещения)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-9\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Остановить котёл «Сердце»<\/strong><\/td><td>Рабочие перестанут выгорать. Но фабрика встанет: погаснет электрический свет, встанут поезда, прекратится выпуск протезов и консервов. В голодных деревнях зимой начнутся смерти<\/td><\/tr><tr><td><strong>Взорвать фабрику (Ломатели)<\/strong><\/td><td>Быстро и окончательно. Погибнет ночная смена, а Копоть станет Тихим очагом. Прогресс на полуострове откатится на двадцать лет<\/td><\/tr><tr><td><strong>Сделка с Офелией<\/strong><\/td><td>Пифия может заменить Ухо Посланца. Но Офелия хочет «измерить» Велиссу: это три дня в машине, после которых у Велиссы, возможно, будет +1 Мазок навсегда<\/td><\/tr><tr><td><strong>Номер 19<\/strong><\/td><td>Признать его человеком — значит признать людьми <strong>всех<\/strong> автоматонов, и фабрика встанет. Не признать — переплавить существо, которое пишет стихи<\/td><\/tr><tr><td><strong>Дети в цехе<\/strong><\/td><td>Их заработок кормит семьи. Без работы семьи голодают; с работой дети теряют детство и эмоции<\/td><\/tr><tr><td><strong>Офелия<\/strong><\/td><td>Её можно арестовать, убить, переубедить или оставить. Без неё никто не починит паровоз, протез или лампу<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-10\">Босс: Офелия Дарквуд и котёл «Сердце»<\/h2><p><strong>Фаза 1 — Офелия в экзокаркасе «Прогресс-1».<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>120 (уровень 7) / 160 (уровень 9)<\/td><\/tr><tr><td>КД<\/td><td>18 (латунный каркас)<\/td><\/tr><tr><td>Особенность<\/td><td><strong>Насадки:<\/strong> в начале хода меняет насадку руки: молот (2d10 дробящего), бур (2d8 колющего, игнорирует щиты), сеть (опутан, спасбросок Силы СЛ 15), огнемёт (конус 4,5 м, 4d6 огня)<\/td><\/tr><tr><td>Подготовка<\/td><td>«Перерасчёт»: Офелия замирает и щёлкает линзами монокля. Если не прервать, следующая её атака автоматически попадает и критическая<\/td><\/tr><tr><td>Прерывание<\/td><td>Заставить её <strong>отвлечься<\/strong>: нелогичный вопрос, задачка, которую нельзя решить, Эврика, повторяющий её же слова. Или 20+ урона по каркасу<\/td><\/tr><tr><td>Надлом<\/td><td>Каждый раз, когда её <strong>расчёт не сбывается<\/strong> (промах при «гарантированном» ударе, нелогичный поступок героев), — жетон<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Фаза 2 — котёл «Сердце».<\/strong> При 0 хитах каркаса Офелия бьёт по аварийному клапану: «Если я остановлюсь, пусть остановится всё!» Котёл начинает <strong>выпускать эмоции<\/strong>.<\/p><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>150, только по клапанам (6 клапанов по 25)<\/td><\/tr><tr><td>Каждый раунд<\/td><td>Из котла вырывается случайная эмоция (1d10 по таблице «Посланец и десять эмоций»). Все в котельной — спасбросок Мудрости СЛ 15 или 1 Отголосок этой эмоции<\/td><\/tr><tr><td>Подготовка<\/td><td>«Последний гудок»: стрелка давления в красной зоне. Если не прервать за 2 раунда — взрыв: 10d10 всем в котельной, Копоть становится Тихим очагом<\/td><\/tr><tr><td>Прерывание<\/td><td>Закрыть 3 клапана за раунд (разные герои), или Номер 19 входит в котёл и берёт давление на себя (он погибнет), или Офелия сама закрывает клапан (если её переубедили)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Офелию можно <strong>переубедить<\/strong>. Её слабость — незаконченная расшифровка. Если показать ей, что без трёх «мягких» слов (Тоска, Нежность, Желание) весть звучит как приговор, а с ними означает «вы несовершенны и поэтому живы», она впервые в жизни <strong>остановится<\/strong>. Это мирный финал локации: фабрика работает дальше, но котёл перестраивают на уголь.<\/p><\/div><h2 id=\"s18-11\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Паровой молот-трансформер<\/strong><\/td><td>Литейный цех<\/td><td>Оружие: 1d10 дробящего / в «паровом» режиме 2d8 + сбивает с ног (спасбросок Силы СЛ 15), перезарядка давления 1 ход. Тяжёлое, понижает порог прерывания<\/td><\/tr><tr><td><strong>Электрическая дубинка<\/strong><\/td><td>Охрана проходной<\/td><td>1d6 дробящего + 1d6 электричеством; при крите — цель ошеломлена до конца хода<\/td><\/tr><tr><td><strong>Многоствольный пистоль «Шестиглазка»<\/strong><\/td><td>Кабинет Офелии<\/td><td>Огнестрел, 1d10, шесть выстрелов до перезарядки; парирование<\/td><\/tr><tr><td><strong>Механический протез<\/strong><\/td><td>Цех мелкой сборки (Офелия или Азраэль)<\/td><td>Навсегда снимает сильную травму руки или ноги. Цена: 300 зм или услуга; протез работает на небесном железе — носитель получает 1 Отголосок Гнева раз в неделю<\/td><\/tr><tr><td><strong>Электрический фонарь<\/strong><\/td><td>Лавка компании<\/td><td>Свет 18 м на 12 часов, не гаснет от ветра и воды; в катакомбах и Мглине — меняет правила света<\/td><\/tr><tr><td><strong>Противогаз<\/strong><\/td><td>Проходная<\/td><td>Иммунитет к смогу, огненной пыли карьера, мучному снегу мельницы<\/td><\/tr><tr><td><strong>Банка эмоции<\/strong> (тип по выбору мастера)<\/td><td>Котельная, «Пункт приёма»<\/td><td>Граната: разбить — все в 3 м получают эффект Тяги этой эмоции на 1 минуту (спасбросок Мудрости СЛ 14). Банка Гнева — враги дерутся друг с другом; банка Страха — бегут<\/td><\/tr><tr><td><strong>Перфокарта приказа<\/strong> (3)<\/td><td>Сборочная<\/td><td>Вставить в автоматона: он выполняет один приказ<\/td><\/tr><tr><td><strong>Билет на «Неутомимую»<\/strong><\/td><td>Офелия / Олаф<\/td><td>Быстрое перемещение между хабом, Мглином, Карьером и Копотью за одну ночь<\/td><\/tr><tr><td><strong>Чертёж Пифии<\/strong><\/td><td>Башня<\/td><td>Сюжетный: Дургар сможет собрать «малую Пифию» — 1 раз узнать любое слово вести<\/td><\/tr><tr><td><strong>Латунный монокль<\/strong><\/td><td>Кабинет Офелии (если она мертва или дарит)<\/td><td>1 раз в день — «Перерасчёт» самому: следующая атака с преимуществом<\/td><\/tr><tr><td><strong>Шестерёнчатый ворон<\/strong><\/td><td>Оранжерея<\/td><td>Компаньон-разведчик: летает на 1 км и повторяет услышанное<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s18-12\">Личные крючки героев<\/h2><ul><li><strong>Эстел.<\/strong> На складе — новая партия <strong>кандалов для Бастиона<\/strong>. Офелия делает их, не задавая вопросов. Азраэль показывает ему рабочих в долговых контрактах: «Мы не рабы. Мы просто никогда не расплатимся.» Где граница? Ещё одно: Офелия утверждает, что печать можно <strong>выжечь электричеством<\/strong> — пятый способ снять её (3d10 урона, малая травма, 50% шанс, что печать просто сместится).<\/li><li><strong>Велисса.<\/strong> Для Офелии она — «сбой в материи, а значит, самое интересное, что я видела за 20 лет». Офелия предлагает закончить её <strong>механически<\/strong>: латунный каркас и лак собственного состава. Это снимет слабость к солнцу и морозу, но Велисса станет наполовину машиной.<\/li><li><strong>Ума.<\/strong> Железная дорога тянется к Белой чаще. <strong>Холодное железо<\/strong> — яд для фэйри. Если рельсы дойдут до границы, страна фэйри окажется отрезана навсегда — или, наоборот, станет беззащитной. Капитан Ирвель потребует остановить стройку.<\/li><li><strong>Тесори.<\/strong> Есть ли у Номера Девятнадцать сердце, которое можно взвесить? Если Тесори вернулся, это вопрос для него.<\/li><\/ul>", "toc": [["s18-1", "Офелия Дарквуд — гений"], ["s18-2", "Атмосфера"], ["s18-3", "Правило локации: Гудок и Конденсат"], ["s18-4", "Зоны"], ["s18-5", "Ключевые NPC"], ["s18-6", "Ловушки и опасности"], ["s18-7", "Сюжетные линии"], ["s18-8", "Квесты"], ["s18-9", "Тяжёлые выборы"], ["s18-10", "Босс: Офелия Дарквуд и котёл «Сердце»"], ["s18-11", "Находки"], ["s18-12", "Личные крючки героев"]], "text": "Тип: большая локация Акта II (без артефакта ритуала, но с ключом к финалу). Эмоции: все понемногу — фабрика их добывает . Рекомендуемый уровень: 7–9. Музыка: Сильный бой, Пещеры, Ambient набор; для кабинета Офелии — любая опера. На восточном берегу полуострова, где раньше был рыбацкий посёлок, за десять лет вырос город Копоть : трубы, рельсы, газовые фонари, кирпичные бараки, вечный гул. В центре — Фабрика «Прогресс» , собор из стали и стекла. Здесь делают то, чего полуостров никогда не видел: паровозы, электрические лампы, механические протезы, счётные машины, ружья, консервы. Всё это придумала одна женщина — Офелия Дарквуд . Тайна · только для мастера Машины «Прогресса» работают на небесном железе из карьера «Глотка». Металл Посланца резонирует с эмоциями, и Офелия открыла, что котлы на нём разгоняются от человеческих чувств . Рабочие у станков злятся, боятся, тоскуют, а котёл «Сердце» втягивает это и превращает в давление. После смены рабочие выходят пустыми и тихими. Офелия знает. Она называет это «допустимыми потерями — четыре процента». Её главная тайна — разностная машина «Пифия» в башне фабрики. Пифия по колебаниям небесного железа расшифровывает весть Посланца . Расшифровано семь слов из десяти. Офелия прочитала их по-своему: «Совершенное не меняется. Неизменное — мертво». Вывод: совершенство — это бесконечное улучшение . Мир надо поставить на конвейер и никогда не останавливать. Офелия Дарквуд — гений Кто она. Человек, около 50 лет. Изобретательница железной дороги, электрической лампы и механической руки. Самый умный человек на полуострове, и знает это. Эксцентричность (используйте щедро): В 30 лет сама ампутировала себе здоровую левую руку : «Природа сделала её на 73% эффективной. Я сделала на 94%.» Латунный протез с семью сменными насадками. Носит монокль с семью линзами и переключает их во время разговора, «чтобы увидеть собеседника под разными углами». Говорит в процентах и секундах: «Вы опоздали на 340 секунд. Это 6% моего утра. Я вас прощаю на 80%.» Ездит по цехам на роликовых коньках собственной конструкции и не любит стоять на месте. Спит четыре часа стоя в «камере покоя» — шкафу с паровым подогревом. Даёт рабочим номера из нежности : «Имя можно забыть. Номер — никогда.» Машинам даёт имена людей, которыми восхищается. Кормит голубей шурупами и искренне удивляется, что они не едят. Во время смен по трубам фабрики играет опера. Свою любимую арию она поёт сама, фальшиво и громко. На всех стенах кабинета мелом написаны уравнения. Убирать их запрещено под страхом увольнения. Питомец — механический ворон Эврика . Он повторяет её последние слова с опозданием в 10 секунд. Чего хочет. Поставить мир на конвейер: накормить, осветить, вылечить всех, без чудес и без случайностей. Дочитать весть до конца. Чего боится. Остановиться. Если «Прогресс» встанет хотя бы на час, она считает, что всё развалится. Как говорит. «Ручная работа — это брак, которому дали красивое имя.» «Чудо — это машина, чертежи которой потеряли.» «Сайлас Вейл рисует мир. Я его собираю. Угадайте, чей переживёт зиму.» Отношение к другим силам Сила Отношение Офелии Сайлас Презирает: «Краска — это неточность.» Тайно восхищается тем, что Картина работает без единой шестерёнки Культ Равных Продаёт им эмоциональные конденсаторы . Считает их «мистиками с плохой логистикой». Малрик в восторге от конвейера: для него это и есть равенство Корвин Блэкторн Покупает у него небесное железо. Делает для Бастиона кандалы — те самые, которыми ставят печати Элиас Уважает как «единственного эмпирика на острове». Её протезы лечат то, что он не может Дургар Ночной Молот (хаб) Её бывший мастер-литейщик. Ушёл, когда увидел котёл «Сердце». Не говорит о ней без мата Страна фэйри Её железная дорога идёт к Белой чаще. Холодное железо для фэйри — яд Атмосфера Гудок четыре раза в сутки. Между гудками город замирает и смотрит на трубы. Жёлтый смог, газовые фонари, первые на полуострове электрические лампы : ровный свет, от которого не спрятаться. Рабочие в одинаковых комбинезонах с номерами на груди. После смены — очень тихие. Автоматоны на перфокартах метут улицы, чинят рельсы, патрулируют. Плакаты: «Каждый винтик важен!» «Норма — это свобода!» «Улыбайтесь: 12% к производительности!» Правило локации: Гудок и Конденсат Важно Гудок. Сутки делятся на четыре смены. Во время смены фабрика работает: конвейеры движутся, котлы под давлением, автоматоны заняты делом и не обращают внимания на людей в комбинезонах. Между сменами (30 минут после гудка) автоматоны переходят в режим патруля и проверяют номера у всех. Важно Конденсат. Рядом с котлами фабрика тянет из людей эмоции. Каждый час в цехах — спасбросок Мудрости СЛ 14. Провал: персонаж теряет 1 Отголосок любой эмоции (на выбор мастера), но и 1 вдохновение . Если нет ни того, ни другого — получает 1 уровень истощения («выжат»). Из потерянного Отголоска фабрика делает банку эмоции (см. находки). Сдать эмоцию добровольно. В проходной есть «Пункт приёма»: персонаж может сдать 1 Отголосок за 20 зм. Это способ избавиться от Одержимости. Но каждая сданная банка уходит культу (Часы Культа +1 за каждые 3 банки). Смог. Вне помещений без маски или противогаза — спасбросок Телосложения СЛ 12 раз в 4 часа или помеха на проверки Внимательности до отдыха. Зоны Зона Что там Опасность Город Копоть Бараки, лавка компании, бар «Ровный шов», вокзал Шпики фабрики, долговые надсмотрщики Проходная Турникеты, «Пункт приёма» эмоций, выдача номеров Без номера — проход только между сменами (с риском) Литейный цех Плавка небесного железа Брызги металла, жар, Гневные камни Главный конвейер Километр движущихся лент Затягивает; рабочие не могут отойти от места Цех мелкой сборки Часовые механизмы, протезы Здесь работают дети : у них маленькие пальцы Сборочная автоматонов Ряды механических людей, перфокарты Пробуждённые автоматоны Котельная «Сердце» Огромный котёл, трубы-вены, стеклянные баки с эмоциями Конденсат ×2; взрывоопасно Депо Паровозы, броневагон Охрана, механики Башня «Пифии» Разностная машина размером с церковь Перфокарты-ловушки; Офелия Оранжерея-кабинет Латунные цветы, которые раскрываются по таймеру; уравнения на стенах; ворон Эврика Офелия, её «камера покоя» Ключевые NPC Азраэль Вейн — лидер рабочих Тифлинг, инженер, бывший любимый ученик Офелии. Номер 001. Организует забастовку . Знает про котёл «Сердце» и хочет его остановить. Не хочет разрушать фабрику: «Машины — это хорошо. Плохо то, на чём они работают.» Дилемма: без остановки котла рабочие продолжат выгорать. С остановкой встанет весь город: свет, поезда, протезы, консервы для голодных деревень. Номер Девятнадцать — пробудившийся автоматон Автоматон-уборщик. Конденсат годами проходил сквозь его корпус, и он начал чувствовать : всего понемногу, по крупице от каждого рабочего. Скрывает это. Пишет стихи на обратной стороне перфокарт. Хочет, чтобы его признали человеком . Или хотя бы не переплавили. Ключ к Пифии: он единственный, кто может войти в башню, не сбив перфокарты. Второстепенные NPC NPC Кто Крючок / функция Мастер Бруно Кнут Старший мастер конвейера Жесток к нормам, добр к людям. Тайно отпускает больных раньше гудка. Если его разоблачить, уволят Шплинт Мальчишка 11 лет из цеха мелкой сборки Знает все вентиляционные ходы. Хочет стать инженером, «как госпожа Дарквуд» Ханна Ржа Лидер «Ломателей» Хочет взорвать котёл. Готова к тому, что погибнут рабочие ночной смены Серый покупатель Агент культа Равных Принимает партию из 100 конденсаторов. Если сделка состоится, Часы Культа +2 Машинист Олаф Водитель паровоза «Неутомимая» Может довезти героев куда угодно на полуострове за ночь Эврика Механический ворон Офелии Повторяет всё, что слышит, с опозданием. Идеальный шпион, и для Офелии, и против неё Ловушки и опасности Ловушка Описание Обход Конвейер Упавший на ленту уезжает к прессу: каждый раунд спасбросок Силы СЛ 14, третий провал — пресс, 6d10 дробящего Рычаг аварийной остановки (Расследование СЛ 13), но тогда гудок тревоги Паровой выброс Клапаны сбрасывают пар по таймеру: 4d6 огня в линии 9 м, спасбросок Ловкости СЛ 15 Внимательность СЛ 14 — свист перед выбросом Электрический пол В депо и башне: 3d8 электричества при наступании в металлической обуви или доспехе Резина, дерево, прыжки по изоляторам Перфокарты патруля Автоматоны действуют по картам. Чужак без номера — цель Подменить карту в патрульном (Ловкость рук СЛ 15): автоматон выполнит новый приказ Котёл «Сердце» Касание бака с эмоцией: спасбросок Мудрости СЛ 16 или получить эту эмоцию целиком (3 Отголоска) на час Перчатки, изоляция, Номер 19 Литейный ковш Брызги расплавленного небесного железа: 3d10 огня Щит; держаться в 6 м от ковша Смог См. правило Противогаз, маска чумного доктора Сюжетные линии Забастовка. Азраэль готовит забастовку на следующий гудок. Офелия готовит автоматонов-штрейкбрехеров. Ханна Ржа готовит бомбу. Герои могут оказаться посредниками, взрывателями, охраной или забастовщиками. Котёл «Сердце». В баках хранятся годы чужих эмоций. Если котёл взорвётся, всё вырвется наружу: Копоть на неделю станет Тихим очагом всех эмоций сразу. Пифия. Машина расшифровала семь слов вести. Ей не хватает Тоски («Вы»), Нежности («и») и Желания («живы»): именно этих трёх у культа тоже нет. Офелия хочет «измерить» Велиссу и Кисточку. Взамен Пифия может стать заменой Уха Посланца для концовки «Услышать Весть». Номер Девятнадцать. Если он человек, значит, у автоматонов есть право на жизнь. Тогда Офелия построила рабство. Если нет — его можно переплавить. Сделка культа. Сто конденсаторов уходят Серому покупателю ночным поездом. Ограбление поезда или срыв отгрузки — отличная экшен-сцена. Квесты Квест Кто даёт Суть Награда «Пифия» (основной) Офелия / Номер 19 Попасть в башню и получить расшифровку вести Семь слов вести; Пифия как замена Уха Посланца (при договоре с Офелией) «Гудок» Азраэль Вейн Помочь забастовке: обеспечить остановку котла без взрыва Рабочие Копоти — союзники в Акте V; Часы Культа −1 «Ломатели» Ханна Ржа Заложить бомбу в котёл Котёл уничтожен; цена — ночная смена и Тихий очаг в Копоти «Ночной поезд» Машинист Олаф или Азраэль Перехватить поезд с конденсаторами Часы Культа −2; 10 банок эмоций «Стихи на перфокартах» Номер 19 Доказать Офелии, что он чувствует Номер 19 — компаньон (40 хитов, КД 16, ремонт за 1 час) «Шплинт» Мастер Кнут Вывести детей из цеха мелкой сборки или добиться для них школы Шплинт — проводник по вентиляции; Оттепель Эстела +1 «Заказ Бастиона» — Найти на складе партию кандалов для Корвина Эстел узнаёт, где их делают; кандалы можно испортить: все печати новой партии будут ложными «Билет» Офелия Выполнить для неё любое поручение Пожизненный билет на «Неутомимую» (быстрые перемещения) Тяжёлые выборы Выбор Почему тяжело Остановить котёл «Сердце» Рабочие перестанут выгорать. Но фабрика встанет: погаснет электрический свет, встанут поезда, прекратится выпуск протезов и консервов. В голодных деревнях зимой начнутся смерти Взорвать фабрику (Ломатели) Быстро и окончательно. Погибнет ночная смена, а Копоть станет Тихим очагом. Прогресс на полуострове откатится на двадцать лет Сделка с Офелией Пифия может заменить Ухо Посланца. Но Оф андалов для Бастиона . Офелия делает их, не задавая вопросов. Азраэль показывает ему рабочих в долговых контрактах: «Мы не рабы. Мы просто никогда не расплатимся.» Где граница? Ещё одно: Офелия утверждает, что печать можно выжечь электричеством — пятый способ снять её (3d10 урона, малая травма, 50% шанс, что печать просто сместится). Велисса. Для Офелии она — «сбой в материи, а значит, самое интересное, что я видела за 20 лет». Офелия предлагает закончить её механически : латунный каркас и лак собственного состава. Это снимет слабость к солнцу и морозу, но Велисса станет наполовину машиной. Ума. Железная дорога тянется к Белой чаще. Холодное железо — яд для фэйри. Если рельсы дойдут до границы, страна фэйри окажется отрезана навсегда — или, наоборот, станет беззащитной. Капитан Ирвель потребует остановить стройку. Тесори. Есть ли у Номера Девятнадцать сердце, которое можно взвесить? Если Тесори вернулся, это вопрос для него."}, {"id": "s19", "n": 19, "title": "ГНЕЗДО ВЕЙЛОВ", "disp": "Гнездо Вейлов", "group": "Акт II", "html": "<p><strong>Тип:<\/strong> сюжетная локация Акта II. <strong>Эмоции:<\/strong> Тоска и Зависть (семейные). <strong>Рекомендуемый уровень:<\/strong> 6–8. <strong>Музыка:<\/strong> Внутри здания, Библиотека, Туман / гром.<\/p><p>Родовое поместье семьи Вейл на скале у края Кратера. Здесь выросли Сайлас и Элиас, сюда вернулась Нерисса. Дом пуст сорок лет — и всё это время <strong>ждёт свою семью<\/strong>. Сейчас в подвалах поместья — <strong>штаб культа Равных<\/strong> на полуострове.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> После падения Посланца Ирена Вейл сделала дом своей лабораторией. Касание Посланца пропитало стены: дом <strong>помнит<\/strong>, кто в нём жил, и пытается снова собрать семью. Любой, кто переступит порог, получает в доме <strong>роль<\/strong>. Нерисса использует это: здесь она снова «младшая дочь», которую наконец любят, — дом даёт ей то, чего не дала мать.<\/p><\/div><h2 id=\"s19-1\">Атмосфера<\/h2><ul><li>Накрытый на пятерых стол; еда свежая, хотя никто не готовил.<\/li><li>Детские рисунки на стенах: на одних кисть, на других скальпель. На рисунках Нериссы нет ничего — пустые листы.<\/li><li>Часы во всех комнатах показывают время падения Посланца.<\/li><li>В саду цветёт нарисованная яблоня — первое, что маленький Сайлас «оживил». Её яблоки не гниют.<\/li><\/ul><h2 id=\"s19-2\">Правило локации: Роли<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> При входе каждый герой получает от дома <strong>роль<\/strong> (мастер выбирает или бросает 1d6): 1 — сын-художник, 2 — сын-врач, 3 — младшая дочь, 4 — мать, 5 — слуга, 6 — гость. Пока герой <strong>играет роль<\/strong>, дом к нему добр: двери открываются, ловушки спят. Если герой <strong>выходит из роли<\/strong> (атакует члена «семьи», отказывается сесть за стол, говорит «я не ваш»), — спасбросок Мудрости СЛ 14. Провал: 1 Отголосок Тоски и дом становится враждебным в этой комнате.<\/p><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Роли — отличный инструмент для ролевой игры. Пусть Эстел, ищущий семью, получит роль «сына», и пусть дом <strong>будет ему настоящей семьёй<\/strong>. Это ловушка, которую он захочет не заметить.<\/p><\/div><h2 id=\"s19-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Столовая<\/td><td>Стол на пятерых; портрет семьи, где лица Ирены и мужа закрашены<\/td><td>Ужин: кто ест, тот получает роль навсегда (спасбросок Харизмы СЛ 14)<\/td><\/tr><tr><td>Детская<\/td><td>Две колыбели — с вырезанной кистью и со скальпелем; третья, сломанная, в углу<\/td><td>Игрушки-нарисованные, просят поиграть<\/td><\/tr><tr><td>Кабинет Ирены<\/td><td>Звёздные карты, образцы краски из кратера, дневник<\/td><td>Охрана культа; запертый сейф<\/td><\/tr><tr><td>Комната Нериссы<\/td><td>Сожжённые портреты братьев; её единственный рисунок — пустая рама<\/td><td>Нерисса (если дома)<\/td><\/tr><tr><td>Оранжерея<\/td><td>Нарисованная яблоня, банки с первой краской<\/td><td>Ожившие растения<\/td><\/tr><tr><td>Подвал-часовня<\/td><td>Штаб культа: карты, список артефактов, клетка для Велиссы<\/td><td>Культисты, Равные без лиц<\/td><\/tr><tr><td>Чердак-обсерватория<\/td><td>Первый телескоп Ирены<\/td><td>Ключ к Обсерватории «Звёздный Колодец»<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-4\">Ключевые NPC<\/h2><h3>Нерисса Вейл — дома<\/h3><ul><li>Здесь Нерисса <strong>уязвима<\/strong>: дом зовёт её «доченькой», и она не может себя заставить уйти.<\/li><li>Она хранит <strong>письмо матери<\/strong>, которое так и не вскрыла.<\/li><li><strong>Что хочет:<\/strong> чтобы братья признали её. Чтобы мать её увидела. Культ обещал, что после Уравнения «больше никто не будет любим сильнее».<\/li><\/ul><h3>Нянька Грета<\/h3><ul><li>Человек, очень старая, почти слепая. Вырастила всех троих детей. Жива и живёт в домике садовника.<\/li><li>Помнит, как Ирена вернулась из кратера «с чужим светом в глазах». Помнит, как маленький Сайлас нарисовал ей птицу, и та улетела.<\/li><li><strong>Функция:<\/strong> рассказывает о семье; знает, где Ирена спрятала дневник; любит Нериссу, но боится её.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Маленький Сайлас<\/td><td>Нарисованный мальчик лет восьми — автопортрет, оживший случайно<\/td><td>Играет в детской. Знает, где спрятана «первая краска». Не знает, что он нарисован.<\/td><\/tr><tr><td>Квартирмейстер Ордо<\/td><td>Культист, лицо стёрто наполовину<\/td><td>Хранит список целей культа: Велисса, Кисточка, Сайлас. Можно подкупить или запугать.<\/td><\/tr><tr><td>Слуга-без-лица<\/td><td>Равный, бывший дворецкий<\/td><td>Всё ещё подаёт на стол. Если назвать его по имени (найти в книге слуг), он вспоминает себя и помогает<\/td><\/tr><tr><td>Телескоп «Ирена»<\/td><td>Механизм с голосом<\/td><td>Отвечает на вопросы только тем, у кого роль «мать»<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-5\">Ловушки<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Семейный ужин<\/td><td>Кто ест за столом — роль становится постоянной до конца сцены, даже вне дома (спасбросок Харизмы СЛ 14)<\/td><td>Есть «понарошку» (Ловкость рук СЛ 13)<\/td><\/tr><tr><td>Колыбельная<\/td><td>В детской играет музыкальная шкатулка. Спасбросок Мудрости СЛ 13 или персонаж засыпает на 1 минуту<\/td><td>Сломать шкатулку; заткнуть уши<\/td><\/tr><tr><td>Пустая рама Нериссы<\/td><td>Смотрящий в раму видит себя «никем» — 1d10 психического урона и помеха на следующую проверку<\/td><td>Завесить; Нерисса может «снять» эффект<\/td><\/tr><tr><td>Сейф Ирены<\/td><td>Открывается звёздной картой (Обсерватория) или кровью Вейла. Ошибка — вспышка 4d6 излучения<\/td><td>Кровь Сайласа (с холста), Элиаса или Нериссы<\/td><\/tr><tr><td>Часы падения<\/td><td>Все часы бьют разом: на 1 раунд время останавливается для всех, кроме «членов семьи»<\/td><td>Иметь роль; Мастихин режет остановку<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-6\">Сюжетные линии<\/h2><ol><li><strong>Дневник Ирены.<\/strong> Ирена знала, что эмоций десять и что весть — предупреждение. Она пыталась собрать их <strong>с любовью<\/strong>, а не силой, и не успела. Её дневник даёт партии подсказку к концовке «Услышать Весть».<\/li><li><strong>Письмо матери.<\/strong> Нерисса не вскрывала письмо 30 лет. В нём Ирена пишет, что <strong>дар не передала Нериссе специально<\/strong>, чтобы уберечь её: «Я хотела, чтобы хоть одна из моих детей была просто живой». Если Нерисса его прочитает — её линия поворачивает.<\/li><li><strong>Клетка для Велиссы.<\/strong> Культ готов к похищению. Сорвать подготовку — значит выиграть время; не заметить — Велиссу попытаются похитить в ближайшую передышку.<\/li><li><strong>Ключ к Обсерватории.<\/strong> Без первого телескопа Ирены Эларис не сможет точно рассчитать Ночь Звезды. Без него ритуал придётся проводить наугад.<\/li><\/ol><h2 id=\"s19-7\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Дневник Ирены» (основной)<\/td><td>Нянька Грета<\/td><td>Найти дневник в сейфе<\/td><td>Знание о десяти эмоциях; подсказка к «Услышать Весть»<\/td><\/tr><tr><td>«Доченька»<\/td><td>Дом<\/td><td>Убедить Нериссу вскрыть письмо<\/td><td>Нерисса колеблется или переходит на сторону героев<\/td><\/tr><tr><td>«Цели культа»<\/td><td>Квартирмейстер Ордо<\/td><td>Выкрасть список и планы культа<\/td><td>Часы Культа −2<\/td><\/tr><tr><td>«Маленький Сайлас»<\/td><td>—<\/td><td>Решить, что делать с нарисованным ребёнком<\/td><td>См. тяжёлые выборы<\/td><\/tr><tr><td>«Ключ к звёздам»<\/td><td>Телескоп «Ирена»<\/td><td>Снять линзу первого телескопа<\/td><td>Точная дата ритуала<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-8\">Мини-босс: Дом Вейлов<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>120 (сам дом; урон наносится по «сердцу» — портрету семьи в столовой)<\/td><\/tr><tr><td>Особенность<\/td><td>В каждой комнате 1 раз за раунд дом атакует мебелью, дверьми, лестницей (+7, 2d8 дробящего)<\/td><\/tr><tr><td>Подготовка<\/td><td>«Семейный сбор»: дом запирает все двери и стягивает всех в столовую. Если не прервать — каждый герой без роли получает 3d10 психического урона<\/td><\/tr><tr><td>Прерывание<\/td><td>Кто-то с ролью «мать» или «сын» говорит дому: «Мы дома». Или портрет семьи пробит Мастихином<\/td><\/tr><tr><td>Надлом<\/td><td>Каждое правдивое слово о семье Вейл, сказанное в столовой, — жетон Надлома<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-9\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Дневник Ирены<\/strong><\/td><td>Сейф<\/td><td>Сюжетный; подсказ
