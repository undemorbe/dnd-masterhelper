ящему говорить. Что хочет: чтобы мёртвые не проступали. Чтобы никто не узнал, что город стоит на кладбище. Реплика: «Я не мог их спасти. Я мог только сделать так, чтобы они не были мёртвыми.» Угольная Ирена Эскиз матери Сайласа, сделанный им в детстве. Говорит его детскими словами. Знает, чем закончить Картину правильно: «Холст надо залатать шёлком, из которого он соткан ». Это ведёт в Акт IV. Второстепенные NPC NPC Кто Функция Угольный Гравенхольмец Мертвец, чьё лицо носит знакомый героям нарисованный NPC Просит: «Скажи ему, что я его прощаю» или «Верни мне моё лицо» Молодой Элиас (эскиз) Угольный Повторяет: «Я опоздал». Если настоящий Элиас увидит его — ключевая сцена братьев Девочка у колодца Первая умершая Знает, что чума пришла с краской. Ирена принесла её не со зла Квесты Квест Кто даёт Суть Награда «Залатать холст» (основной) Угольная Ирена Узнать, как спасти Картину Путь в страну фэйри «Лицо мертвеца» Угольный гравенхольмец Передать слова живому двойнику наверху Нарисованный NPC узнаёт правду. Решение — его «Колодец» Девочка Достать первую банку краски Первая краска (без Мазков, 2 заряда) «Братья» — Привести Элиаса (через Узы или раму) к Сайласу в подмалёвок Сайлас и Элиас говорят впервые за 40 лет Опасности Опасность Описание Обход Проступающие Угольные мертвецы выходят из стен, если рядом есть цвет: 2d8 некротического Стать угольным (правило локации) Мазок сверху Тень кисти Сайласа закрашивает участок: спасбросок Ловкости СЛ 15 или персонаж «закрашен» — перенесён наверх, в живой город Уйти с тени; Сайлас может остановить кисть Яма Падающий в яму — 4d10 некротического и 1 уровень истощения Верёвка; угольные мертвецы помогают выбраться угольному персонажу Находки Предмет Где Эффект Первая краска Ирены Колодец 2 заряда без Мазков Угольный карандаш Сайласа Мастерская-в-эскизе Нарисовать на стене дверь, которая работает 1 раз (в подмалёвке — без цены) Повязка чумного врача Дом Элиаса Иммунитет к болезням; преимущество против некротического урона Пепел колодца Колодец Материал: свойство «Угольное» — +1d6 против нарисованных, но не работает против угольных Список умерших Яма Все имена — для Книги Мёртвых (Некрополь) Тяжёлые выборы Выбор Почему тяжело Рассказать городу, на чём он стоит Правда разрушит веру горожан в свою жизнь. Ложь сохранит их счастье и предаст мёртвых Отдать мёртвым их лица Угольный мертвец может забрать лицо у нарисованного двойника: двойник исчезает, мертвец обретает покой Сайлас: помочь или остановить Помочь закрашивать — город проживёт дольше. Остановить — мёртвые проступят, и город станет честным кладбищем"}, {"id": "s25", "n": 25, "title": "ГАЛЕРЕЯ ОТВЕРГНУТЫХ", "disp": "Галерея отвергнутых", "group": "Акт III", "html": "<p>Где-то между краской и углём есть зал, куда Сайлас складывает <strong>неудачи<\/strong>. Сюда попадают отброшенные наброски: неправильные лица, лишние руки, ранние версии людей. Сейчас Отвергнутые <strong>восстали<\/strong>: они хотят занять место законченных.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Предводитель восстания — <strong>Велисса-Законченная<\/strong>, одна из запечатанных «осколков личности» Велиссы. Это та версия, которую Сайлас пытался сделать правильной: идеальная, послушная, без грубых мазков. Она считает настоящую Велиссу неудачей и хочет <strong>занять её место<\/strong> снаружи.<\/p><\/div><h2 id=\"s25-1\">Атмосфера<\/h2><ul><li>Бесконечный зал с холстами, повёрнутыми лицом к стене.<\/li><li>Сотни голосов шепчут: «я лучше», «я была первой», «закончи меня».<\/li><li>Всё, что здесь есть, — почти правильное: лица чуть асимметричны, у собак пять ног.<\/li><\/ul><h2 id=\"s25-2\">Правило локации: Сравнение<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый герой встречает здесь <strong>свой набросок<\/strong> — версию себя, которую Сайлас мог бы написать. Каждый раз, когда набросок и герой делают одно и то же действие (атакуют, говорят, колдуют), они сравниваются: противоборство характеристик. Проигравший получает 1 Отголосок Зависти. Если герой проигрывает 3 сравнения подряд, набросок <strong>меняется с ним местами<\/strong> до конца сцены (игрок играет за набросок, мастер — за героя).<\/p><\/div><h2 id=\"s25-3\">Ключевые NPC<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Что хочет<\/th><\/tr><\/thead><tbody><tr><td><strong>Велисса-Законченная<\/strong><\/td><td>Осколок личности Велиссы<\/td><td>Выйти наружу и стать «настоящей Велиссой». Предлагает сделку: «Отдай мне имя, и я отдам тебе покой»<\/td><\/tr><tr><td><strong>Третий Фредерик<\/strong><\/td><td>Носит зелёный перстень и синий берет — тот самый из «здания 1»<\/td><td>Самый первый, самый грустный набросок. Помнит, как Фредерик выглядел до всех исправлений<\/td><\/tr><tr><td><strong>Первый Король Крыс<\/strong><\/td><td>Одна огромная крыса без стаи<\/td><td>Самый одинокий набросок. Хочет к своим<\/td><\/tr><tr><td><strong>Кисточки-наброски<\/strong><\/td><td>Ранние версии Кисточки — лисята без глаз, без хвоста<\/td><td>Просят у настоящего Кисточки «немного жизни»<\/td><\/tr><tr><td><strong>Набросок Эстела<\/strong><\/td><td>Котёнок в клетке, который «сопротивлялся»<\/td><td>Версия Эстела, которую хотел Корвин. Яростный, жестокий, свободный от холода<\/td><\/tr><tr><td><strong>Набросок Умы<\/strong><\/td><td>Фэйри в парадной форме с медалями<\/td><td>Версия Умы, которая <strong>не ошиблась<\/strong>: ребёнок полетел. Она не понимает, почему Ума такая<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s25-4\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Восстание Отвергнутых» (основной)<\/td><td>Остановить восстание — силой, сделкой или исполнив желания отвергнутых<\/td><td>Отвергнутые не прорвутся в город<\/td><\/tr><tr><td>«Осколок»<\/td><td>Велисса встречает себя законченную<\/td><td>Решение её линии (см. тяжёлые выборы)<\/td><\/tr><tr><td>«Третий Фредерик»<\/td><td>Вернуть его к двум другим<\/td><td>Слияние трёх Фредериков — или покой для одного<\/td><\/tr><tr><td>«Наброски героев»<\/td><td>Каждый герой побеждает или принимает свой набросок<\/td><td>Набросок становится <strong>чертой<\/strong>: герой получает одну его способность (см. находки)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s25-5\">Опасности<\/h2><div class=\"tbl\"><table><thead><tr><th>Опасность<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Повёрнутые холсты<\/td><td>Повернуть холст лицом — выпустить его обитателя<\/td><td>Не трогать; или повернуть нужный<\/td><\/tr><tr><td>Хор «закончи меня»<\/td><td>Спасбросок Мудрости СЛ 15 или персонаж тратит ресурс (заряд краски, заклинание) на набросок<\/td><td>Затыкать уши; Узы «Ключ»<\/td><\/tr><tr><td>Восстание<\/td><td>Волны отвергнутых: 2d6 набросков (по 15 хитов) каждый раунд, пока Велисса-Законченная не остановлена<\/td><td>Портрет-оберег; сделка<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s25-6\">Мини-босс: Велисса-Законченная<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>130<\/td><\/tr><tr><td>Особенность<\/td><td>Все заклинания и черты настоящей Велиссы, но <strong>без её слабостей<\/strong>: солнце, мороз, отвержение на неё не действуют<\/td><\/tr><tr><td>Подготовка<\/td><td>«Подмена»: касается Велиссы. Если не прервать — меняется с ней местами (настоящая Велисса оказывается за холстом)<\/td><\/tr><tr><td>Прерывание<\/td><td>Кто-то из партии называет черту настоящей Велиссы, которой у Законченной <strong>нет<\/strong> (грубость, издёвка, странное любопытство). Каждая названная черта — она пошатывается<\/td><\/tr><tr><td>Надлом<\/td><td>Ей больно, когда настоящую Велиссу <strong>любят такой, какая она есть<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s25-7\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Черта наброска<\/strong><\/td><td>Победа или примирение со своим наброском<\/td><td>Эстел: 1 раз в день ярость наброска (+1d6 урона, иммунитет к испугу на 1 мин). Ума: 1 раз в день — «Безупречный приказ» (союзник перебрасывает атаку). Велисса: 1 раз в день — игнорировать отвержение<\/td><\/tr><tr><td><strong>Повёрнутый холст<\/strong><\/td><td>Галерея<\/td><td>Внутри можно спрятать одно существо или предмет — «карманный тайник»<\/td><\/tr><tr><td><strong>Зелёный перстень и синий берет (оригиналы)<\/strong><\/td><td>Третий Фредерик<\/td><td>Ключ к слиянию Фредериков<\/td><\/tr><tr><td><strong>Корона первого Короля<\/strong><\/td><td>Первый Король Крыс<\/td><td>С каменной короной: крысы слушаются как одна армия<\/td><\/tr><tr><td><strong>Ранние кисточки<\/strong><\/td><td>Мастерская отвергнутых<\/td><td>3 кисти: каждая — 1 мелкая правка в Картине без краски<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s25-8\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Велисса и её законченная версия<\/strong><\/td><td>Законченная — лучше по всем меркам. Отдать ей имя — Велисса обретёт покой (уйдёт в холст), а снаружи будет Велисса, которую все хотели видеть. Отказать — убить «себя»<\/td><\/tr><tr><td><strong>Набросок Умы<\/strong><\/td><td>Ума видит себя, которая не ошиблась. Набросок предлагает поменяться: «Я пойду домой с победой. Ты останешься здесь без вины»<\/td><\/tr><tr><td><strong>Набросок Эстела<\/strong><\/td><td>Яростный котёнок свободен от холода, но полон Гнева. Принять его — Оттепель +2, но 1 Отголосок Гнева навсегда<\/td><\/tr><tr><td><strong>Отвергнутые<\/strong><\/td><td>Они тоже хотят жить. Запереть их обратно — вечное заточение. Выпустить — город наполнится полу-людьми<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s25-1", "Атмосфера"], ["s25-2", "Правило локации: Сравнение"], ["s25-3", "Ключевые NPC"], ["s25-4", "Квесты"], ["s25-5", "Опасности"], ["s25-6", "Мини-босс: Велисса-Законченная"], ["s25-7", "Находки"], ["s25-8", "Тяжёлые выборы"]], "text": "Где-то между краской и углём есть зал, куда Сайлас складывает неудачи . Сюда попадают отброшенные наброски: неправильные лица, лишние руки, ранние версии людей. Сейчас Отвергнутые восстали : они хотят занять место законченных. Тайна · только для мастера Предводитель восстания — Велисса-Законченная , одна из запечатанных «осколков личности» Велиссы. Это та версия, которую Сайлас пытался сделать правильной: идеальная, послушная, без грубых мазков. Она считает настоящую Велиссу неудачей и хочет занять её место снаружи. Атмосфера Бесконечный зал с холстами, повёрнутыми лицом к стене. Сотни голосов шепчут: «я лучше», «я была первой», «закончи меня». Всё, что здесь есть, — почти правильное: лица чуть асимметричны, у собак пять ног. Правило локации: Сравнение Важно Каждый герой встречает здесь свой набросок — версию себя, которую Сайлас мог бы написать. Каждый раз, когда набросок и герой делают одно и то же действие (атакуют, говорят, колдуют), они сравниваются: противоборство характеристик. Проигравший получает 1 Отголосок Зависти. Если герой проигрывает 3 сравнения подряд, набросок меняется с ним местами до конца сцены (игрок играет за набросок, мастер — за героя). Ключевые NPC NPC Кто Что хочет Велисса-Законченная Осколок личности Велиссы Выйти наружу и стать «настоящей Велиссой». Предлагает сделку: «Отдай мне имя, и я отдам тебе покой» Третий Фредерик Носит зелёный перстень и синий берет — тот самый из «здания 1» Самый первый, самый грустный набросок. Помнит, как Фредерик выглядел до всех исправлений Первый Король Крыс Одна огромная крыса без стаи Самый одинокий набросок. Хочет к своим Кисточки-наброски Ранние версии Кисточки — лисята без глаз, без хвоста Просят у настоящего Кисточки «немного жизни» Набросок Эстела Котёнок в клетке, который «сопротивлялся» Версия Эстела, которую хотел Корвин. Яростный, жестокий, свободный от холода Набросок Умы Фэйри в парадной форме с медалями Версия Умы, которая не ошиблась : ребёнок полетел. Она не понимает, почему Ума такая Квесты Квест Суть Награда «Восстание Отвергнутых» (основной) Остановить восстание — силой, сделкой или исполнив желания отвергнутых Отвергнутые не прорвутся в город «Осколок» Велисса встречает себя законченную Решение её линии (см. тяжёлые выборы) «Третий Фредерик» Вернуть его к двум другим Слияние трёх Фредериков — или покой для одного «Наброски героев» Каждый герой побеждает или принимает свой набросок Набросок становится чертой : герой получает одну его способность (см. находки) Опасности Опасность Описание Обход Повёрнутые холсты Повернуть холст лицом — выпустить его обитателя Не трогать; или повернуть нужный Хор «закончи меня» Спасбросок Мудрости СЛ 15 или персонаж тратит ресурс (заряд краски, заклинание) на набросок Затыкать уши; Узы «Ключ» Восстание Волны отвергнутых: 2d6 набросков (по 15 хитов) каждый раунд, пока Велисса-Законченная не остановлена Портрет-оберег; сделка Мини-босс: Велисса-Законченная Параметр Значение Хиты 130 Особенность Все заклинания и черты настоящей Велиссы, но без её слабостей : солнце, мороз, отвержение на неё не действуют Подготовка «Подмена»: касается Велиссы. Если не прервать — меняется с ней местами (настоящая Велисса оказывается за холстом) Прерывание Кто-то из партии называет черту настоящей Велиссы, которой у Законченной нет (грубость, издёвка, странное любопытство). Каждая названная черта — она пошатывается Надлом Ей больно, когда настоящую Велиссу любят такой, какая она есть Находки Предмет Где Эффект Черта наброска Победа или примирение со своим наброском Эстел: 1 раз в день ярость наброска (+1d6 урона, иммунитет к испугу на 1 мин). Ума: 1 раз в день — «Безупречный приказ» (союзник перебрасывает атаку). Велисса: 1 раз в день — игнорировать отвержение Повёрнутый холст Галерея Внутри можно спрятать одно существо или предмет — «карманный тайник» Зелёный перстень и синий берет (оригиналы) Третий Фредерик Ключ к слиянию Фредериков Корона первого Короля Первый Король Крыс С каменной короной: крысы слушаются как одна армия Ранние кисточки Мастерская отвергнутых 3 кисти: каждая — 1 мелкая правка в Картине без краски Тяжёлые выборы Выбор Почему тяжело Велисса и её законченная версия Законченная — лучше по всем меркам. Отдать ей имя — Велисса обретёт покой (уйдёт в холст), а снаружи будет Велисса, которую все хотели видеть. Отказать — убить «себя» Набросок Умы Ума видит себя, которая не ошиблась. Набросок предлагает поменяться: «Я пойду домой с победой. Ты останешься здесь без вины» Набросок Эстела Яростный котёнок свободен от холода, но полон Гнева. Принять его — Оттепель +2, но 1 Отголосок Гнева навсегда Отвергнутые Они тоже хотят жить. Запереть их обратно — вечное заточение. Выпустить — город наполнится полу-людьми"}, {"id": "s26", "n": 26, "title": "СУД ОСИРИСА", "disp": "Суд Осириса", "group": "Акт III", "html": "<p>В ратуше Гравенхольма Тесори устроил <strong>суд<\/strong>. На месте трибуны — огромные весы, призванные Осирисом. Нарисованных жителей ведут по одному. Сердце нарисованного — капля краски, и она всегда <strong>легче пера<\/strong>. По закону Осириса это значит: душа пуста, и её надо стереть.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Тесори не хочет этого делать. Каждый приговор ломает его. Он ждёт, что кто-нибудь <strong>оспорит закон<\/strong> — и не может сделать этого сам: он связан приказом. Если партия выступит защитником, Осирис <strong>обязан выслушать<\/strong>.<\/p><\/div><h2 id=\"s26-1\">Механика: Суд<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Суд проходит в <strong>три раунда<\/strong> аргументов. В каждом раунде партия предъявляет <strong>доказательство<\/strong> и <strong>говорит речь<\/strong>. Мастер оценивает речь от 0 до 2, доказательство — по таблице. Обвинение (голос Осириса через Тесори) отвечает. Счёт ведётся на <strong>Весах<\/strong>: нужно набрать <strong>6 очков<\/strong>, чтобы город признали живым.<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>Доказательство<\/th><th>Очки<\/th><th>Откуда<\/th><\/tr><\/thead><tbody><tr><td><strong>Перо Истины<\/strong><\/td><td>3<\/td><td>Некрополь Осириса<\/td><\/tr><tr><td><strong>Фотография<\/strong> (показывает, что люди были живыми)<\/td><td>2<\/td><td>Мглин<\/td><\/tr><tr><td><strong>Казуистика Элиаса<\/strong> (оригинал, с именами)<\/td><td>2<\/td><td>Обитель<\/td><\/tr><tr><td>Свидетель — угольный мертвец из Подмалёвка, который прощает своего двойника<\/td><td>2<\/td><td>Подмалёвок<\/td><\/tr><tr><td>Нарисованный NPC, который рискнул собой ради героев<\/td><td>1<\/td><td>Любой акт<\/td><\/tr><tr><td>Сломанные Узы или ложь в суде<\/td><td>−1<\/td><td>—<\/td><\/tr><tr><td>Сердце Велиссы (она сама соглашается встать на весы)<\/td><td>2, но см. выборы<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p><strong>6+ очков:<\/strong> Осирис признаёт нарисованных <strong>живыми, но иными<\/strong>. Приказ отменён. Тесори свободен.<\/p><p><strong>3–5 очков:<\/strong> Осирис признаёт живыми <strong>только тех, за кого говорили<\/strong> (конкретных NPC). Остальных суд продолжит.<\/p><p><strong>0–2 очка:<\/strong> приговор — стереть всех. Тесори вынужден сражаться с героями.<\/p><h2 id=\"s26-2\">Кто в зале<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Роль<\/th><\/tr><\/thead><tbody><tr><td><strong>Тесори<\/strong><\/td><td>Судья поневоле. Его голос — голос Осириса, глаза — свои<\/td><\/tr><tr><td><strong>Голос Осириса<\/strong><\/td><td>Обвинитель. Холоден и справедлив: «Покажите мне сердце, которое весит»<\/td><\/tr><tr><td><strong>Подсудимые<\/strong><\/td><td>Знакомые NPC: нарисованный Элиас, Фредерик, одна из Иар, Графиня<\/td><\/tr><tr><td><strong>Отец Вальдрик<\/strong><\/td><td>Свидетель обвинения: «Они пятна. Я сам их видел»<\/td><\/tr><tr><td><strong>Нарисованные горожане<\/strong><\/td><td>Публика. Каждое удачное слово героев снижает Страх нарисованных<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s26-3\">Если суд проигран: бой с Тесори<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>160<\/td><\/tr><tr><td>Особенность<\/td><td>Хопеш Осириса (если у него), сила Осириса: каждое попадание по нарисованному — двойной урон<\/td><\/tr><tr><td>Подготовка<\/td><td>«Приговор»: поднимает руку к весам. Если не прервать — один нарисованный NPC в зале стирается навсегда<\/td><\/tr><tr><td>Прерывание<\/td><td>Назвать Тесори по имени и напомнить о Групповом портрете (пустое место). Или положить на весы своё сердце (герой получает 3d10 некротического, но приговор откладывается)<\/td><\/tr><tr><td>Надлом<\/td><td>Каждый раз, когда Тесори щадит кого-то, — жетон. При трёх жетонах он сам ломает приказ<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s26-4\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Весы Осириса (малые)<\/strong><\/td><td>После суда<\/td><td>1 раз в день — узнать, лжёт ли собеседник<\/td><\/tr><tr><td><strong>Печать оправдания<\/strong><\/td><td>Если суд выигран<\/td><td>Нарисованные NPC, получившие её, не могут быть стёрты растворителем или Перекраской<\/td><\/tr><tr><td><strong>Тесори<\/strong><\/td><td>Если суд выигран<\/td><td>Тесори возвращается в партию (как NPC или как персонаж игрока)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s26-5\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Перо для суда или для Велиссы<\/strong><\/td><td>Если Перо уже потрачено на Велиссу, в суде его нет. Город придётся защищать без главного доказательства<\/td><\/tr><tr><td><strong>Сердце Велиссы на весах<\/strong><\/td><td>Велисса может встать на весы как доказательство: если её сердце <strong>перевесит<\/strong>, Осирис признает весь город. Если нет — её сотрут первой<\/td><\/tr><tr><td><strong>Вальдрик-свидетель<\/strong><\/td><td>Опровергнуть Вальдрика — значит рассказать суду, что он служит культу. Тогда Осирис потребует судить и его, а он тоже нарисован<\/td><\/tr><tr><td><strong>Тесори<\/strong><\/td><td>Если суд проигран, победить Тесори — значит убить друга, исполнявшего приказ<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s26-6\">Выход из Акта III<\/h2><p>После Подмалёвка, Галереи и Суда партия знает: чтобы Картина пережила ритуал, её нужно <strong>залатать фэйским шёлком<\/strong> — тем, из которого она соткана. Шёлк ткут только в стране фэйри. Угольная Ирена, Ума и зов Велиссы указывают туда же. Начинается <strong>Акт IV<\/strong>.<\/p>", "toc": [["s26-1", "Механика: Суд"], ["s26-2", "Кто в зале"], ["s26-3", "Если суд проигран: бой с Тесори"], ["s26-4", "Находки"], ["s26-5", "Тяжёлые выборы"], ["s26-6", "Выход из Акта III"]], "text": "В ратуше Гравенхольма Тесори устроил суд . На месте трибуны — огромные весы, призванные Осирисом. Нарисованных жителей ведут по одному. Сердце нарисованного — капля краски, и она всегда легче пера . По закону Осириса это значит: душа пуста, и её надо стереть. Тайна · только для мастера Тесори не хочет этого делать. Каждый приговор ломает его. Он ждёт, что кто-нибудь оспорит закон — и не может сделать этого сам: он связан приказом. Если партия выступит защитником, Осирис обязан выслушать . Механика: Суд Важно Суд проходит в три раунда аргументов. В каждом раунде партия предъявляет доказательство и говорит речь . Мастер оценивает речь от 0 до 2, доказательство — по таблице. Обвинение (голос Осириса через Тесори) отвечает. Счёт ведётся на Весах : нужно набрать 6 очков , чтобы город признали живым. Доказательство Очки Откуда Перо Истины 3 Некрополь Осириса Фотография (показывает, что люди были живыми) 2 Мглин Казуистика Элиаса (оригинал, с именами) 2 Обитель Свидетель — угольный мертвец из Подмалёвка, который прощает своего двойника 2 Подмалёвок Нарисованный NPC, который рискнул собой ради героев 1 Любой акт Сломанные Узы или ложь в суде −1 — Сердце Велиссы (она сама соглашается встать на весы) 2, но см. выборы — 6+ очков: Осирис признаёт нарисованных живыми, но иными . Приказ отменён. Тесори свободен. 3–5 очков: Осирис признаёт живыми только тех, за кого говорили (конкретных NPC). Остальных суд продолжит. 0–2 очка: приговор — стереть всех. Тесори вынужден сражаться с героями. Кто в зале NPC Роль Тесори Судья поневоле. Его голос — голос Осириса, глаза — свои Голос Осириса Обвинитель. Холоден и справедлив: «Покажите мне сердце, которое весит» Подсудимые Знакомые NPC: нарисованный Элиас, Фредерик, одна из Иар, Графиня Отец Вальдрик Свидетель обвинения: «Они пятна. Я сам их видел» Нарисованные горожане Публика. Каждое удачное слово героев снижает Страх нарисованных Если суд проигран: бой с Тесори Параметр Значение Хиты 160 Особенность Хопеш Осириса (если у него), сила Осириса: каждое попадание по нарисованному — двойной урон Подготовка «Приговор»: поднимает руку к весам. Если не прервать — один нарисованный NPC в зале стирается навсегда Прерывание Назвать Тесори по имени и напомнить о Групповом портрете (пустое место). Или положить на весы своё сердце (герой получает 3d10 некротического, но приговор откладывается) Надлом Каждый раз, когда Тесори щадит кого-то, — жетон. При трёх жетонах он сам ломает приказ Находки Предмет Где Эффект Весы Осириса (малые) После суда 1 раз в день — узнать, лжёт ли собеседник Печать оправдания Если суд выигран Нарисованные NPC, получившие её, не могут быть стёрты растворителем или Перекраской Тесори Если суд выигран Тесори возвращается в партию (как NPC или как персонаж игрока) Тяжёлые выборы Выбор Почему тяжело Перо для суда или для Велиссы Если Перо уже потрачено на Велиссу, в суде его нет. Город придётся защищать без главного доказательства Сердце Велиссы на весах Велисса может встать на весы как доказательство: если её сердце перевесит , Осирис признает весь город. Если нет — её сотрут первой Вальдрик-свидетель Опровергнуть Вальдрика — значит рассказать суду, что он служит культу. Тогда Осирис потребует судить и его, а он тоже нарисован Тесори Если суд проигран, победить Тесори — значит убить друга, исполнявшего приказ Выход из Акта III После Подмалёвка, Галереи и Суда партия знает: чтобы Картина пережила ритуал, её нужно залатать фэйским шёлком — тем, из которого она соткана. Шёлк ткут только в стране фэйри. Угольная Ирена, Ума и зов Велиссы указывают туда же. Начинается Акт IV ."}, {"id": "s27", "n": 27, "title": "АКТ IV: СТРАНА ФЭЙРИ", "disp": "Акт IV: страна фэйри", "group": "Акт IV", "html": "<p><strong>Уровни:<\/strong> 11–13. <strong>Где:<\/strong> закрытое королевство фэйри за Белой чащей (рабочее название — <strong>Вересковый Предел<\/strong>; название лучше узнать у игрока Умы). <strong>Главный вопрос акта:<\/strong> спасать один мир за счёт другого — или искать путь, при котором выживут оба?<\/p><h2 id=\"s27-1\">Зачем герои идут к фэйри<\/h2><div class=\"tbl\"><table><thead><tr><th>Нужно<\/th><th>Где<\/th><th>Кому важно<\/th><\/tr><\/thead><tbody><tr><td><strong>Фэйский шёлк и нить сна<\/strong>, чтобы залатать Картину<\/td><td>Шёлковые сады<\/td><td>Всей партии: без этого холст порвётся при ритуале<\/td><\/tr><tr><td><strong>Ухо Посланца<\/strong> — реликвия, позволяющая услышать полную весть<\/td><td>Сумеречный двор<\/td><td>Для концовки «Услышать Весть»<\/td><\/tr><tr><td>Отчёт перед командованием<\/td><td>Застава Шипов, Сумеречный двор<\/td><td>Уме<\/td><\/tr><tr><td>Зов, который она слышит всю жизнь<\/td><td>Шёлковые сады<\/td><td>Велиссе<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Сорок лет назад, когда Посланец упал, фэйри <strong>закрыли границы<\/strong>: одна из десяти эмоций, Страх, впервые перешла в их страну, и королева решила отгородиться. Вместе со Страхом за границу случайно попало <strong>Ухо Посланца<\/strong> — орган, которым он слушал мир. Королева хранит его как корону. Тот, кто приложит Ухо к Кратеру, сможет <strong>услышать весть целиком<\/strong>, а значит, произнести её правильно.<\/p><\/div><h2 id=\"s27-2\">Правила акта<\/h2><ul><li><strong>Закон гостя.<\/strong> В стране фэйри нельзя отказаться от предложенного угощения, подарка или вопроса без последствий. Отказ — спасбросок Харизмы СЛ 15, провал: персонаж <strong>должен<\/strong> фэйри услугу.<\/li><li><strong>Истинные имена.<\/strong> Назвавший фэйри своё полное имя даёт ему власть: 1 раз этот фэйри может приказать персонажу (как «Приказ», без спасброска).<\/li><li><strong>Время.<\/strong> Неделя у фэйри — день снаружи. Часы Культа идут медленнее, но культ не стоит на месте.<\/li><li><strong>Картина с собой.<\/strong> Здесь Картина <strong>сильнее<\/strong>: поглощает чудовищ Страха, если её развернуть (см. Выжженную опушку).<\/li><\/ul><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Акт IV — акт Умы. Дайте ей быть офицером: вести переговоры, отдавать приказы, отвечать перед командованием. И дайте ей увидеть, что её страна тоже не без греха.<\/p><\/div>", "toc": [["s27-1", "Зачем герои идут к фэйри"], ["s27-2", "Правила акта"]], "text": "Уровни: 11–13. Где: закрытое королевство фэйри за Белой чащей (рабочее название — Вересковый Предел ; название лучше узнать у игрока Умы). Главный вопрос акта: спасать один мир за счёт другого — или искать путь, при котором выживут оба? Зачем герои идут к фэйри Нужно Где Кому важно Фэйский шёлк и нить сна , чтобы залатать Картину Шёлковые сады Всей партии: без этого холст порвётся при ритуале Ухо Посланца — реликвия, позволяющая услышать полную весть Сумеречный двор Для концовки «Услышать Весть» Отчёт перед командованием Застава Шипов, Сумеречный двор Уме Зов, который она слышит всю жизнь Шёлковые сады Велиссе Тайна · только для мастера Сорок лет назад, когда Посланец упал, фэйри закрыли границы : одна из десяти эмоций, Страх, впервые перешла в их страну, и королева решила отгородиться. Вместе со Страхом за границу случайно попало Ухо Посланца — орган, которым он слушал мир. Королева хранит его как корону. Тот, кто приложит Ухо к Кратеру, сможет услышать весть целиком , а значит, произнести её правильно. Правила акта Закон гостя. В стране фэйри нельзя отказаться от предложенного угощения, подарка или вопроса без последствий. Отказ — спасбросок Харизмы СЛ 15, провал: персонаж должен фэйри услугу. Истинные имена. Назвавший фэйри своё полное имя даёт ему власть: 1 раз этот фэйри может приказать персонажу (как «Приказ», без спасброска). Время. Неделя у фэйри — день снаружи. Часы Культа идут медленнее, но культ не стоит на месте. Картина с собой. Здесь Картина сильнее : поглощает чудовищ Страха, если её развернуть (см. Выжженную опушку). Совет мастеру Акт IV — акт Умы. Дайте ей быть офицером: вести переговоры, отдавать приказы, отвечать перед командованием. И дайте ей увидеть, что её страна тоже не без греха."}, {"id": "s28", "n": 28, "title": "ЗАСТАВА ШИПОВ", "disp": "Застава Шипов", "group": "Акт IV", "html": "<p>Граница королевства — стена живого терновника высотой в башню. Единственный вход — <strong>Застава Шипов<\/strong>, крепость, выросшая из кустарника. Здесь решают, кто войдёт. Никто не входил сорок лет.<\/p><h2 id=\"s28-1\">Кто здесь<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Капитан Ирвель<\/strong><\/td><td>Командир Умы<\/td><td>Принимает её рапорт. Хочет Картину. Считает спутников Умы «грузом»<\/td><\/tr><tr><td><strong>Привратница Шиповник<\/strong><\/td><td>Древняя фэйри-дриада, сама — часть стены<\/td><td>Задаёт три вопроса каждому входящему. Ложь — шип в сердце (1d10 урона, след на всю жизнь)<\/td><\/tr><tr><td><strong>Сержант Тис<\/strong><\/td><td>Бывший однокашник Умы<\/td><td>Завидует её миссии. Может помочь — или донести<\/td><\/tr><tr><td><strong>Беженцы с опушки<\/strong><\/td><td>Фэйри из сожжённых деревень<\/td><td>Просят Уму рассказать командованию правду о фронте<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s28-2\">Правило: Допрос<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждого героя допрашивает Привратница: <strong>три вопроса<\/strong>, на которые нельзя солгать. Мастер задаёт вопросы игрокам <strong>напрямую<\/strong>, от лица Привратницы. Солгавший получает шип (1d10, след навсегда). Тот, кто отказался отвечать, остаётся за стеной.<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>Герой<\/th><th>Вопросы Привратницы<\/th><\/tr><\/thead><tbody><tr><td>Эстел<\/td><td>«Чей ты?» «Ты всё ещё принадлежишь ему?» «Что ты украдёшь у нас?»<\/td><\/tr><tr><td>Велисса<\/td><td>«Из чего ты соткана?» «Кто тебя закончит?» «Ты пришла домой или в гости?»<\/td><\/tr><tr><td>Ума<\/td><td>«Что ты принесла своему народу?» «Кого ты не смогла спасти?» «Если прикажут предать их — предашь?»<\/td><\/tr><tr><td>Тесори (если с партией)<\/td><td>«Кому ты служишь?» «Скольких ты стёр?» «Ты пришёл судить нас?»<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s28-3\">Опасности<\/h2><div class=\"tbl\"><table><thead><tr><th>Опасность<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Живая стена<\/td><td>Терновник хватает того, кто приближается без разрешения: 3d6 колющего, опутан<\/td><td>Разрешение Привратницы<\/td><\/tr><tr><td>Таможня фэйри<\/td><td>Каждый предмет описывается и «взвешивается». Нарисованные предметы конфискуются<\/td><td>Спрятать в Повёрнутом холсте<\/td><\/tr><tr><td>Арест Велиссы<\/td><td>Ирвель объявляет Велиссу «аномалией фэйского шёлка, подлежащей изъятию»<\/td><td>Поручительство Умы (рискует званием)<\/td><\/tr><tr><td>Донос Тиса<\/td><td>Если Тис завидует, он доносит, что Ума нарушала приказы<\/td><td>Помириться с Тисом; дать ему славу<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s28-4\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Пропуск Заставы<\/strong> (шип в смоле)<\/td><td>Привратница<\/td><td>Свободный вход и выход из королевства<\/td><\/tr><tr><td><strong>Терновый плащ<\/strong><\/td><td>Арсенал заставы<\/td><td>Средняя броня +1; кто бьёт носителя в ближнем бою — 1d4 колющего<\/td><\/tr><tr><td><strong>Знаки различия старшего лейтенанта<\/strong><\/td><td>Ирвель (если Ума выполнила приказы)<\/td><td>+1 к Запугиванию и Убеждению с солдатами фэйри<\/td><\/tr><tr><td><strong>Медовый хлеб гостя<\/strong> (5)<\/td><td>Застава<\/td><td>+1d8 хитов; но съевший — гость и связан Законом гостя<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s28-5\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Правда Привратнице<\/strong><\/td><td>Чтобы войти, Ума должна вслух рассказать, кого не смогла спасти. При всей заставе и при Тисе<\/td><\/tr><tr><td><strong>Отдать Велиссу под стражу<\/strong><\/td><td>Иначе Ирвель не пропустит партию. Ума поручится — и рискнёт званием. Или Велисса пойдёт под стражу добровольно и окажется в Шёлковых садах <strong>без союзников<\/strong><\/td><\/tr><tr><td><strong>Эстел — «чей ты?»<\/strong><\/td><td>Если Эстел ответит «ничей», а печать ещё на нём, это ложь: шип в сердце. Значит, печать надо снять <strong>до<\/strong> заставы — или признать, что он чей-то<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s28-1", "Кто здесь"], ["s28-2", "Правило: Допрос"], ["s28-3", "Опасности"], ["s28-4", "Находки"], ["s28-5", "Тяжёлые выборы"]], "text": "Граница королевства — стена живого терновника высотой в башню. Единственный вход — Застава Шипов , крепость, выросшая из кустарника. Здесь решают, кто войдёт. Никто не входил сорок лет. Кто здесь NPC Кто Функция Капитан Ирвель Командир Умы Принимает её рапорт. Хочет Картину. Считает спутников Умы «грузом» Привратница Шиповник Древняя фэйри-дриада, сама — часть стены Задаёт три вопроса каждому входящему. Ложь — шип в сердце (1d10 урона, след на всю жизнь) Сержант Тис Бывший однокашник Умы Завидует её миссии. Может помочь — или донести Беженцы с опушки Фэйри из сожжённых деревень Просят Уму рассказать командованию правду о фронте Правило: Допрос Важно Каждого героя допрашивает Привратница: три вопроса , на которые нельзя солгать. Мастер задаёт вопросы игрокам напрямую , от лица Привратницы. Солгавший получает шип (1d10, след навсегда). Тот, кто отказался отвечать, остаётся за стеной. Герой Вопросы Привратницы Эстел «Чей ты?» «Ты всё ещё принадлежишь ему?» «Что ты украдёшь у нас?» Велисса «Из чего ты соткана?» «Кто тебя закончит?» «Ты пришла домой или в гости?» Ума «Что ты принесла своему народу?» «Кого ты не смогла спасти?» «Если прикажут предать их — предашь?» Тесори (если с партией) «Кому ты служишь?» «Скольких ты стёр?» «Ты пришёл судить нас?» Опасности Опасность Описание Обход Живая стена Терновник хватает того, кто приближается без разрешения: 3d6 колющего, опутан Разрешение Привратницы Таможня фэйри Каждый предмет описывается и «взвешивается». Нарисованные предметы конфискуются Спрятать в Повёрнутом холсте Арест Велиссы Ирвель объявляет Велиссу «аномалией фэйского шёлка, подлежащей изъятию» Поручительство Умы (рискует званием) Донос Тиса Если Тис завидует, он доносит, что Ума нарушала приказы Помириться с Тисом; дать ему славу Находки Предмет Где Эффект Пропуск Заставы (шип в смоле) Привратница Свободный вход и выход из королевства Терновый плащ Арсенал заставы Средняя броня +1; кто бьёт носителя в ближнем бою — 1d4 колющего Знаки различия старшего лейтенанта Ирвель (если Ума выполнила приказы) +1 к Запугиванию и Убеждению с солдатами фэйри Медовый хлеб гостя (5) Застава +1d8 хитов; но съевший — гость и связан Законом гостя Тяжёлые выборы Выбор Почему тяжело Правда Привратнице Чтобы войти, Ума должна вслух рассказать, кого не смогла спасти. При всей заставе и при Тисе Отдать Велиссу под стражу Иначе Ирвель не пропустит партию. Ума поручится — и рискнёт званием. Или Велисса пойдёт под стражу добровольно и окажется в Шёлковых садах без союзников Эстел — «чей ты?» Если Эстел ответит «ничей», а печать ещё на нём, это ложь: шип в сердце. Значит, печать надо снять до заставы — или признать, что он чей-то"}, {"id": "s29", "n": 29, "title": "ШЁЛКОВЫЕ САДЫ", "disp": "Шёлковые сады", "group": "Акт IV", "html": "<p>Долина гигантских тутовых деревьев, где шелкопряды размером с собаку <strong>едят сны<\/strong>. Ткачихи-фэйри прядут из коконов <strong>фэйский шёлк<\/strong>: ткань, которая помнит всё, что на ней изображено. На таком шёлке Сайлас написал Картину, и на таком же — Велиссу.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Велисса <strong>соткана здесь<\/strong>. Её нить спряла <strong>Матушка Кокон<\/strong>, старшая ткачиха, и продала рулон торговцам. Шёлк помнит Матушку: рядом с ней Велисса впервые чувствует себя <strong>дома<\/strong>, и её слабости (солнце, мороз) здесь не действуют.<\/p><\/div><h2 id=\"s29-1\">Атмосфера<\/h2><ul><li>Листья шелестят голосами спящих. Шелкопряды тихо жуют.<\/li><li>В воздухе висят нити, на которых видны чужие сны: полёт, падение, первая любовь.<\/li><li>Ткачихи не смотрят на гостей — только на нити.<\/li><\/ul><h2 id=\"s29-2\">Правило локации: Сны вместо денег<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Плата здесь — <strong>сны<\/strong>. Каждый герой может отдать ткачихам сон: игрок описывает сон персонажа (мечту, кошмар, воспоминание). Отданный сон уходит навсегда: персонаж больше не видит его и <strong>теряет связанную с ним черту<\/strong> (мастер выбирает вместе с игроком). Флаконы сновидений Велиссы — валюта: 1 флакон = 1 сон без потерь.<\/p><\/div><h2 id=\"s29-3\">Кто здесь<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Матушка Кокон<\/strong><\/td><td>Старшая ткачиха, огромная и мягкая, с шестью руками<\/td><td>Может залатать Картину. Знает Велиссу «на ощупь». Просит плату<\/td><\/tr><tr><td><strong>Ткачиха Лён<\/strong><\/td><td>Молодая фэйри<\/td><td>Ткёт шёлк, на котором оживают сны. Тайно продаёт его культу через границу<\/td><\/tr><tr><td><strong>Шелкопряд Великий<\/strong><\/td><td>Червь размером с дом<\/td><td>Ест кошмары. Если ему скормить Страх — Страх уходит<\/td><\/tr><tr><td><strong>Садовник Ветвь<\/strong><\/td><td>Старый фэйри-воин, дядя Умы<\/td><td>Помнит Уму ребёнком. Помнит и тот случай. Может рассказать то, чего Ума о нём не знает<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s29-4\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Заплата» (основной)<\/td><td>Матушка Кокон<\/td><td>Собрать <strong>нить сна<\/strong>: три сна от каждого героя или флаконы Велиссы<\/td><td>Картина залатана: выдержит ритуал<\/td><\/tr><tr><td>«Нить для культа»<\/td><td>Ткачиха Лён<\/td><td>Узнать, кому она продаёт шёлк<\/td><td>Часы Культа −1; Лён — союзник или пленница<\/td><\/tr><tr><td>«Накормить Великого»<\/td><td>Садовник Ветвь<\/td><td>Скормить Великому Шелкопряду кошмар (Стадо Страха, кошмар Умы)<\/td><td>Нападения на опушку слабеют<\/td><\/tr><tr><td>«Нить Велиссы»<\/td><td>Матушка Кокон<\/td><td>Велисса может остаться и <strong>быть перетканной<\/strong>: стать настоящей фэйри<\/td><td>См. тяжёлые выборы<\/td><\/tr><tr><td>«Дядя Ветвь»<\/td><td>Садовник Ветвь<\/td><td>Выслушать правду о ребёнке, который не полетел<\/td><td>Ума: Отголоски Страха снимаются<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s29-5\">Опасности<\/h2><div class=\"tbl\"><table><thead><tr><th>Опасность<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Сонные нити<\/td><td>Задевший нить засыпает и видит чужой сон: спасбросок Мудрости СЛ 16 или 1 час сна<\/td><td>Идти по следам ткачих<\/td><\/tr><tr><td>Голодные коконы<\/td><td>Шелкопряды тянутся к спящим и едят их сны: персонаж теряет 1 вдохновение и не получает отдыха<\/td><td>Не спать в садах без стражи<\/td><\/tr><tr><td>Шёлковая паутина<\/td><td>Труднопроходимая местность, опутывает: спасбросок Силы СЛ 15<\/td><td>Огонь (но Матушка разгневается)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s29-6\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Рулон фэйского шёлка<\/strong><\/td><td>Плата ткачихам<\/td><td>Залатать Картину; или сшить <strong>шёлковую броню<\/strong> (лёгкая, КД 13 + Ловкость, сопротивление психическому)<\/td><\/tr><tr><td><strong>Нить сна<\/strong><\/td><td>Матушка Кокон<\/td><td>Сюжетный: залатать Картину<\/td><\/tr><tr><td><strong>Кокон-убежище<\/strong><\/td><td>Сады<\/td><td>1 раз: персонаж прячется в кокон на 1 час — полноценная долгая передышка за час<\/td><\/tr><tr><td><strong>Флакон кошмара<\/strong><\/td><td>Великий Шелкопряд<\/td><td>Бросок: цель видит свой худший страх — испугана 1 минуту (спасбросок Мудрости СЛ 16)<\/td><\/tr><tr><td><strong>Веретено Матушки<\/strong><\/td><td>Награда за «Заплату»<\/td><td>Фокус; 1 раз в день — сшить разорванное (починить предмет, снять 1 травму «Кровотечение»)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s29-7\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Какие сны отдать<\/strong><\/td><td>Каждый сон — часть героя. Эстел может отдать сон о сестре — и перестать видеть её во сне. Ума — сон о полёте. Велисса — сон о создателе<\/td><\/tr><tr><td><strong>Перетканная Велисса<\/strong><\/td><td>Матушка может переткать Велиссу: она станет настоящей фэйри, без Мазков, без слабостей, навсегда свободной от Сайласа. Но <strong>Желание выйдет из неё<\/strong> — и уйдёт к культу или к Посланцу. Слово «живы» придётся ловить заново<\/td><\/tr><tr><td><strong>Ткачиха Лён<\/strong><\/td><td>Она продавала шёлк культу, потому что фэйри закрыли границы и её семья голодала. Выдать её — её казнят. Скрыть — Ума нарушит долг<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s29-1", "Атмосфера"], ["s29-2", "Правило локации: Сны вместо денег"], ["s29-3", "Кто здесь"], ["s29-4", "Квесты"], ["s29-5", "Опасности"], ["s29-6", "Находки"], ["s29-7", "Тяжёлые выборы"]], "text": "Долина гигантских тутовых деревьев, где шелкопряды размером с собаку едят сны . Ткачихи-фэйри прядут из коконов фэйский шёлк : ткань, которая помнит всё, что на ней изображено. На таком шёлке Сайлас написал Картину, и на таком же — Велиссу. Тайна · только для мастера Велисса соткана здесь . Её нить спряла Матушка Кокон , старшая ткачиха, и продала рулон торговцам. Шёлк помнит Матушку: рядом с ней Велисса впервые чувствует себя дома , и её слабости (солнце, мороз) здесь не действуют. Атмосфера Листья шелестят голосами спящих. Шелкопряды тихо жуют. В воздухе висят нити, на которых видны чужие сны: полёт, падение, первая любовь. Ткачихи не смотрят на гостей — только на нити. Правило локации: Сны вместо денег Важно Плата здесь — сны . Каждый герой может отдать ткачихам сон: игрок описывает сон персонажа (мечту, кошмар, воспоминание). Отданный сон уходит навсегда: персонаж больше не видит его и теряет связанную с ним черту (мастер выбирает вместе с игроком). Флаконы сновидений Велиссы — валюта: 1 флакон = 1 сон без потерь. Кто здесь NPC Кто Функция Матушка Кокон Старшая ткачиха, огромная и мягкая, с шестью руками Может залатать Картину. Знает Велиссу «на ощупь». Просит плату Ткачиха Лён Молодая фэйри Ткёт шёлк, на котором оживают сны. Тайно продаёт его культу через границу Шелкопряд Великий Червь размером с дом Ест кошмары. Если ему скормить Страх — Страх уходит Садовник Ветвь Старый фэйри-воин, дядя Умы Помнит Уму ребёнком. Помнит и тот случай. Может рассказать то, чего Ума о нём не знает Квесты Квест Кто даёт Суть Награда «Заплата» (основной) Матушка Кокон Собрать нить сна : три сна от каждого героя или флаконы Велиссы Картина залатана: выдержит ритуал «Нить для культа» Ткачиха Лён Узнать, кому она продаёт шёлк Часы Культа −1; Лён — союзник или пленница «Накормить Великого» Садовник Ветвь Скормить Великому Шелкопряду кошмар (Стадо Страха, кошмар Умы) Нападения на опушку слабеют «Нить Велиссы» Матушка Кокон Велисса может остаться и быть перетканной : стать настоящей фэйри См. тяжёлые выборы «Дядя Ветвь» Садовник Ветвь Выслушать правду о ребёнке, который не полетел Ума: Отголоски Страха снимаются Опасности Опасность Описание Обход Сонные нити Задевший нить засыпает и видит чужой сон: спасбросок Мудрости СЛ 16 или 1 час сна Идти по следам ткачих Голодные коконы Шелкопряды тянутся к спящим и едят их сны: персонаж теряет 1 вдохновение и не получает отдыха Не спать в садах без стражи Шёлковая паутина Труднопроходимая местность, опутывает: спасбросок Силы СЛ 15 Огонь (но Матушка разгневается) Находки Предмет Где Эффект Рулон фэйского шёлка Плата ткачихам Залатать Картину; или сшить шёлковую броню (лёгкая, КД 13 + Ловкость, сопротивление психическому) Нить сна Матушка Кокон Сюжетный: залатать Картину Кокон-убежище Сады 1 раз: персонаж прячется в кокон на 1 час — полноценная долгая передышка за час Флакон кошмара Великий Шелкопряд Бросок: цель видит свой худший страх — испугана 1 минуту (спасбросок Мудрости СЛ 16) Веретено Матушки Награда за «Заплату» Фокус; 1 раз в день — сшить разорванное (починить предмет, снять 1 травму «Кровотечение») Тяжёлые выборы Выбор Почему тяжело Какие сны отдать Каждый сон — часть героя. Эстел может отдать сон о сестре — и перестать видеть её во сне. Ума — сон о полёте. Велисса — сон о создателе Перетканная Велисса Матушка может переткать Велиссу: она станет настоящей фэйри, без Мазков, без слабостей, навсегда свободной от Сайласа. Но Желание выйдет из неё — и уйдёт к культу или к Посланцу. Слово «живы» придётся ловить заново Ткачиха Лён Она продавала шёлк культу, потому что фэйри закрыли границы и её семья голодала. Выдать её — её казнят. Скрыть — Ума нарушит долг"}, {"id": "s30", "n": 30, "title": "ВЫЖЖЕННАЯ ОПУШКА", "disp": "Выжженная опушка", "group": "Акт IV", "html": "<p>Фронт. Деревни у границы сожжены. Армия фэйри держит линию против <strong>волн чудовищ<\/strong>: тени Страха, звери с человеческими глазами, охотники Бастиона в масках. Это то, ради чего Ума отправилась в путь.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Чудовищ гонит не только Пастух (если его не остановили в Белой чаще). Через трещины в границе идут <strong>все Тихие эмоции<\/strong>, которые партия не разрешила. Каждый неразрешённый Тихий очаг добавляет фронту новый вид чудовищ. Если Слова Вести собраны чисто — фронт уже затихает.<\/p><\/div><h2 id=\"s30-1\">Правило локации: Фронт<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Опушка — <strong>массовое сражение<\/strong> в 3 волны. В каждой волне герои выбирают <strong>участок<\/strong>: держать линию, спасать деревню, охотиться на вожака, прикрывать Картину. Каждый невыбранный участок мастер разрешает броском: 1d6 + число союзников, собранных в кампании (Шаэл, Дрейвен, сопротивление, Ирвель…). 4+ — участок держится; 3 и меньше — потери.<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>Волна<\/th><th>Враги<\/th><th>Особый участок<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Тени Страха, стадо, если Пастух не спасён<\/td><td>Деревня Тёрн: 40 жителей, мост вот-вот рухнет<\/td><\/tr><tr><td>2<\/td><td>Охотники Бастиона в масках (если Корвин ещё жив — он здесь лично)<\/td><td>Полевой лазарет<\/td><\/tr><tr><td>3<\/td><td><strong>Великий Страх<\/strong> — существо из всех неразрешённых Тихих эмоций<\/td><td>Картина: можно развернуть её и <strong>поглотить волну<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s30-2\">Кто здесь<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Генерал Огнецвет<\/strong><\/td><td>Командующий фронтом<\/td><td>Хочет развернуть Картину немедленно: «Летопись не лжёт»<\/td><\/tr><tr><td><strong>Ирвель<\/strong><\/td><td>Если пришёл с партией<\/td><td>Ведёт роту, подчиняется Уме или нет — по Недоверию<\/td><\/tr><tr><td><strong>Сержант Тис<\/strong><\/td><td>Однокашник<\/td><td>Может погибнуть, прикрывая Уму. Или выжить, если Ума позволит ему славу<\/td><\/tr><tr><td><strong>Девочка-знаменосец<\/strong><\/td><td>Кадет 12 лет<\/td><td>Отказывается уходить с линии. Отражение юной Умы<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s30-3\">Мини-босс: Великий Страх<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>200 (уровень 11) / 250 (уровень 13)<\/td><\/tr><tr><td>Облик<\/td><td>Меняется для каждого: то, чего боится тот, кто смотрит<\/td><\/tr><tr><td>Подготовка<\/td><td>«Бегство армии»: если не прервать — все союзные NPC-отряды отступают, участки падают<\/td><\/tr><tr><td>Прерывание<\/td><td>Ума отдаёт приказ «Стоять!», а её Уза «Вперёд!» срабатывает в тот же ход. Или Пастух (если спасён) выходит вперёд и говорит: «Я больше не боюсь»<\/td><\/tr><tr><td>Надлом<\/td><td>Каждый герой, который в бою вслух назвал свой страх (как в Белой чаще), даёт жетон<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s30-4\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Знамя Тёрна<\/strong><\/td><td>Спасённая деревня<\/td><td>Союзники в 9 м — +1 к спасброскам<\/td><\/tr><tr><td><strong>Клинок фронта<\/strong> (+2)<\/td><td>Генерал Огнецвет, за спасение лазарета<\/td><td>Длинный меч +2; против существ Страха +1d8<\/td><\/tr><tr><td><strong>Медаль Опушки<\/strong><\/td><td>Командование<\/td><td>Ума: черта «Ветеран» (по договорённости), слава<\/td><\/tr><tr><td><strong>Маска охотника<\/strong><\/td><td>Охотники Бастиона<\/td><td>Носитель неуязвим к испугу, но 1 Отголосок Гнева в день ношения<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s30-5\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Развернуть Картину<\/strong><\/td><td>Летопись права: Картина поглотит всю волну, фронт будет спасён за один миг. Но чудовища окажутся <strong>внутри нарисованного города<\/strong>, среди жителей, которых герои защища едленно: «Летопись не лжёт» Ирвель Если пришёл с партией Ведёт роту, подчиняется Уме или нет — по Недоверию Сержант Тис Однокашник Может погибнуть, прикрывая Уму. Или выжить, если Ума позволит ему славу Девочка-знаменосец Кадет 12 лет Отказывается уходить с линии. Отражение юной Умы Мини-босс: Великий Страх Параметр Значение Хиты 200 (уровень 11) / 250 (уровень 13) Облик Меняется для каждого: то, чего боится тот, кто смотрит Подготовка «Бегство армии»: если не прервать — все союзные NPC-отряды отступают, участки падают Прерывание Ума отдаёт приказ «Стоять!», а её Уза «Вперёд!» срабатывает в тот же ход. Или Пастух (если спасён) выходит вперёд и говорит: «Я больше не боюсь» Надлом Каждый герой, который в бою вслух назвал свой страх (как в Белой чаще), даёт жетон Находки Предмет Где Эффект Знамя Тёрна Спасённая деревня Союзники в 9 м — +1 к спасброскам Клинок фронта (+2) Генерал Огнецвет, за спасение лазарета Длинный меч +2; против существ Страха +1d8 Медаль Опушки Командование Ума: черта «Ветеран» (по договорённости), слава Маска охотника Охотники Бастиона Носитель неуязвим к испугу, но 1 Отголосок Гнева в день ношения Тяжёлые выборы Выбор Почему тяжело Развернуть Картину Летопись права: Картина поглотит всю волну, фронт будет спасён за один миг. Но чудовища окажутся внутри нарисованного города , среди жителей, которых герои защищали в Акте III Деревня или лазарет Во второй волне герои успевают только на один участок. Жители Тёрна или раненые солдаты Девочка-знаменосец Приказать ей уйти — сломать её. Позволить остаться — она может погибнуть. Для Умы это тот же выбор, что и тогда, с ребёнком Тис Отдать Тису командование атакой — он получит славу, о которой мечтал, и, скорее всего, погибнет. Не отдать — Ума заберёт славу себе"}, {"id": "s31", "n": 31, "title": "СУМЕРЕЧНЫЙ ДВОР", "disp": "Сумеречный двор", "group": "Акт IV", "html": "<p>Столица королевства — дворец из застывших сумерек, где всегда вечер. Здесь правит <strong>Королева Ильвейн<\/strong> и решается судьба Умы, Велиссы и Уха Посланца.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> При дворе живёт <strong>звездочёт королевы<\/strong>, седая женщина без возраста. Это <strong>Ирена Вейл<\/strong>. Сорок лет назад, после чумы, она ушла за границу вслед за Ухом Посланца, надеясь услышать весть целиком. Королева приютила её в обмен на службу. Ирена не знает, что стало с её детьми. (Это один из вариантов ответа на открытый вопрос; мастер может оставить Ирену пропавшей.)<\/p><\/div><h2 id=\"s31-1\">Кто здесь<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Что хочет<\/th><\/tr><\/thead><tbody><tr><td><strong>Королева Ильвейн<\/strong><\/td><td>Правительница, прекрасная и древняя<\/td><td>Безопасность своей страны любой ценой. Хочет Картину — или Велиссу как «фэйскую собственность»<\/td><\/tr><tr><td><strong>Ирена Вейл<\/strong><\/td><td>Звездочёт королевы, мать Вейлов<\/td><td>Услышать весть. Узнать о детях. Искупить чуму<\/td><\/tr><tr><td><strong>Лорд-канцлер Мох<\/strong><\/td><td>Советник, сторонник закрытых границ<\/td><td>Хочет, чтобы чужаки ушли и никогда не возвращались<\/td><\/tr><tr><td><strong>Капитан Ирвель<\/strong><\/td><td>Обвинитель или защитник Умы на трибунале<\/td><td>Зависит от жетонов Недоверия<\/td><\/tr><tr><td><strong>Шут Полынь<\/strong><\/td><td>Фэйри-шут<\/td><td>Единственный, кто говорит королеве правду. Знает, где хранится Ухо<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s31-2\">Трибунал Умы<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Ума предстаёт перед Двором. Её судят за нарушение приказов (если были жетоны Недоверия) <strong>или<\/strong> награждают (если нет). Механика как в Суде Осириса: три раунда, доказательства и речи. Нужно <strong>5 очков<\/strong>.<\/p><\/div><div class=\"tbl\"><table><thead><tr><th>Доказательство<\/th><th>Очки<\/th><\/tr><\/thead><tbody><tr><td>Спасённый Пастух (живой свидетель, что угроза — испуганный ребёнок)<\/td><td>2<\/td><\/tr><tr><td>Оригинал летописи из Обители<\/td><td>2<\/td><\/tr><tr><td>Спасённая деревня Тёрн / лазарет<\/td><td>1<\/td><\/tr><tr><td>Медаль Опушки<\/td><td>1<\/td><\/tr><tr><td>Спасённый фэйри-ребёнок из Зверинца<\/td><td>2<\/td><\/tr><tr><td>Каждый жетон Недоверия<\/td><td>−1<\/td><\/tr><\/tbody><\/table><\/div><p><strong>5+:<\/strong> Ума оправдана и получает звание капитана. <strong>2–4:<\/strong> выговор, звание сохраняется. <strong>0–1:<\/strong> Уму лишают звания и изгоняют. Это не конец её линии, а начало новой.<\/p><h2 id=\"s31-3\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Ухо Посланца» (основной)<\/td><td>Ирена / Шут Полынь<\/td><td>Получить Ухо: выменять, выиграть, украсть<\/td><td>Ключ к концовке «Услышать Весть»<\/td><\/tr><tr><td>«Мать»<\/td><td>—<\/td><td>Рассказать Ирене о детях<\/td><td>Ирена идёт в Акт V. Возможная сцена всех Вейлов в Кратере<\/td><\/tr><tr><td>«Трибунал»<\/td><td>—<\/td><td>Защитить Уму<\/td><td>Звание или изгнание<\/td><\/tr><tr><td>«Цена королевы»<\/td><td>Королева<\/td><td>Королева просит одно из трёх: Картину, Велиссу или вечную службу одного героя<\/td><td>Ухо Посланца<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s31-4\">Опасности двора<\/h2><div class=\"tbl\"><table><thead><tr><th>Опасность<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Сумеречные танцы<\/td><td>Бал: кто танцует с фэйри, обязан дотанцевать до рассвета (а рассвета нет)<\/td><td>Отказаться через Закон гостя (услуга)<\/td><\/tr><tr><td>Имена<\/td><td>Канцлер выведывает истинные имена<\/td><td>Не называться; использовать прозвища<\/td><\/tr><tr><td>Подарки<\/td><td>Каждый подарок королевы — обязательство<\/td><td>Отдарить равноценным<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s31-5\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Ухо Посланца<\/strong><\/td><td>Сокровищница<\/td><td>Сюжетный: позволяет услышать полную весть в Кратере<\/td><\/tr><tr><td><strong>Звёздная карта Ирены (поздняя)<\/strong><\/td><td>Покои звездочёта<\/td><td>Точная Ночь Звезды; +2 к проверкам в Обсерватории<\/td><\/tr><tr><td><strong>Сумеречный клинок<\/strong> (+2, редкий)<\/td><td>Награда королевы<\/td><td>Рапира +2; 1 раз в день — шаг сквозь тень на 9 м<\/td><\/tr><tr><td><strong>Корона из вереска<\/strong><\/td><td>Ума, если оправдана<\/td><td>Капитанский знак: 1 раз в день союзники в 9 м получают временные хиты 2d10<\/td><\/tr><tr><td><strong>Бубенчик Полыни<\/strong><\/td><td>Шут<\/td><td>Звон снимает очарование фэйри<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s31-6\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Цена королевы<\/strong><\/td><td>Картина — значит, ритуала не будет, но страна фэйри в безопасности. Велисса — значит, её запрут при дворе как реликвию. Вечная служба — один герой (часто Ума) остаётся навсегда<\/td><\/tr><tr><td><strong>Ирена и дети<\/strong><\/td><td>Рассказать Ирене всё: чума от её краски, Сайлас в картине, Нерисса в культе. Она может сломаться — или пойти с героями и <strong>стать жертвой<\/strong> в Кратере вместо любого из них<\/td><\/tr><tr><td><strong>Украсть Ухо<\/strong><\/td><td>Кража у королевы — война с фэйри после ритуала. Ума станет предательницей своей страны<\/td><\/tr><tr><td><strong>Изгнание Умы<\/strong><\/td><td>Если Ума изгнана, она может остаться с партией навсегда. Или попросить королеву о последнем шансе: в обмен на вечную службу<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s31-7\">Выход из Акта IV<\/h2><p>Картина залатана. Ухо Посланца — у героев или у королевы. Ирена, возможно, с ними. Звезда Посланца поднимается. Пора в <strong>Кратер<\/strong>.<\/p>", "toc": [["s31-1", "Кто здесь"], ["s31-2", "Трибунал Умы"], ["s31-3", "Квесты"], ["s31-4", "Опасности двора"], ["s31-5", "Находки"], ["s31-6", "Тяжёлые выборы"], ["s31-7", "Выход из Акта IV"]], "text": "Столица королевства — дворец из застывших сумерек, где всегда вечер. Здесь правит Королева Ильвейн и решается судьба Умы, Велиссы и Уха Посланца. Тайна · только для мастера При дворе живёт звездочёт королевы , седая женщина без возраста. Это Ирена Вейл . Сорок лет назад, после чумы, она ушла за границу вслед за Ухом Посланца, надеясь услышать весть целиком. Королева приютила её в обмен на службу. Ирена не знает, что стало с её детьми. (Это один из вариантов ответа на открытый вопрос; мастер может оставить Ирену пропавшей.) Кто здесь NPC Кто Что хочет Королева Ильвейн Правительница, прекрасная и древняя Безопасность своей страны любой ценой. Хочет Картину — или Велиссу как «фэйскую собственность» Ирена Вейл Звездочёт королевы, мать Вейлов Услышать весть. Узнать о детях. Искупить чуму Лорд-канцлер Мох Советник, сторонник закрытых границ Хочет, чтобы чужаки ушли и никогда не возвращались Капитан Ирвель Обвинитель или защитник Умы на трибунале Зависит от жетонов Недоверия Шут Полынь Фэйри-шут Единственный, кто говорит королеве правду. Знает, где хранится Ухо Трибунал Умы Важно Ума предстаёт перед Двором. Её судят за нарушение приказов (если были жетоны Недоверия) или награждают (если нет). Механика как в Суде Осириса: три раунда, доказательства и речи. Нужно 5 очков . Доказательство Очки Спасённый Пастух (живой свидетель, что угроза — испуганный ребёнок) 2 Оригинал летописи из Обители 2 Спасённая деревня Тёрн / лазарет 1 Медаль Опушки 1 Спасённый фэйри-ребёнок из Зверинца 2 Каждый жетон Недоверия −1 5+: Ума оправдана и получает звание капитана. 2–4: выговор, звание сохраняется. 0–1: Уму лишают звания и изгоняют. Это не конец её линии, а начало новой. Квесты Квест Кто даёт Суть Награда «Ухо Посланца» (основной) Ирена / Шут Полынь Получить Ухо: выменять, выиграть, украсть Ключ к концовке «Услышать Весть» «Мать» — Рассказать Ирене о детях Ирена идёт в Акт V. Возможная сцена всех Вейлов в Кратере «Трибунал» — Защитить Уму Звание или изгнание «Цена королевы» Королева Королева просит одно из трёх: Картину, Велиссу или вечную службу одного героя Ухо Посланца Опасности двора Опасность Описание Обход Сумеречные танцы Бал: кто танцует с фэйри, обязан дотанцевать до рассвета (а рассвета нет) Отказаться через Закон гостя (услуга) Имена Канцлер выведывает истинные имена Не называться; использовать прозвища Подарки Каждый подарок королевы — обязательство Отдарить равноценным Находки Предмет Где Эффект Ухо Посланца Сокровищница Сюжетный: позволяет услышать полную весть в Кратере Звёздная карта Ирены (поздняя) Покои звездочёта Точная Ночь Звезды; +2 к проверкам в Обсерватории Сумеречный клинок (+2, редкий) Награда королевы Рапира +2; 1 раз в день — шаг сквозь тень на 9 м Корона из вереска Ума, если оправдана Капитанский знак: 1 раз в день союзники в 9 м получают временные хиты 2d10 Бубенчик Полыни Шут Звон снимает очарование фэйри Тяжёлые выборы Выбор Почему тяжело Цена королевы Картина — значит, ритуала не будет, но страна фэйри в безопасности. Велисса — значит, её запрут при дворе как реликвию. Вечная служба — один герой (часто Ума) остаётся навсегда Ирена и дети Рассказать Ирене всё: чума от её краски, Сайлас в картине, Нерисса в культе. Она может сломаться — или пойти с героями и стать жертвой в Кратере вместо любого из них Украсть Ухо Кража у королевы — война с фэйри после ритуала. Ума станет предательницей своей страны Изгнание Умы Если Ума изгнана, она может остаться с партией навсегда. Или попросить королеву о последнем шансе: в обмен на вечную службу Выход из Акта IV Картина залатана. Ухо Посланца — у героев или у королевы. Ирена, возможно, с ними. Звезда Посланца поднимается. Пора в Кратер ."}, {"id": "s32", "n": 32, "title": "АКТ V: ЗВЁЗДНЫЙ КОЛОДЕЦ И КРАТЕР ПОСЛАНЦА", "disp": "Акт V: Звёздный Колодец и кратер Посланца", "group": "Акт V", "html": "<p><strong>Рекомендуемый уровень:<\/strong> 13–15. <strong>Музыка:<\/strong> астрономическая сцена (подобрать), Туман / гром, Сильный бой, финальный трек — Костёр / рассвет.<\/p><h2 id=\"s32-1\">Обсерватория «Звёздный Колодец»<\/h2><p>Купол на скале у края Кратера, построенный Иреной Вейл. Телескоп нацелен не на небо, а <strong>вниз — в Кратер<\/strong>.<\/p><h3>Эларис Тёмная Звезда — астроном<\/h3><ul><li>Эльф, ученик Ирены Вейл. Живёт в обсерватории 40 лет. Почти ослеп, но видит звёзды с закрытыми глазами.<\/li><li>Знает, <strong>откуда пришёл Посланец<\/strong> и что было в его вести. Готов рассказать, если герои принесут Евангелие Вести.<\/li><li>Расчитывает <strong>дату ритуала<\/strong>: ночь, когда звезда Посланца встанет над Кратером. Это финальный таймер кампании.<\/li><\/ul><h3>Что раскрывается в Обсерватории<\/h3><ul><li>Записи Ирены Вейл: Посланец пришёл <strong>предупредить<\/strong>. Его весть: «Вы несовершенны — и поэтому живы. Совершенное не меняется. Неизменное мертво.»<\/li><li>Эмоции — не яд, а <strong>слова сообщения<\/strong>, которые люди не смогли понять целиком. Их десять — по числу слов. Собранные вместе, они складываются в эту фразу.<\/li><li><strong>Тоска<\/strong> — пятая Великая эмоция и первое слово, «Вы». Это то, что Посланец чувствовал к людям. Её Сосуд — Сайлас.<\/li><li><strong>Желание<\/strong> живёт в Велиссе, <strong>Нежность<\/strong> — в Кисточке. Без них весть звучит как приговор, и культ читает её именно так.<\/li><li>Культ «Равных» прочитал весть <strong>наоборот<\/strong>: «Несовершенство — смерть. Будьте одинаковы — будете вечны.»<\/li><\/ul><h3>Находки Обсерватории<\/h3><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Звёздный атлас Ирены<\/strong><\/td><td>Библиотека купола<\/td><td>Точная дата Ночи Звезды (если нет линзы или поздней карты — дата ±3 дня)<\/td><\/tr><tr><td><strong>Небесное стекло<\/strong><\/td><td>Телескоп<\/td><td>Посмотревший в Кратер видит, где сейчас культ, на 1 час<\/td><\/tr><tr><td><strong>Плащ астронома<\/strong><\/td><td>Эларис<\/td><td>Сопротивление излучению; ночью +1 к КД<\/td><\/tr><tr><td><strong>Метеоритная пыль<\/strong> (2)<\/td><td>Подвал<\/td><td>Материал «Звёздное» для улучшения +4<\/td><\/tr><\/tbody><\/table><\/div><h3>Тяжёлые выборы Обсерватории<\/h3><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Эларис и ритуал<\/strong><\/td><td>Эларис хочет сам услышать весть. Если взять его в Кратер, он поможет рассчитать момент, но культ первым делом убьёт его<\/td><\/tr><tr><td><strong>Сказать Элиасу правду о матери<\/strong><\/td><td>Если Ирена жива (Акт IV), Элиас должен узнать, что она ушла и не вернулась. Может ли он её простить?<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s32-2\">Лагерь Равных «Ровное»<\/h2><p>На склоне Кратера культ построил посёлок. Здесь живут <strong>Равные<\/strong> — люди, которых уже «уравняли»: одинаковые лица, одинаковые голоса, одинаковые серые одежды. Они не страдают. Они не радуются. Они строят алтарь.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> «Ровное» — это <strong>будущее мира<\/strong>, если победит Малрик. Пусть герои увидят его своими глазами: дети с одинаковыми лицами играют в одну и ту же игру, мать не может найти своего сына, потому что все сыновья одинаковые, — и не ищет.<\/p><\/div><h3>Правило: Одинаковость<\/h3><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> В Ровном каждый раз, когда герой проявляет <strong>уникальную черту<\/strong> (говорит своим особым словом, использует особенность класса, вспоминает личное), Равные замечают его: Часы Культа +1 (до максимума). Если герой <strong>притворяется одинаковым<\/strong> (мантия Равного, монотонная речь), — спасбросок Мудрости СЛ 15 каждый час или 1 Отголосок Зависти.<\/p><\/div><h3>Кто здесь<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Нерисса Вейл<\/strong><\/td><td>Голос Равных<\/td><td>Здесь — её последний выбор. Зависит от письма матери (Гнездо Вейлов) и от того, жива ли Ирена<\/td><\/tr><tr><td><strong>Ордо<\/strong><\/td><td>Квартирмейстер<\/td><td>Если подкуплен в Гнезде — открывает ворота<\/td><\/tr><tr><td><strong>Мальчик-Равный №17<\/strong><\/td><td>Ребёнок без имени<\/td><td>Начинает рисовать на земле — неровно, по-своему. Первый признак, что уравнение можно обратить<\/td><\/tr><tr><td><strong>Бывшие герои Акта II<\/strong><\/td><td>Если культ кого-то забрал (Селена, Шаэл, Дрейвен…)<\/td><td>Они здесь, уже уравнённые. Узнать их можно только по шраму или травме<\/td><\/tr><\/tbody><\/table><\/div><h3>Квесты<\/h3><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Ворота» (основной)<\/td><td>Пройти через Ровное к алтарю: скрытно, силой или с помощью Нериссы<\/td><td>Доступ к Кратеру до начала ритуала культа<\/td><\/tr><tr><td>«Номер 17»<\/td><td>Помочь мальчику нарисовать свой рисунок до конца<\/td><td>Доказательство, что уравнение обратимо; для Умы и Эстела — Оттепель/Искупление<\/td><\/tr><tr><td>«Узнать своих»<\/td><td>Найти уравненных союзников<\/td><td>Вернуть их (дар Элиаса, Перо, Фотография Селены)<\/td><\/tr><tr><td>«Последний разговор»<\/td><td>Нерисса<\/td><td>Она отдаёт свой план ритуала — или ведёт героев в засаду<\/td><\/tr><\/tbody><\/table><\/div><h3>Находки<\/h3><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Мантия Равного<\/strong><\/td><td>Склад<\/td><td>Маскировка (см. правило)<\/td><\/tr><tr><td><strong>План алтаря<\/strong><\/td><td>Шатёр Нериссы<\/td><td>Слабое место алтаря Малрика: Надлом босса начинается с 1 жетона<\/td><\/tr><tr><td><strong>Рисунок №17<\/strong><\/td><td>Мальчик<\/td><td>Прерывание «Уравнения» Малрика (как уникальная вещь — «он не может повторить то, что есть только у ребёнка»)<\/td><\/tr><tr><td><strong>Серая маска<\/strong><\/td><td>Тела стражи<\/td><td>Иммунитет к «Уравнению» на 1 раунд (одноразовая)<\/td><\/tr><\/tbody><\/table><\/div><h3>Тяжёлые выборы<\/h3><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Вернуть уравненных<\/strong><\/td><td>Каждому нужен дар Элиаса, а у Элиаса осталось мало сил. Кого вернуть — Селену, Шаэл, незнакомую мать?<\/td><\/tr><tr><td><strong>Нерисса<\/strong><\/td><td>Если она перешла на сторону героев, Малрик сделает её жертвой. Защитить её — значит задержаться и пустить культ к алтарю первым<\/td><\/tr><tr><td><strong>Сжечь Ровное<\/strong><\/td><td>Уничтожит культ, но сотни уравненных людей внутри не побегут: они не боятся<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s32-3\">Кратер Посланца<\/h2><p>Огромная чаша с остекленевшими стенами. В центре — тёмное пятно, похожее на пустой холст. Здесь проходит ритуал. Культ ждёт героев — или герои культ.<\/p><h3>Финальное столкновение<\/h3><div class=\"tbl\"><table><thead><tr><th>Участник<\/th><th>Цель в финале<\/th><\/tr><\/thead><tbody><tr><td><strong>Малрик Угасший<\/strong><\/td><td>Завершить ритуал «уравнения»: прочитать записи голосом культа и сделать жертвой Нериссу (её «обычность» станет образцом для всех)<\/td><\/tr><tr><td><strong>Нерисса Вейл<\/strong><\/td><td>Колеблется. Если герои раскрыли ей правду о матери и брате — может перейти на их сторону<\/td><\/tr><tr><td><strong>Сайлас<\/strong> (из Картины)<\/td><td>Хочет, чтобы Картина стала «настоящей» и закрытой<\/td><\/tr><tr><td><strong>Элиас<\/strong><\/td><td>Готов коснуться Картины даром и стереть её — если герои попросят<\/td><\/tr><tr><td><strong>Тесори<\/strong> (из Картины)<\/td><td>Приказ Осириса: уничтожить всё нарисованное. Выйдет через разрез кинжала — или уже с партией, если Суд Осириса выигран<\/td><\/tr><tr><td><strong>Ирена Вейл<\/strong> (если найдена в Акте IV)<\/td><td>Услышать весть. Готова стать жертвой вместо любого из детей<\/td><\/tr><tr><td><strong>Сосуды<\/strong> (если выжили)<\/td><td>Каждый выживший Сосуд — отдельная фаза или союзник<\/td><\/tr><\/tbody><\/table><\/div><h3>Малрик Угасший, «Равный» — финальный босс<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>300 (уровень 13) / 380 (уровень 15)<\/td><\/tr><tr><td>КД<\/td><td>17<\/td><\/tr><tr><td>Особенность<\/td><td><strong>Безликий:<\/strong> иммунитет к очарованию и испугу; любые бонусы героев (вдохновение, преимущество, благословение) на расстоянии 9 м от него <strong>не действуют<\/strong> — «все равны»<\/td><\/tr><tr><td>Атака<\/td><td>Ровный удар: всегда наносит <strong>среднее<\/strong> значение урона (никаких критов ни у него, ни против него) — 30 урона дробящего<\/td><\/tr><tr><td>Подготовка<\/td><td>«Уравнение» — все герои в 18 м: их хиты становятся равны среднему значению хитов партии<\/td><\/tr><tr><td>Прерывание<\/td><td>Действие, которое может сделать <strong>только этот персонаж<\/strong> (уникальная черта, личная история, предмет, связанный с его прошлым). Мастер заранее объявляет: «Он не может повторить то, что есть только у вас.»<\/td><\/tr><tr><td>Фазы<\/td><td>Фаза 1 — Малрик и культисты. Фаза 2 — он поглощает собранные эмоции (по одной за каждый Сосуд, которого не победили). Фаза 3 — разрез холста: бой на границе Картины и мира<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s32-4\">Остов Посланца<\/h2><p>Под дном Кратера, за остеклевшей коркой, лежит <strong>тело Посланца<\/strong> — огромное, звёздное, полое внутри. Сюда можно спуститься через разрез Мастихина или через трещину, которую откроет «Уравнение» Малрика. Здесь весть звучит <strong>громче всего<\/strong>.<\/p><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Остов — финальное подземелье для концовки «Услышать Весть» или для случая, когда ритуал пошёл не так и Малрик ушёл вглубь. Если партия выбирает другую концовку, Остов можно пропустить или дать как эпилог.<\/p><\/div><h3>Правило: Десять залов<\/h3><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Остов — это <strong>десять залов<\/strong>, по одному на каждое слово вести. В каждом зале герои встречают свою эмоцию <strong>в последний раз<\/strong> — не врагом, а голосом. Чтобы пройти зал, нужно <strong>произнести его Слово Вести<\/strong>:<\/p><\/div><ul><li><strong>чистое<\/strong> Слово — зал проходится без боя;<\/li><li><strong>надтреснутое<\/strong> — проверка Харизмы СЛ 15 или короткий бой с тенью эмоции;<\/li><li><strong>у врага<\/strong> — бой с полной формой эмоции (бывший Сосуд как тень).<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>Зал<\/th><th>Слово<\/th><th>Что внутри<\/th><\/tr><\/thead><tbody><tr><td>Зал Тоски<\/td><td>«Вы»<\/td><td>Сайлас (или его тень) просит: «Скажите, что я был прав хоть в чём-то»<\/td><\/tr><tr><td>Зал Скрытности<\/td><td>«несовершенны»<\/td><td>Все забытые воспоминания героев, развешанные, как бельё<\/td><\/tr><tr><td>Зал Нежности<\/td><td>«и»<\/td><td>Кисточка ждёт — и ведёт дальше, если ему доверяли<\/td><\/tr><tr><td>Зал Страха<\/td><td>«поэтому»<\/td><td>Пастух (или Стадо). Каждый герой встречает свой страх<\/td><\/tr><tr><td>Зал Желания<\/td><td>«живы»<\/td><td>Велисса слышит, как Желание зовёт её «домой». Решение её линии, если оно ещё не принято<\/td><\/tr><tr><td>Зал Гордыни<\/td><td>«Совершенное»<\/td><td>Пьедестал с именем Умы<\/td><\/tr><tr><td>Зал Зависти<\/td><td>«не»<\/td><td>Наброски героев из Галереи Отвергнутых<\/td><\/tr><tr><td>Зал Обжорства<\/td><td>«меняется»<\/td><td>Бесконечный стол. Кто-то должен не есть<\/td><\/tr><tr><td>Зал Гнева<\/td><td>«Неизменное»<\/td><td>Корвин или его тень. Печать Эстела горит в последний раз<\/td><\/tr><tr><td>Зал Оцепенения<\/td><td>«мертво»<\/td><td>Ледяная тишина. Пройти можно, только если кто-то рассказал о чувстве<\/td><\/tr><\/tbody><\/table><\/div><h3>Сердце Остова<\/h3><p>В центре — <strong>пустое место<\/strong>, где должна звучать весть. Если у героев есть <strong>Ухо Посланца<\/strong> (или расшифровка <strong>Пифии<\/strong> с Фабрики) и все десять слов, они слышат весть целиком — и могут <strong>произнести её за Посланца<\/strong>. Это и есть концовка «Услышать Весть».<\/p><h3>Находки Остова<\/h3><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Звёздное сердце<\/strong><\/td><td>Центр Остова<\/td><td>Легендарный материал: любое оружие становится +3 и «Звёздным»<\/td><\/tr><tr><td><strong>Отголосок вести<\/strong><\/td><td>Любой зал<\/td><td>Тот, кто его держит, 1 раз может отменить одно решение мастера-Судьбы (переброс любого броска в сцене)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s32-5\">Жертва: кого требует кинжал<\/h2><p>Кинжал требует «того, кто был и нарисован, и настоящим». Вариантов несколько — и каждый меняет концовку.<\/p><div class=\"tbl\"><table><thead><tr><th>Жертва<\/th><th>Почему подходит<\/th><th>Последствие<\/th><\/tr><\/thead><tbody><tr><td>Сайлас<\/td><td>Нарисовал себя в Картину, будучи настоящим<\/td><td>Картина остаётся, но больше никто не может её менять<\/td><\/tr><tr><td>Элиас<\/td><td>Его дар — оборотная сторона дара Сайласа<\/td><td>Картина «запоминает» мир настоящим; все Мазки исчезают у всех<\/td><\/tr><tr><td>Кисточка<\/td><td>Первое существо обоих миров<\/td><td>Мягкая цена; Картина и мир разделяются навсегда<\/td><\/tr><tr><td>Фредерик (объединённый)<\/td><td>Был разделён и соединён<\/td><td>Город сохраняет и идеалы, и изъяны<\/td><\/tr><tr><td>Герой с 5+ Мазками<\/td><td>Стал наполовину нарисованным<\/td><td>Герой уходит в Картину; может вернуться в эпилоге<\/td><\/tr><tr><td>Тесори<\/td><td>Провёл Акт II в Картине<\/td><td>Осирис принимает жертву; суд над нарисованными отменяется<\/td><\/tr><tr><td>Велисса<\/td><td>Нарисована и жива; носит Желание<\/td><td>Желание возвращается к Посланцу. Велисса исчезает — или, если её портрет закончен, остаётся в Картине<\/td><\/tr><tr><td><strong>Контракт феи<\/strong> (Велисса, «сделка на 1 желание»)<\/td><td>Желание платит само за себя<\/td><td><strong>Заменяет жертву.<\/strong> Велисса теряет Желание: остаётся собой, но больше не очаровывает и не слышит покровителя (смена подкласса/покровителя по договорённости с игроком)<\/td><\/tr><tr><td>Ирена Вейл<\/td><td>Первой коснулась Посланца; живёт сорок лет «между»<\/td><td>Мать искупает чуму. Все трое детей Вейл свободны от дара. Картина становится настоящей<\/td><\/tr><tr><td>Нерисса<\/td><td>Не подходит! Культ ошибается<\/td><td>Ритуал срывается, начинается катастрофа (финальный бой)<\/td><\/tr><tr><td>Без жертвы<\/td><td>—<\/td><td>Цену платит реальность: часть полуострова становится эскизом<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s32-6\">Концовки<\/h2><div class=\"tbl\"><table><thead><tr><th>Концовка<\/th><th>Что сделали<\/th><th>Итог<\/th><\/tr><\/thead><tbody><tr><td><strong>Стереть<\/strong><\/td><td>Элиас касается Картины даром<\/td><td>Нарисованный город исчезает. Все, кого герои любили в нём, — тоже. Мир честен и сер.<\/td><\/tr><tr><td><strong>Исправить<\/strong><\/td><td>Краска + Фотография + Записи; жертва<\/td><td>Город становится настоящим — с изъянами, болью и памятью. Самый «правильный» и самый трудный финал.<\/td><\/tr><tr><td><strong>Закрыть раму<\/strong><\/td><td>Отдать Картину Сайласу и запечатать<\/td><td>Город живёт в холсте вечно и идеально. Снаружи остаётся пустой Гравенхольм.<\/td><\/tr><tr><td><strong>Слить миры<\/strong><\/td><td>Разрез кинжала без жертвы<\/td><td>Нарисованное и настоящее смешиваются по всему полуострову. Начало новой кампании.<\/td><\/tr><tr><td><strong>Уравнение<\/strong><\/td><td>Культ побеждает<\/td><td>Все люди полуострова становятся одинаковыми. Герои — последние, у кого есть лица. Плохая концовка.<\/td><\/tr><tr><td><strong>Новый художник<\/strong><\/td><td>Герой берёт кисть Сайласа<\/td><td>Герой получает силу переписывать мир. Вопрос кампании переходит к нему.<\/td><\/tr><tr><td><strong>Услышать Весть<\/strong><\/td><td>Все 10 Слов Вести собраны чисто и прочитаны в Кратере (с Ухом Посланца или расшифровкой Пифии с Фабрики — без проверок; без Уха — проверка Харизмы СЛ 20 на каждое надтреснутое слово)<\/td><td>Эмоции возвращаются к Посланцу. Чудовища затихают по всему миру, в том числе в стране фэйри. Нарисованный город остаётся жить, но становится несовершенным — живым. Сайлас и Элиас впервые за 40 лет говорят друг с другом.<\/td><\/tr><tr><td><strong>Холст для фэйри<\/strong><\/td><td>Ума отвозит Картину домой<\/td><td>Страна фэйри спасена: Картина забирает её чудовищ. Нарисованный город внутри превращается в тюрьму для них. Если Сайлас умрёт — холст выпустит всё (см. Обитель).<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box quote\"><p>Я всю жизнь пытался понять, кого убивает моё лечение. А теперь думаю, что задавал неправильный вопрос. Нужно было спросить... кто вообще решил, что они должны умереть?<\/p><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Финальный принцип: поставить игроков <strong>перед выбором, а не перед одной правильной кнопкой<\/strong>. Ни одна концовка не должна быть однозначно хорошей. Даже «Исправить» стоит жизни.<\/p><\/div><h2 id=\"s32-7\">Эпилог: что показать в конце<\/h2><div class=\"tbl\"><table><thead><tr><th>Вопрос<\/th><th>Как отразить<\/th><\/tr><\/thead><tbody><tr><td>Что стало с городом?<\/td><td>Опишите одно утро в Гравенхольме (нарисованном, настоящем или смешанном) глазами одного NPC, которого герои спасли<\/td><\/tr><tr><td>Что стало с Вейлами?<\/td><td>Сайлас, Элиас, Нерисса, Ирена — одна фраза о каждом<\/td><\/tr><tr><td>Эстел<\/td><td>Нашёл ли он семью? Есть ли на нём печать? Мурлычет ли он, когда думает, что никто не слышит?<\/td><\/tr><tr><td>Велисса<\/td><td>Законченная, перетканная, свободная, исчезнувшая? Кто теперь её «питомцы»?<\/td><\/tr><tr><td>Ума<\/td><td>Капитан, изгнанница, легенда академии? Летает ли тот ребёнок?<\/td><\/tr><tr><td>Тесори<\/td><td>Свободен ли он от Осириса?<\/td><\/tr><tr><td>Мир<\/td><td>Затихли ли чудовища? Помнят ли люди, что весть была?<\/td><\/tr><\/tbody><
