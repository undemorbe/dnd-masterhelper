\/table><\/div><div class=\"box quote\"><p>Можно ли исправить несовершенную реальность, не уничтожив саму реальность?<\/p><\/div>", "toc": [["s32-1", "Обсерватория «Звёздный Колодец»"], ["s32-2", "Лагерь Равных «Ровное»"], ["s32-3", "Кратер Посланца"], ["s32-4", "Остов Посланца"], ["s32-5", "Жертва: кого требует кинжал"], ["s32-6", "Концовки"], ["s32-7", "Эпилог: что показать в конце"]], "text": "Рекомендуемый уровень: 13–15. Музыка: астрономическая сцена (подобрать), Туман / гром, Сильный бой, финальный трек — Костёр / рассвет. Обсерватория «Звёздный Колодец» Купол на скале у края Кратера, построенный Иреной Вейл. Телескоп нацелен не на небо, а вниз — в Кратер . Эларис Тёмная Звезда — астроном Эльф, ученик Ирены Вейл. Живёт в обсерватории 40 лет. Почти ослеп, но видит звёзды с закрытыми глазами. Знает, откуда пришёл Посланец и что было в его вести. Готов рассказать, если герои принесут Евангелие Вести. Расчитывает дату ритуала : ночь, когда звезда Посланца встанет над Кратером. Это финальный таймер кампании. Что раскрывается в Обсерватории Записи Ирены Вейл: Посланец пришёл предупредить . Его весть: «Вы несовершенны — и поэтому живы. Совершенное не меняется. Неизменное мертво.» Эмоции — не яд, а слова сообщения , которые люди не смогли понять целиком. Их десять — по числу слов. Собранные вместе, они складываются в эту фразу. Тоска — пятая Великая эмоция и первое слово, «Вы». Это то, что Посланец чувствовал к людям. Её Сосуд — Сайлас. Желание живёт в Велиссе, Нежность — в Кисточке. Без них весть звучит как приговор, и культ читает её именно так. Культ «Равных» прочитал весть наоборот : «Несовершенство — смерть. Будьте одинаковы — будете вечны.» Находки Обсерватории Предмет Где Эффект Звёздный атлас Ирены Библиотека купола Точная дата Ночи Звезды (если нет линзы или поздней карты — дата ±3 дня) Небесное стекло Телескоп Посмотревший в Кратер видит, где сейчас культ, на 1 час Плащ астронома Эларис Сопротивление излучению; ночью +1 к КД Метеоритная пыль (2) Подвал Материал «Звёздное» для улучшения +4 Тяжёлые выборы Обсерватории Выбор Почему тяжело Эларис и ритуал Эларис хочет сам услышать весть. Если взять его в Кратер, он поможет рассчитать момент, но культ первым делом убьёт его Сказать Элиасу правду о матери Если Ирена жива (Акт IV), Элиас должен узнать, что она ушла и не вернулась. Может ли он её простить? Лагерь Равных «Ровное» На склоне Кратера культ построил посёлок. Здесь живут Равные — люди, которых уже «уравняли»: одинаковые лица, одинаковые голоса, одинаковые серые одежды. Они не страдают. Они не радуются. Они строят алтарь. Тайна · только для мастера «Ровное» — это будущее мира , если победит Малрик. Пусть герои увидят его своими глазами: дети с одинаковыми лицами играют в одну и ту же игру, мать не может найти своего сына, потому что все сыновья одинаковые, — и не ищет. Правило: Одинаковость Важно В Ровном каждый раз, когда герой проявляет уникальную черту (говорит своим особым словом, использует особенность класса, вспоминает личное), Равные замечают его: Часы Культа +1 (до максимума). Если герой притворяется одинаковым (мантия Равного, монотонная речь), — спасбросок Мудрости СЛ 15 каждый час или 1 Отголосок Зависти. Кто здесь NPC Кто Функция Нерисса Вейл Голос Равных Здесь — её последний выбор. Зависит от письма матери (Гнездо Вейлов) и от того, жива ли Ирена Ордо Квартирмейстер Если подкуплен в Гнезде — открывает ворота Мальчик-Равный №17 Ребёнок без имени Начинает рисовать на земле — неровно, по-своему. Первый признак, что уравнение можно обратить Бывшие герои Акта II Если культ кого-то забрал (Селена, Шаэл, Дрейвен…) Они здесь, уже уравнённые. Узнать их можно только по шраму или травме Квесты Квест Суть Награда «Ворота» (основной) Пройти через Ровное к алтарю: скрытно, силой или с помощью Нериссы Доступ к Кратеру до начала ритуала культа «Номер 17» Помочь мальчику нарисовать свой рисунок до конца Доказательство, что уравнение обратимо; для Умы и Эстела — Оттепель/Искупление «Узнать своих» Найти уравненных союзников Вернуть их (дар Элиаса, Перо, Фотография Селены) «Последний разговор» Нерисса Она отдаёт свой план ритуала — или ведёт героев в засаду Находки Предмет Где Эффект Мантия Равного Склад Маскировка (см. правило) План алтаря Шатёр Нериссы Слабое место алтаря Малрика: Надлом босса начинается с 1 жетона Рисунок №17 Мальчик Прерывание «Уравнения» Малрика (как уникальная вещь — «он не может повторить то, что есть только у ребёнка») Серая маска Тела стражи Иммунитет к «Уравнению» на 1 раунд (одноразовая) Тяжёлые выборы Выбор Почему тяжело Вернуть уравненных Каждому нужен дар Элиаса, а у Элиаса осталось мало сил. Кого вернуть — Селену, Шаэл, незнакомую мать? Нерисса Если она перешла на сторону героев, Малрик сделает её жертвой. Защитить её — значит задержаться и пустить культ к алтарю первым Сжечь Ровное Уничтожит культ, но сотни уравненных людей внутри не побегут: они не боятся Кратер Посланца Огромная чаша с остекленевшими стенами. В центре — тёмное пятно, похожее на пустой холст. Здесь проходит ритуал. Культ ждёт героев — или герои культ. Финальное столкновение Участник Цель в финале Малрик Угасший Завершить ритуал «уравнения»: прочитать записи голосом культа и сделать жертвой Нериссу (её «обычность» станет образцом для всех) Нерисса Вейл Колеблется. Если герои раскрыли ей правду о матери и брате — может перейти на их сторону Сайлас (из Картины) Хочет, чтобы Картина стала «настоящей» и закрытой Элиас Готов коснуться Картины даром и стереть её — если герои попросят Тесори (из Картины) Приказ Осириса: уничтожить всё нарисованное. Выйдет через разрез кинжала — или уже с партией, если Суд Осириса выигран Ирена Вейл (если найдена в Акте IV) Услышать весть. Готова стать жертвой вместо любого из детей Сосуды (если выжили) Каждый выживший Сосуд — отдельная фаза или союзник Малрик Угасший, «Равный» — финальный босс Параметр Значение Хиты 300 (уровень 13) / 380 (уровень 15) КД 17 Особенность Безликий: иммунитет к очарованию и испугу; любые бонусы героев (вдохновение, преимущество, благословение) на расстоянии 9 м от него не действуют — «все равны» Атака Ровный удар: всегда наносит среднее значение урона (никаких критов ни у него, ни против него) — 30 урона дробящего Подготовка «Уравнение» — все герои в 18 м: их хиты становятся равны среднему значению хитов партии Прерывание Действие, которое может сделать только этот персонаж (уникальная черта, личная история, предмет, связанный с его прошлым). Мастер заранее объявляет: «Он не может повторить то, что есть только у вас.» Фазы Фаза 1 — Малрик и культисты. Фаза 2 — он поглощает собранные эмоции (по одной за каждый Сосуд, которого не победили). Фаза 3 — разрез холста: бой на границе Картины и мира Остов Посланца Под дном Кратера, за остеклевшей коркой, лежит тело Посланца — огромное, звёздное, полое внутри. Сюда можно спуститься через разрез Мастихина или через трещину, которую откроет «Уравнение» Малрика. Здесь весть звучит громче всего . Совет мастеру Остов — финальное подземелье для концовки «Услышать Весть» или для случая, когда ритуал пошёл не так и Малрик ушёл вглубь. Если партия выбирает другую концовку, Остов можно пропустить или дать как эпилог. Правило: Десять залов Важно Остов — это десять залов , по одному на каждое слово вести. В каждом зале герои встречают свою эмоцию в последний раз — не врагом, а голосом. Чтобы пройти зал, нужно произнести его Слово Вести : чистое Слово — зал проходится без боя; надтреснутое — проверка Харизмы СЛ 15 или короткий бой с тенью эмоции; у врага — бой с полной формой эмоции (бывший Сосуд как тень). Зал Слово Что внутри Зал Тоски «Вы» Сайлас (или его тень) просит: «Скажите, что я был прав хоть в чём-то» Зал Скрытности «несовершенны» Все забытые воспоминания героев, развешанные, как бельё Зал Нежности «и» Кисточка ждёт — и ведёт дальше, если ему доверяли Зал Страха «поэтому» Пастух (или Стадо). Каждый герой встречает свой страх Зал Желания «живы» Велисса слышит, как Желание зовёт её «домой». Решение её линии, если оно ещё не принято Зал Гордыни «Совершенное» Пьедестал с именем Умы Зал Зависти «не» Наброски героев из Галереи Отвергнутых Зал Обжорства «меняется» Бесконечный стол. Кто-то должен не есть Зал Гнева «Неизменное» Корвин или его тень. Печать Эстела горит в последний раз Зал Оцепенения «мертво» Ледяная тишина. Пройти можно, только если кто-то рассказал о чувстве Сердце Остова В центре — пустое место , где должна звучать весть. Если у героев есть Ухо Посланца (или расшифровка Пифии с Фабрики) и все десять слов, они слышат весть целиком — и могут произнести её за Посланца . Это и есть концовка «Услышать Весть». Находки Остова Предмет Где Эффект Звёздное сердце Центр Остова Легендарный материал: любое оружие становится +3 и «Звёздным» Отголосок вести Любой зал Тот, кто его держит, 1 раз может отменить одно решение мастера-Судьбы (переброс любого броска в сцене) Жертва: кого требует кинжал Кинжал требует «того, кто был и нарисован, и настоящим». Вариантов несколько — и каждый меняет концовку. Жертва Почему подходит Последствие Сайлас Нарисовал себя в Картину, будучи настоящим Картина остаётся, но больше никто не может её менять Элиас Его дар — оборотная сторона дара Сайласа Картина «запоминает» мир настоящим; все Мазки исчезают у всех Кисточка Первое существо обоих миров Мягкая цена; Картина и мир разделяются навсегда Фредерик (объединённый) Был разделён и соединён Город сохраняет и идеалы, и изъяны Герой с 5+ Мазками Стал наполовину нарисованным Герой уходит в Картину; может вернуться в эпилоге Тесори Провёл Акт II в Картине Осирис принимает жертву; суд над нарисованными отменяется Велисса Нарисована и жива; носит Желание Желание возвращается к Посланцу. Велисса исчезает — или, если её портрет закончен, остаётся в Картине Контракт феи (Велисса, «сделка на 1 желание») Желание платит само за себя Заменяет жертву. Велисса теряет Желание: остаётся собой, но больше не очаровывает и не слышит покровителя (смена подкласса/покровителя по договорённости с игроком) Ирена Вейл Первой коснулась Посланца; живёт сорок лет «между» Мать искупает чуму. Все трое детей Вейл свободны от дара. Картина становится настоящей Нерисса Не подходит! Культ ошибается Ритуал срывается, начинается катастрофа (финальный бой) Без жертвы — Цену платит реальность: часть полуострова становится эскизом Концовки Концовка Что сделали Итог Стереть Элиас касается Картины даром Нарисованный город исчезает. Все, кого герои любили в нём, — тоже. Мир честен и сер. Исправить Краска + Фотография + Записи; жертва Город становится настоящим — с изъянами, болью и памятью. Самый «правильный» и самый трудный финал. Закрыть раму Отдать Картину Сайласу и запечатать Город живёт в холсте вечно и идеально. Снаружи остаётся пустой Гравенхольм. Слить миры Разрез кинжала без жертвы Нарисованное и настоящее смешиваются по всему полуострову. Начало новой кампании. Уравнение Культ побеждает Все люди полуострова становятся одинаковыми. Герои — последние, у кого есть лица. Плохая концовка. Новый художник Герой берёт кисть Сайласа Герой получает силу переписывать мир. Вопрос кампании переходит к нему. Услышать Весть Все 10 Слов Вести собраны чисто и прочитаны в Кратере (с Ухом Посланца или расшифровкой Пифии с Фабрики — без проверок; без Уха — проверка Харизмы СЛ 20 на каждое надтреснутое слово) Эмоции возвращаются к Посланцу. Чудовища затихают по всему миру, в том числе в стране фэйри. Нарисованный город остаётся жить, но становится несовершенным — живым. Сайлас и Элиас впервые за 40 лет говорят друг с другом. Холст для фэйри Ума отвозит Картину домой Страна фэйри спасена: Картина забирает её чудовищ. Нарисованный город внутри превращается в тюрьму для них. Если Сайлас умрёт — холст выпустит всё (см. Обитель). Я всю жизнь пытался понять, кого убивает моё лечение. А теперь думаю, что задавал неправильный вопрос. Нужно было спросить... кто вообще решил, что они должны умереть? Важно Финальный принцип: поставить игроков перед выбором, а не перед одной правильной кнопкой . Ни одна концовка не должна быть однозначно хорошей. Даже «Исправить» стоит жизни. Эпилог: что показать в конце Вопрос Как отразить Что стало с городом? Опишите одно утро в Гравенхольме (нарисованном, настоящем или смешанном) глазами одного NPC, которого герои спасли Что стало с Вейлами? Сайлас, Элиас, Нерисса, Ирена — одна фраза о каждом Эстел Нашёл ли он семью? Есть ли на нём печать? Мурлычет ли он, когда думает, что никто не слышит? Велисса Законченная, перетканная, свободная, исчезнувшая? Кто теперь её «питомцы»? Ума Капитан, изгнанница, легенда академии? Летает ли тот ребёнок? Тесори Свободен ли он от Осириса? Мир Затихли ли чудовища? Помнят ли люди, что весть была? Можно ли исправить несовершенную реальность, не уничтожив саму реальность?"}, {"id": "s33", "n": 33, "title": "ПЕРСОНАЖИ ИГРОКОВ: РАЗВИТИЕ", "disp": "Персонажи игроков: развитие", "group": "Герои", "html": "<p>У каждого героя есть <strong>личная линия<\/strong>, вплетённая в главный сюжет. Линии устроены одинаково: <strong>Крючок → Раскрытие → Выбор → Развязка<\/strong>. Каждый этап привязан к конкретным локациям, поэтому личная история продвигается сама собой, пока партия идёт по кампании.<\/p><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Главное правило: личная линия героя должна <strong>сталкиваться<\/strong> с главным ритуалом. Эстелу нужен кинжал, Уме — Картина, Велисса сама является частью вести Посланца. В финале каждому придётся выбирать между своим и общим.<\/p><\/div><h2 id=\"s33-1\">Сводка<\/h2><div class=\"tbl\"><table><thead><tr><th>Герой<\/th><th>Раса и класс<\/th><th>Что ищет<\/th><th>Чем связан с сюжетом<\/th><th>Эмоции-отзвуки<\/th><th>Ключевая локация<\/th><\/tr><\/thead><tbody><tr><td><strong>Эстел<\/strong><\/td><td>Табакси, плут<\/td><td>Родню, особенно сестру<\/td><td>Бывший раб <strong>Корвина Блэкторна<\/strong>; печать вырезана <strong>Мастихином<\/strong><\/td><td>Гнев, Оцепенение, Скрытность<\/td><td>Карьер «Глотка»<\/td><\/tr><tr><td><strong>Велисса<\/strong><\/td><td>Фея, колдун (дикая кровь фей)<\/td><td>Своего создателя<\/td><td>Создание <strong>Сайласа<\/strong>; живой носитель <strong>Желания<\/strong><\/td><td>Желание, Тоска<\/td><td>Башня, Обитель<\/td><\/tr><tr><td><strong>Ума<\/strong><\/td><td>Фэйри, воин (мистический рыцарь)<\/td><td>Артефакт для страны фэйри<\/td><td>Её цель — <strong>Картина<\/strong>; чудовища на родине — <strong>Тихие эмоции<\/strong><\/td><td>Гордыня, Страх, Гнев<\/td><td>Белая чаща, Сад Статуй<\/td><\/tr><tr><td><strong>Тесори<\/strong> (NPC)<\/td><td>—<\/td><td>Исполнить приказ Осириса<\/td><td>Внутри Картины; приказ угрожает <strong>Велиссе<\/strong><\/td><td>Страх<\/td><td>Башня, Картина<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s33-2\">Эстел<\/h2><h3>Карточка<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Раса, класс<\/td><td>Табакси, плут. Черты: Бдительный, Атлетичный<\/td><\/tr><tr><td>Возраст, рост, вес<\/td><td>19–22 года; 180–190 см; 60–75 кг<\/td><\/tr><tr><td>Внешность<\/td><td>Насыщенно-янтарная шерсть, белая морда и грудь, белые «носочки» на лапах; бледно-бирюзовые глаза<\/td><\/tr><tr><td>Привычка<\/td><td>Мурлычащие словечки («мяу», «мур-мяу»), мурлычет во сне или когда гладят<\/td><\/tr><tr><td>Идеал<\/td><td>«Если и жить, то в своё удовольствие!»<\/td><\/tr><tr><td>Привязанность<\/td><td>«Я обязательно когда-нибудь найду своих сородичей»<\/td><\/tr><tr><td>Слабость<\/td><td>Хладнокровность, которая развивалась годами и пугает его самого: как быть дружелюбным и человечным?<\/td><\/tr><tr><td>Навязчивая мысль<\/td><td>Родня, особенно сестра<\/td><\/tr><tr><td>Трофей<\/td><td>Один серп из пары бывшего хозяина<\/td><\/tr><\/tbody><\/table><\/div><h3>Прошлое (как написал игрок, коротко)<\/h3><p>Эстел вырос в маленьком клане. Когда ему было 7–12 лет, родилась сестра; малышку оставили знакомым и пошли учить сына охотиться. Ночью лагерь окружили работорговцы. Родителей и Эстела разлучили и продали; Эстела купил у гоблина-работорговца огромный мужчина с маниакальным взглядом и парой серпов. Он спросил, сопротивлялся ли котёнок, разочаровался («ничего, с этим можно поработать») и согласился на <strong>рабскую печать<\/strong>, которая питается жизненной силой хозяина. Спустя годы Эстел в поединке сбил хозяина с ног и ногой отправил его через развалившуюся стену — на 2–3 этажа вниз, в пепел. Печать перестала колоть. Эстел взял серп как трофей, долго искал клан, нашёл лишь чужие, стал наёмником гильдий и надел маску жизнерадостного экстраверта.<\/p><p>Позже возле трактира он увидел у крупного незнакомца <strong>причудливый кинжал с меткой, похожей на его рабскую печать<\/strong>. Лица не разглядел, одну деталь забыл, человека потерял на первом же повороте.<\/p><h3>Канон кампании (предложение)<\/h3><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Хозяин жив. Это Корвин Блэкторн<\/strong>, лорд-охотник Бастиона, Сосуд Гнева. Падая в пепел, он должен был умереть, но его подхватил Гнев Посланца. Теперь Корвин живёт Гневом, а не своей жизнью, поэтому печать «уснула»: ей нечем питаться.<\/p><p><strong>Кинжал у трактира — Мастихин Звёздного Железа<\/strong>, ритуальный кинжал из списка артефактов. Все печати Бастиона режутся им, отсюда одинаковая метка. Забытая деталь: на поясе незнакомца висел <strong>один серп<\/strong>, пара к трофею Эстела.<\/p><p><strong>Семья жива, но разбросана по полуострову<\/strong> (предложение, мастер может оставить кого-то пропавшим): <strong>сестра Искорка<\/strong> сидит в клетке Зверинца; <strong>отец по кличке Рыжий<\/strong> — постаревший боец Арены Ям в карьере; <strong>мать<\/strong> — одна из забытых невидимых слуг Зефера в Мглине. Клан уничтожили охотники Бастиона, когда пришли за остальными табакси.<\/p><p>Название клана игрок выбирать не хочет, поэтому можно оставить его безымянным. Если понадобится: <strong>клан Тёплого Камня<\/strong>. Только как вариант.<\/p><\/div><h3>Личная механика: Печать<\/h3><div class=\"tbl\"><table><thead><tr><th>Состояние печати<\/th><th>Когда<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Тихая<\/strong><\/td><td>Обычно<\/td><td>Без эффекта<\/td><\/tr><tr><td><strong>Зуд<\/strong><\/td><td>Рядом сильный Гнев (Бастион, Корвин в пределах 1 км)<\/td><td>Эстел чувствует направление к Корвину, как компас<\/td><\/tr><tr><td><strong>Жжение<\/strong><\/td><td>Корвин в пределах 100 м<\/td><td>Печать светится: помеха на Скрытность; 1 жетон Ярости в начале боя<\/td><\/tr><tr><td><strong>Зов<\/strong><\/td><td>Корвин использует «Зов печати»<\/td><td>Спасбросок Телосложения СЛ 15 или ошеломлён до конца следующего хода<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Как снять печать навсегда<\/strong><\/p><div class=\"tbl\"><table><thead><tr><th>Способ<\/th><th>Цена<\/th><\/tr><\/thead><tbody><tr><td>Разрезать Мастихином (Эстел делает это сам)<\/td><td>Шрам навсегда, 2d6 урона, 1 Отголосок Гнева; печать исчезает<\/td><\/tr><tr><td>Дар Элиаса («вернуть к тому, каким был»)<\/td><td>Печать исчезает, но Эстел теряет одно воспоминание из рабских лет. Возможно, именно то, что сделало его сильным (мастер выбирает)<\/td><\/tr><tr><td>Корвин примирён или побеждён без ярости<\/td><td>Печать гаснет сама<\/td><\/tr><tr><td><strong>Эстел убивает Корвина в ярости<\/strong> (3 жетона Ярости в момент удара)<\/td><td>Печать гаснет, <strong>но Гнев переходит в Эстела<\/strong>: он становится новым Сосудом Гнева. Тёмная ветка, только если игрок согласен<\/td><\/tr><\/tbody><\/table><\/div><h3>Личная механика: Оттепель<\/h3><p>Слабость Эстела — его холод. Ведите шкалу <strong>Оттепели<\/strong> (0–5). +1 за сцену, где Эстел <strong>искренне<\/strong> проявляет чувство без маски весельчака: обнимает сестру, плачет на Ледяной мельнице, признаётся в страхе, защищает того, кто слабее.<\/p><div class=\"tbl\"><table><thead><tr><th>Оттепель<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>2<\/td><td>Раз за сессию: снять с союзника испуг, просто поговорив с ним<\/td><\/tr><tr><td>3<\/td><td>Иммунитет к правилу «Тепло» Ледяной мельницы: Эстел греет и себя, и других<\/td><\/tr><tr><td>5<\/td><td><strong>«Живое сердце»<\/strong>: преимущество на спасброски против очарования, Оцепенения и Зова печати; маска весельчака больше не нужна, и NPC это замечают<\/td><\/tr><\/tbody><\/table><\/div><p>Если Эстел соглашается «смолоть» боль на Ледяной мельнице, Оттепель обнуляется навсегда.<\/p><h3>Этапы линии<\/h3><div class=\"tbl\"><table><thead><tr><th>Этап<\/th><th>Где<\/th><th>Что происходит<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td><strong>Крючок<\/strong><\/td><td>Мастерская (сейчас)<\/td><td>Эскиз «К. Б., заказ»: огромный мужчина с парой серпов. Эстел узнаёт серпы<\/td><td>Вдохновение; первое имя: «К. Б.»<\/td><\/tr><tr><td>Крючок<\/td><td>Город, Дрейвен Нокс<\/td><td>Метка Дрейвена похожа на печать Эстела. Дрейвен — бывший охотник Бастиона<\/td><td>Дрейвен рассказывает о Корвине и Мастихине<\/td><\/tr><tr><td><strong>Раскрытие<\/strong><\/td><td>Мглин<\/td><td>Фотография Селены возвращает забытую деталь: одинокий серп. Среди забытых слуг — мать<\/td><td>Мать (если её вернуть)<\/td><\/tr><tr><td>Раскрытие<\/td><td>Обитель<\/td><td>Запись Элиаса: «хозяин не мёртв, он перестал быть собой»<\/td><td>Понимание, что Корвин жив<\/td><\/tr><tr><td>Раскрытие<\/td><td>Зверинец<\/td><td>Сестра Искорка в клетке. Она его не помнит<\/td><td>Сестра — NPC-спутница; Оттепель +1<\/td><\/tr><tr><td>Раскрытие<\/td><td>Ледяная мельница<\/td><td>Зеркало его холода<\/td><td>Шанс на Оттепель или на её потерю<\/td><\/tr><tr><td><strong>Выбор<\/strong><\/td><td>Карьер «Глотка»<\/td><td>Отец на Арене; Корвин; Мастихин. Снять печать, отомстить, освободить отца, забрать кинжал<\/td><td>Серп Жнеца (пара), снятая печать<\/td><\/tr><tr><td><strong>Развязка<\/strong><\/td><td>Кратер<\/td><td>Кинжал нужен ритуалу, а Эстел держал его в руках. Отдать или оставить себе?<\/td><td>Зависит от выбора<\/td><\/tr><\/tbody><\/table><\/div><h3>Крючки на ближайшие сессии<\/h3><ul><li>На эскизе в мастерской серпы прорисованы тщательнее лица. Сайлас явно восхищался ими.<\/li><li>Бармен Веспер Мор тоже носит под шарфом след ошейника и замечает, как Эстел трёт плечо.<\/li><li>Ночью трофейный серп Эстела <strong>тихо звенит<\/strong>, когда кто-то рядом злится.<\/li><li>В городе Эстелу попадается нарисованный котёнок-табакси, ребёнок одного из горожан. Сайлас нарисовал его «по памяти». Чьей памяти?<\/li><\/ul><h3>Вопросы игроку<\/h3><ul><li>Как звали сестру? (Если имени нет, то «Искорка» — имя, которое дала ей Шаэл.)<\/li><li>Что Эстел сделает, когда сестра его не узнает?<\/li><li>Чего он хочет от Корвина: смерти, ответа, извинения?<\/li><li>Готов ли он отдать Мастихин ради ритуала, если кинжал — единственное, что снимает печать?<\/li><\/ul><h2 id=\"s33-3\">Велисса<\/h2><h3>Карточка<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Раса, класс<\/td><td>Фея; колдун, покровитель — дикая кровь фей; предыстория — торговец<\/td><\/tr><tr><td>Возраст<\/td><td>30 лет (с момента «написания»)<\/td><\/tr><tr><td>Внешность<\/td><td>Бледная кожа с перламутровым блеском; глубокие синие затягивающие глаза; лёгкие светлые волнистые волосы; полупрозрачные мерцающие крылья стрекозы с острыми краями, которые темнеют и складываются в плащ. Одежда — вторая кожа, переливается и выглядит для каждого чуть по-разному<\/td><\/tr><tr><td>Взгляд<\/td><td>Манит, как у сирены. Кто смотрит слишком долго, забывает, кто он и зачем пришёл<\/td><\/tr><tr><td>Характер<\/td><td>Спокойствие, издёвка, игра, очарование, манипуляция, искушение, неторопливость<\/td><\/tr><tr><td>Идеалы<\/td><td>Свобода, выгода, развлечение, искушение<\/td><\/tr><tr><td>Привязанности<\/td><td>Её «питомцы»; создатель-художник — самое дорогое в её жизни; страна фей, чей зов она иногда слышит<\/td><\/tr><tr><td>Слабости<\/td><td>Недооценивает смертных; теряет очарование в гневе или когда её отвергают; странное любопытство; не переносит долгое солнце и мороз<\/td><\/tr><tr><td>Снаряжение<\/td><td>Шёлковая верёвка, амулет художника, зеркало (показывает желания, а не облик), серебряный кинжал, шпилька-игла, флаконы сновидений, контракт феи на одно желание, <strong>осколки личности<\/strong> (запечатанные чужие «я»)<\/td><\/tr><\/tbody><\/table><\/div><h3>Происхождение (от игрока)<\/h3><p>Велисса появилась не как существо, а как <strong>эмоция и мысль художника, обретшая форму<\/strong>. Художник, безумный или просветлённый, писал её грубыми мазками и оставил смотреть на солнце. Увидев мерцающий свет из холста, он усомнился в ней и попытался сжечь, но не смог. Тогда он сам посмотрел на солнце и исчез. Она точно знает: он жив, а она — <strong>незаконченное творение<\/strong>.<\/p><h3>Канон кампании (предложение)<\/h3><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Создатель Велиссы — Сайлас Вейл.<\/strong> Задолго до Картины он впервые попробовал краску из кратера, наследство матери, и написал на <strong>фэйском шёлке<\/strong> (его привозили торговцы из страны фэйри) образ, который назвал «Желание». Тихая эмоция Посланца <strong>Желание<\/strong> вошла в холст и обрела тело. Отсюда фейская природа Велиссы и зов страны фей: она соткана из фэйского шёлка.<\/p><p><strong>Почему у Сайласа синий глаз:<\/strong> он посмотрел на солнце, чтобы больше не видеть её, и выжег левый глаз. Потом нарисовал себе новый, синий. «Исчез» он в свою Картину, в нарисованный город.<\/p><p><strong>Почему солнце и мороз:<\/strong> Велисса — <strong>непролакированная живопись<\/strong>. Её краска не закреплена: солнце её выцветает, мороз её трескает. Законченный и покрытый лаком портрет снял бы обе слабости.<\/p><p><strong>Осколки личности<\/strong> — это <strong>другие наброски<\/strong> Велиссы, которые Сайлас пробовал сделать «правильными». Перечёркнутый портрет «уродство» в Галерее — один из них. Если осколок раскрыть, появляется другая Велисса: законченная, послушная, идеальная. Соперница.<\/p><p><strong>Почему существо из Картины назвало её уродством:<\/strong> среди гладких, «законченных» нарисованных она выглядит грубым эскизом. Для Картины она ошибка. Для Посланца — одно из десяти слов его вести, слово «<strong>живы<\/strong>».<\/p><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Велисса — цель <strong>сразу трёх сил<\/strong>: культ (ему нужно Желание для ритуала), Осирис через Тесори (всё нарисованное должно быть уничтожено) и Сайлас (хочет закончить работу). Это делает её линию самой опасной в партии.<\/p><\/div><h3>Личная механика: Незаконченность<\/h3><ul><li>Велисса считается <strong>нарисованным существом<\/strong>: у неё постоянно <strong>2 Мазка<\/strong>, которые нельзя снять. Попытка Элиаса снять их даром вернёт её «к тому, чем она была», то есть в эмоцию, и она исчезнет. Элиас об этом догадается и откажется.<\/li><li>Башня пропускает её уже при <strong>1 дополнительном Мазке<\/strong>.<\/li><li><strong>Растворитель<\/strong> наносит ей урон как нарисованному существу (2d6).<\/li><li><strong>Отвергнутая.<\/strong> Если Сайлас или нарисованное существо отвергает её (вслух называет ошибкой, уродством, отворачивается), она получает помеху на проверки Харизмы, а СЛ её заклинаний снижается на 2 до конца следующей короткой передышки. Это её флейвор-слабость, оформленная в правило.<\/li><li><strong>Солнце:<\/strong> за каждый час под прямым солнцем — спасбросок Телосложения СЛ 12 или 1 уровень истощения («выцветание»). <strong>Мороз:<\/strong> в холоде (Ледяная мельница) — помеха на спасброски Телосложения.<\/li><\/ul><h3>Этапы линии<\/h3><div class=\"tbl\"><table><thead><tr><th>Этап<\/th><th>Где<\/th><th>Что происходит<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td><strong>Крючок<\/strong><\/td><td>Мастерская (сейчас)<\/td><td>Обгоревший холст на чердаке с её силуэтом. «Не смотри на неё. Не смотри на солнце.» Амулет теплеет<\/td><td>Вдохновение; амулет начинает указывать на Сайласа<\/td><\/tr><tr><td>Крючок<\/td><td>Галерея Портретов<\/td><td>Два её портрета; второй перечёркнут: «уродство». Осколок личности в её сумке откликается на него<\/td><td>Выбор: уничтожить перечёркнутый портрет или забрать<\/td><\/tr><tr><td><strong>Раскрытие<\/strong><\/td><td>Башня, вершина<\/td><td>Встреча с Сайласом. Он узнаёт её и пугается, потом очаровывается. Предлагает её <strong>закончить<\/strong><\/td><td>Решение откладывается или принимается<\/td><\/tr><tr><td>Раскрытие<\/td><td>Обитель<\/td><td>Страница дневника о том, как он писал Желание<\/td><td>Понимание своей природы<\/td><\/tr><tr><td>Раскрытие<\/td><td>Хоспис<\/td><td>Элиас отказывается её лечить: «Я верну тебя к тому, чем ты была. А ты была чувством».<\/td><td>—<\/td><\/tr><tr><td>Угроза<\/td><td>Акт II, Нерисса<\/td><td>Культ пытается её похитить. Нерисса предлагает «найти ей место» в ритуале<\/td><td>Если похищение удалось — спасательная сессия<\/td><\/tr><tr><td>Угроза<\/td><td>Акт II, Тесори<\/td><td>На холсте Тесори поднимает хопеш в сторону её нарисованного портрета<\/td><td>—<\/td><\/tr><tr><td><strong>Выбор<\/strong><\/td><td>Акт II — Акт V<\/td><td>Как поступить со своей незаконченностью (см. ниже)<\/td><td>Слово Вести «живы»<\/td><\/tr><tr><td><strong>Развязка<\/strong><\/td><td>Кратер<\/td><td>Контракт феи на одно желание может <strong>заменить жертву<\/strong> ритуала<\/td><td>Зависит от выбора<\/td><\/tr><\/tbody><\/table><\/div><h3>Выбор незаконченности<\/h3><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Итог<\/th><th>Слово «живы»<\/th><\/tr><\/thead><tbody><tr><td><strong>Сайлас заканчивает её<\/strong><\/td><td>Лак: иммунитет к солнцу и морозу, +2 к Харизме (максимум 20). Но Сайлас «владеет» ею: раз за сессию может заставить её замереть или сказать правду. Осколки личности сливаются в неё, и она меняется<\/td><td>Надтреснуто<\/td><\/tr><tr><td><strong>Заканчивает себя сама<\/strong> (3 заряда флакона краски)<\/td><td>Велисса сама выбирает недостающую деталь и сама себя лакирует. Иммунитет к солнцу и морозу, а Сайлас больше не имеет над ней власти. Требует принять свою «грубость»<\/td><td><strong>Чисто<\/strong><\/td><\/tr><tr><td><strong>Остаётся незаконченной<\/strong><\/td><td>Сохраняет слабости, но <strong>никто<\/strong> не может ею владеть: иммунитет к очарованию со стороны Сайласа и культа<\/td><td>Чисто, если решение принято осознанно<\/td><\/tr><tr><td><strong>Возвращает Желание<\/strong> (контракт вместо жертвы)<\/td><td>Велисса остаётся собой, но перестаёт очаровывать и теряет покровителя. Смена подкласса по договорённости с игроком. Она впервые по-настоящему чего-то <strong>не<\/strong> хочет — и свободна<\/td><td>Чисто, слово уходит в весть<\/td><\/tr><tr><td><strong>Похищена культом<\/strong><\/td><td>Малрик использует её в ритуале<\/td><td>У врага<\/td><\/tr><\/tbody><\/table><\/div><h3>Крючки на ближайшие сессии<\/h3><ul><li>Зеркало Велиссы в мастерской показывает не её желание, а <strong>желание Сайласа<\/strong>: её, законченную, на месте Картины.<\/li><li>Нарисованные горожане тянутся к ней, как к своей. Но существа из картины шипят: «грубая».<\/li><li>Один из её «питомцев» оказывается нарисованным и выцветает, когда она отходит.<\/li><li>Амулет художника — это пуговица с куртки Сайласа. В Башне её не хватает на его рукаве.<\/li><\/ul><h3>Вопросы игроку<\/h3><ul><li>Кого Велисса называет «питомцами»: людей, которых очаровала? Существ? Осколки себя?<\/li><li>Чего она хочет от Сайласа: любви, ответа, завершения, мести за огонь?<\/li><li>Что она почувствует, когда узнает, что она — не фея, а слово?<\/li><li>Голос покровителя: это страна фей или само Желание, которое хочет вернуться к Посланцу?<\/li><\/ul><h2 id=\"s33-4\">Ума<\/h2><h3>Карточка<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Раса, класс<\/td><td>Фэйри; воин, мистический рыцарь; предыстория — солдат (специализация: офицер)<\/td><\/tr><tr><td>Звание<\/td><td>Выпускница военной академии, лейтенант<\/td><\/tr><tr><td>Характер<\/td><td>Вспыльчивая и своенравная, но уважаемая офицерами с кадетских лет. Целеустремлённая, быстро соображает в бою. Не любит, когда что-то идёт не по её приказу; давит и запугивает до последнего; не терпит неуважения. Любит быть в центре внимания (хорошего). Отступает, если понимает, что поединок не потянет: тактическое отступление никто не отменял<\/td><\/tr><tr><td>Черта<\/td><td>Прямолинейная и нелицеприятная<\/td><\/tr><tr><td>Идеал<\/td><td>«Мой город, нация и народ — самое важное» (даже несмотря на эгоизм и желание выделиться)<\/td><\/tr><tr><td>Привязанность<\/td><td>«Я по-прежнему готова отдать жизнь за тех, кому поклялась служить»<\/td><\/tr><tr><td>Слабость<\/td><td>«Однажды я совершила ужасную ошибку, которая стоила многого» — <strong>ребёнок не полетел<\/strong><\/td><\/tr><tr><td>Цель<\/td><td>Найти артефакт для страны фэйри. Известно лишь, что артефакт — картина<\/td><\/tr><tr><td>Летопись<\/td><td>«Спасёт от монстров, забирая их в себя»<\/td><\/tr><\/tbody><\/table><\/div><h3>Прошлое (от игрока)<\/h3><p>Страна фэйри — закрытое государство, которое никого не впускает и не выпускает. Над ней давно нависла угроза: бесчисленные нападения самых разных монстров. Войны при этом нет, и это бесит Уму: она училась, чтобы показать себя на поле боя, а не жить в ожидании «страшного». Когда командование решило отправить одного воина во внешний мир, Ума сразу выдвинула себя. Это её шанс прославиться так, чтобы её ставили в пример не только нынешним кадетам, но и их прапраправнукам.<\/p><h3>Канон кампании (предложение)<\/h3><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Чудовища, нападающие на страну фэйри, — Тихие эмоции Посланца<\/strong>, прежде всего Страх. Их гонит через Белую чащу <strong>Пастух<\/strong>, испуганный мальчик из чумного Гравенхольма. Часть «чудовищ» — <strong>охотники Бастиона<\/strong>, которые ходят за границу за крыльями фэйри.<\/p><p><strong>Картина действительно забирает чудовищ в себя.<\/strong> Это свойство Тоски: холст притягивает эмоции. Но каждое поглощённое чудовище появляется в нарисованном городе, среди горожан.<\/p><p><strong>Летопись — копия из Обители Переписчиков.<\/strong> В оригинале есть продолжение: «…пока жив тот, чья рука её держит. Умрёт рука — и холст отдаст всё, что взял». Если Сайлас умрёт, Картина выпустит всех чудовищ разом. Ума единственная в партии, кому <strong>жизненно нужен живой Сайлас<\/strong>.<\/p><p>Картина написана на <strong>фэйском шёлке<\/strong>. Поэтому страна фэйри «чувствует» её и знает о ней из летописи.<\/p><\/div><h3>Личная механика: Рапорты<\/h3><p>Ума поддерживает связь с командованием через <strong>ночных бабочек-гонцов<\/strong> (раз в долгую передышку в безопасном месте может отправить рапорт). Командование отвечает <strong>приказами<\/strong>. Выполненный приказ даёт снабжение, невыполненный — недоверие.<\/p><div class=\"tbl\"><table><thead><tr><th>Когда<\/th><th>Приказ командования<\/th><th>Если выполнить<\/th><th>Если нет<\/th><\/tr><\/thead><tbody><tr><td>Конец Акта I<\/td><td>«Подтвердите, что артефакт найден»<\/td><td>Посылка: 2 зелья лечения и фэйский плащ (преимущество на Скрытность в лесу)<\/td><td>—<\/td><\/tr><tr><td>Мглин<\/td><td>«Изъять артефакт и вернуться, не дожидаясь союзников»<\/td><td>Повышение до старшего лейтенанта (+1 к Запугиванию с солдатами)<\/td><td>Недоверие: 1 жетон<\/td><\/tr><tr><td>Белая чаща<\/td><td>Капитан Ирвель лично: «Найти источник и уничтожить»<\/td><td>Ирвель уважает Уму<\/td><td>Недоверие: 1 жетон<\/td><\/tr><tr><td>Конец Акта II<\/td><td>«Передать Картину патрулю Ирвеля»<\/td><td>Концовка «Холст для фэйри» становится доступна без боя<\/td><td>При 2+ жетонах Недоверия Ирвель приходит забрать Картину силой<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Приказы командования работают как приказ Осириса у Тесори: внешняя воля против решений партии. Не давайте Уме лёгкого выхода. Хороший приказ должен быть <strong>разумным<\/strong> с точки зрения её страны.<\/p><\/div><h3>Нить «Ребёнок, который не полетел»<\/h3><p>Через всю кампанию Ума встречает <strong>трёх детей<\/strong>, каждый из которых отражает её старую ошибку:<\/p><div class=\"tbl\"><table><thead><tr><th>Где<\/th><th>Ребёнок<\/th><th>Что нужно сделать<\/th><th>Итог<\/th><\/tr><\/thead><tbody><tr><td>Сад Статуй<\/td><td>Окаменевшая девочка-фэйри с медалью «за лучший полёт»<\/td><td>Освободить, отказавшись от собственного памятника<\/td><td>Ума понимает цену славы<\/td><\/tr><tr><td>Белая чаща<\/td><td>Пастух, источник угрозы<\/td><td>Пощадить или убить по приказу<\/td><td>Пощадить: Страх отпускает её. Убить: повтор ошибки<\/td><\/tr><tr><td>Зверинец<\/td><td>Фэйри-ребёнок с подрезанными крыльями<\/td><td>Научить снова летать (сцена на шестах над ямой)<\/td><td><strong>Искупление<\/strong><\/td><\/tr><\/tbody><\/table><\/div><p><strong>Искупление:<\/strong> если Ума спасла хотя бы двоих из трёх детей, её слабость закрыта. Она получает <strong>черту Вдохновляющий лидер<\/strong> (или аналог по договорённости), а в эпилоге её ставят в пример кадетам. Не за победу в бою, а за то, что ребёнок полетел.<\/p><h3>Этапы линии<\/h3><div class=\"tbl\"><table><thead><tr><th>Этап<\/th><th>Где<\/th><th>Что происходит<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td><strong>Крючок<\/strong><\/td><td>Мастерская (сейчас)<\/td><td>Рулон фэйского шёлка с печатью её страны в кладовой. Картина написана на таком же<\/td><td>Вдохновение; уверенность, что артефакт здесь<\/td><\/tr><tr><td>Крючок<\/td><td>Башня<\/td><td>Ума видит Картину. Она «зовёт» её так же, как Велиссу зовёт страна фей<\/td><td>—<\/td><\/tr><tr><td><strong>Раскрытие<\/strong><\/td><td>Обитель<\/td><td>Оригинал летописи: Сайлас должен жить<\/td><td>Смена цели: защищать художника<\/td><\/tr><tr><td>Раскрытие<\/td><td>Белая чаща<\/td><td>Пастух; Ирвель; правда о чудовищах<\/td><td>Слово «поэтому»<\/td><\/tr><tr><td>Раскрытие<\/td><td>Сад Статуй<\/td><td>Искушение вечной славой<\/td><td>Слово «Совершенное»<\/td><\/tr><tr><td><strong>Выбор<\/strong><\/td><td>Конец Акта II<\/td><td>Отдать Картину своей стране или оставить партии для ритуала<\/td><td>—<\/td><\/tr><tr><td><strong>Развязка<\/strong><\/td><td>Кратер<\/td><td>«Холст для фэйри», «Услышать Весть» (чудовища затихают без жертвы Картины) или иной путь<\/td><td>Эпилог в стране фэйри<\/td><\/tr><\/tbody><\/table><\/div><h3>Крючки на ближайшие сессии<\/h3><ul><li>В мастерской на эскизах Сайласа есть <strong>крылья<\/strong>: он рисовал фэйри, хотя никогда не был в их стране. Кто-то ему позировал.<\/li><li>Нарисованный стражник города отдаёт Уме честь. Узнал знаки различия? Сайлас нарисовал город с солдатами, похожими на фэйри.<\/li><li>Гонец-бабочка прилетает и не может найти Уму: внутри Картины её <strong>не видно<\/strong> снаружи. Первый рапорт уходит только после выхода из города.<\/li><\/ul><h3>Вопросы игроку<\/h3><ul><li>Что именно случилось с ребёнком, который не полетел? Ума была инструктором? Командиром? Сестрой?<\/li><li>Как называется её страна и как выглядит её знак различия?<\/li><li>Что Ума сделает, если командование прикажет то, что она считает неправильным?<\/li><li>Слава или страна: что она выберет, если придётся выбирать?<\/li><\/ul><h2 id=\"s33-5\">Личные линии в Актах III–V<\/h2><div class=\"tbl\"><table><thead><tr><th>Герой<\/th><th>Акт III: Изнанка Холста<\/th><th>Акт IV: Страна фэйри<\/th><th>Акт V: Кратер<\/th><\/tr><\/thead><tbody><tr><td><strong>Эстел<\/strong><\/td><td>Набросок «котёнок, который сопротивлялся» в Галерее Отвергнутых; роль «сына» в Гнезде Вейлов (Акт II) отзывается здесь<\/td><td>Привратница: «Чей ты?» — печать надо снять до заставы; сон о сестре в Шёлковых садах<\/td><td>Зал Гнева в Остове; Корвин или его тень; судьба Мастихина<\/td><\/tr><tr><td><strong>Велисса<\/strong><\/td><td>Велисса-Законченная и восстание Отвергнутых; сердце на весах Суда Осириса<\/td><td>Дом: Шёлковые сады, Матушка Кокон, выбор «перетканной» Велиссы; королева требует её как «фэйскую собственность»<\/td><td>Зал Желания; контракт феи вместо жертвы<\/td><\/tr><tr><td><strong>Ума<\/strong><\/td><td>Набросок Умы, «которая не ошиблась»<\/td><td>Её акт: допрос, фронт, девочка-знаменосец, Тис, трибунал, Ухо Посланца<\/td><td>Зал Гордыни; Картина — домой или в Кратер<\/td><\/tr><tr><td><strong>Тесори<\/strong><\/td><td>Суд Осириса: возвращение в партию или бой<\/td><td>Привратница: «Ты пришёл судить нас?»<\/td><td>Выходит через разрез или стоит рядом<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s33-6\">Тесори (NPC)<\/h2><p>Подробно — в разделе 5. Для личных линий важно:<\/p><ul><li>Приказ Осириса <strong>направлен против Велиссы<\/strong>: она нарисована. Тесори, выйдя из Картины, может поднять на неё хопеш.<\/li><li>Если <strong>Сайлас умрёт<\/strong> от руки Тесори, Картина выпустит чудовищ (линия Умы).<\/li><li>Если игрок Тесори вернётся, его линия продолжается с раздела 5 и Суда Осириса (раздел 26).<\/li><\/ul><h2 id=\"s33-7\">Напряжения внутри партии<\/h2><div class=\"tbl\"><table><thead><tr><th>Пара<\/th><th>Конфликт<\/th><th>Как обострить<\/th><th>Как развязать<\/th><\/tr><\/thead><tbody><tr><td>Ума ↔ ритуал<\/td><td>Ей нужна Картина дома, ритуалу — в Кратере<\/td><td>Приказ «Передать Картину» в конце Акта II<\/td><td>Концовка «Услышать Весть» решает проблему чудовищ без Картины<\/td><\/tr><tr><td>Эстел ↔ ритуал<\/td><td>Мастихин снимает его печать, но нужен ритуалу<\/td><td>Корвин предлагает кинжал в обмен на возвращение Эстела в рабство<\/td><td>Разрезать печать до ритуала и отдать кинжал<\/td><\/tr><tr><td>Тесори ↔ Велисса<\/td><td>Осирис требует уничтожить нарисованное<\/td><td>Тесори на холсте поднимает хопеш у её портрета<\/td><td>Велисса заканчивает себя сама: законченное и живое Осирис может судить, а значит, может и оправдать<\/td><\/tr><tr><td>Ума ↔ Велисса<\/td><td>Обе — фэйская природа; командование Умы может считать Велиссу «аномалией» и потребовать её доставить<\/td><td>Приказ: «Доставить нарисованную фею для изучения»<\/td><td>Обеим нужен живой Сайлас: общий интерес<\/td><\/tr><tr><td>Эстел ↔ Ума<\/td><td>Эстел ненавидит приказы и хозяев. Ума командует всеми<\/td><td>Ума отдаёт приказ в бою тоном Корвина<\/td><td>Ума просит, а не приказывает (Оттепель для обоих)<\/td><\/tr><tr><td>Эстел ↔ Велисса<\/td><td>Её «питомцы» и очарование напоминают ему печать<\/td><td>Велисса очаровывает Эстела в бою «для его же блага»<\/td><td>Велисса отпускает «питомца» по его просьбе<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s33-1", "Сводка"], ["s33-2", "Эстел"], ["s33-3", "Велисса"], ["s33-4", "Ума"], ["s33-5", "Личные линии в Актах III–V"], ["s33-6", "Тесори (NPC)"], ["s33-7", "Напряжения внутри партии"]], "text": "У каждого героя есть личная линия , вплетённая в главный сюжет. Линии устроены одинаково: Крючок → Раскрытие → Выбор → Развязка . Каждый этап привязан к конкретным локациям, поэтому личная история продвигается сама собой, пока партия идёт по кампании. Важно Главное правило: личная линия героя должна сталкиваться с главным ритуалом. Эстелу нужен кинжал, Уме — Картина, Велисса сама является частью вести Посланца. В финале каждому придётся выбирать между своим и общим. Сводка Герой Раса и класс Что ищет Чем связан с сюжетом Эмоции-отзвуки Ключевая локация Эстел Табакси, плут Родню, особенно сестру Бывший раб Корвина Блэкторна ; печать вырезана Мастихином Гнев, Оцепенение, Скрытность Карьер «Глотка» Велисса Фея, колдун (дикая кровь фей) Своего создателя Создание Сайласа ; живой носитель Желания Желание, Тоска Башня, Обитель Ума Фэйри, воин (мистический рыцарь) Артефакт для страны фэйри Её цель — Картина ; чудовища на родине — Тихие эмоции Гордыня, Страх, Гнев Белая чаща, Сад Статуй Тесори (NPC) — Исполнить приказ Осириса Внутри Картины; приказ угрожает Велиссе Страх Башня, Картина Эстел Карточка Параметр Значение Раса, класс Табакси, плут. Черты: Бдительный, Атлетичный Возраст, рост, вес 19–22 года; 180–190 см; 60–75 кг Внешность Насыщенно-янтарная шерсть, белая морда и грудь, белые «носочки» на лапах; бледно-бирюзовые глаза Привычка Мурлычащие словечки («мяу», «мур-мяу»), мурлычет во сне или когда гладят Идеал «Если и жить, то в своё удовольствие!» Привязанность «Я обязательно когда-нибудь найду своих сородичей» Слабость Хладнокровность, которая развивалась годами и пугает его самого: как быть дружелюбным и человечным? Навязчивая мысль Родня, особенно сестра Трофей Один серп из пары бывшего хозяина Прошлое (как написал игрок, коротко) Эстел вырос в маленьком клане. Когда ему было 7–12 лет, родилась сестра; малышку оставили знакомым и пошли учить сына охотиться. Ночью лагерь окружили работорговцы. Родителей и Эстела разлучили и продали; Эстела купил у гоблина-работорговца огромный мужчина с маниакальным взглядом и парой серпов. Он спросил, сопротивлялся ли котёнок, разочаровался («ничего, с этим можно поработать») и согласился на рабскую печать , которая питается жизненной силой хозяина. Спустя годы Эстел в поединке сбил хозяина с ног и ногой отправил его через развалившуюся стену — на 2–3 этажа вниз, в пепел. Печать перестала колоть. Эстел взял серп как трофей, долго искал клан, нашёл лишь чужие, стал наёмником гильдий и надел маску жизнерадостного экстраверта. Позже возле трактира он увидел у крупного незнакомца причудливый кинжал с меткой, похожей на его рабскую печать . Лица не разглядел, одну деталь забыл, человека потерял на первом же повороте. Канон кампании (предложение) Тайна · только для мастера Хозяин жив. Это Корвин Блэкторн , лорд-охотник Бастиона, Сосуд Гнева. Падая в пепел, он должен был умереть, но его подхватил Гнев Посланца. Теперь Корвин живёт Гневом, а не своей жизнью, поэтому печать «уснула»: ей нечем питаться. Кинжал у трактира — Мастихин Звёздного Железа , ритуальный кинжал из списка артефактов. Все печати Бастиона режутся им, отсюда одинаковая метка. Забытая деталь: на поясе незнакомца висел один серп , пара к трофею Эстела. Семья жива, но разбросана по полуострову (предложение, мастер может оставить кого-то пропавшим): сестра Искорка сидит в клетке Зверинца; отец по кличке Рыжий — постаревший боец Арены Ям в карьере; мать — одна из забытых невидимых слуг Зефера в Мглине. Клан уничтожили охотники Бастиона, когда пришли за остальными табакси. Название клана игрок выбирать не хочет, поэтому можно оставить его безымянным. Если понадобится: клан Тёплого Камня . Только как вариант. Личная механика: Печать Состояние печати Когда Эффект Тихая Обычно Без эффекта Зуд Рядом сильный Гнев (Бастион, Корвин в пределах 1 км) Эстел чувствует направление к Корвину, как компас Жжение Корвин в пределах 100 м Печать светится: помеха на Скрытность; 1 жетон Ярости в начале боя Зов Корвин использует «Зов печати» Спасбросок Телосложения СЛ 15 или ошеломлён до конца следующего хода Как снять печать навсегда Способ Цена Разрезать Мастихином (Эстел делает это сам) Шрам навсегда, 2d6 урона, 1 Отголосок Гнева; печать исчезает Дар Элиаса («вернуть к тому, каким был») Печать исчезает, но Эстел теряет одно воспоминание из рабских лет. Возможно, именно то, что сделало его сильным (мастер выбирает) Корвин примирён или побеждён без ярости Печать гаснет сама Эстел убивает Корвина в ярости (3 жетона Ярости в момент удара) Печать гаснет, но Гнев переходит в Эстела : он становится новым Сосудом Гнева. Тёмная ветка, только если игрок согласен Личная механика: Оттепель Слабость Эстела — его холод. Ведите шкалу Оттепели (0–5). +1 за сцену, где Эстел искренне проявляет чувство без маски весельчака: обнимает сестру, плачет на Ледяной мельнице, признаётся в страхе, защищает того, кто слабее. Оттепель Эффект 2 Раз за сессию: снять с союзника испуг, просто поговорив с ним 3 Иммунитет к правилу «Тепло» Ледяной мельницы: Эстел греет и себя, и других 5 «Живое сердце» : преимущество на спасброски против очарования, Оцепенения и Зова печати; маска весельчака больше не нужна, и NPC это замечают Если Эстел соглашается «смолоть» боль на Ледяной мельнице, Оттепель обнуляется навсегда. Этапы линии Этап Где Что происходит Награда Крючок Мастерская (сейчас) Эскиз «К. Б., заказ»: огромный мужчина с парой серпов. Эстел узнаёт серпы Вдохновение; первое имя: «К. Б.» Крючок Город, Дрейвен Нокс Метка Дрейвена похожа на печать Эстела. Дрейвен — бывший охотник Бастиона Дрейвен рассказывает о Корвине и Мастихине Раскрытие Мглин Фотография Селены возвращает забытую деталь: одинокий серп. Среди забытых слуг — мать Мать (если её вернуть) Раскрытие Обитель Запись Элиаса: «хозяин не мёртв, он перестал быть собой» Понимание, что Корвин жив Раскрытие Зверинец Сестра Искорка в клетке. Она его не помнит Сестра — NPC-спутница; Оттепель +1 Раскрытие Ледяная мельница Зеркало его холода Шанс на Оттепель или на её потерю Выбор Карьер «Глотка» Отец на Арене; Корвин; Мастихин. Снять печать, отомстить, освободить отца, забрать кинжал Серп Жнеца (пара), снятая печать Развязка Кратер Кинжал нужен ритуалу, а Эстел держал его в руках. Отдать или оставить себе? Зависит от выбора Крючки на ближайшие сессии На эскизе в мастерской серпы прорисованы тщательнее лица. Сайлас явно восхищался ими. Бармен Веспер Мор тоже носит под шарфом след ошейника и замечает, как Эстел трёт плечо. Ночью трофейный серп Эстела тихо звенит , когда кто-то рядом злится. В городе Эстелу попадается нарисованный котёнок-табакси, ребёнок одного из горожан. Сайлас нарисовал его «по памяти». Чьей памяти? Вопросы игроку Как звали сестру? (Если имени нет, то «Искорка» — имя, которое дала ей Шаэл.) Что Эстел сделает, когда сестра его не узнает? Чего он хочет от Корвина: смерти, ответа, извинения? Готов ли он отдать Мастихин ради ритуала, если кинжал — единственное, что снимает печать? Велисса Карточка Параметр Значение Раса, класс Фея; колдун, покровитель — дикая кровь фей; предыстория — торговец Возраст 30 лет (с момента «написания») Внешность Бледная кожа с перламутровым блеском; глубокие синие затягивающие глаза; лёгкие светлые волнистые волосы; полупрозрачные мерцающие крылья стрекозы с острыми краями, которые темнеют и складываются в плащ. Одежда — вторая кожа, переливается и выглядит для каждого чуть по-разному Взгляд Манит, как у сирены. Кто смотрит слишком долго, забывает, кто он и зачем пришёл Характер Спокойствие, издёвка, игра, очарование, манипуляция, искушение, неторопливость Идеалы Свобода, выгода, развлечение, искушение Привязанности Её «питомцы»; создатель-художник — самое дорогое в её жизни; страна фей, чей зов она иногда слышит Слабости Недооценивает смертных; теряет очарование в гневе или когда её отвергают; странное любопытство; не переносит долгое солнце и мороз Снаряжение Шёлковая верёвка, амулет художника, зеркало (показывает желания, а не облик), серебряный кинжал, шпилька-игла, флаконы сновидений, контракт феи на одно желание, осколки личности (запечатанные чужие «я») Происхождение (от игрока) Велисса появилась не как существо, а как эмоция и мысль художника, обретшая форму . Художник, безумный или просветлённый, писал её грубыми мазками и оставил смотреть на солнце. Увидев мерцающий свет из холста, он усомнился в ней и попытался сжечь, но не смог. Тогда он сам посмотрел на солнце и исчез. Она точно знает: он жив, а она — незаконченное творение . Канон кампании (предложение) Тайна · только для мастера Создатель Велиссы — Сайлас Вейл. Задолго до Картины он впервые попробовал краску из кратера, наследство матери, и написал на фэйском шёлке (его привозили торговцы из страны фэйри) образ, который назвал «Желание». Тихая эмоция Посланца Желание вошла в холст и обрела тело. Отсюда фейская природа Велиссы и зов страны фей: она соткана из фэйского шёлка. Почему у Сайласа синий глаз: он посмотрел на солнце, чтобы больше не видеть её, и выжег левый глаз. Потом нарисовал себе новый, синий. «Исчез» он в свою Картину, в нарисованный город. Почему солнце и мороз: Велисса — непролакированная живопись . Её краска не закреплена: солнце её выцветает, мороз её трескает. Законченный и покрытый лаком портрет снял бы обе слабости. Осколки личности — это другие наброски Велиссы, которые Сайлас пробовал сделать «правильными». Перечёркнутый портрет «уродство» в Галерее — один из них. Если осколок раскрыть, появляется другая Велисса: законченная, послушная, идеальная. Соперница. Почему существо из Картины назвало её уродством: среди гладких, «законченных» нарисованных она выглядит грубым эскизом. Для Картины она ошибка. Для Посланца — одно из десяти слов его вести, слово « живы ». Важно Велисса — цель сразу трёх сил : культ (ему нужно Желание для ритуала), Осирис через Тесори (всё нарисованное должно быть уничтожено) и Сайлас (хочет закончить работу). Это делает её линию самой опасной в партии. Личная механика: Незаконченность Велисса считается нарисованным существом : у неё постоянно 2 Мазка , которые нельзя снять. Попытка Элиаса снять их даром вернёт её «к тому, чем она была», то есть в эмоцию, и она исчезнет. Элиас об этом догадается и откажется. Башня пропускает её уже при 1 дополнительном Мазке . Растворитель наносит ей урон как нарисованному существу (2d6). Отвергнутая. Если Сайлас или нарисованное существо отвергает её (вслух называет ошибкой, уродством, отворачивается), она получает помеху на проверки Харизмы, а СЛ её заклинаний снижается на 2 до конца следующей короткой передышки. Это её флейвор-слабость, оформленная в правило. Солнце: за каждый час под прямым солнцем — спасбросок Телосложения СЛ 12 или 1 уровень истощения («выцветание»). Мороз: в холоде (Ледяная мельница) — помеха на спасброски Телосложения. Этапы линии Этап Где Что происходит Награда Крючок Мастерская (сейчас) Обгоревший холст на чердаке с её силуэтом. «Не смотри на неё. Не смотри на солнце.» Амулет теплеет Вдохновение; амулет начинает указывать на Сайласа Крючок Галерея Портретов Два её портрета; второй перечёркнут: «уродство». Осколок личности в её сумке откликается на него Выбор: уничтожить перечёркнутый портрет или забрать Раскрытие Башня, вершина Встреча с Сайласом. Он узнаёт её и пугается, потом очаровывается. Предлагает её закончить Решение откладывается или принимается Раскрытие Обитель Страница дневника о том, как он писал Желан
