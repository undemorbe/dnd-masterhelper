вищ в себя. Это свойство Тоски: холст притягивает эмоции. Но каждое поглощённое чудовище появляется в нарисованном городе, среди горожан. Летопись — копия из Обители Переписчиков. В оригинале есть продолжение: «…пока жив тот, чья рука её держит. Умрёт рука — и холст отдаст всё, что взял». Если Сайлас умрёт, Картина выпустит всех чудовищ разом. Ума единственная в партии, кому жизненно нужен живой Сайлас . Картина написана на фэйском шёлке . Поэтому страна фэйри «чувствует» её и знает о ней из летописи. Личная механика: Рапорты Ума поддерживает связь с командованием через ночных бабочек-гонцов (раз в долгую передышку в безопасном месте может отправить рапорт). Командование отвечает приказами . Выполненный приказ даёт снабжение, невыполненный — недоверие. Когда Приказ командования Если выполнить Если нет Конец Акта I «Подтвердите, что артефакт найден» Посылка: 2 зелья лечения и фэйский плащ (преимущество на Скрытность в лесу) — Мглин «Изъять артефакт и вернуться, не дожидаясь союзников» Повышение до старшего лейтенанта (+1 к Запугиванию с солдатами) Недоверие: 1 жетон Белая чаща Капитан Ирвель лично: «Найти источник и уничтожить» Ирвель уважает Уму Недоверие: 1 жетон Конец Акта II «Передать Картину патрулю Ирвеля» Концовка «Холст для фэйри» становится доступна без боя При 2+ жетонах Недоверия Ирвель приходит забрать Картину силой Совет мастеру Приказы командования работают как приказ Осириса у Тесори: внешняя воля против решений партии. Не давайте Уме лёгкого выхода. Хороший приказ должен быть разумным с точки зрения её страны. Нить «Ребёнок, который не полетел» Через всю кампанию Ума встречает трёх детей , каждый из которых отражает её старую ошибку: Где Ребёнок Что нужно сделать Итог Сад Статуй Окаменевшая девочка-фэйри с медалью «за лучший полёт» Освободить, отказавшись от собственного памятника Ума понимает цену славы Белая чаща Пастух, источник угрозы Пощадить или убить по приказу Пощадить: Страх отпускает её. Убить: повтор ошибки Зверинец Фэйри-ребёнок с подрезанными крыльями Научить снова летать (сцена на шестах над ямой) Искупление Искупление: если Ума спасла хотя бы двоих из трёх детей, её слабость закрыта. Она получает черту Вдохновляющий лидер (или аналог по договорённости), а в эпилоге её ставят в пример кадетам. Не за победу в бою, а за то, что ребёнок полетел. Этапы линии Этап Где Что происходит Награда Крючок Мастерская (сейчас) Рулон фэйского шёлка с печатью её страны в кладовой. Картина написана на таком же Вдохновение; уверенность, что артефакт здесь Крючок Башня Ума видит Картину. Она «зовёт» её так же, как Велиссу зовёт страна фей — Раскрытие Обитель Оригинал летописи: Сайлас должен жить Смена цели: защищать художника Раскрытие Белая чаща Пастух; Ирвель; правда о чудовищах Слово «поэтому» Раскрытие Сад Статуй Искушение вечной славой Слово «Совершенное» Выбор Конец Акта II Отдать Картину своей стране или оставить партии для ритуала — Развязка Кратер «Холст для фэйри», «Услышать Весть» (чудовища затихают без жертвы Картины) или иной путь Эпилог в стране фэйри Крючки на ближайшие сессии В мастерской на эскизах Сайласа есть крылья : он рисовал фэйри, хотя никогда не был в их стране. Кто-то ему позировал. Нарисованный стражник города отдаёт Уме честь. Узнал знаки различия? Сайлас нарисовал город с солдатами, похожими на фэйри. Гонец-бабочка прилетает и не может найти Уму: внутри Картины её не видно снаружи. Первый рапорт уходит только после выхода из города. Вопросы игроку Что именно случилось с ребёнком, который не полетел? Ума была инструктором? Командиром? Сестрой? Как называется её страна и как выглядит её знак различия? Что Ума сделает, если командование прикажет то, что она считает неправильным? Слава или страна: что она выберет, если придётся выбирать? Личные линии в Актах III–V Герой Акт III: Изнанка Холста Акт IV: Страна фэйри Акт V: Кратер Эстел Набросок «котёнок, который сопротивлялся» в Галерее Отвергнутых; роль «сына» в Гнезде Вейлов (Акт II) отзывается здесь Привратница: «Чей ты?» — печать надо снять до заставы; сон о сестре в Шёлковых садах Зал Гнева в Остове; Корвин или его тень; судьба Мастихина Велисса Велисса-Законченная и восстание Отвергнутых; сердце на весах Суда Осириса Дом: Шёлковые сады, Матушка Кокон, выбор «перетканной» Велиссы; королева требует её как «фэйскую собственность» Зал Желания; контракт феи вместо жертвы Ума Набросок Умы, «которая не ошиблась» Её акт: допрос, фронт, девочка-знаменосец, Тис, трибунал, Ухо Посланца Зал Гордыни; Картина — домой или в Кратер Тесори Суд Осириса: возвращение в партию или бой Привратница: «Ты пришёл судить нас?» Выходит через разрез или стоит рядом Тесори (NPC) Подробно — в разделе 5. Для личных линий важно: Приказ Осириса направлен против Велиссы : она нарисована. Тесори, выйдя из Картины, может поднять на неё хопеш. Если Сайлас умрёт от руки Тесори, Картина выпустит чудовищ (линия Умы). Если игрок Тесори вернётся, его линия продолжается с раздела 5 и Суда Осириса (раздел 26). Напряжения внутри партии Пара Конфликт Как обострить Как развязать Ума ↔ ритуал Ей нужна Картина дома, ритуалу — в Кратере Приказ «Передать Картину» в конце Акта II Концовка «Услышать Весть» решает проблему чудовищ без Картины Эстел ↔ ритуал Мастихин снимает его печать, но нужен ритуалу Корвин предлагает кинжал в обмен на возвращение Эстела в рабство Разрезать печать до ритуала и отдать кинжал Тесори ↔ Велисса Осирис требует уничтожить нарисованное Тесори на холсте поднимает хопеш у её портрета Велисса заканчивает себя сама: законченное и живое Осирис может судить, а значит, может и оправдать Ума ↔ Велисса Обе — фэйская природа; командование Умы может считать Велиссу «аномалией» и потребовать её доставить Приказ: «Доставить нарисованную фею для изучения» Обеим нужен живой Сайлас: общий интерес Эстел ↔ Ума Эстел ненавидит приказы и хозяев. Ума командует всеми Ума отдаёт приказ в бою тоном Корвина Ума просит, а не приказывает (Оттепель для обоих) Эстел ↔ Велисса Её «питомцы» и очарование напоминают ему печать Велисса очаровывает Эстела в бою «для его же блага» Велисса отпускает «питомца» по его просьбе"}, {"id": "s34", "n": 34, "title": "МЕХАНИКИ: БОЙ", "disp": "Механики: бой", "group": "Механики", "html": "<p>Механики ниже надстраиваются над D&amp;D 5e. Их цель — сделать бой <strong>читаемым, опасным и тактическим<\/strong> в духе Bloodborne и Fear &amp; Hunger: враги показывают опасность заранее, ошибки оставляют следы, а смелая игра вознаграждается.<\/p><h2 id=\"s34-1\">34.1. Травма<\/h2><p>Если мастер объявляет, что в результате атаки персонаж получил <strong>травму<\/strong>, это постоянное состояние. Обычными зельями, короткой передышкой и подручными средствами травму снять нельзя.<\/p><ul><li>Травма возникает: от подготовленной атаки, от критического попадания врага (по решению мастера), при падении до 0 хитов (автоматически — <strong>малая травма<\/strong>), от некоторых ловушек.<\/li><li>Снять травму может только врач, лекарь, хилер или существо с подходящей способностью.<\/li><li>Одновременно может быть несколько травм. <strong>Три травмы<\/strong> любой степени = персонаж получает 1 уровень истощения, пока не вылечит хотя бы одну.<\/li><li>Лечение травмы — отдельно от восстановления хитов.<\/li><\/ul><h3>Степени травмы<\/h3><div class=\"tbl\"><table><thead><tr><th>Степень<\/th><th>Принцип<\/th><th>Как лечится<\/th><\/tr><\/thead><tbody><tr><td><strong>Малая<\/strong><\/td><td>Нарушает одну конкретную область действий<\/td><td>Медицина СЛ 13 + набор целителя (1 ч) или долгая передышка в безопасном месте у лекаря<\/td><\/tr><tr><td><strong>Средняя<\/strong><\/td><td>Заметно ограничивает персонажа<\/td><td>Лекарь (Талисса, нарисованный Элиас) + 1 день отдыха<\/td><\/tr><tr><td><strong>Сильная<\/strong><\/td><td>Меняет тактику, требует срочного лечения<\/td><td>Только Элиас Вейл, высшая магия или сюжетное событие<\/td><\/tr><\/tbody><\/table><\/div><h3>Таблица травм (бросок 1d8 или выбор мастера)<\/h3><div class=\"tbl\"><table><thead><tr><th>d8<\/th><th>Область<\/th><th>Малая<\/th><th>Средняя<\/th><th>Сильная<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Голова<\/td><td>Помеха на Внимательность<\/td><td>Помеха на спасброски Мудрости<\/td><td>Каждый ход 1 из 6: персонаж теряет действие (дезориентация)<\/td><\/tr><tr><td>2<\/td><td>Глаз<\/td><td>Помеха на дальние атаки дальше 9 м<\/td><td>Помеха на все дальние атаки<\/td><td>Не видит с одной стороны: враги сбоку получают преимущество<\/td><\/tr><tr><td>3<\/td><td>Ведущая рука<\/td><td>−1 к атакам этой рукой<\/td><td>Не может использовать двуручное оружие<\/td><td>Не может атаковать ведущей рукой<\/td><\/tr><tr><td>4<\/td><td>Вторая рука<\/td><td>Нельзя держать щит/фонарь в бою<\/td><td>Помеха на Ловкость рук и Атлетику<\/td><td>Рука не действует<\/td><\/tr><tr><td>5<\/td><td>Нога<\/td><td>Скорость −1,5 м<\/td><td>Скорость −3 м, нельзя бежать (Рывок)<\/td><td>Скорость вдвое меньше, падение при провале спасброска Ловкости СЛ 10 после движения<\/td><\/tr><tr><td>6<\/td><td>Рёбра / торс<\/td><td>Помеха на проверки Телосложения<\/td><td>Максимум хитов −5<\/td><td>Каждый Рывок или прыжок — 1d6 урона<\/td><\/tr><tr><td>7<\/td><td>Кровотечение<\/td><td>−1 хит в начале каждого боя<\/td><td>1d4 урона в начале хода, пока не перевязан<\/td><td>Без перевязки — каждые 10 минут 1 уровень истощения<\/td><\/tr><tr><td>8<\/td><td>Разум (ужас)<\/td><td>Помеха против испуга<\/td><td>Не может приближаться к источнику ужаса добровольно<\/td><td>Видит нарисованное там, где его нет (мастер вводит ложные детали)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Травма — <strong>сюжетное последствие<\/strong>, а не просто штраф. Её задача — заставить игроков искать врача, менять план, идти к Элиасу. Не давайте больше одной травмы за бой без серьёзной причины.<\/p><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Обезболивающая настойка подавляет эффекты <strong>малой<\/strong> травмы на 1 час и <strong>средней<\/strong> — на 10 минут. Это позволяет пережить бой, но не лечит.<\/p><\/div><h2 id=\"s34-2\">34.2. Подготовительный ход<\/h2><p>Некоторые враги и боссы перед сильной атакой делают подготовительный ход. Мастер <strong>явно описывает<\/strong> подготовку: существо принимает позу, натягивает оружие, концентрируется, начинает ритуал, заводит механизм.<\/p><ul><li><strong>Обычная атака с подготовкой:<\/strong> при попадании наносит <strong>двойной бросок урона<\/strong>.<\/li><li><strong>Особая атака с подготовкой:<\/strong> после завершения подготовки выполняет указанное особое действие.<\/li><li>Игроки имеют право попытаться <strong>прервать<\/strong> подготовку между ходом подготовки и ходом удара.<\/li><li>У каждого врага есть свой <strong>порог прерывания<\/strong>. Стандартный способ — оглушение.<\/li><li>Если подготовка прервана: враг <strong>полностью пропускает следующий ход<\/strong> и не может использовать реакции до своего следующего хода.<\/li><li>Если прервать не удалось — атака происходит, как описано.<\/li><\/ul><h3>Новое: Окно добивания<\/h3><p>Когда подготовка прервана, враг <strong>открыт<\/strong>. Один союзник в пределах 1,5 м может <strong>реакцией<\/strong> совершить <strong>Удар в открытую рану<\/strong>: атака с преимуществом, при попадании — дополнительная кость урона оружия. Если у оружия есть свойство «Хирургическое» — цель получает травму (у врагов травма = помеха на атаки или −3 м скорости до конца боя).<\/p><h3>Новое: Огнестрел как парирование<\/h3><p>Выстрел из огнестрельного оружия по врагу <strong>во время его подготовки<\/strong>: если попадание — враг проходит спасбросок Телосложения (СЛ 8 + бонус мастерства стрелка + модификатор Ловкости). Провал = подготовка прервана. Это работает на обычных и элитных врагов; у боссов — только если в их пороге указан «выстрел».<\/p><h3>Примеры порогов прерывания<\/h3><div class=\"tbl\"><table><thead><tr><th>Существо<\/th><th>Условие прерывания<\/th><\/tr><\/thead><tbody><tr><td>Комар, мелкая тварь<\/td><td>Любое успешное попадание<\/td><\/tr><tr><td>Крыса, рой<\/td><td>Попадание, толчок или огонь<\/td><\/tr><tr><td>Обычный человек<\/td><td>Оглушение, 8+ урона за один удар, выстрел<\/td><\/tr><tr><td>Элитный враг<\/td><td>Оглушение, определённый тип урона или разрушение предмета подготовки<\/td><\/tr><tr><td>Босс<\/td><td>Особое условие, объявленное заранее (см. описание боссов)<\/td><\/tr><tr><td>Фредерик из холодильника<\/td><td>Молитва, синий берет, настоящее имя, огонь<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s34-3\">34.3. Правило честной подготовки<\/h2><p>Подготовительные атаки должны быть <strong>заранее читаемыми<\/strong>. Игроки должны понимать, что происходит что-то опасное, иначе механика превращается в скрытый критический удар.<\/p><div class=\"tbl\"><table><thead><tr><th>Сигнал<\/th><th>Пример описания<\/th><\/tr><\/thead><tbody><tr><td>Визуальный<\/td><td>«Он поднимает топор над головой, лезвие начинает светиться»<\/td><\/tr><tr><td>Звуковой<\/td><td>«Писк крыс сливается в один низкий гул»<\/td><\/tr><tr><td>Пространственный<\/td><td>«Стены шатра начинают сжиматься к центру»<\/td><\/tr><tr><td>Ритуальный<\/td><td>«Она шепчет, и в воздухе проступают буквы»<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Хорошая практика — кладите на стол <strong>жетон подготовки<\/strong> перед миниатюрой врага. Игроки видят угрозу и сами решают, рисковать ли.<\/p><\/div><h2 id=\"s34-4\">34.4. Возврат крови (новое, в духе Bloodborne)<\/h2><p>Когда персонаж получает урон от атаки ближнего боя, до конца его <strong>следующего хода<\/strong> каждое его успешное попадание оружием ближнего боя по любому врагу восстанавливает ему <strong>1d4 хита<\/strong> (не больше, чем было потеряно от этой атаки). Это поощряет агрессию после ранения, а не отступление.<\/p><ul><li>Не работает, если персонаж отступил дальше 3 м от врага, нанёсшего урон.<\/li><li>Не восстанавливает хиты, потерянные от травм и кровотечения.<\/li><\/ul><h2 id=\"s34-5\">34.5. Слабое место<\/h2><p>Перед некоторыми атаками мастер может дать игрокам возможность заметить слабое место. Если персонаж тратит <strong>действие<\/strong> на анализ или проходит подходящую проверку (Внимательность, Природа, Медицина, Магия — СЛ 12–16), он получает конкретную подсказку.<\/p><ul><li>Попадание в слабое место: +1d4 к урону, <strong>или<\/strong> отмена реакции врага, <strong>или<\/strong> облегчение прерывания подготовки (порог снижается на ступень).<\/li><li>Слабое место не должно превращать босса в мешок хитов: его ценность — в тактическом выборе.<\/li><\/ul><h2 id=\"s34-6\">34.6. Надлом<\/h2><p>Некоторые сильные враги имеют скрытую шкалу <strong>Надлома<\/strong> (обычно 3 жетона). Жетон Надлома даётся за: успешное прерывание подготовки, попадание по слабому месту, подходящий тип урона, сюжетное действие (см. боссов).<\/p><ul><li>При Надломе враг <strong>теряет реакцию<\/strong> до начала своего следующего хода и получает <strong>помеху<\/strong> на следующую атаку.<\/li><li>Первый Надлом за бой может открыть слабое место, сменить фазу или изменить поведение босса.<\/li><\/ul><h2 id=\"s34-7\">34.7. Последствие<\/h2><p>Особенно жестокие атаки могут иметь Последствие, даже если не нанесли много урона: сбит с ног, отброшен, теряет предмет, получает временное ограничение, меняет позицию.<\/p><ul><li>Последствие должно быть <strong>понятно из описания<\/strong> атаки.<\/li><li>Не используйте Последствие для случайного лишения игрока хода без возможности реакции.<\/li><\/ul>", "toc": [["s34-1", "34.1. Травма"], ["s34-2", "34.2. Подготовительный ход"], ["s34-3", "34.3. Правило честной подготовки"], ["s34-4", "34.4. Возврат крови (новое, в духе Bloodborne)"], ["s34-5", "34.5. Слабое место"], ["s34-6", "34.6. Надлом"], ["s34-7", "34.7. Последствие"]], "text": "Механики ниже надстраиваются над D&D 5e. Их цель — сделать бой читаемым, опасным и тактическим в духе Bloodborne и Fear & Hunger: враги показывают опасность заранее, ошибки оставляют следы, а смелая игра вознаграждается. 34.1. Травма Если мастер объявляет, что в результате атаки персонаж получил травму , это постоянное состояние. Обычными зельями, короткой передышкой и подручными средствами травму снять нельзя. Травма возникает: от подготовленной атаки, от критического попадания врага (по решению мастера), при падении до 0 хитов (автоматически — малая травма ), от некоторых ловушек. Снять травму может только врач, лекарь, хилер или существо с подходящей способностью. Одновременно может быть несколько травм. Три травмы любой степени = персонаж получает 1 уровень истощения, пока не вылечит хотя бы одну. Лечение травмы — отдельно от восстановления хитов. Степени травмы Степень Принцип Как лечится Малая Нарушает одну конкретную область действий Медицина СЛ 13 + набор целителя (1 ч) или долгая передышка в безопасном месте у лекаря Средняя Заметно ограничивает персонажа Лекарь (Талисса, нарисованный Элиас) + 1 день отдыха Сильная Меняет тактику, требует срочного лечения Только Элиас Вейл, высшая магия или сюжетное событие Таблица травм (бросок 1d8 или выбор мастера) d8 Область Малая Средняя Сильная 1 Голова Помеха на Внимательность Помеха на спасброски Мудрости Каждый ход 1 из 6: персонаж теряет действие (дезориентация) 2 Глаз Помеха на дальние атаки дальше 9 м Помеха на все дальние атаки Не видит с одной стороны: враги сбоку получают преимущество 3 Ведущая рука −1 к атакам этой рукой Не может использовать двуручное оружие Не может атаковать ведущей рукой 4 Вторая рука Нельзя держать щит/фонарь в бою Помеха на Ловкость рук и Атлетику Рука не действует 5 Нога Скорость −1,5 м Скорость −3 м, нельзя бежать (Рывок) Скорость вдвое меньше, падение при провале спасброска Ловкости СЛ 10 после движения 6 Рёбра / торс Помеха на проверки Телосложения Максимум хитов −5 Каждый Рывок или прыжок — 1d6 урона 7 Кровотечение −1 хит в начале каждого боя 1d4 урона в начале хода, пока не перевязан Без перевязки — каждые 10 минут 1 уровень истощения 8 Разум (ужас) Помеха против испуга Не может приближаться к источнику ужаса добровольно Видит нарисованное там, где его нет (мастер вводит ложные детали) Важно Травма — сюжетное последствие , а не просто штраф. Её задача — заставить игроков искать врача, менять план, идти к Элиасу. Не давайте больше одной травмы за бой без серьёзной причины. Совет мастеру Обезболивающая настойка подавляет эффекты малой травмы на 1 час и средней — на 10 минут. Это позволяет пережить бой, но не лечит. 34.2. Подготовительный ход Некоторые враги и боссы перед сильной атакой делают подготовительный ход. Мастер явно описывает подготовку: существо принимает позу, натягивает оружие, концентрируется, начинает ритуал, заводит механизм. Обычная атака с подготовкой: при попадании наносит двойной бросок урона . Особая атака с подготовкой: после завершения подготовки выполняет указанное особое действие. Игроки имеют право попытаться прервать подготовку между ходом подготовки и ходом удара. У каждого врага есть свой порог прерывания . Стандартный способ — оглушение. Если подготовка прервана: враг полностью пропускает следующий ход и не может использовать реакции до своего следующего хода. Если прервать не удалось — атака происходит, как описано. Новое: Окно добивания Когда подготовка прервана, враг открыт . Один союзник в пределах 1,5 м может реакцией совершить Удар в открытую рану : атака с преимуществом, при попадании — дополнительная кость урона оружия. Если у оружия есть свойство «Хирургическое» — цель получает травму (у врагов травма = помеха на атаки или −3 м скорости до конца боя). Новое: Огнестрел как парирование Выстрел из огнестрельного оружия по врагу во время его подготовки : если попадание — враг проходит спасбросок Телосложения (СЛ 8 + бонус мастерства стрелка + модификатор Ловкости). Провал = подготовка прервана. Это работает на обычных и элитных врагов; у боссов — только если в их пороге указан «выстрел». Примеры порогов прерывания Существо Условие прерывания Комар, мелкая тварь Любое успешное попадание Крыса, рой Попадание, толчок или огонь Обычный человек Оглушение, 8+ урона за один удар, выстрел Элитный враг Оглушение, определённый тип урона или разрушение предмета подготовки Босс Особое условие, объявленное заранее (см. описание боссов) Фредерик из холодильника Молитва, синий берет, настоящее имя, огонь 34.3. Правило честной подготовки Подготовительные атаки должны быть заранее читаемыми . Игроки должны понимать, что происходит что-то опасное, иначе механика превращается в скрытый критический удар. Сигнал Пример описания Визуальный «Он поднимает топор над головой, лезвие начинает светиться» Звуковой «Писк крыс сливается в один низкий гул» Пространственный «Стены шатра начинают сжиматься к центру» Ритуальный «Она шепчет, и в воздухе проступают буквы» Совет мастеру Хорошая практика — кладите на стол жетон подготовки перед миниатюрой врага. Игроки видят угрозу и сами решают, рисковать ли. 34.4. Возврат крови (новое, в духе Bloodborne) Когда персонаж получает урон от атаки ближнего боя, до конца его следующего хода каждое его успешное попадание оружием ближнего боя по любому врагу восстанавливает ему 1d4 хита (не больше, чем было потеряно от этой атаки). Это поощряет агрессию после ранения, а не отступление. Не работает, если персонаж отступил дальше 3 м от врага, нанёсшего урон. Не восстанавливает хиты, потерянные от травм и кровотечения. 34.5. Слабое место Перед некоторыми атаками мастер может дать игрокам возможность заметить слабое место. Если персонаж тратит действие на анализ или проходит подходящую проверку (Внимательность, Природа, Медицина, Магия — СЛ 12–16), он получает конкретную подсказку. Попадание в слабое место: +1d4 к урону, или отмена реакции врага, или облегчение прерывания подготовки (порог снижается на ступень). Слабое место не должно превращать босса в мешок хитов: его ценность — в тактическом выборе. 34.6. Надлом Некоторые сильные враги имеют скрытую шкалу Надлома (обычно 3 жетона). Жетон Надлома даётся за: успешное прерывание подготовки, попадание по слабому месту, подходящий тип урона, сюжетное действие (см. боссов). При Надломе враг теряет реакцию до начала своего следующего хода и получает помеху на следующую атаку. Первый Надлом за бой может открыть слабое место, сменить фазу или изменить поведение босса. 34.7. Последствие Особенно жестокие атаки могут иметь Последствие, даже если не нанесли много урона: сбит с ног, отброшен, теряет предмет, получает временное ограничение, меняет позицию. Последствие должно быть понятно из описания атаки. Не используйте Последствие для случайного лишения игрока хода без возможности реакции."}, {"id": "s35", "n": 35, "title": "МЕХАНИКИ: МИР И РАССУДОК", "disp": "Механики: мир и рассудок", "group": "Механики", "html": "<h2 id=\"s35-1\">35.1. Мазки (заражение краской)<\/h2><p>Мазки показывают, насколько персонаж стал <strong>частью Картины<\/strong>. Шкала от 0 до 6. Отмечайте на листе персонажа.<\/p><p><strong>Как получить Мазок:<\/strong> использование флакона краски; критическое попадание нарисованного существа; ловушки с краской (холст, купель, свежая краска); законченный портрет (+2); ночь Перекраски в городе (при провале спасброска); сделка с Сайласом (+3).<\/p><div class=\"tbl\"><table><thead><tr><th>Мазки<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Косметика: на коже пятно краски, которое не смывается<\/td><\/tr><tr><td>2<\/td><td>Нарисованные существа менее враждебны: преимущество на Убеждение с ними<\/td><\/tr><tr><td>3<\/td><td><strong>Башня пропускает.<\/strong> Персонаж может проходить сквозь нарисованные двери. Отражение запаздывает на полсекунды<\/td><\/tr><tr><td>4<\/td><td>Сопротивление психическому урону. Уязвимость к растворителю (растворитель наносит ему 2d6)<\/td><\/tr><tr><td>5<\/td><td>Персонаж может «войти» в любую картину и выйти из другой в пределах 1 км (1 раз в день). Элиас не может лечить его обычной медициной<\/td><\/tr><tr><td>6<\/td><td><strong>Персонаж нарисован.<\/strong> Он больше не стареет, не умирает обычной смертью (возвращается копией после Перекраски) — и становится целью Осириса. Персонаж переходит к мастеру или требует сюжетного спасения<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Мазки снимает только <strong>Элиас<\/strong> (дар; все Мазки разом, с побочным эффектом) или ритуал в финале. Мазки — это <strong>ресурс и угроза одновременно<\/strong>: игроки могут сознательно набирать их, чтобы попасть в Башню или ходить сквозь картины.<\/p><\/div><h2 id=\"s35-2\">35.2. Отголоски (эмоции Посланца)<\/h2><p>В каждой локации Акта II и в Тихих очагах действует своя эмоция. Персонаж копит <strong>Отголоски<\/strong> каждой из десяти эмоций отдельно (0–3).<\/p><div class=\"tbl\"><table><thead><tr><th>Отголоски<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Флейвор: персонаж замечает в себе чужое чувство. Мастер может раз за сессию предложить «поддаться» (см. ниже)<\/td><\/tr><tr><td>2<\/td><td><strong>Тяга:<\/strong> раз за сессию мастер описывает навязчивое желание; сопротивление — спасбросок Мудрости СЛ 13<\/td><\/tr><tr><td>3<\/td><td><strong>Одержимость:<\/strong> у персонажа появляется постоянная черта эмоции (см. таблицу). Снимается только квестом очищения или победой над Сосудом<\/td><\/tr><\/tbody><\/table><\/div><div class=\"tbl\"><table><thead><tr><th>Эмоция<\/th><th>Одержимость (3 Отголоска)<\/th><th>Дар при «поддаться»<\/th><\/tr><\/thead><tbody><tr><td>Скрытность<\/td><td>Персонажа не замечают NPC, пока он не заговорит (и он сам иногда забывает своё имя)<\/td><td>Преимущество на Скрытность на 1 сцену<\/td><\/tr><tr><td>Зависть<\/td><td>Персонаж невольно копирует жесты союзника; не может отказаться от чужой вещи<\/td><td>Один раз скопировать бонус атаки или навык союзника<\/td><\/tr><tr><td>Обжорство<\/td><td>Двойной паёк; ест не еду в стрессе<\/td><td>Восстановить 2d6 хитов, съев что-то странное<\/td><\/tr><tr><td>Гнев<\/td><td>Каждый бой начинает с 1 жетоном Ярости<\/td><td>+1d6 к урону одной атаки<\/td><\/tr><tr><td>Тоска<\/td><td>Не может оставить вещь «как есть»: чинит, переделывает, дорисовывает — даже в бою (помеха на инициативу)<\/td><td>Один раз изменить мелкую деталь сцены (как 1 заряд краски, без Мазка)<\/td><\/tr><tr><td>Страх<\/td><td>Помеха на спасброски от испуга; не может спать без света<\/td><td>Рывок бонусным действием на 1 ход<\/td><\/tr><tr><td>Гордыня<\/td><td>Не может отступить, если на него смотрят; не принимает помощь (Помощь на него не действует)<\/td><td>Преимущество на одну проверку Харизмы<\/td><\/tr><tr><td>Оцепенение<\/td><td>Не получает вдохновение; не чувствует боли — мастер скрывает от игрока точные хиты его персонажа<\/td><td>Сопротивление урону холодом и психическим уроном на 1 бой<\/td><\/tr><tr><td>Желание<\/td><td>Не может отказаться от того, чего хочет (спасбросок Мудрости СЛ 13 при виде желаемого)<\/td><td>Преимущество на Убеждение или Обман на 1 сцену<\/td><\/tr><tr><td>Нежность<\/td><td>Отдаёт свои хиты и предметы слабым, даже в ущерб себе<\/td><td>Восстановить союзнику 1d8 хитов касанием (1 раз)<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Поддаться:<\/strong> игрок может добровольно взять 1 Отголосок, чтобы получить дар эмоции. Это и есть Fear &amp; Hunger: сила за цену, и игрок решает сам.<\/p><p>Победа над Сосудом эмоции снимает <strong>все<\/strong> Отголоски этой эмоции у партии. Мирное разрешение — снимает и даёт каждому персонажу <strong>вдохновение<\/strong>.<\/p><h2 id=\"s35-3\">35.3. Страх нарисованных (шкала города)<\/h2><p>Шкала 0–5 (см. раздел «Герои и злодеи»). Растёт от уничтожения нарисованных, кражи портретов, растворителя, громких боёв в городе. Падает (−1) за спасение нарисованного NPC, за выполненный квест горожан.<\/p><div class=\"tbl\"><table><thead><tr><th>Значение<\/th><th>Реакция города<\/th><\/tr><\/thead><tbody><tr><td>0–1<\/td><td>Горожане дружелюбны, торгуют, дают слухи<\/td><\/tr><tr><td>2<\/td><td>Цены ×2, слухи только за услуги<\/td><\/tr><tr><td>3<\/td><td>Двери запираются; дети убегают от героев<\/td><\/tr><tr><td>4<\/td><td>Отец Вальдрик проповедует против героев; стража следит<\/td><\/tr><tr><td>5<\/td><td>Ополчение нарисованных. Охота на героев по всему городу<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s35-4\">35.4. Отдых и безопасные места<\/h2><ul><li><strong>Долгая передышка<\/strong> возможна только в <strong>безопасном месте<\/strong>: таверна «Последняя свеча», хоспис «Тихая палата», мансарда Селены, зажжённый костёр путников (только короткая) и места, которые мастер объявит безопасными.<\/li><li>Отдых в опасной зоне: бросьте 1d6 — на 1–2 случайная встреча или событие локации.<\/li><li>В безопасном месте играет трек <strong>«Отдых»<\/strong>. Пусть игроки привыкнут: эта музыка = выдох.<\/li><\/ul><h2 id=\"s35-5\">35.5. Свет<\/h2><ul><li>В катакомбах, Мглине, карьере и Шатре-желудке <strong>темно<\/strong>. Тёмное зрение видит только серое — <strong>цвета не различает<\/strong>, а значит, не может решать цветовые загадки и видеть синий свет нарисованного.<\/li><li>Факел — 1 час, лампа — 6 часов на флакон масла, свеча — 1 час, чёрная свеча — 1 час, мерцает рядом с иллюзиями.<\/li><li>Когда последний источник света гаснет — мастер переходит на трек <strong>«Террор»<\/strong>.<\/li><\/ul><h2 id=\"s35-6\">35.6. Прозрение (необязательно)<\/h2><p>За каждое ключевое открытие (строка из таблицы «Ответы на вопросы», раскрытая игроками) партия получает <strong>1 Прозрение<\/strong>. Его можно потратить, чтобы задать мастеру один вопрос о сцене, на который мастер отвечает правдиво. Но при 5 и более накопленных Прозрениях <strong>синий глаз Сайласа замечает партию<\/strong> — Картина начинает реагировать на героев напрямую.<\/p><h2 id=\"s35-7\">35.7. Узы партии<\/h2><p>Узы появляются после сцены «Разделённый холст» в мастерской (раздел 9). Кратко:<\/p><div class=\"tbl\"><table><thead><tr><th>Уза<\/th><th>Эффект (1 раз за короткую передышку)<\/th><\/tr><\/thead><tbody><tr><td>Эстел ↔ Велисса «Ключ»<\/td><td>Иллюзия Велиссы даёт Эстелу Скрытую атаку без союзника рядом; или Эстел снимает с Велиссы очарование/страх<\/td><\/tr><tr><td>Велисса ↔ Ума «Щит и тень»<\/td><td>Велисса рядом с Умой игнорирует солнце; Ума реакцией даёт ей +2 КД<\/td><\/tr><tr><td>Ума ↔ Эстел «Вперёд!»<\/td><td>Приказ Умы: Эстел смещается на полскорости без провоцирования и с преимуществом на атаку<\/td><\/tr><tr><td>Вся партия «Групповой портрет»<\/td><td>1 раз за долгую передышку: переброс проваленного спасброска союзника<\/td><\/tr><\/tbody><\/table><\/div><p>Ранги Уз растут от личных сцен (максимум 3). Предательство и очарование союзника без согласия рвут Узу до примирения.<\/p>", "toc": [["s35-1", "35.1. Мазки (заражение краской)"], ["s35-2", "35.2. Отголоски (эмоции Посланца)"], ["s35-3", "35.3. Страх нарисованных (шкала города)"], ["s35-4", "35.4. Отдых и безопасные места"], ["s35-5", "35.5. Свет"], ["s35-6", "35.6. Прозрение (необязательно)"], ["s35-7", "35.7. Узы партии"]], "text": "35.1. Мазки (заражение краской) Мазки показывают, насколько персонаж стал частью Картины . Шкала от 0 до 6. Отмечайте на листе персонажа. Как получить Мазок: использование флакона краски; критическое попадание нарисованного существа; ловушки с краской (холст, купель, свежая краска); законченный портрет (+2); ночь Перекраски в городе (при провале спасброска); сделка с Сайласом (+3). Мазки Эффект 1 Косметика: на коже пятно краски, которое не смывается 2 Нарисованные существа менее враждебны: преимущество на Убеждение с ними 3 Башня пропускает. Персонаж может проходить сквозь нарисованные двери. Отражение запаздывает на полсекунды 4 Сопротивление психическому урону. Уязвимость к растворителю (растворитель наносит ему 2d6) 5 Персонаж может «войти» в любую картину и выйти из другой в пределах 1 км (1 раз в день). Элиас не может лечить его обычной медициной 6 Персонаж нарисован. Он больше не стареет, не умирает обычной смертью (возвращается копией после Перекраски) — и становится целью Осириса. Персонаж переходит к мастеру или требует сюжетного спасения Важно Мазки снимает только Элиас (дар; все Мазки разом, с побочным эффектом) или ритуал в финале. Мазки — это ресурс и угроза одновременно : игроки могут сознательно набирать их, чтобы попасть в Башню или ходить сквозь картины. 35.2. Отголоски (эмоции Посланца) В каждой локации Акта II и в Тихих очагах действует своя эмоция. Персонаж копит Отголоски каждой из десяти эмоций отдельно (0–3). Отголоски Эффект 1 Флейвор: персонаж замечает в себе чужое чувство. Мастер может раз за сессию предложить «поддаться» (см. ниже) 2 Тяга: раз за сессию мастер описывает навязчивое желание; сопротивление — спасбросок Мудрости СЛ 13 3 Одержимость: у персонажа появляется постоянная черта эмоции (см. таблицу). Снимается только квестом очищения или победой над Сосудом Эмоция Одержимость (3 Отголоска) Дар при «поддаться» Скрытность Персонажа не замечают NPC, пока он не заговорит (и он сам иногда забывает своё имя) Преимущество на Скрытность на 1 сцену Зависть Персонаж невольно копирует жесты союзника; не может отказаться от чужой вещи Один раз скопировать бонус атаки или навык союзника Обжорство Двойной паёк; ест не еду в стрессе Восстановить 2d6 хитов, съев что-то странное Гнев Каждый бой начинает с 1 жетоном Ярости +1d6 к урону одной атаки Тоска Не может оставить вещь «как есть»: чинит, переделывает, дорисовывает — даже в бою (помеха на инициативу) Один раз изменить мелкую деталь сцены (как 1 заряд краски, без Мазка) Страх Помеха на спасброски от испуга; не может спать без света Рывок бонусным действием на 1 ход Гордыня Не может отступить, если на него смотрят; не принимает помощь (Помощь на него не действует) Преимущество на одну проверку Харизмы Оцепенение Не получает вдохновение; не чувствует боли — мастер скрывает от игрока точные хиты его персонажа Сопротивление урону холодом и психическим уроном на 1 бой Желание Не может отказаться от того, чего хочет (спасбросок Мудрости СЛ 13 при виде желаемого) Преимущество на Убеждение или Обман на 1 сцену Нежность Отдаёт свои хиты и предметы слабым, даже в ущерб себе Восстановить союзнику 1d8 хитов касанием (1 раз) Поддаться: игрок может добровольно взять 1 Отголосок, чтобы получить дар эмоции. Это и есть Fear & Hunger: сила за цену, и игрок решает сам. Победа над Сосудом эмоции снимает все Отголоски этой эмоции у партии. Мирное разрешение — снимает и даёт каждому персонажу вдохновение . 35.3. Страх нарисованных (шкала города) Шкала 0–5 (см. раздел «Герои и злодеи»). Растёт от уничтожения нарисованных, кражи портретов, растворителя, громких боёв в городе. Падает (−1) за спасение нарисованного NPC, за выполненный квест горожан. Значение Реакция города 0–1 Горожане дружелюбны, торгуют, дают слухи 2 Цены ×2, слухи только за услуги 3 Двери запираются; дети убегают от героев 4 Отец Вальдрик проповедует против героев; стража следит 5 Ополчение нарисованных. Охота на героев по всему городу 35.4. Отдых и безопасные места Долгая передышка возможна только в безопасном месте : таверна «Последняя свеча», хоспис «Тихая палата», мансарда Селены, зажжённый костёр путников (только короткая) и места, которые мастер объявит безопасными. Отдых в опасной зоне: бросьте 1d6 — на 1–2 случайная встреча или событие локации. В безопасном месте играет трек «Отдых» . Пусть игроки привыкнут: эта музыка = выдох. 35.5. Свет В катакомбах, Мглине, карьере и Шатре-желудке темно . Тёмное зрение видит только серое — цвета не различает , а значит, не может решать цветовые загадки и видеть синий свет нарисованного. Факел — 1 час, лампа — 6 часов на флакон масла, свеча — 1 час, чёрная свеча — 1 час, мерцает рядом с иллюзиями. Когда последний источник света гаснет — мастер переходит на трек «Террор» . 35.6. Прозрение (необязательно) За каждое ключевое открытие (строка из таблицы «Ответы на вопросы», раскрытая игроками) партия получает 1 Прозрение . Его можно потратить, чтобы задать мастеру один вопрос о сцене, на который мастер отвечает правдиво. Но при 5 и более накопленных Прозрениях синий глаз Сайласа замечает партию — Картина начинает реагировать на героев напрямую. 35.7. Узы партии Узы появляются после сцены «Разделённый холст» в мастерской (раздел 9). Кратко: Уза Эффект (1 раз за короткую передышку) Эстел ↔ Велисса «Ключ» Иллюзия Велиссы даёт Эстелу Скрытую атаку без союзника рядом; или Эстел снимает с Велиссы очарование/страх Велисса ↔ Ума «Щит и тень» Велисса рядом с Умой игнорирует солнце; Ума реакцией даёт ей +2 КД Ума ↔ Эстел «Вперёд!» Приказ Умы: Эстел смещается на полскорости без провоцирования и с преимуществом на атаку Вся партия «Групповой портрет» 1 раз за долгую передышку: переброс проваленного спасброска союзника Ранги Уз растут от личных сцен (максимум 3). Предательство и очарование союзника без согласия рвут Узу до примирения."}, {"id": "s36", "n": 36, "title": "МИНИ-ИГРЫ", "disp": "Мини-игры", "group": "Механики", "html": "<p>Использовать мини-игры в сценах, где важны риск, нервы и скорость решений, а не обычная тактика D&amp;D: ставки у Веспера, Игорный шатёр зверинца, переговоры с Сосудом.<\/p><h2 id=\"s36-1\">Buckshot (переработанные правила)<\/h2><p><strong>Подготовка.<\/strong> Каждый участник бросает <strong>1d4<\/strong> — это его жетоны жизни в игре (HP). Порядок — инициатива <strong>1d20<\/strong>.<\/p><p><strong>Зарядка.<\/strong> Мастер бросает <strong>1d8<\/strong> — столько патронов в ружье (минимум 2). Для каждого патрона тайно бросается <strong>1d2<\/strong>: 1 — <strong>боевой<\/strong>, 2 — <strong>холостой<\/strong>. Мастер объявляет вслух, сколько боевых и сколько холостых, но не порядок. <strong>Последний патрон всегда боевой.<\/strong><\/p><p><strong>Предметы.<\/strong> После каждой зарядки каждый участник получает <strong>1d4<\/strong> предметов; каждый определяется броском <strong>1d8<\/strong> по таблице ниже.<\/p><p><strong>Ход.<\/strong> Игрок может использовать любое число предметов, затем стреляет — <strong>в себя<\/strong> или <strong>в противника<\/strong>:<\/p><ul><li><strong>В себя, холостой<\/strong> — игрок ходит ещё раз.<\/li><li><strong>В себя, боевой<\/strong> — теряет жетоны урона.<\/li><li><strong>В противника, боевой<\/strong> — противник может попытаться <strong>увернуться<\/strong>: он бросает <strong>1d20<\/strong>, стрелок бросает <strong>1d8 + 10<\/strong> (точность). Если d20 противника выше — промах. Иначе — попадание.<\/li><li><strong>В противника, холостой<\/strong> — ход переходит к противнику.<\/li><\/ul><p><strong>Урон<\/strong> — <strong>1d4<\/strong> жетона. Участник с 0 жетонов проиграл.<\/p><h3>Предметы (d8)<\/h3><div class=\"tbl\"><table><thead><tr><th>d8<\/th><th>Предмет<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td><strong>Ножовка (Cutter)<\/strong><\/td><td>Следующий выстрел наносит +1d4 урона<\/td><\/tr><tr><td>2<\/td><td><strong>Пиво (Beer)<\/strong><\/td><td>+1d4 жетона жизни (не выше стартового значения + 1)<\/td><\/tr><tr><td>3<\/td><td><strong>Карта обратного знания (Reverse Card of Knowledge)<\/strong><\/td><td>+1d20 к броску уклонения сейчас <strong>или<\/strong> +20 к точности сейчас<\/td><\/tr><tr><td>4<\/td><td><strong>Наручники (Handcuffs)<\/strong><\/td><td>Противник пропускает свой следующий ход<\/td><\/tr><tr><td>5<\/td><td><strong>Лупа<\/strong> <em>(новое)<\/em><\/td><td>Посмотреть, какой патрон сейчас в патроннике<\/td><\/tr><tr><td>6<\/td><td><strong>Сигарета<\/strong> <em>(новое)<\/em><\/td><td>+1 жетон жизни<\/td><\/tr><tr><td>7<\/td><td><strong>Инвертор<\/strong> <em>(новое)<\/em><\/td><td>Текущий патрон меняется: боевой ↔ холостой<\/td><\/tr><tr><td>8<\/td><td><strong>Таблетки<\/strong> <em>(новое)<\/em><\/td><td>Бросьте 1d2: 1 — +2 жетона, 2 — −1 жетон<\/td><\/tr><\/tbody><\/table><\/div><h3>Как связать с игрой<\/h3><div class=\"tbl\"><table><thead><tr><th>Жетоны, потерянные в мини-игре<\/th><th>Последствие в мире<\/th><\/tr><\/thead><tbody><tr><td>Каждый жетон<\/td><td>Ставка проиграна; при игре «на кровь» — 1d6 реального урона за жетон<\/td><\/tr><tr><td>Проигрыш с 0 жетонов<\/td><td>Потеря ставки + <strong>малая травма<\/strong> (если игра шла «по-настоящему»)<\/td><\/tr><tr><td>Победа без потерь<\/td><td>Вдохновение и уважение заведения<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Перед началом объявите, на что идёт игра — «на интерес», «на кровь» или «на всё». Если «на всё» — ружьё настоящее.<\/p><\/div>", "toc": [["s36-1", "Buckshot (переработанные правила)"]], "text": "Использовать мини-игры в сценах, где важны риск, нервы и скорость решений, а не обычная тактика D&D: ставки у Веспера, Игорный шатёр зверинца, переговоры с Сосудом. Buckshot (переработанные правила) Подготовка. Каждый участник бросает 1d4 — это его жетоны жизни в игре (HP). Порядок — инициатива 1d20 . Зарядка. Мастер бросает 1d8 — столько патронов в ружье (минимум 2). Для каждого патрона тайно бросается 1d2 : 1 — боевой , 2 — холостой . Мастер объявляет вслух, сколько боевых и сколько холостых, но не порядок. Последний патрон всегда боевой. Предметы. После каждой зарядки каждый участник получает 1d4 предметов; каждый определяется броском 1d8 по таблице ниже. Ход. Игрок может использовать любое число предметов, затем стреляет — в себя или в противника : В себя, холостой — игрок ходит ещё раз. В себя, боевой — теряет жетоны урона. В противника, боевой — противник может попытаться увернуться : он бросает 1d20 , стрелок бросает 1d8 + 10 (точность). Если d20 противника выше — промах. Иначе — попадание. В противника, холостой — ход переходит к противнику. Урон — 1d4 жетона. Участник с 0 жетонов проиграл. Предметы (d8) d8 Предмет Эффект 1 Ножовка (Cutter) Следующий выстрел наносит +1d4 урона 2 Пиво (Beer) +1d4 жетона жизни (не выше стартового значения + 1) 3 Карта обратного знания (Reverse Card of Knowledge) +1d20 к броску уклонения сейчас или +20 к точности сейчас 4 Наручники (Handcuffs) Противник пропускает свой следующий ход 5 Лупа (новое) Посмотреть, какой патрон сейчас в патроннике 6 Сигарета (новое) +1 жетон жизни 7 Инвертор (новое) Текущий патрон меняется: боевой ↔ холостой 8 Таблетки (новое) Бросьте 1d2: 1 — +2 жетона, 2 — −1 жетон Как связать с игрой Жетоны, потерянные в мини-игре Последствие в мире Каждый жетон Ставка проиграна; при игре «на кровь» — 1d6 реального урона за жетон Проигрыш с 0 жетонов Потеря ставки + малая травма (если игра шла «по-настоящему») Победа без потерь Вдохновение и уважение заведения Совет мастеру Перед началом объявите, на что идёт игра — «на интерес», «на кровь» или «на всё». Если «на всё» — ружьё настоящее."}, {"id": "s37", "n": 37, "title": "ОРУЖИЕ: НАХОДКИ 1–4 УРОВНЯ", "disp": "Оружие: находки 1–4 уровня", "group": "Снаряжение", "html": "<p>Оружие ниже — то, что герои могут <strong>найти<\/strong> на уровнях 1–4 (Акт I и начало Акта II). Принцип: никакого резкого скачка силы. Отличия — в <strong>ситуациях<\/strong>: против нарисованного, против роев, для прерывания подготовки, для травм. Магические бонусы появляются не раньше 3 уровня и не выше +1.<\/p><div class=\"tbl\"><table><thead><tr><th>Редкость<\/th><th>Где встречается<\/th><th>Бонус<\/th><\/tr><\/thead><tbody><tr><td><strong>Обычное<\/strong><\/td><td>Валяется, продаётся, отбирается у врагов<\/td><td>Без бонуса, есть особенность<\/td><\/tr><tr><td><strong>Необычное<\/strong><\/td><td>Награда квеста, тайник, элитный враг<\/td><td>Особенность сильнее; возможно +1 с 3 уровня<\/td><\/tr><tr><td><strong>Уникальное<\/strong><\/td><td>Только одно в мире; связано с сюжетом<\/td><td>+1 и сюжетное свойство, своя ветка улучшений<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> <strong>Трансформер<\/strong> — новое свойство оружия в духе Bloodborne. Оружие имеет две формы; смена формы — бонусное действие. Если атаковать <strong>в тот же ход<\/strong>, когда сменил форму, атака получает +1d4 урона («атака с переходом»).<\/p><\/div><h2 id=\"s37-1\">Уровень 1 — Город и трущобы<\/h2><div class=\"tbl\"><table><thead><tr><th>Оружие<\/th><th>Урон<\/th><th>Свойства<\/th><th>Особенность<\/th><th>Где найти<\/th><\/tr><\/thead><tbody><tr><td><strong>Мастихин подмастерья<\/strong><\/td><td>1d4 колющий<\/td><td>Лёгкое, фехтовальное, метательное (6/18 м)<\/td><td>Против нарисованных +1d4: соскабливает краску<\/td><td>Мастерская, кладовая пигментов<\/td><\/tr><tr><td><strong>Нож для холста<\/strong><\/td><td>1d4 рубящий<\/td><td>Лёгкое, фехтовальное<\/td><td>За 1 минуту прорезает проход в нарисованной стене или двери<\/td><td>Мастерская, сушильня<\/td><\/tr><tr><td><strong>Палитра-щит<\/strong><\/td><td>1d4 дробящий (удар)<\/td><td>Щит, +1 КД<\/td><td>Реакцией «поймать» плевок краски, жидкости или кислоты: урон половинный<\/td><td>Мастерская, атриум<\/td><\/tr><tr><td><strong>Крысобойная лопата<\/strong><\/td><td>1d6 дробящий<\/td><td>Двуручное<\/td><td>Против роев — полный урон по всем, кто в рое; при попадании можно толкнуть на 1,5 м<\/td><td>Подвал дома 19<\/td><\/tr><tr><td><strong>Багор фонарщика<\/strong><\/td><td>1d6 колющий<\/td><td>Двуручное, досягаемость<\/td><td>На крюк вешается фонарь: свет 6 м, руки не заняты лампой<\/td><td>Сторожка фонарщика на площади<\/td><\/tr><tr><td><strong>Тесак мясника<\/strong><\/td><td>1d6 рубящий<\/td><td>Одноручное<\/td><td>Критическое попадание — малая травма врагу (−3 м скорости или помеха на атаки)<\/td><td>Трущобы, бойня<\/td><\/tr><tr><td><strong>Колесцовый пистоль<\/strong><\/td><td>1d8 колющий<\/td><td>Огнестрел, 9/27 м, перезарядка (действие), громкий<\/td><td><strong>Парирование:<\/strong> может прерывать подготовку (см. 34.2)<\/td><td>Банда Гримвара<\/td><\/tr><tr><td><strong>Праща с красильными шариками<\/strong><\/td><td>1d4 дробящий<\/td><td>Дальнобойное, 9/36 м<\/td><td>Попадание метит цель краской: невидимость и маскировка не работают 1 минуту<\/td><td>Галерея Портретов, мастерская<\/td><\/tr><tr><td><strong>Трость прихожанина<\/strong><\/td><td>1d6 дробящий<\/td><td>Универсальное (1d8)<\/td><td>Нарисованные в Церкви и рядом с ней не атакуют носителя первыми<\/td><td>Церковь Чистого Холста<\/td><\/tr><tr><td><strong>Серп-трофей Эстела<\/strong> (уникальное)<\/td><td>1d6 рубящий<\/td><td>Лёгкое, фехтовальное<\/td><td>Половина пары «Серпы Жнеца». Тихо звенит, когда рядом злятся. Против Корвина Блэкторна +1d4. С парой складывается в косу (2d10, двуручное, досягаемость)<\/td><td>Уже у Эстела<\/td><\/tr><tr><td><strong>Ржавый тесак катакомб<\/strong><\/td><td>1d6 рубящий<\/td><td>Одноручное<\/td><td>Дешёвый; после убийства Короля Крыс может получить свойство «Охотничье» бесплатно<\/td><td>Катакомбы<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s37-2\">Уровень 2 — Катакомбы, Галерея, нижние этажи Башни<\/h2><div class=\"tbl\"><table><thead><tr><th>Оружие<\/th><th>Урон<\/th><th>Свойства<\/th><th>Особенность<\/th><th>Где найти<\/th><\/tr><\/thead><tbody><tr><td><strong>Зубастый тесак<\/strong> (трансформер)<\/td><td>1d6 рубящий / 1d10 рубящий<\/td><td>Лёгкое / двуручное<\/td><td>Длинная форма: при попадании по звероподобным +1d4<\/td><td>Тело охотника в катакомбах<\/td><\/tr><tr><td><strong>Трость-хлыст Галереи<\/strong> (трансформер)<\/td><td>1d6 дробящий / 1d4 рубящий<\/td><td>Фехтовальное / хлыст, досягаемость 3 м<\/td><td>Хлыстом — одна атака по 2 соседним целям<\/td><td>Кабинет Морвен Блэкхарт<\/td><\/tr><tr><td><strong>Мушкетон «Хриплый»<\/strong><\/td><td>1d10 колющий<\/td><td>Огнестрел, 4,5/9 м, перезарядка, громкий<\/td><td>Попадание задевает ещё одно существо в 1,5 м от цели (половина урона); СЛ парирования +2<\/td><td>Под стойкой Веспера (покупка или услуга)<\/td><\/tr><tr><td><strong>Скипетр Крысиного Короля<\/strong><\/td><td>1d6 дробящий<\/td><td>Одноручное<\/td><td>С каменной короной: 1 раз в день «KNEEL» — все крысы и рои в 9 м сбиты с ног<\/td><td>Награда за Короля Крыс<\/td><\/tr><tr><td><strong>Цеп маляра<\/strong><\/td><td>1d8 дробящий<\/td><td>Одноручное, тяжёлое<\/td><td>Крит: плеск краски — нарисованная цель +1d6, обычная ослеплена до конца хода<\/td><td>Сушильня; вестибюль Башни<\/td><\/tr><tr><td><strong>Серп Чистого Холста<\/strong><\/td><td>1d4 рубящий<\/td><td>Лёгкое, посеребрённое<\/td><td>Против нарисованных +1d4 излучением<\/td><td>Тайник Отца Вальдрика<\/td><\/tr><tr><td><strong>Мясницкий крюк на цепи<\/strong><\/td><td>1d6 колющий<\/td><td>Досягаемость 4,5 м<\/td><td>Раз в ход притянуть Среднюю цель на 3 м (спасбросок Силы СЛ 8 + мастерство + Сила)<\/td><td>Бойня в трущобах<\/td><\/tr><tr><td><strong>Арбалет Дрейвена<\/strong><\/td><td>1d8 колющий<\/td><td>Лёгкий арбалет, 24/96 м<\/td><td>Болт с цепью (3 шт.): попадание — опутан, спасбросок Силы СЛ 12<\/td><td>Подарок Дрейвена Нокса<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s37-3\">Уровень 3 — Вершина Акта I, Хоспис, Мглин<\/h2><div class=\"tbl\"><table><thead><tr><th>Оружие<\/th><th>Урон<\/th><th>Свойства<\/th><th>Особенность<\/th><th>Где найти<\/th><\/tr><\/thead><tbody><tr><td><strong>Ланцет Элиаса<\/strong> (+1)<\/td><td>1d4+1 колющий<\/td><td>Лёгкое, фехтовальное, <strong>хирургическое<\/strong><\/td><td>Окно добивания: +2 кости урона вместо одной; крит — травма врагу<\/td><td>Хоспис: Элиас дарит, если узнает правду о городе<\/td><\/tr><tr><td><strong>Секира подмастерья<\/strong> (трансформер)<\/td><td>1d8 рубящий / 1d12 рубящий<\/td><td>Одноручное / двуручное, досягаемость<\/td><td><strong>Подготовка героя:<\/strong> можно пропустить атаку, объявив подготовку; в следующий ход — двойной бросок урона (враг может прервать!)<\/td><td>Башня, Галерея неудач<\/td><\/tr><tr><td><strong>Зеркальный клинок<\/strong><\/td><td>1d6 колющий<\/td><td>Фехтовальное, короткий меч<\/td><td>Может атаковать существ, видимых только в отражении; по иллюзиям — автоматическое попадание<\/td><td>Мглин, квартира 44; или Галерея<\/td><\/tr><tr><td><strong>Гарпун дрессировщицы<\/strong><\/td><td>1d8 колющий<\/td><td>Метательное 6/18 м, с верёвкой 9 м<\/td><td>Попадание — цель привязана, можно притянуть на 3 м бонусным действием<\/td><td>Зверинец (Шаэл Найтблум) или Аллея клеток<\/td><\/tr><tr><td><strong>Горелка лампадаря<\/strong><\/td><td>2d6 огня<\/td><td>Конус 4,5 м, спасбросок Ловкости СЛ 12<\/td><td>Тратит флакон масла; по нарисованным — двойной урон; в Кладовой пигментов — взрыв<\/td><td>Кухня Гуго, склад Мглина<\/td><\/tr><tr><td><strong>Колокол-кистень<\/strong><\/td><td>1d8 дробящий<\/td><td>Одноручное<\/td><td>Звон при попадании: существа Скрытности видимы до конца раунда; монахи-копии теряют концентрацию<\/td><td>Колокольня Обители; сторожка Мглина<\/td><\/tr><tr><td><strong>Вдовий пистоль<\/strong><\/td><td>1d10 колющий<\/td><td>Огнестрел, 12/36 м, перезарядка бонусным действием, громкий<\/td><td>Парирование; по сбитым с ног +1d6<\/td><td>Патруль охотников Бастиона (случайная встреча)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s37-4\">Уровень 4 — Уникальные находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Оружие<\/th><th>Урон<\/th><th>Свойства<\/th><th>Особенность<\/th><th>Где найти<\/th><\/tr><\/thead><tbody><tr><td><strong>Хопеш Осириса<\/strong> (+1, уникальное)<\/td><td>1d8+1 рубящий<\/td><td>Одноручное<\/td><td>Против нарисованных +1d6 некротического. Владелец слышит шёпот Осириса: раз в день — правдивый совет, но мастер может отдать «приказ». <strong>Оружие Тесори.<\/strong><\/td><td>Башня, комната Тесори<\/td><\/tr><tr><td><strong>Рама-щит «Паспарту»<\/strong> (+1, уникальное)<\/td><td>1d4 дробящий (удар)<\/td><td>Щит +1: всего +3 КД<\/td><td>Реакцией «вставить в раму» нарисованное существо (Среднее или меньше): опутано до конца своего хода, спасбросок Силы СЛ 13. 1 раз за короткую передышку<\/td><td>Башня, Галерея неудач<\/td><\/tr><tr><td><strong>Кисть-посох подмастерья<\/strong> (+1, уникальное)<\/td><td>1d6+1 / 1d8+1 дробящий<\/td><td>Универсальное, фокус<\/td><td>Эффект краски на 2 заряда стоит 1 заряд (1 раз в день); Мазок получает всё равно<\/td><td>Вершина Башни (если Сайлас ушёл в холст)<\/td><\/tr><tr><td><strong>Кинжал забвения<\/strong> (+1, уникальное)<\/td><td>1d4+1 колющий<\/td><td>Лёгкое, фехтовальное<\/td><td>Попадание: цель забывает носителя — до конца своего следующего хода не может выбрать его целью (спасбросок Мудрости СЛ 13). Каждое использование — носитель бросает Забвение 1 раз в день<\/td><td>Мглин, Зефер Ноктрейн<\/td><\/tr><tr><td><strong>Перо-стилет Вариса<\/strong> (+1, уникальное)<\/td><td>1d8+1 колющий<\/td><td>Фехтовальное<\/td><td>Раз в короткую передышку: следующая атака копирует тип урона и бонусную кость последнего существа, нанёсшего урон носителю<\/td><td>Обитель Переписчиков (если пришли рано)<\/td><\/tr><tr><td><strong>Клинок-пила Дрейвена<\/strong> (трансформер, необычное)<\/td><td>1d8 рубящий / 2d6 рубящий<\/td><td>Одноручное / двуручное<\/td><td>Свойство «Кровоточащее»; при атаке с переходом — +1d6 вместо +1d4<\/td><td>Дрейвен Нокс (в благодарность или после его смерти)<\/td><\/tr><tr><td><strong>Фонарь-кадило<\/strong> (необычное)<\/td><td>1d6 огня<\/td><td>Досягаемость 3 м, фокус<\/td><td>Свет 9 м; раз в день — Церковный звон: все нарисованные в 9 м прерывают подготовку<\/td><td>Церковь Чистого Холста<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> <strong>Правило баланса:<\/strong> на уровнях 1–2 никакого постоянного бонуса выше +0 к атаке. На уровнях 3–4 — не больше одного предмета +1 на героя. Уникальные эффекты выдавать <strong>за сюжет<\/strong>, а не за деньги.<\/p><\/div><h2 id=\"s37-5\">Оружие поздних уровней (наброски, 5+)<\/h2><div class=\"tbl\"><table><thead><tr><th>Оружие<\/th><th>Где<\/th><th>Суть<\/th><\/tr><\/thead><tbody><tr><td>Вилка-трезубец Лукреции (+1)<\/td><td>Зверинец<\/td><td>Попадание восстанавливает 1d4 хита, но после боя — бросок Голода<\/td><\/tr><tr><td>Серп Жнеца — вторая половина (+1)<\/td><td>Бастион, Корвин<\/td><td>Вместе с серпом-трофеем Эстела: коса-трансформер (+2), 2d10, досягаемость 3 м; «Казнь» по сбитым с ног — крит на 19–20<\/td><\/tr><tr><td>Паровой молот-трансформер<\/td><td>Фабрика<\/td><td>1d10 / паровой режим 2d8 + сбивает с ног; перезарядка давления<\/td><\/tr><tr><td>«Шестиглазка»<\/td><td>Фабрика, кабинет Офелии<\/td><td>Огнестрел 1d10, шесть выстрелов до перезарядки; парирование<\/td><\/tr><tr><td>Мастихин Звёздного Железа<\/td><td>Бастион (артефакт)<\/td><td>1d4 + 2d6 по нарисованным и эмоциям; разрез пространства<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s37-6\">Базовое оружие (может встретиться на любом уровне)<\/h2><div class=\"tbl\"><table><thead><tr><th>Оружие<\/th><th>Тип<\/th><th>Урон<\/th><th>Особенность<\/th><\/tr><\/thead><tbody><tr><td>Старый нож<\/td><td>Лёгкое<\/td><td>1d4<\/td><td>Быстрое, скрытное<\/td><\/tr><tr><td>Охотничий нож<\/td><td>Лёгкое<\/td><td>1d4<\/td><td>Удобен против зверей и для разделки<\/td><\/tr><tr><td>Кинжал<\/td><td>Лёгкое<\/td><td>1d4<\/td><td>Можно метать<\/td><\/tr><tr><td>Серп<\/td><td>Лёгкое<\/td><td>1d4<\/td><td>Удобен для зацепов<\/td><\/tr><tr><td>Тесак хирурга<\/td><td>Лёгкое<\/td><td>1d4<\/td><td>Хирургическое: работает с механикой травм<\/td><\/tr><tr><td>Короткий меч<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Универсальный<\/td><\/tr><tr><td>Ржавый меч<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Дешёвый; может получить сюжетное свойство<\/td><\/tr><tr><td>Дубинка<\/td><td>Одноручное<\/td><td>1d4<\/td><td>Дробящий урон<\/td><\/tr><tr><td>Молот<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Хорош против хрупких объектов<\/td><\/tr><tr><td>Кирка<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Хороша против брони и камня<\/td><\/tr><tr><td>Боевой топор<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Сильный рубящий удар<\/td><\/tr><tr><td>Трость-шпага<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Можно скрывать среди обычных вещей<\/td><\/tr><tr><td>Факел<\/td><td>Одноручное<\/td><td>1d4<\/td><td>Свет + небольшой огненный эффект<\/td><\/tr><tr><td>Цепь<\/td><td>Одноручное<\/td><td>1d4<\/td><td>Можно использовать для контроля<\/td><\/tr><tr><td>Крюк на цепи<\/td><td>Одноручное<\/td><td>1d4<\/td><td>Зацепить предмет или противника<\/td><\/tr><tr><td>Молот кузнеца<\/td><td>Одноручное<\/td><td>1d6<\/td><td>Инструмент + оружие<\/td><\/tr><tr><td>Мясницкий крюк<\/td><td>Лёгкое<\/td><td>1d4<\/ <div class=\"tbl\"><table><thead><tr><th>Уровень<\/th><th>Название<\/th><th>Стоимость<\/th><th>Эффект<\/th><th>Кто делает<\/th><\/tr><\/thead><tbody><tr><td>+0<\/td><td>Повреждённое / обычное<\/td><td>—<\/td><td>Базовые характеристики<\/td><td>—<\/td><\/tr><tr><td>+1<\/td><td>Подправленное<\/td><td>1 Обломок крови + немного денег<\/td><td>+1 к урону <strong>или<\/strong> небольшое усиление особенности<\/td><td>Бальрик (город), Дургар (хоспис)<\/td><\/tr><tr><td>+2<\/td><td>Укреплённое<\/td><td>2 Куска железа + деньги<\/td><td>Ещё +1 к урону<\/td><td>Бальрик, Дургар<\/td><\/tr><tr><td>+3<\/td><td>Мастерское<\/td><td>3 материала + редкий компонент<\/td><td>+1 к урону и новое свойство<\/td><td>Только Дургар<\/td><\/tr><tr><td>+4<\/td><td>Особое<\/td><td>Сюжетный материал (небесное железо, кровь Сосуда)<\/td><td>Уникальная ветка, может стать +1 к атаке<\/td><td>Дургар + сюжетное событие<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s38-2\">Материалы и где их найти<\/h2><div class=\"tbl\"><table><thead><tr><th>Материал<\/th><th>Для чего<\/th><th>Где найти<\/th><\/tr><\/thead><tbody><tr><td>Обломок крови<\/td><td>+1<\/td><td>Враги в городе и катакомбах, крысы-переростки<\/td><\/tr><tr><td>Кусок железа<\/td><td>+2<\/td><td>Трущобы, катакомбы, дорожные встречи<\/td><\/tr><tr><td>Чёрный металл<\/td><td>+3<\/td><td>Мглин (котельная), Бастион<\/td><\/tr><tr><td>Фрагмент картины<\/td><td>Меняет свойство оружия<\/td><td>Галерея, Башня, нарисованные боссы<\/td><\/tr><tr><td>Осколок зеркала<\/td><td>Компонент для «Зеркального»<\/td><td>Мглин, Обитель, Шатёр кривых зеркал<\/td><\/tr><tr><td>Кровь чудовища<\/td><td>Уникальные улучшения<\/td><td>Боссы, Король Крыс<\/td><\/tr><tr><td>Небесное железо<\/td><td>+4, «Звёздное» свойство<\/td><td>Только карьер «Глотка»<\/td><\/tr><tr><td>Краска Сайласа<\/td><td>Меняет <strong>природу<\/strong> оружия<\/td><td>Флакон (тратится заряд)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s38-3\">Свойства оружия<\/h2><div class=\"tbl\"><table><thead><tr><th>Свойство<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>Кровоточащее<\/td><td>После 3 попаданий по одной цели — цель получает 1d6 урона в начале каждого своего хода (до перевязки или 3 ходов)<\/td><\/tr><tr><td>Тяжёлое<\/td><td>Понижает порог прерывания подготовки на ступень; помеха при атаке из засады<\/td><\/tr><tr><td>Быстрое<\/td><td>После атаки — перемещение на 1,5 м без провоцирования<\/td><\/tr><tr><td>Охотничье<\/td><td>+1d4 против зверей и существ с животными повадками<\/td><\/tr><tr><td>Зеркальное<\/td><td>Взаимодействует с отражениями и иллюзиями (см. Зеркальный клинок)<\/td><\/tr><tr><td>Хирургическое<\/td><td>Окно добивания и крит наносят травму врагу<\/td><\/tr><tr><td>Огненное<\/td><td>+1d4 огнём против уязвимых; в Кладовой пигментов — осторожно<\/td><\/tr><tr><td>Серебряное<\/td><td>+1d4 против нарисованных и некоторых сверхъестественных существ<\/td><\/tr><tr><td>Ритуальное<\/td><td>Открывает взаимодействия с символами и картинами; может служить фокусом<\/td><\/tr><tr><td>Трансформер<\/td><td>Две формы, смена — бонусное действие, атака с переходом +1d4<\/td><\/tr><tr><td>Звёздное (только +4)<\/td><td>Режет краску и эмоции: +1d6 против нарисованных и существ-эмоций<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s38-4\">Правила<\/h2><ul><li>На 1–2 уровне не давать оружию постоянный бонус выше +0 к броску атаки; на 3–4 — не выше +1.<\/li><li>Одно оружие можно улучшать несколько раз. Улучшение не должно требовать замены оружия.<\/li><li>Оружие визуально меняется после каждого улучшения (опишите это!).<\/li><li>При поломке оружие временно откатывается на уровень ниже.<\/li><li>Уникальное оружие имеет собственную ветку улучшений.<\/li><\/ul><h2 id=\"s38-5\">Мастерские<\/h2><ul><li><strong>Кузня Бальрика<\/strong> (город): +1 и +2. Горн нарисованный, но жар настоящий. После Ночи Перекраски Бальрик может забыть заказ.<\/li><li><strong>Кузня Дургара<\/strong> (хоспис): до +3, а с небесным железом — +4.<\/li><li><strong>Мастерская художника<\/strong>: способна менять не только характеристики, но и природу оружия (краска Сайласа). Цена — Мазок.<\/li><li>Некоторые улучшения требуют жертвы, крови, части картины или иного сюжетного ресурса.<\/li><\/ul><h2 id=\"s38-6\">Пример ветки<\/h2><p><strong>Охотничий тесак<\/strong> +0: 1d6. +1: 1d6+1. +2: 1d6+1, Тяжёлое против звероподобных. +3: 1d6+2, Кровоточащее. <strong>+4 «Звёздный тесак»<\/strong>: 1d6+2, +1 к атаке, Звёздное. <strong>Уникальная ветка (краска)<\/strong>: «Тесак, реагирующий на картины» — светится рядом с нарисованным, режет холсты как ткань.<\/p>", "toc": [["s38-1", "Уровни улучшения"], ["s38-2", "Материалы и где их найти"], ["s38-3", "Свойства оружия"], ["s38-4", "Правила"], ["s38-5", "Мастерские"], ["s38-6", "Пример ветки"]], "text": "Оружие развивается не за счёт огромных числовых бонусов, а через мастерскую, материалы и выбор направления. Цель — чтобы найденное оружие оставалось интересным, а улучшение ощущалось как часть мира. Уровни улучшения Уровень Название Стоимость Эффект Кто делает +0 Повреждённое / обычное — Базовые характеристики — +1 Подправленное 1 Обломок крови + немного денег +1 к урону или небольшое усиление особенности Бальрик (город), Дургар (хоспис) +2 Укреплённое 2 Куска железа + деньги Ещё +1 к урону Бальрик, Дургар +3 Мастерское 3 материала + редкий компонент +1 к урону и новое свойство Только Дургар +4 Особое Сюжетный материал (небесное железо, кровь Сосуда) Уникальная ветка, может стать +1 к атаке Дургар + сюжетное событие Материалы и где их найти Материал Для чего Где найти Обломок крови +1 Враги в городе и катакомбах, крысы-переростки Кусок железа +2 Трущобы, катакомбы, дорожные встречи Чёрный металл +3 Мглин (котельная), Бастион Фрагмент картины Меняет свойство оружия Галерея, Башня, нарисованные боссы Осколок зеркала Компонент для «Зеркального» Мглин, Обитель, Шатёр кривых зеркал Кровь чудовища Уникальные улучшения Боссы, Король Крыс Небесное железо +4, «Звёздное» свойство Только карьер «Глотка» Краска Сайласа Меняет природу оружия Флакон (тратится заряд) Свойства оружия Свойство Эффект Кровоточащее После 3 попаданий по одной цели — цель получает 1d6 урона в начале каждого своего хода (до перевязки или 3 ходов) Тяжёлое Понижает порог прерывания подготовки на ступень; помеха при атаке из засады Быстрое После атаки — перемещение на 1,5 м без провоцирования Охотничье +1d4 против зверей и существ с животными повадками Зеркальное Взаимодействует с отражениями и иллюзиями (см. Зеркальный клинок) Хирургическое Окно добивания и крит наносят травму врагу Огненное +1d4 огнём против уязвимых; в Кладовой пигментов — осторожно Серебряное +1d4 против нарисованных и некоторых сверхъестественных существ Ритуальное Открывает взаимодействия с символами и картинами; может служить фокусом Трансформер Две формы, смена — бонусное действие, атака с переходом +1d4 Звёздное (только +4) Режет краску и эмоции: +1d6 против нарисованных и существ-эмоций Правила На 1–2 уровне не давать оружию постоянный бонус выше +0 к броску атаки; на 3–4 — не выше +1. Одно оружие можно улучшать несколько раз. Улучшение не должно требовать замены оружия. Оружие визуально меняется после каждого улучшения (опишите это!). При поломке оружие временно откатывается на уровень ниже. Уникальное оружие имеет собственную ветку улучшений. Мастерские Кузня Бальрика (город): +1 и +2. Горн нарисованный, но жар настоящий. После Ночи Перекраски Бальрик может забыть заказ. Кузня Дургара (хоспис): до +3, а с небесным железом — +4. Мастерская художника : способна менять не только характеристики, но и природу оружия (краска Сайласа). Цена — Мазок. Некоторые улучшения требуют жертвы, крови, части картины или иного сюжетного ресурса. Пример ветки Охотничий тесак +0: 1d6. +1: 1d6+1. +2: 1d6+1, Тяжёлое против звероподобных. +3: 1d6+2, Кровоточащее. +4 «Звёздный тесак» : 1d6+2, +1 к атаке, Звёздное. Уникальная ветка (краска) : «Тесак, реагирующий на картины» — светится рядом с нарисованным, режет холсты как ткань."}, {"id": "s39", "n": 39, "title": "СНАРЯЖЕНИЕ И ПРЕДМЕТЫ", "disp": "Снаряжение и предметы", "group": "Снаряжение", "html": "<p>Предметы рассчитаны на персонажей начальных уровней. Большинство даёт небольшое преимущество, открывает взаимодействие с миром или помогает пережить конкретную ситуацию.<\/p><h2 id=\"s39-1\">Сюжетные и особые предметы<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Использование<\/th><\/tr><\/thead><tbody><tr><td><strong>Флакон краски Сайласа<\/strong><\/td><td>Мастерская, чердак<\/td><td>5 зарядов; дорисовать, стереть, изменить (см. раздел 3). Каждое применение — 1 Мазок<\/td><\/tr><tr><td><strong>Растворитель<\/strong><\/td><td>Кладовая пигментов<\/td><td>3 применения; 2d6 урона нарисованному или стереть нарисованный объект. Растит Страх нарисованных<\/td><\/tr><tr><td><strong>Синий берет<\/strong><\/td><td>Здание 1 (Фредерик)<\/td><td>Надевший видит, что нарисовано: у нарисованного нет тени в синем свете<\/td><\/tr><tr><td><strong>Красный / зелёный перстень<\/strong><\/td><td>Фредерики<\/td><td>Ключи цветовой системы: оживить / сохранить<\/td><\/tr><tr><td><strong>Каменная корона<\/strong><\/td><td>Король Крыс<\/td><td>Крысы дружелюбны; 1 раз в день призвать стаю или расспросить крыс<\/td><\/tr><tr><td><strong>Шляпа контроля<\/strong><\/td><td>Броммир<\/td><td>1 раз в день — «Приказ» (СЛ 12); надевший рискует сам получить приказ<\/td><\/tr><tr><td><strong>Половина фотографии<\/strong><\/td><td>Шкатулка с повозки<\/td><td>Крючок к Мглину; вместе со второй половиной — артефакт<\/td><\/tr><tr><td><strong>Фотоаппарат Аурела<\/strong><\/td><td>Мглин<\/td><td>3 вспышки за долгую передышку; прерывание существ Скрытности, раскрытие невидимого<\/td><\/tr><tr><td><strong>Пустая рамка<\/strong><\/td><td>Мастерская / находка<\/td><td>Светится рядом с картинами, связанными с героями; может «поймать» мелкое нарисованное существо<\/td><\/tr><tr><td><strong>Именная фотография<\/strong><\/td><td>Селена<\/td><td>Иммунитет к одному провалу Забвения<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s39-2\">Медицина<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Использование<\/th><\/tr><\/thead><tbody><tr><td>Бинт<\/td><td>Одноразовый. Остановить кровотечение; стабилизировать тяжело раненого<\/td><\/tr><tr><td>Игла и нить<\/td><td>Простая обработка раны; с проверкой Медицины СЛ 13 снимает малую травму «Кровотечение»<\/td><\/tr><tr><td>Флакон спирта<\/td><td>Обработать рану или поджечь<\/td><\/tr><tr><td>Медицинская склянка<\/td><td>Восстанавливает 1d4+1 хита<\/td><\/tr><tr><td>Обезболивающая настойка<\/td><td>Подавляет малую травму на 1 час, среднюю — на 10 минут; не лечит<\/td><\/tr><tr><td>Антисептический порошок<\/td><td>Против заражённых ран; преимущество на спасброски от болезни<\/td><\/tr><tr><td>Шина<\/td><td>Фиксация конечности: травма ноги/руки на ступень легче до лечения<\/td><\/tr><tr><td>Швейный набор<\/td><td>Ремонт одежды и простая обработка ран<\/td><\/tr><tr><td>Сухие травы<\/td><td>Настой, дым или ритуал<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s39-3\">Свет и огонь<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Использование<\/th><\/tr><\/thead><tbody><tr><td>Свеча<\/td><td>Свет 1,5 м, 1 час<\/td><\/tr><tr><td>Чёрная свеча<\/td><td>Горит слабее, мерцает рядом с иллюзиями<\/td><\/tr><tr><td>Фонарь<\/td><td>Надёжный переносной источник света, 6 часов на масле<\/td><\/tr><tr><td>Масляная лампа<\/td><td>Дольше горит, требует масла<\/td><\/tr><tr><td>Флакон масла<\/td><td>Топливо или горючая жидкость (1d4 огня, разлить и поджечь)<\/td><\/tr><tr><td>Спички<\/td><td>Небольшой запас огня<\/td><\/tr><tr><td>Кремень и кресало<\/td><td>Надёжный способ развести огонь<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s39-4\">Инструменты<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Использование<\/th><\/tr><\/thead><tbody><tr><td>Тесак мясника<\/td><td>Инструмент и импровизированное оружие<\/td><\/tr><tr><td>Ключ-трещотка<\/td><td>Простые механизмы<\/td><\/tr><tr><td>Набор отмычек<\/td><td>Вскрывать простые замки<\/td><\/tr><tr><td>Верёвка 10 м<\/td><td>Подъём, связывание, ловушки<\/td><\/tr><tr><td>Крюк-кошка<\/td><td>Работает вместе с верёвкой<\/td><\/tr><tr><td>Мешочек гвоздей<\/td><td>Ремонт, ловушки, баррикады<\/td><\/tr><tr><td>Маленький молоток<\/td><td>Инструмент<\/td><\/tr><tr><td>Кусачки<\/td><td>Проволока, тонкие цепи, кандалы-капканы карьера<\/td><\/tr><tr><td>Карманное зеркало<\/td><td>Наблюдать за углами, проверять отражения, обходить «Глазок» в Мглине<\/td><\/tr><tr><td>Осколок зеркала<\/td><td>Показывает фрагмент реальности в иллюзорной зоне<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s39-5\">Письмо, ритуал, краска<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Использование<\/th><\/tr><\/thead><tbody><tr><td>Мел<\/td><td>Метки в лабиринтах; счёт ступеней в Мглине<\/td><\/tr><tr><td>Кусок мела с красной пылью<\/td><td>Заметные знаки; в цветовой системе — «красный»<\/td><\/tr><tr><td>Уголь<\/td><td>Знаки, быстрые записи; угольные эскизы в городе «стираются» им же<\/td><\/tr><tr><td>Перо и чернила<\/td><td>Письмо, символы<\/td><\/tr><tr><td>Красные чернила<\/td><td>Заменитель крови для некоторых загадок<\/td><\/tr><tr><td>Записная книжка<\/td><td>Заметки, карты, символы<\/td><\/tr><tr><td>Кусок холста<\/td><td>Перевязка, маскировка, живопись<\/td><\/tr><tr><td>Пустой флакон / пробирка<\/td><td>Образцы крови, краски, жидкости<\/td><\/tr><tr><td>Мешочек соли<\/td><td>Ритуалы, консервация; соль на страницах Палимпсеста<\/td><\/tr><tr><td>Мешочек железных опилок<\/td><td>Ритуалы; рядом с небесным железом — указывают направление к Кратеру<\/td><\/tr><tr><td>Медный колокольчик<\/td><td>Сигнал; иногда реагирует на сверхъестественное<\/td><\/tr><tr><td>Свисток<\/td><td>Дальний сигнал; прерывает «KNEEL» Короля Крыс<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s39-6\">Улики и загадочное<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Использование<\/th><\/tr><\/thead><tbody><tr><td>Старый ключ<\/td><td>Подходи
