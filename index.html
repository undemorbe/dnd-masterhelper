иная с ближайшей к Кратеру локации). Отбить — можно, но артефакт будет у Сосуда в другом месте.<\/li><li><strong>Картина с собой.<\/strong> Каждый раз, когда партия делает долгую передышку, мастер описывает одну перемену на холсте (Тесори, Сайлас, горожане). Это канал подсказок и угроз.<\/li><li><strong>Эмоция локации<\/strong> — в каждой локации действует своё правило заражения (см. механику «Отголоски»).<\/li><\/ul><h2 id=\"s13-2\">Хаб: Перекрёсток и хоспис «Тихая палата»<\/h2><p>Старое здание карантинного хосписа на перекрёстке четырёх дорог. Белые простыни сушатся на ветру. Внутри тихо, чисто и пахнет карболкой. <strong>Безопасное место<\/strong>: здесь можно делать долгую передышку без риска.<\/p><h3>Кто здесь<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Роль<\/th><th>Что даёт<\/th><\/tr><\/thead><tbody><tr><td><strong>Элиас Вейл<\/strong><\/td><td>Врач, хозяин хосписа<\/td><td>Лечение тяжёлых травм, снятие Мазков, медицинская линия записей<\/td><\/tr><tr><td><strong>Талисса Грейвуд<\/strong><\/td><td>Полуэльф, сестра милосердия<\/td><td>Лечение лёгких и средних травм, продажа медикаментов, слухи с дорог<\/td><\/tr><tr><td><strong>Дургар Ночной Молот<\/strong><\/td><td>Дварф-кузнец, бывший оружейник Бастиона<\/td><td>Улучшения +1…+3; ковка из небесного железа (+4 — только сюжетно)<\/td><\/tr><tr><td><strong>Вейлар Тёмный Лист<\/strong><\/td><td>Эльф-проводник, хромой<\/td><td>Карты дорог, сокращение пути, ловушки на дорогах<\/td><\/tr><tr><td><strong>Веспер Мор<\/strong> (после Акта I)<\/td><td>Переносит стойку в хоспис<\/td><td>Торговля, слухи, ставки (мини-игра), история карьера<\/td><\/tr><\/tbody><\/table><\/div><h3>Элиас: как работает лечение<\/h3><ul><li><strong>Обычная медицина<\/strong> — бесплатно, но медленно: 1 травма за долгую передышку, лёгкая или средняя.<\/li><li><strong>Дар<\/strong> — мгновенно снимает <strong>любую<\/strong> травму и <strong>все Мазки<\/strong>. Побочный эффект: возвращает персонажа «к тому, каким он был» — бросьте 1d6: 1–2 — пропадает одна недавняя память (о последней сессии); 3–4 — магический предмет, к которому персонаж настроен, теряет настройку; 5–6 — без побочных эффектов.<\/li><li>После третьего применения дара на героях Элиас отказывается — ему страшно.<\/li><\/ul><h3>Крючки хаба<\/h3><ul><li><strong>Журнал смертей.<\/strong> Элиас разрешит прочитать его, только если герои расскажут правду о городе. Последняя запись: имя одного из нарисованных NPC, которых знают герои, — с датой <strong>в будущем<\/strong>.<\/li><li><strong>Письмо брату.<\/strong> Нарисованный Элиас передал письмо «настоящему». Элиас не может его открыть — бумага превращается в краску в его руках.<\/li><li><strong>Дургар<\/strong> узнаёт стиль ковки на любом оружии из Бастиона и рассказывает о кинжале из небесного железа.<\/li><li><strong>Талисса<\/strong> влюблена в одного из пациентов — нарисованного, который приходит из Картины по ночам (сквозь холст, если его оставить развёрнутым).<\/li><\/ul><h3>Костры путников<\/h3><p>На дорогах между локациями стоят старые сторожевые костры. Зажжённый костёр — <strong>точка безопасного отдыха<\/strong> (короткая передышка без случайных встреч) и место, где можно оставить метку для Вейлара. Погасший тёплый костёр — знак, что культ прошёл здесь недавно.<\/p><h2 id=\"s13-3\">Случайные встречи на дорогах (1d8)<\/h2><div class=\"tbl\"><table><thead><tr><th>d8<\/th><th>Встреча<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Повозка беженцев из Гравенхольма. Один из них — нарисованный, он сбежал из Картины и медленно выцветает.<\/td><\/tr><tr><td>2<\/td><td>Патруль охотников Бастиона ищет беглого раба (Дрейвена Нокса или другого).<\/td><\/tr><tr><td>3<\/td><td>Двое культистов несут закрытый паланкин. Внутри — человек без лица, уже «уравненный».<\/td><\/tr><tr><td>4<\/td><td>Стая крыс. Если у героев каменная корона — крысы приносят предмет (бросьте по таблице находок).<\/td><\/tr><tr><td>5<\/td><td>Туман из Мглина. Спасбросок Мудрости СЛ 12 или персонаж забывает, куда шла партия (теряет 1 час).<\/td><\/tr><tr><td>6<\/td><td>Странствующий торговец (Броммир, если выжил). Продаёт обычные предметы и одно оружие уровня партии.<\/td><\/tr><tr><td>7<\/td><td>Брошенная клетка зверинца — пустая, прутья погрызены изнутри.<\/td><\/tr><tr><td>8<\/td><td>Погасший тёплый костёр. Рядом — листовка культа: «Будь как все. Это не больно.»<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s13-4\">Лавка хаба<\/h2><div class=\"tbl\"><table><thead><tr><th>Товар<\/th><th>Кто продаёт<\/th><th>Цена<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>Бинты (5)<\/td><td>Талисса<\/td><td>5 зм<\/td><td>Остановить кровотечение<\/td><\/tr><tr><td>Медицинская склянка<\/td><td>Талисса<\/td><td>25 зм<\/td><td>1d4+1 хит<\/td><\/tr><tr><td>Обезболивающая настойка<\/td><td>Талисса<\/td><td>30 зм<\/td><td>Подавить травму<\/td><\/tr><tr><td>Шина<\/td><td>Талисса<\/td><td>10 зм<\/td><td>Травма конечности на ступень легче<\/td><\/tr><tr><td>Антисептический порошок<\/td><td>Талисса<\/td><td>15 зм<\/td><td>Преимущество против болезни<\/td><\/tr><tr><td>Флакон масла, свечи, спички<\/td><td>Веспер<\/td><td>1–5 зм<\/td><td>Свет<\/td><\/tr><tr><td>Растворитель (1 применение)<\/td><td>Веспер, «из-под стойки»<\/td><td>50 зм<\/td><td>2d6 нарисованному<\/td><\/tr><tr><td>Улучшение +1 / +2 / +3<\/td><td>Дургар<\/td><td>50 / 150 / 400 зм + материалы<\/td><td>См. раздел 38<\/td><\/tr><tr><td>Карты дорог<\/td><td>Вейлар<\/td><td>20 зм<\/td><td>Путь до любой локации на день короче<\/td><\/tr><tr><td>Ставки в Buckshot<\/td><td>Веспер<\/td><td>—<\/td><td>См. мини-игры<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s13-5\">Тяжёлые выборы хаба<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Дар Элиаса<\/strong><\/td><td>Мгновенно снимает все Мазки и любую травму, но может стереть память или магию предмета. После третьего раза Элиас откажется навсегда<\/td><\/tr><tr><td><strong>Журнал смертей<\/strong><\/td><td>В журнале — имя любимого героями нарисованного NPC с датой в будущем. Сказать ему? Попытаться изменить?<\/td><\/tr><tr><td><strong>Талисса и ночной гость<\/strong><\/td><td>Её возлюбленный выходит из Картины по ночам. Если холст сворачивать на ночь — он не придёт. Если держать развёрнутым — из холста может выйти и что-то ещё<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s13-1", "Общие правила Акта II"], ["s13-2", "Хаб: Перекрёсток и хоспис «Тихая палата»"], ["s13-3", "Случайные встречи на дорогах (1d8)"], ["s13-4", "Лавка хаба"], ["s13-5", "Тяжёлые выборы хаба"]], "text": "Выйдя из Картины, герои попадают в настоящий мир: серый, сырой, опустевший после чумы. Полуостров — кольцо дорог вокруг центрального Перекрёстка , от которого расходятся пути к четырём локациям ритуала. На горизонте в центре полуострова видно Обсерваторию и тёмную чашу Кратера . Общие правила Акта II Свободный порядок. Игроки выбирают, куда идти. Сложность растёт не от локации, а от уровня партии и Часов Культа . Часы Культа (8 делений). +1 за каждую неделю игрового времени, +2 когда герои покидают локацию, не забрав артефакт. Каждые 2 деления культ забирает один из оставшихся артефактов (начиная с ближайшей к Кратеру локации). Отбить — можно, но артефакт будет у Сосуда в другом месте. Картина с собой. Каждый раз, когда партия делает долгую передышку, мастер описывает одну перемену на холсте (Тесори, Сайлас, горожане). Это канал подсказок и угроз. Эмоция локации — в каждой локации действует своё правило заражения (см. механику «Отголоски»). Хаб: Перекрёсток и хоспис «Тихая палата» Старое здание карантинного хосписа на перекрёстке четырёх дорог. Белые простыни сушатся на ветру. Внутри тихо, чисто и пахнет карболкой. Безопасное место : здесь можно делать долгую передышку без риска. Кто здесь NPC Роль Что даёт Элиас Вейл Врач, хозяин хосписа Лечение тяжёлых травм, снятие Мазков, медицинская линия записей Талисса Грейвуд Полуэльф, сестра милосердия Лечение лёгких и средних травм, продажа медикаментов, слухи с дорог Дургар Ночной Молот Дварф-кузнец, бывший оружейник Бастиона Улучшения +1…+3; ковка из небесного железа (+4 — только сюжетно) Вейлар Тёмный Лист Эльф-проводник, хромой Карты дорог, сокращение пути, ловушки на дорогах Веспер Мор (после Акта I) Переносит стойку в хоспис Торговля, слухи, ставки (мини-игра), история карьера Элиас: как работает лечение Обычная медицина — бесплатно, но медленно: 1 травма за долгую передышку, лёгкая или средняя. Дар — мгновенно снимает любую травму и все Мазки . Побочный эффект: возвращает персонажа «к тому, каким он был» — бросьте 1d6: 1–2 — пропадает одна недавняя память (о последней сессии); 3–4 — магический предмет, к которому персонаж настроен, теряет настройку; 5–6 — без побочных эффектов. После третьего применения дара на героях Элиас отказывается — ему страшно. Крючки хаба Журнал смертей. Элиас разрешит прочитать его, только если герои расскажут правду о городе. Последняя запись: имя одного из нарисованных NPC, которых знают герои, — с датой в будущем . Письмо брату. Нарисованный Элиас передал письмо «настоящему». Элиас не может его открыть — бумага превращается в краску в его руках. Дургар узнаёт стиль ковки на любом оружии из Бастиона и рассказывает о кинжале из небесного железа. Талисса влюблена в одного из пациентов — нарисованного, который приходит из Картины по ночам (сквозь холст, если его оставить развёрнутым). Костры путников На дорогах между локациями стоят старые сторожевые костры. Зажжённый костёр — точка безопасного отдыха (короткая передышка без случайных встреч) и место, где можно оставить метку для Вейлара. Погасший тёплый костёр — знак, что культ прошёл здесь недавно. Случайные встречи на дорогах (1d8) d8 Встреча 1 Повозка беженцев из Гравенхольма. Один из них — нарисованный, он сбежал из Картины и медленно выцветает. 2 Патруль охотников Бастиона ищет беглого раба (Дрейвена Нокса или другого). 3 Двое культистов несут закрытый паланкин. Внутри — человек без лица, уже «уравненный». 4 Стая крыс. Если у героев каменная корона — крысы приносят предмет (бросьте по таблице находок). 5 Туман из Мглина. Спасбросок Мудрости СЛ 12 или персонаж забывает, куда шла партия (теряет 1 час). 6 Странствующий торговец (Броммир, если выжил). Продаёт обычные предметы и одно оружие уровня партии. 7 Брошенная клетка зверинца — пустая, прутья погрызены изнутри. 8 Погасший тёплый костёр. Рядом — листовка культа: «Будь как все. Это не больно.» Лавка хаба Товар Кто продаёт Цена Эффект Бинты (5) Талисса 5 зм Остановить кровотечение Медицинская склянка Талисса 25 зм 1d4+1 хит Обезболивающая настойка Талисса 30 зм Подавить травму Шина Талисса 10 зм Травма конечности на ступень легче Антисептический порошок Талисса 15 зм Преимущество против болезни Флакон масла, свечи, спички Веспер 1–5 зм Свет Растворитель (1 применение) Веспер, «из-под стойки» 50 зм 2d6 нарисованному Улучшение +1 / +2 / +3 Дургар 50 / 150 / 400 зм + материалы См. раздел 38 Карты дорог Вейлар 20 зм Путь до любой локации на день короче Ставки в Buckshot Веспер — См. мини-игры Тяжёлые выборы хаба Выбор Почему тяжело Дар Элиаса Мгновенно снимает все Мазки и любую травму, но может стереть память или магию предмета. После третьего раза Элиас откажется навсегда Журнал смертей В журнале — имя любимого героями нарисованного NPC с датой в будущем. Сказать ему? Попытаться изменить? Талисса и ночной гость Её возлюбленный выходит из Картины по ночам. Если холст сворачивать на ночь — он не придёт. Если держать развёрнутым — из холста может выйти и что-то ещё"}, {"id": "s14", "n": 14, "title": "МГЛИН И ДОМ «ТЕРПЕНИЕ»", "disp": "Мглин и дом «Терпение»", "group": "Акт II", "html": "<p><strong>Артефакт:<\/strong> Фотография. <strong>Эмоция:<\/strong> Скрытность. <strong>Рекомендуемый уровень:<\/strong> 3–5. <strong>Музыка:<\/strong> Туман / гром, Внутри здания, Эмбиент.<\/p><p>Мглин — рыбацкий городок в низине, утонувший в белом тумане. Почти все жители переселились в единственное каменное здание — семиэтажный доходный дом <strong>«Терпение»<\/strong>. Правило дома, написанное на каждой двери: <strong>«НЕ СМОТРИ НАРУЖУ»<\/strong>. Окна заколочены, заклеены газетами, закрашены.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Туман — это Скрытность Посланца. Тот, кого туман «увидит», начинает исчезать из памяти других. Сначала его забывают соседи, потом семья, потом он сам. Управляющий домом <strong>Зефер Ноктрейн<\/strong> — Сосуд Скрытности — тайно «подменяет» жильцов: забытые люди становятся его слугами, которых никто не замечает.<\/p><\/div><h2 id=\"s14-1\">Атмосфера<\/h2><ul><li>Длинные коридоры с тусклыми лампами. Счётчики газа щёлкают сами по себе.<\/li><li>Жильцы не выходят из квартир. Общаются через двери и записки.<\/li><li>Каждую ночь в 3:00 — стук в дверь. Никто не открывает.<\/li><li>На лестничных клетках висят фотографии жильцов, подписанные: «Это я. Не забудь.»<\/li><\/ul><h2 id=\"s14-2\">Правило локации: Забвение<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> В начале локации каждый игрок записывает на карточку <strong>3 воспоминания<\/strong> персонажа: имя близкого человека, одно умение (навык или владение), одну важную вещь. Когда персонаж проваливает спасбросок против Скрытности (СЛ 13, Мудрость), он <strong>теряет одно воспоминание<\/strong> на выбор мастера: не может использовать этот навык, не узнаёт этого человека (и NPC перестаёт узнавать его), не видит этот предмет. Воспоминание возвращается, если персонажа <strong>сфотографирует Селена<\/strong> или если он увидит себя на фотографии.<\/p><\/div><p><strong>Когда бросать:<\/strong> выглянуть наружу; провести ночь в доме без фотографии; встретить взгляд «никого»; открыть дверь на стук в 3:00.<\/p><h2 id=\"s14-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Этаж<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Подвал<\/td><td>Котельная, прачечная с одеждой забытых людей<\/td><td>Слуги Зефера (невидимые, пока не сфотографированы)<\/td><\/tr><tr><td>1 — Вестибюль<\/td><td>Конторка управляющего, почтовые ящики, лифт без кнопок<\/td><td>Лифт везёт туда, куда ты «забыл»<\/td><\/tr><tr><td>2–3<\/td><td>Квартиры семей, общая кухня<\/td><td>Жильцы-параноики, ловушки за дверями<\/td><\/tr><tr><td>4<\/td><td>Квартира 44 — «Тот, кто считает ступени»<\/td><td>Лестница меняет число ступеней<\/td><\/tr><tr><td>4½<\/td><td><strong>Этаж, которого нет.<\/strong> Квартира 0<\/td><td>Сюда попадают только забывшие что-то; здесь Фотография<\/td><\/tr><tr><td>5–6<\/td><td>Пустые квартиры, «гостиные» Зефера<\/td><td>Встречи с «Гостями»<\/td><\/tr><tr><td>7 — Мансарда<\/td><td>Тёмная комната Селены Морвейн<\/td><td>Безопасное место (красный свет)<\/td><\/tr><tr><td>Крыша<\/td><td>Единственное место, откуда видно Мглин сверху<\/td><td>Взгляд наружу = бросок Забвения с помехой<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s14-4\">Ключевые NPC<\/h2><h3>Селена Морвейн — фотограф<\/h3><ul><li>Человек, 30 лет. Пальцы в пятнах реактивов, на шее — фотоаппарат-гармошка отца.<\/li><li>Каждый день фотографирует жильцов, чтобы они помнили себя. Её стена в мансарде — 400 лиц.<\/li><li>Дочь <strong>Аурела Морвейна<\/strong>, сделавшего <strong>последнюю фотографию настоящего Гравенхольма<\/strong> за день до «перерисовки». Отец пропал — его забыли все, кроме неё.<\/li><li><strong>Связь:<\/strong> её портрет плачет в мастерской Сайласа. Сайлас когда-то был в неё влюблён.<\/li><li><strong>Что хочет:<\/strong> вернуть отца. Узнать, почему её портрет плачет.<\/li><li><strong>Механика:<\/strong> фотография от Селены возвращает потерянные воспоминания и делает видимыми слуг Зефера. Её вспышка — <strong>прерывание подготовки<\/strong> любого существа Скрытности.<\/li><\/ul><h3>Зефер Ноктрейн — управляющий, Сосуд Скрытности<\/h3><ul><li>Тифлинг. Его лицо невозможно запомнить: каждый раз, отвернувшись, герои описывают его по-разному.<\/li><li>Вежлив, предупредителен, знает всё о каждом жильце.<\/li><li>Искренне считает, что <strong>забвение — милосердие<\/strong>: «Они пережили чуму, потеряли детей. Я просто помог им не помнить.»<\/li><li>Хранит Фотографию в квартире 0: «Нельзя украсть то, что никто не помнит.»<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Старуха Мэйв (кв. 21)<\/td><td>Слепая жилица<\/td><td>Не боится тумана — ей нечего видеть. Знает, где этаж 4½: «Там, где я забыла сына».<\/td><\/tr><tr><td>«Счётчик» (кв. 44)<\/td><td>Мужчина, считающий ступени<\/td><td>Если число ступеней изменилось — значит, по дому прошёл Гость. Его тетрадь — карта изменений.<\/td><\/tr><tr><td>Аурел Морвейн<\/td><td>Отец Селены, слуга Зефера<\/td><td>Забытый, невидимый, моет полы в подвале. Сфотографировать его — вернуть.<\/td><\/tr><tr><td>Близнецы Хэлл (кв. 32)<\/td><td>Дети, играющие в прятки<\/td><td>Один из них уже не существует — второй этого не знает. Если найти «спрятавшегося» — откроется путь вниз.<\/td><\/tr><tr><td>Гость<\/td><td>Тот, кто стучит в 3:00<\/td><td>Существо Скрытности в форме того, кого ты забыл. Говорит голосом близкого.<\/td><\/tr><tr><td>Нерисса Вейл<\/td><td>Сосуд-посредник культа<\/td><td>Приходит за Фотографией через 2 дня после героев. Предлагает Селене вернуть отца в обмен на снимок.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s14-5\">Ловушки<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Глазок<\/td><td>Посмотрев в дверной глазок, видишь себя со спины. Бросок Забвения.<\/td><td>Смотреть через зеркальце<\/td><\/tr><tr><td>Лифт без кнопок<\/td><td>Едет на этаж, который ты «потерял»; при неудачном выходе — 3d6 дробящего (шахта)<\/td><td>Записать нужный этаж на бумаге и держать в руке<\/td><\/tr><tr><td>Стук в 3:00<\/td><td>Открывший дверь видит Гостя: спасбросок Мудрости СЛ 13, провал — теряет воспоминание о близком человеке<\/td><td>Не открывать; ответить его именем (Гость уходит)<\/td><\/tr><tr><td>Счёт ступеней<\/td><td>Лестница между 4 и 5 этажами то длиннее, то короче. Без счёта — выходишь на 4½ без подготовки<\/td><td>Тетрадь Счётчика; мел на каждой ступени<\/td><\/tr><tr><td>Прачечная забытых<\/td><td>Чужая одежда тянется к герою и «примеряет» его: спасбросок Силы СЛ 12, провал — опутан, внешность меняется на час<\/td><td>Огонь, острый нож, назвать имя владельца одежды<\/td><\/tr><tr><td>Белое окно<\/td><td>Окно без досок. Кто посмотрит — бросок Забвения с помехой<\/td><td>Закрыть глаза (ослеплён на время прохода)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s14-6\">Сюжетные линии<\/h2><ol><li><strong>Отец Селены.<\/strong> Найти Аурела среди слуг Зефера и сфотографировать его. Аурел помнит, где лежит его последний снимок, — в квартире 0.<\/li><li><strong>Этаж, которого нет.<\/strong> Чтобы попасть на 4½, персонаж должен <strong>добровольно забыть<\/strong> одно воспоминание (отдать карточку). Только забывший видит дверь.<\/li><li><strong>Жильцы против тумана.<\/strong> Жильцы Мглина хотят выйти наружу, но боятся. Герои могут «вылечить» дом — снять Скрытность, победив Зефера, — но тогда жильцы <strong>вспомнят<\/strong> всё: чуму, смерти, вину. Некоторые попросят оставить их в забвении.<\/li><li><strong>Вторая половина.<\/strong> Половина фотографии из шкатулки совпадает с половиной из квартиры 0. Вместе — полная <strong>Фотография<\/strong>.<\/li><\/ol><h2 id=\"s14-7\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Это я. Не забудь.»<\/td><td>Селена<\/td><td>Сфотографировать 5 забытых жильцов в разных частях дома<\/td><td>Именная фотография каждого героя (иммунитет к одному провалу Забвения)<\/td><\/tr><tr><td>«Близнецы»<\/td><td>Хэлл<\/td><td>Найти брата, которого никто не помнит<\/td><td>Ключ от подвала; доверие жильцов<\/td><\/tr><tr><td>«Стук»<\/td><td>Старуха Мэйв<\/td><td>Пережить ночь и узнать, кто стучит к ней<\/td><td>Мэйв рассказывает про этаж 4½<\/td><\/tr><tr><td>«Последний снимок» (основной)<\/td><td>—<\/td><td>Добыть Фотографию из квартиры 0<\/td><td><strong>Фотография<\/strong> (артефакт)<\/td><\/tr><tr><td>«Сделка Нериссы»<\/td><td>Нерисса<\/td><td>Отдать Фотографию культу в обмен на возвращение Аурела без боя<\/td><td>Аурел возвращён, но культ +1 артефакт<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s14-8\">Босс: Зефер Ноктрейн, «Тот, кого нет»<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>75 (уровень 4) / 110 (уровень 5+)<\/td><\/tr><tr><td>КД<\/td><td>14<\/td><\/tr><tr><td>Особенность<\/td><td><strong>Незамеченный:<\/strong> невидим, пока не сфотографирован, не отражён в зеркале или пока кто-то не произнесёт его имя (каждое произнесение — 1 раунд видимости)<\/td><\/tr><tr><td>Атака<\/td><td>Кинжал забвения: 2d6 колющего + спасбросок Мудрости СЛ 13 или потеря воспоминания<\/td><\/tr><tr><td>Подготовка<\/td><td>«Стереть из кадра» — выбирает героя: если не прервать, герой исчезает из боя на 1d4 раунда (его никто не помнит, союзники не могут ему помочь)<\/td><\/tr><tr><td>Прерывание<\/td><td>Вспышка фотоаппарата, произнесённое имя Зефера, свет фонаря в упор<\/td><\/tr><tr><td>Надлом<\/td><td>Когда его сфотографировали трижды за бой — Зефер «вспоминает» себя и теряет невидимость до конца боя<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Зефер — сам первая жертва. Он забыл, кем был, — его лицо стёрто так же, как лица его слуг. На Фотографии настоящего Гравенхольма в толпе есть молодой тифлинг — это он. Показав ему снимок, бой можно закончить разговором.<\/p><\/div><h2 id=\"s14-9\">Награды локации<\/h2><ul><li><strong>Фотография<\/strong> (артефакт ритуала).<\/li><li><strong>Фотоаппарат Аурела<\/strong> (если отец вернулся и подарил): 3 вспышки за долгую передышку; вспышка — прерывание подготовки существ Скрытности и иллюзий, раскрывает невидимое в 9 м.<\/li><li>Оружие: <strong>Кинжал забвения<\/strong> (уровень 4, см. таблицу оружия).<\/li><\/ul><h2 id=\"s14-10\">Личные крючки героев<\/h2><ul><li><strong>Эстел — мать и забытая деталь.<\/strong> Среди невидимых слуг Зефера в подвале работает женщина-табакси с седой мордой. Её не помнит никто, включая её саму. Если Селена её сфотографирует — она вспомнит имя дочери, но не сына («у меня был мальчик? нет… не помню»). Отдельно: <strong>фотография Селены возвращает Эстелу забытую деталь<\/strong> встречи у трактира — одинокий серп на поясе незнакомца.<\/li><li><strong>Велисса — зеркало желаний.<\/strong> В доме, где все прячутся, зеркало Велиссы показывает не желания, а <strong>страх быть забытым<\/strong>. Её очарование (Желание) против Скрытности работает с преимуществом — жильцы хотят, чтобы их кто-то хотел видеть. Но каждое очарование здесь — бросок Забвения для цели.<\/li><li><strong>Ума — рапорт.<\/strong> В Мглине Ума впервые получает приказ из дома: ночная бабочка-гонец с печатью страны фэйри (см. раздел 33). Приказ требует «изъять артефакт и вернуться», не дожидаясь союзников.<\/li><\/ul><h2 id=\"s14-11\">Находки Мглина<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Фотоаппарат Аурела<\/strong><\/td><td>Подарок Аурела (если вернулся)<\/td><td>3 вспышки за долгую передышку; прерывание существ Скрытности, раскрытие невидимого в 9 м<\/td><\/tr><tr><td><strong>Именные фотографии<\/strong><\/td><td>Селена, квест «Это я. Не забудь.»<\/td><td>Иммунитет к одному провалу Забвения<\/td><\/tr><tr><td><strong>Кинжал забвения<\/strong><\/td><td>Зефер Ноктрейн<\/td><td>Оружие 4 уровня, уникальное<\/td><\/tr><tr><td><strong>Зеркальный клинок<\/strong><\/td><td>Квартира 44<\/td><td>Оружие 3 уровня<\/td><\/tr><tr><td><strong>Колокол-кистень<\/strong><\/td><td>Сторожка у входа в дом<\/td><td>Оружие 3 уровня<\/td><\/tr><tr><td><strong>Тетрадь Счётчика<\/strong><\/td><td>Квартира 44<\/td><td>Карта изменений дома; снимает ловушку «Счёт ступеней»<\/td><\/tr><tr><td><strong>Плащ из прачечной забытых<\/strong><\/td><td>Подвал<\/td><td>Надевший забывается окружающими на 1 минуту (как невидимость, 1 раз в день), но бросает Забвение<\/td><\/tr><tr><td><strong>Проявитель в склянке<\/strong> (3)<\/td><td>Тёмная комната Селены<\/td><td>Пролитый на пустое место — показывает, что там было спрятано (текст, предмет, невидимый слуга)<\/td><\/tr><tr><td><strong>Чёрный металл<\/strong> (2)<\/td><td>Котельная<\/td><td>Материал для улучшения +3<\/td><\/tr><tr><td><strong>Вторая половина фотографии<\/strong><\/td><td>Квартира 0<\/td><td>Вместе с первой — <strong>Фотография<\/strong> (артефакт)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s14-12\">Тяжёлые выборы Мглина<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Снять Скрытность с дома<\/strong><\/td><td>Победа над Зефером вернёт жильцам память — о чуме, умерших детях, своей вине. Старуха Мэйв просит: «Оставьте мне забвение. Я заслужила тишину»<\/td><\/tr><tr><td><strong>Что отдать на этаж 4½<\/strong><\/td><td>Чтобы найти дверь, персонаж <strong>добровольно<\/strong> отдаёт одно воспоминание. Эстел может отдать память о хозяине — и тогда печать перестанет пугать его, но и Корвина он не узнает<\/td><\/tr><tr><td><strong>Сделка Нериссы<\/strong><\/td><td>Отдать Фотографию культу — Аурел вернётся без боя, и Селена будет счастлива. Не отдавать — бой, в котором Аурел может погибнуть<\/td><\/tr><tr><td><strong>Мать Эстела<\/strong><\/td><td>Если её сфотографировать, она вспомнит дочь, но не сына. Сказать ей правду или позволить помнить только дочь?<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s14-1", "Атмосфера"], ["s14-2", "Правило локации: Забвение"], ["s14-3", "Зоны"], ["s14-4", "Ключевые NPC"], ["s14-5", "Ловушки"], ["s14-6", "Сюжетные линии"], ["s14-7", "Квесты"], ["s14-8", "Босс: Зефер Ноктрейн, «Тот, кого нет»"], ["s14-9", "Награды локации"], ["s14-10", "Личные крючки героев"], ["s14-11", "Находки Мглина"], ["s14-12", "Тяжёлые выборы Мглина"]], "text": "Артефакт: Фотография. Эмоция: Скрытность. Рекомендуемый уровень: 3–5. Музыка: Туман / гром, Внутри здания, Эмбиент. Мглин — рыбацкий городок в низине, утонувший в белом тумане. Почти все жители переселились в единственное каменное здание — семиэтажный доходный дом «Терпение» . Правило дома, написанное на каждой двери: «НЕ СМОТРИ НАРУЖУ» . Окна заколочены, заклеены газетами, закрашены. Тайна · только для мастера Туман — это Скрытность Посланца. Тот, кого туман «увидит», начинает исчезать из памяти других. Сначала его забывают соседи, потом семья, потом он сам. Управляющий домом Зефер Ноктрейн — Сосуд Скрытности — тайно «подменяет» жильцов: забытые люди становятся его слугами, которых никто не замечает. Атмосфера Длинные коридоры с тусклыми лампами. Счётчики газа щёлкают сами по себе. Жильцы не выходят из квартир. Общаются через двери и записки. Каждую ночь в 3:00 — стук в дверь. Никто не открывает. На лестничных клетках висят фотографии жильцов, подписанные: «Это я. Не забудь.» Правило локации: Забвение Важно В начале локации каждый игрок записывает на карточку 3 воспоминания персонажа: имя близкого человека, одно умение (навык или владение), одну важную вещь. Когда персонаж проваливает спасбросок против Скрытности (СЛ 13, Мудрость), он теряет одно воспоминание на выбор мастера: не может использовать этот навык, не узнаёт этого человека (и NPC перестаёт узнавать его), не видит этот предмет. Воспоминание возвращается, если персонажа сфотографирует Селена или если он увидит себя на фотографии. Когда бросать: выглянуть наружу; провести ночь в доме без фотографии; встретить взгляд «никого»; открыть дверь на стук в 3:00. Зоны Этаж Что там Опасность Подвал Котельная, прачечная с одеждой забытых людей Слуги Зефера (невидимые, пока не сфотографированы) 1 — Вестибюль Конторка управляющего, почтовые ящики, лифт без кнопок Лифт везёт туда, куда ты «забыл» 2–3 Квартиры семей, общая кухня Жильцы-параноики, ловушки за дверями 4 Квартира 44 — «Тот, кто считает ступени» Лестница меняет число ступеней 4½ Этаж, которого нет. Квартира 0 Сюда попадают только забывшие что-то; здесь Фотография 5–6 Пустые квартиры, «гостиные» Зефера Встречи с «Гостями» 7 — Мансарда Тёмная комната Селены Морвейн Безопасное место (красный свет) Крыша Единственное место, откуда видно Мглин сверху Взгляд наружу = бросок Забвения с помехой Ключевые NPC Селена Морвейн — фотограф Человек, 30 лет. Пальцы в пятнах реактивов, на шее — фотоаппарат-гармошка отца. Каждый день фотографирует жильцов, чтобы они помнили себя. Её стена в мансарде — 400 лиц. Дочь Аурела Морвейна , сделавшего последнюю фотографию настоящего Гравенхольма за день до «перерисовки». Отец пропал — его забыли все, кроме неё. Связь: её портрет плачет в мастерской Сайласа. Сайлас когда-то был в неё влюблён. Что хочет: вернуть отца. Узнать, почему её портрет плачет. Механика: фотография от Селены возвращает потерянные воспоминания и делает видимыми слуг Зефера. Её вспышка — прерывание подготовки любого существа Скрытности. Зефер Ноктрейн — управляющий, Сосуд Скрытности Тифлинг. Его лицо невозможно запомнить: каждый раз, отвернувшись, герои описывают его по-разному. Вежлив, предупредителен, знает всё о каждом жильце. Искренне считает, что забвение — милосердие : «Они пережили чуму, потеряли детей. Я просто помог им не помнить.» Хранит Фотографию в квартире 0: «Нельзя украсть то, что никто не помнит.» Второстепенные NPC NPC Кто Крючок / функция Старуха Мэйв (кв. 21) Слепая жилица Не боится тумана — ей нечего видеть. Знает, где этаж 4½: «Там, где я забыла сына». «Счётчик» (кв. 44) Мужчина, считающий ступени Если число ступеней изменилось — значит, по дому прошёл Гость. Его тетрадь — карта изменений. Аурел Морвейн Отец Селены, слуга Зефера Забытый, невидимый, моет полы в подвале. Сфотографировать его — вернуть. Близнецы Хэлл (кв. 32) Дети, играющие в прятки Один из них уже не существует — второй этого не знает. Если найти «спрятавшегося» — откроется путь вниз. Гость Тот, кто стучит в 3:00 Существо Скрытности в форме того, кого ты забыл. Говорит голосом близкого. Нерисса Вейл Сосуд-посредник культа Приходит за Фотографией через 2 дня после героев. Предлагает Селене вернуть отца в обмен на снимок. Ловушки Ловушка Описание Обход Глазок Посмотрев в дверной глазок, видишь себя со спины. Бросок Забвения. Смотреть через зеркальце Лифт без кнопок Едет на этаж, который ты «потерял»; при неудачном выходе — 3d6 дробящего (шахта) Записать нужный этаж на бумаге и держать в руке Стук в 3:00 Открывший дверь видит Гостя: спасбросок Мудрости СЛ 13, провал — теряет воспоминание о близком человеке Не открывать; ответить его именем (Гость уходит) Счёт ступеней Лестница между 4 и 5 этажами то длиннее, то короче. Без счёта — выходишь на 4½ без подготовки Тетрадь Счётчика; мел на каждой ступени Прачечная забытых Чужая одежда тянется к герою и «примеряет» его: спасбросок Силы СЛ 12, провал — опутан, внешность меняется на час Огонь, острый нож, назвать имя владельца одежды Белое окно Окно без досок. Кто посмотрит — бросок Забвения с помехой Закрыть глаза (ослеплён на время прохода) Сюжетные линии Отец Селены. Найти Аурела среди слуг Зефера и сфотографировать его. Аурел помнит, где лежит его последний снимок, — в квартире 0. Этаж, которого нет. Чтобы попасть на 4½, персонаж должен добровольно забыть одно воспоминание (отдать карточку). Только забывший видит дверь. Жильцы против тумана. Жильцы Мглина хотят выйти наружу, но боятся. Герои могут «вылечить» дом — снять Скрытность, победив Зефера, — но тогда жильцы вспомнят всё: чуму, смерти, вину. Некоторые попросят оставить их в забвении. Вторая половина. Половина фотографии из шкатулки совпадает с половиной из квартиры 0. Вместе — полная Фотография . Квесты Квест Кто даёт Суть Награда «Это я. Не забудь.» Селена Сфотографировать 5 забытых жильцов в разных частях дома Именная фотография каждого героя (иммунитет к одному провалу Забвения) «Близнецы» Хэлл Найти брата, которого никто не помнит Ключ от подвала; доверие жильцов «Стук» Старуха Мэйв Пережить ночь и узнать, кто стучит к ней Мэйв рассказывает про этаж 4½ «Последний снимок» (основной) — Добыть Фотографию из квартиры 0 Фотография (артефакт) «Сделка Нериссы» Нерисса Отдать Фотографию культу в обмен на возвращение Аурела без боя Аурел возвращён, но культ +1 артефакт Босс: Зефер Ноктрейн, «Тот, кого нет» Параметр Значение Хиты 75 (уровень 4) / 110 (уровень 5+) КД 14 Особенность Незамеченный: невидим, пока не сфотографирован, не отражён в зеркале или пока кто-то не произнесёт его имя (каждое произнесение — 1 раунд видимости) Атака Кинжал забвения: 2d6 колющего + спасбросок Мудрости СЛ 13 или потеря воспоминания Подготовка «Стереть из кадра» — выбирает героя: если не прервать, герой исчезает из боя на 1d4 раунда (его никто не помнит, союзники не могут ему помочь) Прерывание Вспышка фотоаппарата, произнесённое имя Зефера, свет фонаря в упор Надлом Когда его сфотографировали трижды за бой — Зефер «вспоминает» себя и теряет невидимость до конца боя Тайна · только для мастера Зефер — сам первая жертва. Он забыл, кем был, — его лицо стёрто так же, как лица его слуг. На Фотографии настоящего Гравенхольма в толпе есть молодой тифлинг — это он. Показав ему снимок, бой можно закончить разговором. Награды локации Фотография (артефакт ритуала). Фотоаппарат Аурела (если отец вернулся и подарил): 3 вспышки за долгую передышку; вспышка — прерывание подготовки существ Скрытности и иллюзий, раскрывает невидимое в 9 м. Оружие: Кинжал забвения (уровень 4, см. таблицу оружия). Личные крючки героев Эстел — мать и забытая деталь. Среди невидимых слуг Зефера в подвале работает женщина-табакси с седой мордой. Её не помнит никто, включая её саму. Если Селена её сфотографирует — она вспомнит имя дочери, но не сына («у меня был мальчик? нет… не помню»). Отдельно: фотография Селены возвращает Эстелу забытую деталь встречи у трактира — одинокий серп на поясе незнакомца. Велисса — зеркало желаний. В доме, где все прячутся, зеркало Велиссы показывает не желания, а страх быть забытым . Её очарование (Желание) против Скрытности работает с преимуществом — жильцы хотят, чтобы их кто-то хотел видеть. Но каждое очарование здесь — бросок Забвения для цели. Ума — рапорт. В Мглине Ума впервые получает приказ из дома: ночная бабочка-гонец с печатью страны фэйри (см. раздел 33). Приказ требует «изъять артефакт и вернуться», не дожидаясь союзников. Находки Мглина Предмет Где Эффект Фотоаппарат Аурела Подарок Аурела (если вернулся) 3 вспышки за долгую передышку; прерывание существ Скрытности, раскрытие невидимого в 9 м Именные фотографии Селена, квест «Это я. Не забудь.» Иммунитет к одному провалу Забвения Кинжал забвения Зефер Ноктрейн Оружие 4 уровня, уникальное Зеркальный клинок Квартира 44 Оружие 3 уровня Колокол-кистень Сторожка у входа в дом Оружие 3 уровня Тетрадь Счётчика Квартира 44 Карта изменений дома; снимает ловушку «Счёт ступеней» Плащ из прачечной забытых Подвал Надевший забывается окружающими на 1 минуту (как невидимость, 1 раз в день), но бросает Забвение Проявитель в склянке (3) Тёмная комната Селены Пролитый на пустое место — показывает, что там было спрятано (текст, предмет, невидимый слуга) Чёрный металл (2) Котельная Материал для улучшения +3 Вторая половина фотографии Квартира 0 Вместе с первой — Фотография (артефакт) Тяжёлые выборы Мглина Выбор Почему тяжело Снять Скрытность с дома Победа над Зефером вернёт жильцам память — о чуме, умерших детях, своей вине. Старуха Мэйв просит: «Оставьте мне забвение. Я заслужила тишину» Что отдать на этаж 4½ Чтобы найти дверь, персонаж добровольно отдаёт одно воспоминание. Эстел может отдать память о хозяине — и тогда печать перестанет пугать его, но и Корвина он не узнает Сделка Нериссы Отдать Фотографию культу — Аурел вернётся без боя, и Селена будет счастлива. Не отдавать — бой, в котором Аурел может погибнуть Мать Эстела Если её сфотографировать, она вспомнит дочь, но не сына. Сказать ей правду или позволить помнить только дочь?"}, {"id": "s15", "n": 15, "title": "ОБИТЕЛЬ ПЕРЕПИСЧИКОВ", "disp": "Обитель переписчиков", "group": "Акт II", "html": "<p><strong>Артефакт:<\/strong> Записи (триптих). <strong>Эмоция:<\/strong> Зависть. <strong>Рекомендуемый уровень:<\/strong> 4–6. <strong>Музыка:<\/strong> Библиотека, Церковь, Ambient набор.<\/p><p>Монастырь на скале над морем, соединённый с берегом узким каменным мостом. Монахи ордена <strong>Серых Переписчиков<\/strong> веками копировали книги. Под влиянием Зависти они начали копировать <strong>всё<\/strong>: жесты, голоса, лица друг друга. Теперь в обители нельзя понять, кто кому принадлежит.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Настоятель <strong>Брат Варис Тенелист<\/strong> — Сосуд Зависти. Пять лет назад культ передал ему три текста о рождении Картины: вырванные страницы дневника Сайласа, «Казуистику» Элиаса (украденную из хосписа) и Евангелие Вести культа. Варис переписывал их сотни раз, пытаясь понять, <strong>почему дар достался не ему<\/strong>. Каждая копия чуть отличается от оригинала — и монахи верят своим копиям.<\/p><\/div><h2 id=\"s15-1\">Атмосфера<\/h2><ul><li>Тишина, нарушаемая скрипом сотен перьев.<\/li><li>Монахи в серых капюшонах. Под капюшонами — <strong>чужие лица<\/strong>, иногда лица самих героев.<\/li><li>Чернила пахнут кровью. В трапезной все едят одинаковыми движениями.<\/li><li>На стенах — бесконечные копии одной и той же фрески, с каждым разом чуть хуже.<\/li><\/ul><h2 id=\"s15-2\">Правило локации: Зависть<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый раз, когда персонаж использует <strong>особенность класса<\/strong> (заклинание, ярость, скрытую атаку, вдохновение и т.п.) на глазах у монахов, мастер ставит отметку. При 3 отметках у этого персонажа монахи <strong>скопировали<\/strong> эту особенность: один из врагов в локации может использовать её один раз. Кроме того, при провале спасброска Мудрости СЛ 13 (когда персонаж видит своё лицо на чужом человеке) он получает <strong>1 Отголосок Зависти<\/strong> (см. механику «Отголоски»).<\/p><\/div><p><strong>Обратная сторона:<\/strong> монахи <strong>не могут скопировать травмы, шрамы и Мазки<\/strong>. Всё несовершенное в героях — уникально и узнаваемо. Персонаж с травмой получает преимущество на проверки, чтобы доказать, что он — оригинал.<\/p><h2 id=\"s15-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Мост Отражений<\/td><td>Узкий мост, по бокам — пропасть и море<\/td><td>Монах-копия идёт навстречу с вашим лицом<\/td><\/tr><tr><td>Внешний двор<\/td><td>Колокольня, кладбище переписчиков<\/td><td>На надгробиях — одинаковые имена<\/td><\/tr><tr><td>Скрипторий<\/td><td>Главный зал, 200 пюпитров<\/td><td>Ловушка тишины<\/td><\/tr><tr><td><strong>Крыло Кисти<\/strong><\/td><td>Иллюминированные рукописи, мастерская миниатюр<\/td><td><strong>Дневник Сайласа<\/strong> (вырванные страницы)<\/td><\/tr><tr><td><strong>Крыло Скальпеля<\/strong><\/td><td>Анатомический театр, банки с органами<\/td><td><strong>Казуистика Элиаса<\/strong><\/td><\/tr><tr><td><strong>Крыло Веры<\/strong><\/td><td>Колокольня и тайная часовня культа<\/td><td><strong>Евангелие Вести<\/strong><\/td><\/tr><tr><td>Палимпсест<\/td><td>Подземное хранилище соскобленных книг<\/td><td>Слова со старых страниц выползают наружу<\/td><\/tr><tr><td>Келья настоятеля<\/td><td>Зеркала, сотни автопортретов Вариса<\/td><td>Финальный бой<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s15-4\">Ключевые NPC<\/h2><h3>Брат Варис Тенелист — настоятель, Сосуд Зависти<\/h3><ul><li>Эльф. Лицо постоянно «плывёт», становясь похожим на того, с кем он говорит.<\/li><li>Гениальный переписчик, лишённый собственного голоса. Всё, что он пишет, — копии.<\/li><li><strong>Что хочет:<\/strong> получить дар Вейлов. Считает, что, переписав все три записи идеально, он «перепишет» дар себе.<\/li><li><strong>Реплика:<\/strong> «Почему Бог раздаёт таланты, а не долги? Долги хотя бы можно разделить поровну.»<\/li><\/ul><h3>Сестра Лираэль Шадоумир — библиотекарь<\/h3><ul><li>Эльф, слепая на один глаз (выколола сама, чтобы не видеть чужих лиц).<\/li><li>Единственная, кто помнит, <strong>какие тексты оригинальные<\/strong>. Хранит три оригинала в тайниках каждого крыла.<\/li><li>Тайно ненавидит Вариса и боится его.<\/li><li><strong>Механика:<\/strong> отличает оригинал от копии без проверки. Без неё героям нужна проверка Расследования СЛ 15 на каждую запись.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Брат Без-Имени<\/td><td>Копия, ставшая лучше оригинала<\/td><td>Оригинал (брат Ансгар) сидит в Палимпсесте. Брат Без-Имени просит не возвращать его: «Я лучше. Я заслужил.»<\/td><\/tr><tr><td>Элирия Найтвейл<\/td><td>Эльф, иллюминатор<\/td><td>Рисует миниатюры, которые оживают на час. Ученица школы Сайласа. Знает, что делает его краска.<\/td><\/tr><tr><td>Ольгерд-переплётчик<\/td><td>Человек, переплетает книги кожей<\/td><td>Кожей кого? Задайте вопрос — получите крючок к «Казуистике».<\/td><\/tr><tr><td>Новиция Мия<\/td><td>Девочка-послушница<\/td><td>Копирует только героев. К концу локации говорит и ходит как один из них. Если её спасти — она станет «эхом» героя на всю кампанию.<\/td><\/tr><tr><td>Монах-двойник героя<\/td><td>Копия одного из персонажей<\/td><td>Появляется в первый день. Знает всё, что герой делал в обители.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s15-5\">Три записи<\/h2><div class=\"tbl\"><table><thead><tr><th>Запись<\/th><th>Где<\/th><th>Что раскрывает<\/th><th>Как добыть<\/th><\/tr><\/thead><tbody><tr><td><strong>Дневник Сайласа<\/strong> (вырванные страницы)<\/td><td>Крыло Кисти, в переплёте миниатюрного часослова<\/td><td>Как Сайлас нарисовал город; что картине нужна «модель»; что его глаз видит всё нарисованное<\/td><td>Загадка цветов на миниатюрах (та же система: синий-зелёный-красный); оживающие миниатюры охраняют страницы<\/td><\/tr><tr><td><strong>Казуистика Элиаса<\/strong><\/td><td>Крыло Скальпеля, в банке с формалином под ложным дном<\/td><td>37 случаев смертей пациентов; вывод Элиаса: «Моя рука не убивает. Она отменяет.»<\/td><td>Анатомический театр: на столе — тело, которое оживает, если его «вскрывать» неправильно (Медицина СЛ 14)<\/td><\/tr><tr><td><strong>Евангелие Вести<\/strong><\/td><td>Крыло Веры, часовня под колокольней<\/td><td>Слова Посланца; его настоящая цель; упоминание пятой эмоции — Тоски<\/td><td>Часовня охраняется культистами; колокол — ловушка<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждую запись в обители можно найти в <strong>оригинале<\/strong> и в <strong>копиях<\/strong>. Копии отличаются одной деталью — и если в ритуале использовать копию, ритуал примет <strong>искажённую<\/strong> истину (см. Финал). Это скрытая ловушка: мастер должен знать, что у героев на руках.<\/p><\/div><h2 id=\"s15-6\">Ловушки<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Скрипторий тишины<\/td><td>Любое слово вслух — все 200 монахов поворачиваются и повторяют его. Через 3 слова голос героя скопирован: монах-двойник может говорить им.<\/td><td>Жесты, записки, магия без вербальных компонентов<\/td><\/tr><tr><td>Чернильная купель<\/td><td>Купель для освящения чернил. Упавший получает 2d6 некротического и 1 Мазок (чернила с краской Сайласа)<\/td><td>Внимательность СЛ 13 — пол вокруг скользкий<\/td><\/tr><tr><td>Палимпсест<\/td><td>Соскобленные слова выползают со страниц: спасбросок Мудрости СЛ 13, провал — персонаж на 1 раунд читает вслух чужой текст (теряет действие)<\/td><td>Читать только с закрытым глазом; соль на страницах<\/td><\/tr><tr><td>Колокол Веры<\/td><td>Звонит, если кто-то несёт оригинальную запись. Спасбросок Телосложения СЛ 14, провал — 3d6 звукового, оглох<\/td><td>Обмотать колокол тканью; нести копию как приманку<\/td><\/tr><tr><td>Зеркальный коридор<\/td><td>Коридор копий: каждая следующая комната — копия предыдущей, но хуже. После 7-й — коридор рушится<\/td><td>Вернуться назад; найти «оригинальную» комнату (единственная с пылью)<\/td><\/tr><tr><td>Мост Отражений<\/td><td>Монах-копия с вашим лицом. Если атаковать его — урон получает и герой (половину)<\/td><td>Доказать, что ты — оригинал (шрам, травма)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s15-7\">Сюжетные линии<\/h2><ol><li><strong>Оригинал или копия.<\/strong> Найти все три оригинала, а не копии. Лираэль — ключ, но она поможет только если герои пообещают убить Вариса.<\/li><li><strong>Брат Без-Имени.<\/strong> Копия, которая лучше оригинала. Вернуть оригинал — справедливо, но копия добрее, умнее и полезнее. Отражение главного вопроса кампании.<\/li><li><strong>Новиция Мия.<\/strong> Девочка копирует одного из героев. Если её не спасти до конца локации, она становится его постоянной тенью — союзником, который однажды решит, что она «лучший он».<\/li><li><strong>Варис и Нерисса.<\/strong> Варис и Нерисса связаны общей обидой на «одарённых». Их переписка раскрывает, что культ уже знает о Тесори внутри Картины.<\/li><\/ol><h2 id=\"s15-8\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Три голоса» (основной)<\/td><td>—<\/td><td>Найти три оригинальные записи<\/td><td><strong>Записи<\/strong> (артефакт)<\/td><\/tr><tr><td>«Кто я?»<\/td><td>Брат Без-Имени / брат Ансгар<\/td><td>Решить, кто из двоих останется<\/td><td>Ансгар: знание о Палимпсесте; Без-Имени: свиток копии (одноразово копирует заклинание врага)<\/td><\/tr><tr><td>«Тишина»<\/td><td>Лираэль<\/td><td>Вынести её из обители живой<\/td><td>Лираэль приходит в хоспис; переводит Евангелие полностью<\/td><\/tr><tr><td>«Живые миниатюры»<\/td><td>Элирия Найтвейл<\/td><td>Найти ей краску Сайласа (1 заряд флакона)<\/td><td>Миниатюра-страж: оживлённый рисунок, 1 раз защищает героя от удара<\/td><\/tr><tr><td>«Эхо»<\/td><td>—<\/td><td>Спасти Мию от копирования<\/td><td>Мия — помощница в хосписе; знает все тайные ходы обители<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s15-9\">Босс: Брат Варис Тенелист, «Мозаика»<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>90 (уровень 5) / 130 (уровень 6+)<\/td><\/tr><tr><td>КД<\/td><td>15<\/td><\/tr><tr><td>Особенность<\/td><td><strong>Копия:<\/strong> в начале боя копирует одну особенность класса каждого героя, который использовал её в обители (см. правило локации)<\/td><\/tr><tr><td>Атака<\/td><td>Перо-стилет: 2d8 колющего; Чернильный плевок: 9 м, спасбросок Ловкости СЛ 14, ослеплён до конца хода<\/td><\/tr><tr><td>Подготовка<\/td><td>«Переписать» — касание героя; если не прервать, Варис крадёт его лицо: герой получает помеху на все проверки Харизмы, а Варис — его внешность (до конца боя)<\/td><\/tr><tr><td>Прерывание<\/td><td>Показать ему <strong>травму или шрам<\/strong> (Варис не может скопировать несовершенство и замирает); урон огнём по его рукописям<\/td><\/tr><tr><td>Фаза 2<\/td><td>При 50% хитов распадается на мозаику — 3 копии героев (по 20 хитов). Оригинальный Варис — та копия, у которой нет тени в синем свете<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Варис может быть <strong>спасён<\/strong>: если дать ему что-то по-настоящему своё — например, попросить написать что-то новое, не копию, — он впервые пишет одну строчку от себя и плачет. Зависть отпускает его. Это мирный финал локации.<\/p><\/div><h2 id=\"s15-10\">Награды локации<\/h2><ul><li><strong>Записи<\/strong> (артефакт ритуала): Дневник Сайласа, Казуистика Элиаса, Евангелие Вести.<\/li><li><strong>Перо-стилет Вариса<\/strong> (уровень 4, см. оружие).<\/li><li>Лираэль как NPC в хосписе — полный перевод Евангелия раскрывает Тоску как пятую эмоцию.<\/li><\/ul><h2 id=\"s15-11\">Личные крючки героев<\/h2><ul><li><strong>Ума — оригинал летописи.<\/strong> Летопись, по которой командование фэйри отправило Уму, — <strong>копия из этой обители<\/strong>: её продали заезжим торговцам (возможно, тем самым, с которыми когда-то ходила Велисса). В Крыле Веры лежит <strong>оригинал<\/strong>. Строка «Спасёт от чудовищ, забирая их в себя» в оригинале продолжается: <strong>«…пока жив тот, чья рука её держит. Умрёт рука — и холст отдаст всё, что взял».<\/strong> Если Сайлас умрёт, Картина выпустит всех поглощённых чудовищ. Это меняет всё для Умы.<\/li><li><strong>Велисса — вырванные страницы.<\/strong> В дневнике Сайласа есть запись о ней: «Я писал Желание грубо, не глядя. Оставил сохнуть на солнце. Свет пошёл из холста — я понял, что она смотрит на меня. Я испугался и хотел сжечь. Огонь не взял её. Я посмотрел на солнце, чтобы больше её не видеть.» Ниже — её имя, зачёркнутое и написанное снова.<\/li><li><strong>Эстел — печать в книге.<\/strong> В Крыле Скальпеля у Элиаса описан случай: «Раб с печатью Бастиона. Хозяин мёртв, печать молчит. Вывод: хозяин не мёртв — он перестал быть собой.» Подсказка, что хозяин Эстела жив.<\/li><\/ul><h2 id=\"s15-12\">Находки Обители<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Перо-стилет Вариса<\/strong><\/td><td>Варис Тенелист<\/td><td>Оружие 4 уровня, уникальное<\/td><\/tr><tr><td><strong>Свиток копии<\/strong><\/td><td>Брат Без-Имени (квест «Кто я?»)<\/td><td>Одноразово скопировать заклинание врага, которое было использовано за последний раунд<\/td><\/tr><tr><td><strong>Миниатюра-страж<\/strong><\/td><td>Элирия Найтвейл<\/td><td>Оживлённый рисунок, 1 раз принимает удар на себя<\/td><\/tr><tr><td><strong>Чернила переписчиков<\/strong> (3)<\/td><td>Скрипторий<\/td><td>Переписанный ими текст временно становится правдой для того, кто его читает (обман на 1 час, спасбросок Интеллекта СЛ 14)<\/td><\/tr><tr><td><strong>Анатомический атлас Элиаса<\/strong><\/td><td>Крыло Скальпеля<\/td><td>Преимущество на Медицину при лечении травм; с ним малая травма лечится за короткую передышку<\/td><\/tr><tr><td><strong>Ряса серого брата<\/strong><\/td><td>Кельи<\/td><td>Монахи не замечают носителя, пока он молчит<\/td><\/tr><tr><td><strong>Летопись фэйри (оригинал)<\/strong><\/td><td>Крыло Веры<\/td><td>Крючок Умы<\/td><\/tr><tr><td><strong>Осколки зеркала<\/strong> (3)<\/td><td>Зеркальный коридор<\/td><td>Материал для «Зеркального» свойства<\/td><\/tr><tr><td><strong>Соль Палимпсеста<\/strong><\/td><td>Хранилище<\/td><td>Мешочек: посыпанная страница не может «выползти»; брошенная в нарисованное — 1d6 урона<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s15-13\">Тяжёлые выборы Обители<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Брат Без-Имени или брат Ансгар<\/strong><\/td><td>Копия лучше оригинала: добрее, умнее, полезнее. Вернуть оригинал — справедливо, но жестоко<\/td><\/tr><tr><td><strong>Оригинал или копия записи<\/strong><\/td><td>Оригинал Казуистики Элиаса содержит имена всех умерших пациентов. Копия Вариса — без имён. Элиас просил героев <strong>не приносить ему оригинал<\/strong>: он не хочет знать<\/td><\/tr><tr><td><strong>Обещание Лираэль<\/strong><\/td><td>Лираэль поможет только если герои пообещают убить Вариса. Но Вариса можно спасти. Нарушить слово — потерять её помощь<\/td><\/tr><tr><td><strong>Новиция Мия<\/strong><\/td><td>Её можно спасти от копирования, только если тот герой, кого она копирует, <strong>позволит ей стать немного собой<\/strong> — отдаст ей одну свою черту навсегда (игрок выбирает: привычку, фразу, жест)<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s15-1", "Атмосфера"], ["s15-2", "Правило локации: Зависть"], ["s15-3", "Зоны"], ["s15-4", "Ключевые NPC"], ["s15-5", "Три записи"], ["s15-6", "Ловушки"], ["s15-7", "Сюжетные линии"], ["s15-8", "Квесты"], ["s15-9", "Босс: Брат Варис Тенелист, «Мозаика»"], ["s15-10", "Награды локации"], ["s15-11", "Личные крючки героев"], ["s15-12", "Находки Обители"], ["s15-13", "Тяжёлые выборы Обители"]], "text": "Артефакт: Записи (триптих). Эмоция: Зависть. Рекомендуемый уровень: 4–6. Музыка: Библиотека, Церковь, Ambient набор. Монастырь на скале над морем, соединённый с берегом узким каменным мостом. Монахи ордена Серых Переписчиков веками копировали книги. Под влиянием Зависти они начали копировать всё : жесты, голоса, лица друг друга. Теперь в обители нельзя понять, кто кому принадлежит. Тайна · только для мастера Настоятель Брат Варис Тенелист — Сосуд Зависти. Пять лет назад культ передал ему три текста о рождении Картины: вырванные страницы дневника Сайласа, «Казуистику» Элиаса (украденную из хосписа) и Евангелие Вести культа. Варис переписывал их сотни раз, пытаясь понять, почему дар достался не ему . Каждая копия чуть отличается от оригинала — и монахи верят своим копиям. Атмосфера Тишина, нарушаемая скрипом сотен перьев. Монахи в серых капюшонах. Под капюшонами — чужие лица , иногда лица самих героев. Чернила пахнут кровью. В трапезной все едят одинаковыми движениями. На стенах — бесконечные копии одной и той же фрески, с каждым разом чуть хуже. Правило локации: Зависть Важно Каждый раз, когда персонаж использует особенность класса (заклинание, ярость, скрытую атаку, вдохновение и т.п.) на глазах у монахов, мастер ставит отметку. При 3 отметках у этого персонажа монахи скопировали эту особенность: один из врагов в локации может использовать её один раз. Кроме того, при провале спасброска Мудрости СЛ 13 (когда персонаж видит своё лицо на чужом человеке) он получает 1 Отголосок Зависти (см. механику «Отголоски»). Обратная сторона: монахи не могут скопировать травмы, шрамы и Мазки . Всё несовершенное в героях — уникально и узнаваемо. Персонаж с травмой получает преимущество на проверки, чтобы доказать, что он — оригинал. Зоны Зона Что там Опасность Мост Отражений Узкий мост, по бокам — пропасть и море Монах-копия идёт навстречу с вашим лицом Внешний двор Колокольня, кладбище переписчиков На надгробиях — одинаковые имена Скрипторий Главный зал, 200 пюпитров Ловушка тишины Крыло Кисти Иллюминированные рукописи, мастерская миниатюр Дневник Сайласа (вырванные страницы) Крыло Скальпеля Анатомический театр, банки с органами Казуистика Элиаса Крыло Веры Колокольня и тайная часовня культа Евангелие Вести Палимпсест Подземное хранилище соскобленных книг Слова со старых страниц выползают наружу Келья настоятеля Зеркала, сотни автопортретов Вариса Финальный бой Ключевые NPC Брат Варис Тенелист — настоятель, Сосуд Зависти Эльф. Лицо постоянно «плывёт», становясь похожим на того, с кем он говорит. Гениальный переписчик, лишённый собственного голоса. Всё, что он пишет, — копии. Что хочет: получить дар Вейлов. Считает, что, переписав все три записи идеально, он «перепишет» дар себе. Реплика: «Почему Бог раздаёт таланты, а не долги? Долги хотя бы можно разделить поровну.» Сестра Лираэль Шадоумир — библиотекарь Эльф, слепая на один глаз (выколола сама, чтобы не видеть чужих лиц). Единственная, кто помнит, какие тексты оригинальные . Хранит три оригинала в тайниках каждого крыла. Тайно ненавидит Вариса и боится его. Механика: отличает оригинал от копии без проверки. Без неё героям нужна проверка Расследования СЛ 15 на каждую запись. Второстепенные NPC NPC Кто Крючок / функция Брат Без-Имени Копия, ставшая лучше оригинала Оригинал (брат Ансгар) сидит в Палимпсесте. Брат Без-Имени просит не возвращать его: «Я лучше. Я заслужил.» Элирия Найтвейл Эльф, иллюминатор Рисует миниатюры, которые оживают на час. Ученица школы Сайласа. Знает, что делает его краска. Ольгерд-переплётчик Человек, переплетает книги кожей Кожей кого? Задайте вопрос — получите крючок к «Казуистике». Новиция Мия Девочка-послушница Копирует только героев. К концу локации говорит и ходит как один из них. Если её спасти — она станет «эхом» героя на всю кампанию. Монах-двойник героя Копия одного из персонажей Появляется в первый день. Знает всё, что герой делал в обители. Три записи Запись Где Что раскрывает Как добыть Дневник Сайласа (вырванные страницы) Крыло Кисти, в переплёте миниатюрного часослова Как Сайлас нарисовал город; что картине нужна «модель»; что его глаз видит всё нарисованное Загадка цветов на миниатюрах (та же система: синий-зелёный-красный); оживающие миниатюры охраняют страницы Казуистика Элиаса Крыло Скальпеля, в банке с формалином под ложным дном 37 случаев смертей пациентов; вывод Элиаса: «Моя рука не убивает. Она отменяет.» Анатомический театр: на столе — тело, которое оживает, если его «вскрывать» неправильно (Медицина СЛ 14) Евангелие Вести Крыло Веры, часовня под колокольней Слова Посланца; его настоящая цель; упоминание пятой эмоции — Тоски Часовня охраняется культистами; колокол — ловушка Важно Каждую запись в обители можно найти в оригинале и в копиях . Копии отличаются одной деталью — и если в ритуале использовать копию, ритуал примет искажённую истину (см. Финал). Это скрытая ловушка: мастер должен знать, что у героев на руках. Ловушки Ловушка Описание Обход Скрипторий тишины Любое слово вслух — все 200 монахов поворачиваются и повторяют его. Через 3 слова голос героя скопирован: монах-двойник может говорить им. Жесты, записки, магия без вербальных компонентов Чернильная купель Купель для освящения чернил. Упавший получает 2d6 некротического и 1 Мазок (чернила с краской Сайласа) Внимательность СЛ 13 — пол вокруг скользкий Палимпсест Соскобленные слова выползают со страниц: спасбросок Мудрости СЛ 13, провал — персонаж на 1 раунд читает вслух чужой текст (теряет действие) Читать только с закрытым глазом; соль на страницах Колокол Веры Звонит, если кто-то несёт оригинальную запись. Спасбросок Телосложения СЛ 14, провал — 3d6 звукового, оглох Обмотать колокол тканью; нести копию как приманку Зеркальный коридор Коридор копий: каждая следующая комната — копия предыдущей, но хуже. После 7-й — коридор рушится Вернуться назад; найти «оригинальную» комнату (единственная с пылью) Мост Отражений Монах-копия с вашим лицом. Если атаковать его — урон получает и герой (половину) Доказать, что ты — оригинал (шрам, травма) Сюжетные линии Оригинал или копия. Найти все три оригинала, а не копии. Лираэль — ключ, но она поможет только если герои пообещают убить Вариса. Брат Без-Имени. Копия, которая лучше оригинала. Вернуть оригинал — справедливо, но копия добрее, умнее и полезнее. Отражение главного вопроса кампании. Новиция Мия. Девочка копирует одного из героев. Если её не спасти до конца локации, она становится его постоянной тенью — союзником, который однажды решит, что она «лучший он». Варис и Нерисса. Варис и Нерисса связаны общей обидой на «одарённых». Их переписка раскрывает, что культ уже знает о Тесори внутри Картины. Квесты Квест Кто даёт Суть Награда «Три голоса» (основной) — Найти три оригинальные записи Записи (артефакт) «Кто я?» Брат Без-Имени / брат Ансгар Решить, кто из двоих останется Ансгар: знание о Палимпсесте; Без-Имени: свиток копии (одноразово копирует заклинание врага) «Тишина» Лираэль Вынести её из обители живой Лираэль приходит в хоспис; переводит Евангелие полностью «Живые миниатюры» Элирия Найтвейл Найти ей краску Сайласа (1 заряд флакона) Миниатюра-страж: оживлённый рисунок, 1 раз защищает героя от удара «Эхо» — Спасти Мию от копирования Мия — помощница в хосписе; знает все тайные ходы обители Босс: Брат Варис Тенелист, «Мозаика» Параметр Значение Хиты 90 (уровень 5) / 130 (уровень 6+) КД 15 Особенность Копия: в начале боя копирует одну особенность класса каждого героя, который использовал её в обители (см. правило локации) Атака Перо-стилет: 2d8 колющего; Чернильный плевок: 9 м, спасбросок Ловкости СЛ 14, ослеплён до конца хода Подготовка «Переписать» — касание героя; если не прервать, Варис крадёт его лицо: герой получает помеху на все проверки Харизмы, а Варис — его внешность (до конца боя) Прерывание Показать ему травму или шрам (Варис не может скопировать несовершенство и замирает); урон огнём по его рукописям Фаза 2 При 50% хитов распадается на мозаику — 3 копии героев (по 20 хитов). Оригинальный Варис — та копия, у которой нет тени в синем свете Тайна · только для мастера Варис может быть спасён : если дать ему что-то по-настоящему своё — например, попросить написать что-то новое, не копию, — он впервые пишет одну строчку от себя и плачет. Зависть отпускает его. Это мирный финал локации. Награды локации Записи (артефакт ритуала): Дневник Сайласа, Казуистика Элиаса, Евангелие Вести. Перо-стилет Вариса (уровень 4, см. оружие). Лираэль как NPC в хосписе — полный перевод Евангелия раскрывает Тоску как пятую эмоцию. Личные крючки героев Ума — оригинал летописи. Летопись, по которой командование фэйри отправило Уму, — копия из этой обители : её продали заезжим торговцам (возможно, тем самым, с которыми когда-то ходила Велисса). В Крыле Веры лежит оригинал . Строка «Спасёт от чудовищ, забирая их в себя» в оригинале продолжается: «…пока жив тот, чья рука её держит. Умрёт рука — и холст отдаст всё, что взял». Если Сайлас умрёт, Картина выпустит всех поглощённых чудовищ. Это меняет всё для Умы. Велисса — вырванные страницы. В дневнике Сайласа есть запись о ней: «Я писал Желание грубо, не глядя. Оставил сохнуть на солнце. Свет пошёл из холста — я понял, что она смотрит на меня. Я испугался и хотел сжечь. Огонь не взял её. Я посмотрел на солнце, чтобы больше её не видеть.» Ниже — её имя, зачёркнутое и написанное снова. Эстел — печать в книге. В Крыле Скальпеля у Элиаса описан случай: «Раб с печатью Бастиона. Хозяин мёртв, печать молчит. Вывод: хозяин не мёртв — он перестал быть собой.» Подсказка, что хозяин Эстела жив. Находки Обители Предмет Где Эффект Перо-стилет Вариса Варис Тенелист Оружие 4 уровня, уникальное Свиток копии Брат Без-Имени (квест «Кто я?») Одноразово скопировать заклинание врага, которое было использовано за последний раунд Миниатюра-страж Элирия Найтвейл Оживлённый рисунок, 1 раз принимает удар на себя Чернила переписчиков (3) Скрипторий Переписанный ими текст временно становится правдой для того, кто его читает (обман на 1 час, спасбросок Интеллекта СЛ 14) Анатомический атлас Элиаса Крыло Скальпеля Преимущество на Медицину при лечении травм; с ним малая травма лечится за короткую передышку Ряса серого брата Кельи Монахи не замечают носителя, пока он молчит Летопись фэйри (оригинал) Крыло Веры Крючок Умы Осколки зеркала (3) Зеркальный коридор Материал для «Зеркального» свойства Соль Палимпсеста Хранилище Мешочек: посыпанная страница не может «выползти»; брошенная в нарисованное — 1d6 урона Тяжёлые выборы Обители Выбор Почему тяжело Брат Без-Имени или брат Ансгар Копия лучше оригинала: добрее, умнее, полезнее. Вернуть оригинал — справедливо, но жестоко Оригинал или копия записи Оригинал Казуистики Элиаса содержит имена всех умерших пациентов. Копия Вариса — без имён. Элиас просил героев не приносить ему оригинал : он не хочет знать Обещание Лираэль Лираэль поможет только если герои пообещают убить Вариса. Но Вариса можно спасти. Нарушить слово — потерять её помощь Новиция Мия Её можно спасти от копирования, только если тот герой, кого она копирует, позволит ей стать немного собой — отдаст ей одну свою черту навсегда (игрок выбирает: привычку, фразу, жест)"}, {"id": "s16", "n": 16, "title": "ЗВЕРИНЕЦ «НЕНАСЫТНАЯ ЛУНА»", "disp": "Зверинец «Ненасытная луна»", "group": "Акт II", "html": "<p><strong>Артефакт:<\/strong> Клетка со зверьком. <strong>Эмоция:<\/strong> Обжорство. <strong>Рекомендуемый уровень:<\/strong> 5–7. <strong>Музыка:<\/strong> Шота / максимальное напряжение, Ambient набор, Сильный бой.<\/p><p>Бродячий цирк-зверинец застрял в Солёных топях семь лет назад и больше не уезжал. Шатры разрослись, как грибы, сшиваясь друг с другом в лабиринт из полосатой ткани. Каждую ночь здесь — <strong>Пир<\/strong>: гостей кормят до отвала, а звери в клетках смотрят на них с тем же голодом.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Хозяйка зверинца <strong>Лукреция Морвейл<\/strong> — Сосуд Обжорства. Она коллекционирует и <strong>съедает<\/strong> редкие существа, чтобы присвоить их свойства. В её личной коллекции — <strong>Кисточка<\/strong>, первое живое существо, нарисованное Сайласом. Лукреция бережёт его для «Последнего блюда»: съев существо, живущее и в картине, и в мире, она сможет «съесть» саму Картину — и весь город внутри.<\/p><\/div><h2 id=\"s16-1\">Атмосфера<\/h2><ul><li>Запах жареного мяса, сахарной ваты и гнили одновременно.<\/li><li>Музыка шарманки не прекращается ни на минуту. Если она смолкнет — значит, кто-то кого-то ест.<\/li><li>Артисты улыбаются, но у всех одинаково округлившиеся животы и пустые глаза.<\/li><li>Шатры «переваривают» то, что в них оставили: забытые вещи наутро исчезают.<\/li><\/ul><h2 id=\"s16-2\">Правило локации: Голод<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый раз, когда персонаж ест или пьёт в зверинце (а угощают постоянно и отказ — оскорбление), он восстанавливает 1d6 хитов, но проходит спасбросок Телосложения СЛ 13. Провал — <strong>1 Отголосок Обжорства<\/strong>. Персонаж с Отголоском Обжорства должен съедать двойной паёк, иначе получает 1 уровень истощения за долгую передышку. Отказ от угощения без причины — <strong>−1 отношение<\/strong> артистов и шанс, что Лукреция заметит гостей.<\/p><\/div><h2 id=\"s16-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Ворота-пасть<\/td><td>Арка в форме открытого рта; билетёр-клоун<\/td><td>Кто не платит — платит собой (1 предмет «съедает» арка)<\/td><\/tr><tr><td>Аллея клеток<\/td><td>Экзотические звери, часть — люди в костюмах зверей<\/td><td>Голодные звери; клетки открываются по звуку шарманки<\/td><\/tr><tr><td>Игорный шатёр<\/td><td>Карты, кости, <strong>Buckshot<\/strong><\/td><td>Ставки на предметы, хиты и воспоминания<\/td><\/tr><tr><td>Шатёр кривых зеркал<\/td><td>Отражения показывают героев толстыми, голодными, съеденными<\/td><td>Отражение может выйти наружу<\/td><\/tr><tr><td>Пиршественный шатёр<\/td><td>Бесконечный стол, Пир каждую ночь<\/td><td>Голод; обжоры-гости<\/td><\/tr><tr><td>Шатёр-желудок<\/td><td>Внутренний шатёр, стены тёплые и влажные<\/td><td>Кислота, переваривание<\/td><\/tr><tr><td>Кухня Гуго<\/td><td>Огромные котлы, разделочные столы<\/td><td>Повар и его подмастерья<\/td><\/tr><tr><td>Личная коллекция<\/td><td>Вагон Лукреции, чёрные клетки<\/td><td><strong>Клетка с Кисточкой<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s16-4\">Ключевые NPC<\/h2><h3>Лукреция Морвейл — хозяйка, Сосуд Обжорства<\/h3><ul><li>Человек, огромная, в платье из сшитых занавесов. Ест изящно, маленькой серебряной вилкой — но непрерывно.<\/li><li>Обаятельна, щедра, остроумна. Обожает гостей — как блюда.<\/li><li>Съела уже: огненную саламандру (дышит дымом), сирену (её голос гипнотичен), мимика (может растягиваться).<\/li><li><strong>Что хочет:<\/strong> съесть Кисточку и через него — Картину. Насытиться наконец.<\/li><li><strong>Реплика:<\/strong> «Голод — это просто любовь, у которой нет терпения.»<\/li><\/ul><h3>Шаэл Найтблум — дрессировщица<\/h3><ul><li>Дроу, в шрамах от когтей. Единственная, кто <strong>любит зверей<\/strong>, а не хочет их съесть.<\/li><li>Тайно кормит Кисточку и знает, что он «просится к холсту» — тянется к любому рисунку.<\/li><li><strong>Что хочет:<\/strong> освободить всех зверей. Будет союзником, если герои пообещают выпустить не только Кисточку.<\/li><\/ul><h3>Зерик Нокт — акробат<\/h3><ul><li>Тифлинг, худой как тень — единственный, кто не ест (его Обжорство вывернулось наизнанку: он не может проглотить ни кусочка).<\/li><li>Хочет сбежать. Знает все ходы между шатрами.<\/li><li><strong>Крючок:<\/strong> у него татуировка с символом культа. Он был культистом и сбежал. Знает, где Нерисса держит лагерь.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Толстый Гуго<\/td><td>Повар, полуогр<\/td><td>Готовит всё, что принесут. Если принести ему «правильный ингредиент» (растворитель, соль, полынь) — приготовит блюдо, вызывающее у Лукреции тошноту (прерывание подготовки).<\/td><\/tr><tr><td>Кайрон Пепельный Ворон<\/td><td>Метатель ножей<\/td><td>Информатор культа. Ставит на героев в Игорном шатре и продаёт сведения о них Нериссе.<\/td><\/tr><tr><td>Билетёр-клоун Пип-Пип<\/td><td>Клоун у ворот<\/td><td>Безобиден, но рот у него — до ушей. Говорит загадками; его загадки — подсказки по шатрам.<\/td><\/tr><tr><td>«Человек-медведь»<\/td><td>Пленник в клетке<\/td><td>Охотник из Бастиона, зашитый в медвежью шкуру. Знает Дрейвена Нокса. Крючок к карьеру.<\/td><\/tr><tr><td>Мадам Тасса<\/td><td>Гадалка<\/td><td>Гадает на картах, которые «съедают» неверные ответы. Раз за визит даёт правдивый ответ — за еду.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s16-5\">Мини-игра: ставки в Игорном шатре<\/h2><p>Здесь работает <strong>Buckshot<\/strong> (см. раздел Мини-игры). Ставки:<\/p><div class=\"tbl\"><table><thead><tr><th>Ставка героя<\/th><th>Ставка заведения<\/th><\/tr><\/thead><tbody><tr><td>Предмет<\/td><td>Предмет того же уровня (или ключ от личной коллекции)<\/td><\/tr><tr><td>1d6 хитов максимума до долгой передышки<\/td><td>Сведения о Лукреции<\/td><\/tr><tr><td>Одно воспоминание (как в Мглине)<\/td><td>Свободный проход к Кисточке на 10 минут<\/td><\/tr><tr><td>«Место за столом» (герой будет блюдом на Пиру)<\/td><td><strong>Клетка с Кисточкой<\/strong> — финальная ставка<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Финальная игра против самой Лукреции — отличная альтернатива боссу. Если герои выиграют, она отдаёт клетку (Обжорство не может нарушить уговор за едой). Проигрыш — герой становится главным блюдом Пира, и остальные должны его спасать.<\/p><\/div><h2 id=\"s16-6\">Ловушки<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Арка-пасть<\/td><td>Каждый проходящий без билета теряет 1 предмет (случайный)<\/td><td>Купить билет (едой); пролезть через шатры с Зериком<\/td><\/tr><tr><td>Шарманка<\/td><td>Пока играет — звери спят. Если смолкнет — клетки открываются на Аллее<\/td><td>Охранять шарманщика; крутить ручку самому<\/td><\/tr><tr><td>Кривые зеркала<\/td><td>Отражение героя выходит наружу «голодным»: двойник с теми же хитами, атакует владельца<\/td><td>Разбить зеркало до выхода; не смотреть дольше раунда<\/td><\/tr><tr><td>Пиршественный стол<\/td><td>Сел — не можешь встать, пока не съешь всё (спасбросок Силы СЛ 14 каждый раунд)<\/td><td>Не садиться; привязать себя верёвкой<\/td><\/tr><tr><td>Шатёр-желудок<\/td><td>Стены сокращаются: 2d6 кислоты в начале хода в центре шатра; выход «закрывается» через 3 раунда<\/td><td>Двигаться вдоль стенки; огнём заставить шатёр «срыгнуть»<\/td><\/tr><tr><td>Пол-батут<\/td><td>Над ямой с «обитателями» (живые отбросы Пира) натянута ткань<\/td><td>Внимательность СЛ 14; идти по шестам<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s16-7\">Сюжетные линии<\/h2><ol><li><strong>Последнее блюдо.<\/strong> Лукреция назначила Пир на третью ночь после прихода героев. В эту ночь она съест Кисточку. Таймер локации.<\/li><li><strong>Освобождение зверей.<\/strong> Шаэл хочет выпустить всех. Если выпустить всех — в топях появятся новые опасности (и союзники), Лукреция слабеет (−20 хитов).<\/li><li><strong>Кисточка тянется к холсту.<\/strong> Если герои пронесут Картину рядом с личной коллекцией — Кисточка начнёт рваться к ней; клетка из чёрного железа его удерживает. Без клетки он убежит в Картину, и достать его придётся изнутри города (линия с Тесори и Сайласом).<\/li><li><strong>Охотник в шкуре.<\/strong> «Человек-медведь» — разведчик Бастиона. Спасти его — получить союзника для карьера и знание о кинжале.<\/li><\/ol><h2 id=\"s16-8\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Последнее блюдо» (основной)<\/td><td>—<\/td><td>Забрать Кисточку в клетке до третьей ночи<\/td><td><strong>Клетка со зверьком<\/strong> (артефакт)<\/td><\/tr><tr><td>«Открытые клетки»<\/td><td>Шаэл<\/td><td>Выпустить всех зверей<\/td><td>Шаэл — союзник; зверь-компаньон<\/td><\/tr><tr><td>«Лёгкий как тень»<\/td><td>Зерик<\/td><td>Вывести его из зверинца<\/td><td>Карта лагеря Нериссы; Зерик — проводник<\/td><\/tr><tr><td>«Блюдо от шефа»<\/td><td>Толстый Гуго<\/td><td>Принести три редких ингредиента<\/td><td>Отравленное блюдо (прерывание «Великого глотка»)<\/td><\/tr><tr><td>«Человек-медведь»<\/td><td>Пленник<\/td><td>Освободить и вылечить его<\/td><td>Союзник-охотник; пропуск в Бастион<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s16-9\">Босс: Лукреция Морвейл, «Ненасытная»<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>120 (уровень 6) / 160 (уровень 7+)<\/td><\/tr><tr><td>КД<\/td><td>13<\/td><\/tr><tr><td>Особенность<\/td><td><strong>Поглощённые дары:<\/strong> дыхание дымом (конус 4,5 м, 3d6 огня), голос сирены (спасбросок Мудрости СЛ 14 или очарован 1 раунд), растяжение (досягаемость 4,5 м)<\/td><\/tr><tr><td>Атака<\/td><td>Удар вилкой-трезубцем: 2d10 колющего; Укус: 3d8 колющего, восстанавливает половину нанесённого урона<\/td><\/tr><tr><td>Подготовка<\/td><td>«Великий глоток» — она раскрывает рот до пола. Если не прервать — <strong>проглатывает<\/strong> героя: тот ослеплён, опутан, 3d6 кислоты в начале своего хода, может атаковать изнутри (КД 10); выйдет, если нанести 25 урона изнутри<\/td><\/tr><tr><td>Прерывание<\/td><td><strong>Скормить ей что-то другое<\/strong> (бросить предмет, еду, зелье — она рефлекторно глотает), отравленное блюдо Гуго, 20+ урона за раунд<\/td><\/tr><tr><td>Надлом<\/td><td>Каждое прерывание «Великого глотка» вызывает тошноту: она выплёвывает один из поглощённых даров и теряет его до конца боя<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Лукреция по-настоящему никогда не была сыта. Если герои дадут ей <strong>что-то, что насыщает не тело<\/strong> — например, честный рассказ, песню, обед, разделённый за одним столом без голода, — Обжорство отступит. Мирное завершение возможно, но требует, чтобы кто-то из героев сел с ней за стол и не стал есть.<\/p><\/div><h2 id=\"s16-10\">Награды локации<\/h2><ul><li><strong>Клетка со зверьком<\/strong> (артефакт ритуала): Кисточка в клетке из чёрного железа.<\/li><li><strong>Вилка-трезубец Лукреции<\/strong> (оружие поздних уровней, см. раздел оружия), <strong>Гарпун дрессировщицы<\/strong> (уровень 3).<\/li><li>Зверь-компаньон (если клетки открыты): по выбору мастера.<\/li><\/ul><h2 id=\"s16-11\">Личные крючки героев<\/h2><ul><li><strong>Эстел — сестра.<\/strong> В Аллее клеток сидит девочка-табакси лет двенадцати с табличкой «Дикая кошка-оборотень. Не кормить с руки». Шаэл зовёт её <strong>Искоркой<\/strong>. Она не помнит ни родителей, ни брата — её продали младенцем после налёта на клан. На шее — детский шнурок с клановым узлом, таким же, как Эстел видел у матери. Лукреция бережёт её «на десерт после Последнего блюда». <strong>Если героям не до неё — она станет следующей ставкой в Игорном шатре.<\/strong><\/li><li><strong>Ума — ребёнок, который не летит.<\/strong> В личной коллекции Лукреции — <strong>фэйри-ребёнок с подрезанными крыльями<\/strong> (Лукреция ест крылья фэйри как сладость). Девочка боится высоты и плачет, когда видит Уму в форме. Научить её снова летать (несколько проверок, сцена на шестах над Полом-батутом) — прямое искупление старой ошибки Умы.<\/li><li><strong>Велисса — «питомцы».<\/strong> Лукреция предлагает купить Велиссу в коллекцию: «Нарисованная фея — я такого ещё не пробовала». Её Голод отзывается на Желание в Велиссе: каждый раз, когда Велисса использует очарование в зверинце, Лукреция чувствует, где она.<\/li><\/ul><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Кисточка несёт Нежность<\/strong> — одну из тихих эмоций Посланца (см. раздел 21). Поэтому он живой, поэтому к нему тянутся дети и звери, и поэтому Лукреция хочет его съесть: Обжорство — это Нежность, которой не хватило терпения.<\/p><\/div><h2 id=\"s16-12\">Находки Зверинца<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Гарпун дрессировщицы<\/strong><\/td><td>Шаэл / Аллея клеток<\/td><td>Оружие 3 уровня<\/td><\/tr><tr><td><strong>Горелка лампадаря<\/strong><\/td><td>Кухня Гуго<\/td><td>Оружие 3 уровня<\/td><\/tr><tr><td><strong>Вилка-трезубец Лукреции<\/strong><\/td><td>Лукреция<\/td><td>Оружие поздних уровней (+1)<\/td><\/tr><tr><td><strong>Клетка из чёрного железа<\/strong><\/td><td>Личная коллекция<\/td><td>Часть артефакта: удерживает нарисованных существ<\/td><\/tr><tr><td><strong>Ключ без замка<\/strong><\/td><td>(из списка предметов)<\/td><td>Открывает клетку из чёрного железа без шума<\/td><\/tr><tr><td><strong>Ремешок укротителя<\/strong><\/td><td>Шаэл<\/td><td>Преимущество на Уход за животными; 1 раз в день успокоить зверя<\/td><\/tr><tr><td><strong>Пирог Гуго<\/strong> (3)<\/td><td>Кухня<\/td><td>+2d6 хитов, но бросок Голода<\/td><\/tr><tr><td><strong>Фишки Игорного шатра<\/strong><\/td><td>Выигрыш в Buckshot<\/td><td>Обмен на любой предмет зверинца<\/td><\/tr><tr><td><strong>Кривое зеркальце<\/strong><\/td><td>Шатёр кривых зеркал<\/td><td>Показывает, чем существо «голодно»: его главное желание<\/td><\/tr><tr><td><strong>Перо сирены<\/strong><\/td><td>Трофейный шкаф Лукреции<\/td><td>1 раз: заклинание «Внушение» без ячейки<\/td><\/tr><tr><td><strong>Кровь чудовища<\/strong> (2)<\/td><td>Лукреция<\/td><td>Материал для уникальных улучшений<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s16-13\">Тяжёлые выборы Зверинца<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Кого спасать до Пира<\/strong><\/td><td>В ночь Последнего блюда стража стоит у трёх клеток: <strong>Кисточка<\/strong> (артефакт), <strong>Искорка<\/strong> (сестра Эстела) и <strong>фэйри-ребёнок<\/strong> (искупление Умы). Успеть ко всем трём можно, только разделив партию — и рискуя всеми<\/td><\/tr><tr><td><strong>Открыть все клетки<\/strong><\/td><td>Шаэл просит выпустить всех. Тогда в Солёных топях появятся голодные хищники, и ближайшая деревня окажется под угрозой<\/td><\/tr><tr><td><strong>Сесть за стол с Лукрецией<\/strong><\/td><td>Мирное завершение требует, чтобы кто-то сел с ней и <strong>не ел<\/strong> весь Пир. Провал — герой становится блюдом<\/td><\/tr><tr><td><strong>Финальная ставка в Buckshot<\/strong><\/td><td>Можно выиграть клетку без боя, поставив на кон самого себя<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s16-1", "Атмосфера"], ["s16-2", "Правило локации: Голод"], ["s16-3", "Зоны"], ["s16-4", "Ключевые NPC"], ["s16-5", "Мини-игра: ставки в Игорном шатре"], ["s16-6", "Ловушки"], ["s16-7", "Сюжетные линии"], ["s16-8", "Квесты"], ["s16-9", "Босс: Лукреция Морвейл, «Ненасытная»"], ["s16-10", "Награды локации"], ["s16-11", "Личные крючки героев"], ["s16-12", "Находки Зверинца"], ["s16-13", "Тяжёлые выборы Зверинца"]], "text": "Артефакт: Клетка со зверьком. Эмоция: Обжорство. Рекомендуемый уровень: 5–7. Музыка: Шота / максимальное напряжение, Ambient набор, Сильный бой. Бродячий цирк-зверинец застрял в Солёных топях семь лет назад и больше не уезжал. Шатры разрослись, как грибы, сшиваясь друг с другом в лабиринт из полосатой ткани. Каждую ночь здесь — Пир : гостей кормят до отвала, а звери в клетках смотрят на них с тем же голодом. Тайна · только для мастера Хозяйка зверинца Лукреция Морвейл — Сосуд Обжорства. Она коллекционирует и съедает редкие существа, чтобы присвоить их свойства. В её личной коллекции — Кисточка , первое живое существо, нарисованное Сайласом. Лукреция бережёт его для «Последнего блюда»: съев су
