едерик и флакон краски СЕЙЧАС XIII Галерея Портретов Портреты героев далее XIV Башня (вход) Картина и Сайлас кульминация Акта I XV Таверна на раме Вынос Картины из города выход в Акт II Правило города: Часы Холста Важно Город перерисовывается . Ведите счётчик Часы Холста из 6 делений. +1 деление за каждую долгую передышку в городе, за громкий бой на улицах и за каждое уничтожение нарисованного NPC. Когда счётчик полон — наступает Ночь Перекраски , и счётчик обнуляется. Ночь Перекраски: улицы меняют расположение (новая карта района), один нарисованный NPC «исправлен» и забывает героев, уничтоженные нарисованные объекты возвращаются, а у каждого героя, спавшего в городе, — спасбросок Мудрости СЛ 12, при провале +1 Мазок . Районы города Район Что здесь Музыка Площадь Мольберта Идеальный рынок, двойники, нарисованный Элиас Улицы / Bloodborne ambient Трущобы и дом 19 Неотрисованный квартал углём; банда Гримвара; спуск в катакомбы Эмбиент Катакомбы Крысы, Король Крыс, бездомный Броммир Катакомбы Церковь Чистого Холста Отец Вальдрик Морн, молитвы о «непорочном полотне» Церковь Галерея Портретов Портреты всех горожан — и героев Внутри здания Мастерская Сайласа Текущая сцена Внутри здания Шпиль Мольберта (Башня) Картина, Сайлас, Тесори, голубой глаз Hunter Nightmare Таверна «Последняя свеча» Безопасное место, стоит на раме картины Отдых Ключевые NPC Акта I Веспер Мор — бармен «Последней свечи» Человек, около 60. Сухие руки, шрам от ошейника на шее (скрыт шарфом). Наблюдает, знает больше, чем говорит. Не врёт — просто не договаривает. Правда: бывший раб карьера «Глотка», сбежал 20 лет назад. Таверна стоит на раме Картины и существует в обоих мирах. Веспер первым понял, что город нарисован, — и решил не вмешиваться. Функция: безопасная точка, слухи, торговля, выход из Картины в Акт II. Реплика: «Я наливаю всем, кто платит. Даже тем, у кого нет тени.» Фредерик — подмастерье (две версии) Фредерик из мастерской: красный перстень, палетка «синий-красный-зелёный», идеальная улыбка, идеальная память. Это нарисованная версия — тот, кем Фредерик мечтал быть. Фредерик из холодильника: настоящий, исхудавший, замёрзший. Сайлас «отложил» его как лишний материал. Помнит всё плохое, что вычеркнул из себя. В здании 1 Фредерик носил зелёный перстень и синий берет — значит, когда-то был третий набросок (см. «Мастерская»). Ни одна версия не знает наверняка, кто оригинал. Каэлис Воронья Тень — помощник художника Полуэльф, немой, трёт пигменты. Вокруг него всегда вороны. Связь с Сайласом: единственный настоящий человек, которого Сайлас пустил в мастерскую. Пишет записки углём. Может стать проводником в Башню, если герои вернут ему голос (голос забрал Сайлас — нарисован на холсте в мастерской как птица в клетке). Нарисованный Элиас — «добрый доктор» Лечит на площади бесплатно. Лечение работает идеально — но пациенты забывают и саму боль, и то, что её вызвало (умершего ребёнка, предательство). Искренне не понимает, почему это плохо. Крючок к настоящему Элиасу: у нарисованного есть письмо от брата, адресованное «Элиасу настоящему». Отец Вальдрик Морн — священник Церкви Чистого Холста Проповедует, что мир — полотно, которое надо очистить от «пятен». Пятна — это несовершенные люди. И чужаки. Тайный информатор культа Посланца в городе. Его храм — единственное место, где нарисованные слышат молитву (связь с порогом прерывания «Молитва» у Фредерика из холодильника). Морвен Блэкхарт — куратор Галереи Портретов Человек, элегантная, в перчатках. Продаёт портреты горожан тем, кто хочет «поправить» соседа. Портрет связан с человеком: испорченный портрет — испорченный человек. Крючок: в запасниках Галереи висят портреты героев , начатые в день их высадки. Второстепенные NPC NPC Кто Крючок Дрейвен Нокс Мужчина с меткой охотника на рабов Бежал из карьера «Глотка». Знает дорогу к Бастиону. Метка «горит», когда рядом Гнев. Гримвар Дакк Дварф, главарь трущобной банды Это его люди спрятали шкатулку с повозки. Отдаст её за услугу в катакомбах. Старый Броммир Пепельный Бездомный дварф с крысой Графиней Друг крыс. Может говорить с Королём Крыс. Носит Шляпу контроля — и не помнит, где взял. Селена Морвейн (портрет) Девушка на старой фотографии в мастерской Её портрет плачет. Настоящая Селена — фотограф в Мглине (крючок в Акт II). Иара Ноктиль Дроу, натурщица Сайласа Позировала для «идеальной горожанки». Теперь по городу ходят 30 женщин с её лицом. Бальрик Чёрный Камень Кузнец квартала Улучшения +1 и +2. Его горн — нарисованный, но жар настоящий. Основная сюжетная линия Акта I Мастерская: узнать, что Картины здесь нет; найти флакон краски; разобраться с Фредериками; понять, почему Башня отторгает героев. Галерея Портретов: найти свои портреты. Решить: уничтожить их, забрать или дать Сайласу закончить. Вход в Башню: способы попасть внутрь — стать «достаточно нарисованным» (3+ Мазка), надеть законченный портрет как маску, провести Каэлиса, использовать краску на двери. Вершина Башни: Сайлас за мольбертом. Картина-в-картине. Тесори. Голубой глаз. Разговор — или бой. Вынос Картины: холст свёрнут, город остаётся внутри. Выход через раму в таверне Веспера. Снаружи — настоящий, пустой и разрушенный Гравенхольм. Важно Сайласа не обязательно убивать . Рекомендация: в первом столкновении он уходит в собственную картину (вписывает себя в холст), и герои выносят Картину вместе с ним внутри . Это даёт кампании живого антагониста-союзника на весь Акт II."}, {"id": "s9", "n": 9, "title": "МАСТЕРСКАЯ: ЗДЕСЬ И СЕЙЧАС", "disp": "Мастерская: здесь и сейчас", "group": "Акт I", "html": "<p>Мастерская Сайласа — трёхэтажный дом с застеклённой крышей. Внутри пахнет скипидаром, льняным маслом и чем-то сладким, как перезрелые фрукты. Дом подчиняется <strong>художественной логике<\/strong>, а не архитектуре: комнаты соединены так, как удобно композиции.<\/p><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> <strong>Главное открытие сцены:<\/strong> Картины в мастерской <strong>нет<\/strong>. Есть пустой мольберт гигантского размера и следы того, что холст унесли <strong>вверх<\/strong> (следы краски идут по стене и потолку к окну, выходящему на Башню). Мастерская должна дать игрокам: (1) флакон краски, (2) понимание, почему Башня их не пускает, (3) решение по Фредерикам, (4) свои портреты как крючок в Галерею.<\/p><\/div><h2 id=\"s9-1\">Цветовая система (ключ ко всем загадкам мастерской)<\/h2><div class=\"tbl\"><table><thead><tr><th>Цвет<\/th><th>Значение<\/th><th>Что делает с нарисованным<\/th><\/tr><\/thead><tbody><tr><td><strong>Красный<\/strong><\/td><td>Плоть, жизнь<\/td><td>«Оживляет», делает настоящим, будит<\/td><\/tr><tr><td><strong>Зелёный<\/strong><\/td><td>Сохранение, покой<\/td><td>Замораживает, консервирует, усыпляет<\/td><\/tr><tr><td><strong>Синий<\/strong><\/td><td>Взгляд, истина, память<\/td><td>Показывает, что нарисовано; даёт видеть глазами картины<\/td><\/tr><tr><td>Смешение (бурый)<\/td><td>Грязь, гниль<\/td><td>Порождает <strong>Грязевика<\/strong> — существо из испорченной краски<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Цвет предмета определяет его функцию. Если игроки поняли систему — дайте им почувствовать себя умными: зелёная краска на нарисованном враге действительно его замедлит.<\/p><\/div><h2 id=\"s9-2\">Карта мастерской<\/h2><h3>1. Прихожая с портретами<\/h3><p>Узкий коридор, на стенах — 12 портретов горожан. Глаза следят за героями.<\/p><ul><li><strong>Ловушка «Не отводи глаз»:<\/strong> один портрет (женщина в синем) движется, только когда на неё никто не смотрит. Каждый раунд, когда никто из партии не заявляет, что смотрит на неё, она приближается на 3 м. Добравшись, она обнимает жертву: спасбросок Силы СЛ 12, при провале — схвачен, 1d6 холода в начале хода (она «засыхает» вместе с жертвой). Уничтожается растворителем, огнём или ударом по раме.<\/li><li><strong>Деталь:<\/strong> среди портретов — <strong>Селена Морвейн<\/strong> с фотоаппаратом. Её портрет плачет настоящими слезами (соль). Крючок в Мглин.<\/li><\/ul><h3>2. Мастерская-атриум (центральный зал)<\/h3><p>Огромный пустой мольберт до потолка. Вокруг — сотни эскизов города. Стеклянная крыша смотрит на Башню.<\/p><ul><li><strong>Ловушка «Незаконченный холст»:<\/strong> у стены стоит холст с эскизом комнаты, в которой сейчас стоят герои. Первый, кто встанет перед ним, должен пройти спасбросок Мудрости СЛ 12. Провал: на холсте появляется его силуэт, персонаж получает <strong>1 Мазок<\/strong>, а в Акте I позже появится его <strong>нарисованный двойник<\/strong> (враг или союзник — по решению мастера).<\/li><li><strong>Находка:<\/strong> эскиз Башни с фигурой Тесори в окне. Через час игрового времени фигура меняет позу.<\/li><li><strong>Находка:<\/strong> записка углём от Каэлиса: «Он унёс её наверх. Башня примет только тех, кто законченный.»<\/li><\/ul><h3>3. Сушильня<\/h3><p>Холсты висят на верёвках, как бельё. Тесно, полутьма.<\/p><ul><li><strong>Ловушка «Пол-эскиз»:<\/strong> часть досок пола не дописана — это контур углём. Внимательность (Мудрость) СЛ 13 замечает, что линии не закрашены. Шаг на контур — падение на этаж ниже, 2d6 дробящего + персонаж оказывается в Кладовой пигментов, одна.<\/li><li><strong>Враг:<\/strong> 1d4 «Мокрых силуэтов» — фигуры с незасохших холстов. Слабы к огню, но огонь здесь опасен (см. Кладовая).<\/li><\/ul><h3>4. Кладовая пигментов и растворителей<\/h3><p>Банки, ступки, мешки с толчёным камнем. Запах скипидара режет глаза.<\/p><ul><li><strong>Ловушка «Скипидарные пары»:<\/strong> любое открытое пламя (факел, лампа, огненный заговор) вызывает вспышку: 2d6 огня, спасбросок Ловкости СЛ 13, половина при успехе. Нарисованные существа получают двойной урон. <em>Игроки могут использовать это против врагов.<\/em><\/li><li><strong>Находка:<\/strong> <strong>бутыль растворителя<\/strong> (3 применения): наносит 2d6 урона нарисованному существу или стирает нарисованный объект. Использование растворителя на горожанах растит <strong>Страх нарисованных<\/strong>.<\/li><li><strong>Находка:<\/strong> <strong>ступка Каэлиса<\/strong> — внутри, на дне, синим нацарапано: «Птица в клетке — мой голос».<\/li><\/ul><h3>5. Комната натурщиков<\/h3><p>Подиум, драпировки, зеркала. Тридцать одинаковых набросков Иары Ноктиль.<\/p><ul><li><strong>Ловушка «Поза»:<\/strong> если персонаж встаёт на подиум, зеркала «фиксируют» его. Спасбросок Телосложения СЛ 12, при провале — опутан до конца следующего хода (не может двигаться, «держит позу»).<\/li><li><strong>Находка:<\/strong> <strong>клетка с нарисованной птицей<\/strong> — это голос Каэлиса. Красная краска на птице оживит её, и она улетит к хозяину. Каэлис снова заговорит.<\/li><\/ul><h3>6. Холодильная (ледник)<\/h3><p>Металлическая дверь, иней. Внутри — шкаф-холодильник с двумя ручками: <strong>зелёная слева, красная справа<\/strong>.<\/p><ul><li><strong>Загадка:<\/strong> чтобы открыть холодильник безопасно, нужно приложить <strong>зелёный<\/strong> перстень к левой ручке (сохранить), а затем <strong>красный<\/strong> — к правой (оживить). Красный перстень носит нарисованный Фредерик. Зелёный — на руке Фредерика из холодильника внутри (видно сквозь иней) <strong>или<\/strong> в здании 1.<\/li><li><strong>Неверный порядок / силовое вскрытие:<\/strong> холодильник открывается рывком, Фредерик из холодильника выходит <strong>уже в подготовке<\/strong> (см. механику подготовительного хода): первым ходом он наносит удвоенный урон.<\/li><li><strong>Синий берет<\/strong> (из здания 1), надетый на любого героя, позволяет видеть: кто из Фредериков нарисован (у нарисованного нет тени в синем свете).<\/li><\/ul><h3>Фредерик из холодильника (боевые заметки)<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>50<\/td><\/tr><tr><td>Особенность<\/td><td>Подготовка «Ледяной вздох» — конус 4,5 м, 2d8 холода, спасбросок Телосложения СЛ 13<\/td><\/tr><tr><td>Условие прерывания<\/td><td>Молитва (священник или персонаж с религией), синий берет, назвать его настоящим именем, нанести урон огнём<\/td><\/tr><tr><td>После прерывания<\/td><td>Пропускает ход и на мгновение «вспоминает» себя — можно говорить<\/td><\/tr><\/tbody><\/table><\/div><p>Рабочий лог хитов из прошлой сессии (сохранён из исходника): 50 − 7 = 43; 43 − 8 − 4 − 2 − 4 − 3 − 4 = 18; 18 − 4 = 14; 14 − 1 = 13; 13 − 3 = <strong>10<\/strong>.<\/p><h3>7. Чердак — кабинет Сайласа<\/h3><p>Заперт. Замок — палитра с тремя углублениями: синий, красный, зелёный.<\/p><ul><li><strong>Загадка «Палетка Фредерика»:<\/strong> нужно положить цвета в порядке, в котором Сайлас создаёт человека: <strong>синий<\/strong> (увидеть) → <strong>зелёный<\/strong> (сохранить образ) → <strong>красный<\/strong> (оживить). Подсказка — надпись на обороте эскиза: «Сначала взгляни. Потом удержи. Потом дай дышать.»<\/li><li><strong>Ошибка:<\/strong> смесь цветов стекает и превращается в <strong>Грязевика<\/strong> (бурое существо: 22 хита, КД 11, атака 1d8 дробящего, при попадании — помеха на следующую атаку цели).<\/li><li><strong>Награда:<\/strong> <strong>Флакон краски<\/strong> (5 зарядов), <strong>Дневник Сайласа (фрагмент)<\/strong> — первые страницы; последние вырваны («остальное забрали серые монахи» — крючок в Обитель Переписчиков), <strong>карта Башни<\/strong> с пометкой «вход — только для законченных».<\/li><\/ul><h2 id=\"s9-3\">Решение о Фредериках<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Последствие<\/th><\/tr><\/thead><tbody><tr><td>Оставить нарисованного<\/td><td>Идеальный союзник в городе, но при Ночи Перекраски может забыть героев.<\/td><\/tr><tr><td>Освободить настоящего<\/td><td>Слабый, злой, честный. Знает слабые места Сайласа. Ненавидит свою копию.<\/td><\/tr><tr><td>Свести их вместе<\/td><td>Встреча двух версий: одна должна исчезнуть, <strong>или<\/strong> синий берет + краска (2 заряда) соединяют их в одного — несовершенного, но целого.<\/td><\/tr><tr><td>Убить одного<\/td><td>Второй <strong>не исчезает<\/strong>. Смерть одной версии не уничтожает другую — но выжившая теряет часть памяти.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Это первая «маленькая версия» финального выбора кампании. Как игроки поступят с Фредериком — так, скорее всего, они захотят поступить и с городом. Запишите их решение.<\/p><\/div><h2 id=\"s9-4\">Сплочение партии: «Разделённый холст»<\/h2><p>Цель сцены — превратить группу попутчиков в команду. Мастерская Сайласа для этого идеальна: дом подчиняется художественной логике, а значит, <strong>отношения героев здесь становятся пространством<\/strong>.<\/p><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Сцена рассчитана на одну сессию или её половину. Её главный принцип: <strong>никто не может выйти сам — только вытащить другого<\/strong>. Мастер не подталкивает игроков к правильному порядку: пусть сами поймут, что спасение начинается с помощи соседу.<\/p><\/div><h3>Завязка: портрет «Чужие»<\/h3><p>В атриуме, за пустым мольбертом, стоит небольшой холст, который герои раньше не замечали. На нём <strong>они сами<\/strong>: Эстел, Велисса, Ума и Тесори стоят спиной друг к другу и смотрят в разные стороны. Внизу табличка: <strong>«Чужие». Не закончено.<\/strong><\/p><p>Когда кто-то из героев касается холста (или когда партия ссорится в мастерской — это лучший момент), дом <strong>принимает название буквально<\/strong>. Свет гаснет. Каждый герой приходит в себя <strong>один<\/strong>, внутри своей картины. На стенах каждой комнаты висят маленькие холсты, и в них видны комнаты остальных.<\/p><h3>Четыре комнаты<\/h3><div class=\"tbl\"><table><thead><tr><th>Герой<\/th><th>Комната<\/th><th>Что держит<\/th><th>Кто может помочь<\/th><\/tr><\/thead><tbody><tr><td><strong>Эстел<\/strong><\/td><td><strong>«Клетка»<\/strong>. Рынок гоблина-работорговца. Эстел снова в клетке, а голос за решёткой спрашивает: «Он сопротивлялся?» Замок клетки <strong>нарисован снаружи<\/strong><\/td><td>Изнутри замок не существует: его нельзя вскрыть отмычками<\/td><td><strong>Велисса.<\/strong> Её зеркало показывает «желание» замка: он хочет, чтобы его открыли снаружи. Магическая рука или очарование «голоса хозяина» открывают клетку<\/td><\/tr><tr><td><strong>Велисса<\/strong><\/td><td><strong>«Солнечная мансарда»<\/strong>. Холст, оставленный сохнуть на солнце. Свет льётся со всех сторон, Велисса выцветает. В углу — силуэт Сайласа с факелом<\/td><td>Тени нет нигде: уйти из света нельзя, а каждый раунд — 1 уровень истощения «выцветания» (снимается после сцены)<\/td><td><strong>Ума.<\/strong> Офицер закрывает собой солдата. Её крылья и доспех отбрасывают единственную тень в комнате. Ума должна встать между Велиссой и солнцем и <strong>не двигаться<\/strong><\/td><\/tr><tr><td><strong>Ума<\/strong><\/td><td><strong>«Плац»<\/strong>. Двор военной академии. На башне — ребёнок-фэйри, готовый прыгнуть. Голоса офицеров: «Стоять! Строй не покидать!»<\/td><td>Ума буквально не может сойти с места: приказ держит её в строю. Ребёнок прыгнет через 3 раунда<\/td><td><strong>Эстел.<\/strong> Плут с чертой «Атлетичный» — единственный, кто успеет взбежать и поймать ребёнка. Для Умы это испытание: <strong>позволить другому сделать то, что не удалось ей<\/strong><\/td><\/tr><tr><td><strong>Тесори<\/strong><\/td><td><strong>«Пустой стул»<\/strong>. Пустая рама там, где должен стоять Тесори. Из рамы шепчет голос Осириса<\/td><td>Комната пуста, в ней некого спасать<\/td><td><strong>Любой.<\/strong> Герой, вошедший сюда, может «вписать» Тесори (1 заряд краски или кровь на раме). Тесори появляется на один вдох: он жив, он в Башне, приказ Осириса жжёт его. Он успевает сказать одну фразу (см. ниже)<\/td><\/tr><\/tbody><\/table><\/div><h3>Как работает сцена<\/h3><ol><li><strong>Каждый раунд<\/strong> у героя одно действие <strong>в чужой<\/strong> комнате (протянуть руку через холст на стене) и одно <strong>в своей<\/strong>. В своей комнате нельзя спастись, но можно <strong>говорить<\/strong>: голос слышен во всех комнатах.<\/li><li>Чтобы протянуть руку в чужой холст, нужно сделать в нём разрез <strong>ножом для холста<\/strong> или мастихином, использовать магию (магическая рука, иллюзия) или потратить <strong>1 хит<\/strong>: холст «кусается».<\/li><li>Порядок спасения образует <strong>круг<\/strong>: Велисса → Эстел → Ума → Велисса. Начать может любой, но только с помощи <strong>другому<\/strong>.<\/li><li><strong>Таймер:<\/strong> у каждой комнаты 3 раунда. Потом комната «засыхает»: персонаж получает 1 Мазок и <strong>малую травму<\/strong> (Эстел — разум, Велисса — ожог, Ума — нога, «упала с плаца»).<\/li><li>Если игроки совсем застряли, на 4-м раунде вороны Каэлиса вытаскивают героев по одному. Цена: Мазок, травма, а портрет остаётся «Чужие» (см. ниже).<\/li><\/ol><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Пусть каждая комната звучит как воспоминание героя. Дайте игрокам <strong>реплики голосов<\/strong> из их прошлого: «С этим можно поработать», «Не смотри на неё», «Строй не покидать». Чем точнее голос, тем сильнее момент, когда товарищ отвечает за героя.<\/p><\/div><h3>Фраза Тесори (выберите одну)<\/h3><ul><li>«Не дайте ему закончить ваши лица. Осирис не судит того, у кого нет лица.»<\/li><li>«Велисса… прости. Он приказал. Я ещё сопротивляюсь.»<\/li><li>«Голубой глаз видит всё нарисованное. Значит, он не видит вас — пока вы настоящие.»<\/li><\/ul><h3>Финал сцены: «Групповой портрет»<\/h3><p>Когда все трое свободны, они снова в атриуме. Холст «Чужие» изменился: фигуры стоят <strong>лицом друг к другу<\/strong>, но лица ещё не дописаны. Табличка пуста.<\/p><p>Партия <strong>заканчивает портрет вместе<\/strong>. Каждый игрок по кругу отвечает на один вопрос о <strong>другом<\/strong> персонаже (не о своём). Каждый ответ дописывает деталь на холсте.<\/p><div class=\"tbl\"><table><thead><tr><th>Вопрос (для пары)<\/th><th>Пример применения<\/th><\/tr><\/thead><tbody><tr><td>Что твой герой заметил в X, чего X сам о себе не знает?<\/td><td>Ума о Эстеле: «Он мурлычет, когда думает, что никто не слышит»<\/td><\/tr><tr><td>Когда ты впервые доверил X спину?<\/td><td>Эстел об Уме: в катакомбах, когда она прикрыла его от крыс<\/td><\/tr><tr><td>Что ты сделаешь, если X однажды станет врагом?<\/td><td>Велисса об Уме: «Напомню ей про ребёнка»<\/td><\/tr><tr><td>Какую вещь X ты бы спас из огня?<\/td><td>Ума о Велиссе: амулет художника<\/td><\/tr><tr><td>Что X сказал тебе такого, что ты запомнил?<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><p>Последний шаг: <strong>игроки вместе дают картине название<\/strong>, а значит, и своей команде. Табличка «Чужие» перекрашивается сама. Портрет уменьшается до размера ладони, и его можно забрать с собой.<\/p><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Если на портрете остаётся пустое место Тесори — оставьте его пустым. Это напоминание: в команде есть человек, которого ещё предстоит вернуть.<\/p><\/div><h3>Механика: Узы партии<\/h3><p>После сцены у партии появляется <strong>Групповой портрет<\/strong> (сюжетный предмет) и <strong>Узы<\/strong> между парами героев. Каждая Уза срабатывает <strong>1 раз за короткую передышку<\/strong>.<\/p><div class=\"tbl\"><table><thead><tr><th>Уза<\/th><th>Название<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>Эстел ↔ Велисса<\/td><td><strong>«Ключ»<\/strong><\/td><td>Велисса создаёт отвлекающую иллюзию бонусным действием: Эстел получает Скрытую атаку по цели, даже если рядом с ней нет союзника. Или наоборот: Эстел реакцией снимает с Велиссы очарование или страх («Эй, мур, посмотри на меня»)<\/td><\/tr><tr><td>Велисса ↔ Ума<\/td><td><strong>«Щит и тень»<\/strong><\/td><td>Пока Велисса в 1,5 м от Умы, она игнорирует штраф солнца. Ума реакцией даёт Велиссе +2 к КД против одной атаки<\/td><\/tr><tr><td>Ума ↔ Эстел<\/td><td><strong>«Вперёд!»<\/strong><\/td><td>Ума бонусным действием отдаёт Эстелу приказ: он перемещается на половину скорости без провоцирования и получает преимущество на следующую атаку. Эстел соглашается <strong>по своей воле<\/strong> — это не печать<\/td><\/tr><tr><td>Вся партия<\/td><td><strong>«Групповой портрет»<\/strong><\/td><td>1 раз за долгую передышку: когда союзник проваливает спасбросок, любой другой герой в 9 м тратит реакцию и описывает, как поддерживает его. Союзник перебрасывает спасбросок<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Укрепление Уз.<\/strong> Каждая личная сцена между двумя героями (разговор у костра, спасение, ссора и примирение) даёт Узе <strong>+1 ранг<\/strong>, максимум 3. На ранге 2 Уза срабатывает дважды за короткую передышку. На ранге 3 открывается <strong>общий приём пары<\/strong> — придумайте его вместе с игроками.<\/p><p><strong>Разрыв Уз.<\/strong> Предательство, приказ против воли, использование очарования на союзнике без согласия разрывают Узу до примирения. Портрет показывает это: трещина между фигурами.<\/p><h3>Если сцена не получилась<\/h3><p>Если игроки выбрались только с помощью воронов, портрет остаётся «Чужие». Узы не появляются, но дом запоминает это: <strong>Ночь Перекраски<\/strong> первым делом перекрашивает именно отношения. Утром один нарисованный NPC путает героев между собой. Вернуться к портрету можно позже, после любой сцены настоящей взаимопомощи.<\/p><h3>Тихое продолжение: ночь у остывающего горна<\/h3><p>После сцены дайте партии передышку. Каэлис (если ему вернули голос) или нарисованный Фредерик разжигает горн в мастерской и молча варит что-то тёплое. Это <strong>безопасное место на одну ночь<\/strong>. Игроки по желанию отвечают на вопросы у огня; каждый честный ответ даёт <strong>вдохновение<\/strong>.<\/p><ul><li>Эстел: «Как звали твою сестру? Как она смеялась?»<\/li><li>Велисса: «Если бы ты могла сама дорисовать в себе одну деталь — какую?»<\/li><li>Ума: «Что ты скажешь кадетам, когда вернёшься домой, если вернёшься без победы?»<\/li><li>Всем: «Что вы сделаете с Картиной, если найдёте её завтра?» (первая тень финального выбора)<\/li><\/ul><h2 id=\"s9-5\">Находки мастерской<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Флакон краски Сайласа<\/strong> (5 зарядов)<\/td><td>Чердак, кабинет<\/td><td>Дорисовать, стереть, изменить; каждый заряд — 1 Мазок<\/td><\/tr><tr><td><strong>Растворитель<\/strong> (3 применения)<\/td><td>Кладовая пигментов<\/td><td>2d6 нарисованному, стирает нарисованный объект<\/td><\/tr><tr><td><strong>Мастихин подмастерья<\/strong><\/td><td>Кладовая<\/td><td>Оружие 1 уровня (см. раздел 37)<\/td><\/tr><tr><td><strong>Нож для холста<\/strong><\/td><td>Сушильня<\/td><td>Оружие 1 уровня; прорезает нарисованные двери<\/td><\/tr><tr><td><strong>Палитра-щит<\/strong><\/td><td>Атриум<\/td><td>Щит +1<\/td><\/tr><tr><td><strong>Синий берет<\/strong><\/td><td>Здание 1 / Холодильная<\/td><td>Видит нарисованное<\/td><\/tr><tr><td><strong>Банка синего пигмента<\/strong><\/td><td>Кладовая<\/td><td>3 применения: нанести на глаза — 10 минут видеть как в синем берете<\/td><\/tr><tr><td><strong>Банка зелёного пигмента<\/strong><\/td><td>Кладовая<\/td><td>Бросок в нарисованное существо: оно замедлено (−3 м скорости) на 1 минуту<\/td><\/tr><tr><td><strong>Банка красного пигмента<\/strong><\/td><td>Кладовая<\/td><td>Оживляет нарисованный предмет на 1 минуту (дверь откроется сама, нарисованная лестница станет настоящей)<\/td><\/tr><tr><td><strong>Клетка с нарисованной птицей<\/strong><\/td><td>Комната натурщиков<\/td><td>Голос Каэлиса<\/td><\/tr><tr><td><strong>Дневник Сайласа (фрагмент)<\/strong><\/td><td>Чердак<\/td><td>Улика; крючок в Обитель<\/td><\/tr><tr><td><strong>Карта Башни<\/strong><\/td><td>Чердак<\/td><td>«Вход — только для законченных»<\/td><\/tr><tr><td><strong>Групповой портрет<\/strong><\/td><td>Атриум (после сцены сплочения)<\/td><td>Узы партии<\/td><\/tr><tr><td><strong>Обгоревший холст Велиссы<\/strong><\/td><td>За шкафом на чердаке<\/td><td>Её прошлое; амулет теплеет рядом<\/td><\/tr><tr><td><strong>Рулон фэйского шёлка<\/strong><\/td><td>Кладовая<\/td><td>Крючок Умы; 1 кусок можно использовать как «холст» для заряда краски без Мазка<\/td><\/tr><tr><td><strong>Эскиз «К. Б., заказ»<\/strong><\/td><td>Атриум, папка заказов<\/td><td>Крючок Эстела<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s9-6\">Тяжёлый выбор мастерской<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Какого Фредерика оставить<\/strong><\/td><td>Нарисованный добр и полезен, настоящий честен и несчастен. Любое решение — чья-то смерть или искалеченная память (см. «Решение о Фредериках»)<\/td><\/tr><tr><td><strong>Вернуть ли голос Каэлису<\/strong><\/td><td>Голос вернётся, и Каэлис сможет провести героев в Башню. Но тогда он <strong>останется в Башне навсегда<\/strong>: Сайлас заберёт его обратно<\/td><\/tr><tr><td><strong>Использовать краску на Фредерике<\/strong><\/td><td>2 заряда из 5 — почти половина запаса на всю кампанию ради одного человека<\/td><\/tr><tr><td><strong>Взять письмо Нериссы или оставить<\/strong><\/td><td>Если оставить, Сайлас прочитает его и, возможно, отдаст Картину культу. Если взять, культ узнает, что герои были здесь<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s9-7\">Крючки мастерской<\/h2><ul><li><strong>Портреты героев:<\/strong> в кабинете Сайласа — список «моделей»: имена героев, дата высадки и пометка «отправлено в Галерею для доводки». → Галерея Портретов.<\/li><li><strong>Следы на потолке<\/strong> ведут к окну с видом на Башню; на стекле изнутри — отпечаток ладони синей краской.<\/li><li><strong>Голос Каэлиса:<\/strong> если вернуть — он расскажет, что Сайлас отнёс Картину в Башню после того, как «первый посторонний вошёл внутрь» (Тесори).<\/li><li><strong>Пустая рамка<\/strong> (из списка предметов) в мастерской начинает светиться рядом с портретами героев.<\/li><li><strong>Для Велиссы:<\/strong> на чердаке, за шкафом, — <strong>обгоревший холст<\/strong> с её силуэтом. Сгорела только рама, сам холст цел. На обороте: «Не смотри на неё. Не смотри на солнце.» Её амулет рядом с холстом теплеет.<\/li><li><strong>Для Умы:<\/strong> в кладовой — рулон <strong>фэйского шёлка<\/strong> с печатью её родной страны. Сайлас покупал холст у фэйских торговцев. Картина написана на таком же шёлке — вот почему летопись фэйри вообще знает о ней.<\/li><li><strong>Для Эстела:<\/strong> среди заказных эскизов — набросок огромного мужчины с парой серпов. Подпись: «К. Б., заказ. Не закончен — модель слишком злая.» Лицо замазано, но серпы Эстел узнает.<\/li><li><strong>Письмо Нериссы Вейл<\/strong> к Сайласу: «Брат, они придут за холстом. Отдай его нам, и я прослежу, чтобы тебя запомнили.» Первое появление культа в мастерской.<\/li><\/ul>", "toc": [["s9-1", "Цветовая система (ключ ко всем загадкам мастерской)"], ["s9-2", "Карта мастерской"], ["s9-3", "Решение о Фредериках"], ["s9-4", "Сплочение партии: «Разделённый холст»"], ["s9-5", "Находки мастерской"], ["s9-6", "Тяжёлый выбор мастерской"], ["s9-7", "Крючки мастерской"]], "text": "Мастерская Сайласа — трёхэтажный дом с застеклённой крышей. Внутри пахнет скипидаром, льняным маслом и чем-то сладким, как перезрелые фрукты. Дом подчиняется художественной логике , а не архитектуре: комнаты соединены так, как удобно композиции. Важно Главное открытие сцены: Картины в мастерской нет . Есть пустой мольберт гигантского размера и следы того, что холст унесли вверх (следы краски идут по стене и потолку к окну, выходящему на Башню). Мастерская должна дать игрокам: (1) флакон краски, (2) понимание, почему Башня их не пускает, (3) решение по Фредерикам, (4) свои портреты как крючок в Галерею. Цветовая система (ключ ко всем загадкам мастерской) Цвет Значение Что делает с нарисованным Красный Плоть, жизнь «Оживляет», делает настоящим, будит Зелёный Сохранение, покой Замораживает, консервирует, усыпляет Синий Взгляд, истина, память Показывает, что нарисовано; даёт видеть глазами картины Смешение (бурый) Грязь, гниль Порождает Грязевика — существо из испорченной краски Совет мастеру Цвет предмета определяет его функцию. Если игроки поняли систему — дайте им почувствовать себя умными: зелёная краска на нарисованном враге действительно его замедлит. Карта мастерской 1. Прихожая с портретами Узкий коридор, на стенах — 12 портретов горожан. Глаза следят за героями. Ловушка «Не отводи глаз»: один портрет (женщина в синем) движется, только когда на неё никто не смотрит. Каждый раунд, когда никто из партии не заявляет, что смотрит на неё, она приближается на 3 м. Добравшись, она обнимает жертву: спасбросок Силы СЛ 12, при провале — схвачен, 1d6 холода в начале хода (она «засыхает» вместе с жертвой). Уничтожается растворителем, огнём или ударом по раме. Деталь: среди портретов — Селена Морвейн с фотоаппаратом. Её портрет плачет настоящими слезами (соль). Крючок в Мглин. 2. Мастерская-атриум (центральный зал) Огромный пустой мольберт до потолка. Вокруг — сотни эскизов города. Стеклянная крыша смотрит на Башню. Ловушка «Незаконченный холст»: у стены стоит холст с эскизом комнаты, в которой сейчас стоят герои. Первый, кто встанет перед ним, должен пройти спасбросок Мудрости СЛ 12. Провал: на холсте появляется его силуэт, персонаж получает 1 Мазок , а в Акте I позже появится его нарисованный двойник (враг или союзник — по решению мастера). Находка: эскиз Башни с фигурой Тесори в окне. Через час игрового времени фигура меняет позу. Находка: записка углём от Каэлиса: «Он унёс её наверх. Башня примет только тех, кто законченный.» 3. Сушильня Холсты висят на верёвках, как бельё. Тесно, полутьма. Ловушка «Пол-эскиз»: часть досок пола не дописана — это контур углём. Внимательность (Мудрость) СЛ 13 замечает, что линии не закрашены. Шаг на контур — падение на этаж ниже, 2d6 дробящего + персонаж оказывается в Кладовой пигментов, одна. Враг: 1d4 «Мокрых силуэтов» — фигуры с незасохших холстов. Слабы к огню, но огонь здесь опасен (см. Кладовая). 4. Кладовая пигментов и растворителей Банки, ступки, мешки с толчёным камнем. Запах скипидара режет глаза. Ловушка «Скипидарные пары»: любое открытое пламя (факел, лампа, огненный заговор) вызывает вспышку: 2d6 огня, спасбросок Ловкости СЛ 13, половина при успехе. Нарисованные существа получают двойной урон. Игроки могут использовать это против врагов. Находка: бутыль растворителя (3 применения): наносит 2d6 урона нарисованному существу или стирает нарисованный объект. Использование растворителя на горожанах растит Страх нарисованных . Находка: ступка Каэлиса — внутри, на дне, синим нацарапано: «Птица в клетке — мой голос». 5. Комната натурщиков Подиум, драпировки, зеркала. Тридцать одинаковых набросков Иары Ноктиль. Ловушка «Поза»: если персонаж встаёт на подиум, зеркала «фиксируют» его. Спасбросок Телосложения СЛ 12, при провале — опутан до конца следующего хода (не может двигаться, «держит позу»). Находка: клетка с нарисованной птицей — это голос Каэлиса. Красная краска на птице оживит её, и она улетит к хозяину. Каэлис снова заговорит. 6. Холодильная (ледник) Металлическая дверь, иней. Внутри — шкаф-холодильник с двумя ручками: зелёная слева, красная справа . Загадка: чтобы открыть холодильник безопасно, нужно приложить зелёный перстень к левой ручке (сохранить), а затем красный — к правой (оживить). Красный перстень носит нарисованный Фредерик. Зелёный — на руке Фредерика из холодильника внутри (видно сквозь иней) или в здании 1. Неверный порядок / силовое вскрытие: холодильник открывается рывком, Фредерик из холодильника выходит уже в подготовке (см. механику подготовительного хода): первым ходом он наносит удвоенный урон. Синий берет (из здания 1), надетый на любого героя, позволяет видеть: кто из Фредериков нарисован (у нарисованного нет тени в синем свете). Фредерик из холодильника (боевые заметки) Параметр Значение Хиты 50 Особенность Подготовка «Ледяной вздох» — конус 4,5 м, 2d8 холода, спасбросок Телосложения СЛ 13 Условие прерывания Молитва (священник или персонаж с религией), синий берет, назвать его настоящим именем, нанести урон огнём После прерывания Пропускает ход и на мгновение «вспоминает» себя — можно говорить Рабочий лог хитов из прошлой сессии (сохранён из исходника): 50 − 7 = 43; 43 − 8 − 4 − 2 − 4 − 3 − 4 = 18; 18 − 4 = 14; 14 − 1 = 13; 13 − 3 = 10 . 7. Чердак — кабинет Сайласа Заперт. Замок — палитра с тремя углублениями: синий, красный, зелёный. Загадка «Палетка Фредерика»: нужно положить цвета в порядке, в котором Сайлас создаёт человека: синий (увидеть) → зелёный (сохранить образ) → красный (оживить). Подсказка — надпись на обороте эскиза: «Сначала взгляни. Потом удержи. Потом дай дышать.» Ошибка: смесь цветов стекает и превращается в Грязевика (бурое существо: 22 хита, КД 11, атака 1d8 дробящего, при попадании — помеха на следующую атаку цели). Награда: Флакон краски (5 зарядов), Дневник Сайласа (фрагмент) — первые страницы; последние вырваны («остальное забрали серые монахи» — крючок в Обитель Переписчиков), карта Башни с пометкой «вход — только для законченных». Решение о Фредериках Выбор Последствие Оставить нарисованного Идеальный союзник в городе, но при Ночи Перекраски может забыть героев. Освободить настоящего Слабый, злой, честный. Знает слабые места Сайласа. Ненавидит свою копию. Свести их вместе Встреча двух версий: одна должна исчезнуть, или синий берет + краска (2 заряда) соединяют их в одного — несовершенного, но целого. Убить одного Второй не исчезает . Смерть одной версии не уничтожает другую — но выжившая теряет часть памяти. Совет мастеру Это первая «маленькая версия» финального выбора кампании. Как игроки поступят с Фредериком — так, скорее всего, они захотят поступить и с городом. Запишите их решение. Сплочение партии: «Разделённый холст» Цель сцены — превратить группу попутчиков в команду. Мастерская Сайласа для этого идеальна: дом подчиняется художественной логике, а значит, отношения героев здесь становятся пространством . Важно Сцена рассчитана на одну сессию или её половину. Её главный принцип: никто не может выйти сам — только вытащить другого . Мастер не подталкивает игроков к правильному порядку: пусть сами поймут, что спасение начинается с помощи соседу. Завязка: портрет «Чужие» В атриуме, за пустым мольбертом, стоит небольшой холст, который герои раньше не замечали. На нём они сами : Эстел, Велисса, Ума и Тесори стоят спиной друг к другу и смотрят в разные стороны. Внизу табличка: «Чужие». Не закончено. Когда кто-то из героев касается холста (или когда партия ссорится в мастерской — это лучший момент), дом принимает название буквально . Свет гаснет. Каждый герой приходит в себя один , внутри своей картины. На стенах каждой комнаты висят маленькие холсты, и в них видны комнаты остальных. Четыре комнаты Герой Комната Что держит Кто может помочь Эстел «Клетка» . Рынок гоблина-работорговца. Эстел снова в клетке, а голос за решёткой спрашивает: «Он сопротивлялся?» Замок клетки нарисован снаружи Изнутри замок не существует: его нельзя вскрыть отмычками Велисса. Её зеркало показывает «желание» замка: он хочет, чтобы его открыли снаружи. Магическая рука или очарование «голоса хозяина» открывают клетку Велисса «Солнечная мансарда» . Холст, оставленный сохнуть на солнце. Свет льётся со всех сторон, Велисса выцветает. В углу — силуэт Сайласа с факелом Тени нет нигде: уйти из света нельзя, а каждый раунд — 1 уровень истощения «выцветания» (снимается после сцены) Ума. Офицер закрывает собой солдата. Её крылья и доспех отбрасывают единственную тень в комнате. Ума должна встать между Велиссой и солнцем и не двигаться Ума «Плац» . Двор военной академии. На башне — ребёнок-фэйри, готовый прыгнуть. Голоса офицеров: «Стоять! Строй не покидать!» Ума буквально не может сойти с места: приказ держит её в строю. Ребёнок прыгнет через 3 раунда Эстел. Плут с чертой «Атлетичный» — единственный, кто успеет взбежать и поймать ребёнка. Для Умы это испытание: позволить другому сделать то, что не удалось ей Тесори «Пустой стул» . Пустая рама там, где должен стоять Тесори. Из рамы шепчет голос Осириса Комната пуста, в ней некого спасать Любой. Герой, вошедший сюда, может «вписать» Тесори (1 заряд краски или кровь на раме). Тесори появляется на один вдох: он жив, он в Башне, приказ Осириса жжёт его. Он успевает сказать одну фразу (см. ниже) Как работает сцена Каждый раунд у героя одно действие в чужой комнате (протянуть руку через холст на стене) и одно в своей . В своей комнате нельзя спастись, но можно говорить : голос слышен во всех комнатах. Чтобы протянуть руку в чужой холст, нужно сделать в нём разрез ножом для холста или мастихином, использовать магию (магическая рука, иллюзия) или потратить 1 хит : холст «кусается». Порядок спасения образует круг : Велисса → Эстел → Ума → Велисса. Начать может любой, но только с помощи другому . Таймер: у каждой комнаты 3 раунда. Потом комната «засыхает»: персонаж получает 1 Мазок и малую травму (Эстел — разум, Велисса — ожог, Ума — нога, «упала с плаца»). Если игроки совсем застряли, на 4-м раунде вороны Каэлиса вытаскивают героев по одному. Цена: Мазок, травма, а портрет остаётся «Чужие» (см. ниже). Совет мастеру Пусть каждая комната звучит как воспоминание героя. Дайте игрокам реплики голосов из их прошлого: «С этим можно поработать», «Не смотри на неё», «Строй не покидать». Чем точнее голос, тем сильнее момент, когда товарищ отвечает за героя. Фраза Тесори (выберите одну) «Не дайте ему закончить ваши лица. Осирис не судит того, у кого нет лица.» «Велисса… прости. Он приказал. Я ещё сопротивляюсь.» «Голубой глаз видит всё нарисованное. Значит, он не видит вас — пока вы настоящие.» Финал сцены: «Групповой портрет» Когда все трое свободны, они снова в атриуме. Холст «Чужие» изменился: фигуры стоят лицом друг к другу , но лица ещё не дописаны. Табличка пуста. Партия заканчивает портрет вместе . Каждый игрок по кругу отвечает на один вопрос о другом персонаже (не о своём). Каждый ответ дописывает деталь на холсте. Вопрос (для пары) Пример применения Что твой герой заметил в X, чего X сам о себе не знает? Ума о Эстеле: «Он мурлычет, когда думает, что никто не слышит» Когда ты впервые доверил X спину? Эстел об Уме: в катакомбах, когда она прикрыла его от крыс Что ты сделаешь, если X однажды станет врагом? Велисса об Уме: «Напомню ей про ребёнка» Какую вещь X ты бы спас из огня? Ума о Велиссе: амулет художника Что X сказал тебе такого, что ты запомнил? — Последний шаг: игроки вместе дают картине название , а значит, и своей команде. Табличка «Чужие» перекрашивается сама. Портрет уменьшается до размера ладони, и его можно забрать с собой. Важно Если на портрете остаётся пустое место Тесори — оставьте его пустым. Это напоминание: в команде есть человек, которого ещё предстоит вернуть. Механика: Узы партии После сцены у партии появляется Групповой портрет (сюжетный предмет) и Узы между парами героев. Каждая Уза срабатывает 1 раз за короткую передышку . Уза Название Эффект Эстел ↔ Велисса «Ключ» Велисса создаёт отвлекающую иллюзию бонусным действием: Эстел получает Скрытую атаку по цели, даже если рядом с ней нет союзника. Или наоборот: Эстел реакцией снимает с Велиссы очарование или страх («Эй, мур, посмотри на меня») Велисса ↔ Ума «Щит и тень» Пока Велисса в 1,5 м от Умы, она игнорирует штраф солнца. Ума реакцией даёт Велиссе +2 к КД против одной атаки Ума ↔ Эстел «Вперёд!» Ума бонусным действием отдаёт Эстелу приказ: он перемещается на половину скорости без провоцирования и получает преимущество на следующую атаку. Эстел соглашается по своей воле — это не печать Вся партия «Групповой портрет» 1 раз за долгую передышку: когда союзник проваливает спасбросок, любой другой герой в 9 м тратит реакцию и описывает, как поддерживает его. Союзник перебрасывает спасбросок Укрепление Уз. Каждая личная сцена между двумя героями (разговор у костра, спасение, ссора и примирение) даёт Узе +1 ранг , максимум 3. На ранге 2 Уза срабатывает дважды за короткую передышку. На ранге 3 открывается общий приём пары — придумайте его вместе с игроками. Разрыв Уз. Предательство, приказ против воли, использование очарования на союзнике без согласия разрывают Узу до примирения. Портрет показывает это: трещина между фигурами. Если сцена не получилась Если игроки выбрались только с помощью воронов, портрет остаётся «Чужие». Узы не появляются, но дом запоминает это: Ночь Перекраски первым делом перекрашивает именно отношения. Утром один нарисованный NPC путает героев между собой. Вернуться к портрету можно позже, после любой сцены настоящей взаимопомощи. Тихое продолжение: ночь у остывающего горна После сцены дайте партии передышку. Каэлис (если ему вернули голос) или нарисованный Фредерик разжигает горн в мастерской и молча варит что-то тёплое. Это безопасное место на одну ночь . Игроки по желанию отвечают на вопросы у огня; каждый честный ответ даёт вдохновение . Эстел: «Как звали твою сестру? Как она смеялась?» Велисса: «Если бы ты могла сама дорисовать в себе одну деталь — какую?» Ума: «Что ты скажешь кадетам, когда вернёшься домой, если вернёшься без победы?» Всем: «Что вы сделаете с Картиной, если найдёте её завтра?» (первая тень финального выбора) Находки мастерской Предмет Где Эффект Флакон краски Сайласа (5 зарядов) Чердак, кабинет Дорисовать, стереть, изменить; каждый заряд — 1 Мазок Растворитель (3 применения) Кладовая пигментов 2d6 нарисованному, стирает нарисованный объект Мастихин подмастерья Кладовая Оружие 1 уровня (см. раздел 37) Нож для холста Сушильня Оружие 1 уровня; прорезает нарисованные двери Палитра-щит Атриум Щит +1 Синий берет Здание 1 / Холодильная Видит нарисованное Банка синего пигмента Кладовая 3 применения: нанести на глаза — 10 минут видеть как в синем берете Банка зелёного пигмента Кладовая Бросок в нарисованное существо: оно замедлено (−3 м скорости) на 1 минуту Банка красного пигмента Кладовая Оживляет нарисованный предмет на 1 минуту (дверь откроется сама, нарисованная лестница станет настоящей) Клетка с нарисованной птицей Комната натурщиков Голос Каэлиса Дневник Сайласа (фрагмент) Чердак Улика; крючок в Обитель Карта Башни Чердак «Вход — только для законченных» Групповой портрет Атриум (после сцены сплочения) Узы партии Обгоревший холст Велиссы За шкафом на чердаке Её прошлое; амулет теплеет рядом Рулон фэйского шёлка Кладовая Крючок Умы; 1 кусок можно использовать как «холст» для заряда краски без Мазка Эскиз «К. Б., заказ» Атриум, папка заказов Крючок Эстела Тяжёлый выбор мастерской Выбор Почему тяжело Какого Фредерика оставить Нарисованный добр и полезен, настоящий честен и несчастен. Любое решение — чья-то смерть или искалеченная память (см. «Решение о Фредериках») Вернуть ли голос Каэлису Голос вернётся, и Каэлис сможет провести героев в Башню. Но тогда он останется в Башне навсегда : Сайлас заберёт его обратно Использовать краску на Фредерике 2 заряда из 5 — почти половина запаса на всю кампанию ради одного человека Взять письмо Нериссы или оставить Если оставить, Сайлас прочитает его и, возможно, отдаст Картину культу. Если взять, культ узнает, что герои были здесь Крючки мастерской Портреты героев: в кабинете Сайласа — список «моделей»: имена героев, дата высадки и пометка «отправлено в Галерею для доводки». → Галерея Портретов. Следы на потолке ведут к окну с видом на Башню; на стекле изнутри — отпечаток ладони синей краской. Голос Каэлиса: если вернуть — он расскажет, что Сайлас отнёс Картину в Башню после того, как «первый посторонний вошёл внутрь» (Тесори). Пустая рамка (из списка предметов) в мастерской начинает светиться рядом с портретами героев. Для Велиссы: на чердаке, за шкафом, — обгоревший холст с её силуэтом. Сгорела только рама, сам холст цел. На обороте: «Не смотри на неё. Не смотри на солнце.» Её амулет рядом с холстом теплеет. Для Умы: в кладовой — рулон фэйского шёлка с печатью её родной страны. Сайлас покупал холст у фэйских торговцев. Картина написана на таком же шёлке — вот почему летопись фэйри вообще знает о ней. Для Эстела: среди заказных эскизов — набросок огромного мужчины с парой серпов. Подпись: «К. Б., заказ. Не закончен — модель слишком злая.» Лицо замазано, но серпы Эстел узнает. Письмо Нериссы Вейл к Сайласу: «Брат, они придут за холстом. Отдай его нам, и я прослежу, чтобы тебя запомнили.» Первое появление культа в мастерской."}, {"id": "s10", "n": 10, "title": "ГОРОД: ЛОВУШКИ, КРЮЧКИ, ПОБОЧНЫЕ ЛИНИИ", "disp": "Город: ловушки, крючки, побочные линии", "group": "Акт I", "html": "<h2 id=\"s10-1\">Ловушки и опасности города<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Где<\/th><th>Как работает<\/th><th>Как заметить / обойти<\/th><\/tr><\/thead><tbody><tr><td>Дверь-мазок<\/td><td>Любая улица<\/td><td>Дверь ведёт не в ту комнату; закрывается за спиной<\/td><td>Синий свет; дверная ручка не отбрасывает тени<\/td><\/tr><tr><td>Окно другой погоды<\/td><td>Дома на площади<\/td><td>Залезть в окно = выйти в другой район под дождём; 1 деление Часов Холста<\/td><td>Расследование СЛ 12 — стекло нарисовано<\/td><\/tr><tr><td>Эскиз-переулок<\/td><td>Трущобы<\/td><td>Переулок из угля; на каждом шаге 1 из 6 — «стирается» кусок, падение<\/td><td>Мел, верёвка, идти по закрашенному<\/td><\/tr><tr><td>Толпа двойников<\/td><td>Площадь Мольберта<\/td><td>30 Иар окружают и повторяют движения героев; атака = все атакуют<\/td><td>Не делать резких движений; синий берет показывает настоящую<\/td><\/tr><tr><td>Свежая краска<\/td><td>Улицы после Перекраски<\/td><td>Липкое покрытие: труднопроходимая местность; упавший получает 1 Мазок<\/td><td>Ждать высыхания (1 час)<\/td><\/tr><tr><td>Колокол Церкви<\/td><td>Церковь<\/td><td>Звон заставляет нарисованных «замереть», а людей — спасбросок Мудрости СЛ 11 или ошеломлён на 1 раунд<\/td><td>Затыкать уши (помеха на Внимательность)<\/td><\/tr><tr><td>Рама-капкан<\/td><td>Галерея<\/td><td>Пустая рама на стене «рамирует» того, кто перед ней: опутан, 1 Мазок за раунд<\/td><td>Сломать раму (КД 12, 10 хитов)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s10-2\">Побочные квесты Акта I<\/h2><h3>«Шкатулка с повозки»<\/h3><ul><li><strong>Кто даёт:<\/strong> выживший с повозки (если ещё не завершён — Гримвар Дакк знает, где шкатулка).<\/li><li><strong>Суть:<\/strong> банда Гримвара спрятала шкатулку в катакомбах. Гримвар отдаст её, если герои уберут Короля Крыс с его «склада».<\/li><li><strong>Внутри:<\/strong> <strong>половина фотографии<\/strong> — настоящий Гравенхольм, улица с домом без окон. Вторая половина — в Мглине. Это <strong>главный крючок к Фотографии<\/strong>.<\/li><\/ul><h3>«Друг-крыса»<\/h3><ul><li><strong>Кто даёт:<\/strong> Старый Броммир Пепельный.<\/li><li><strong>Суть:<\/strong> Графиня, его крыса, пропала — её «забрал» Король. Броммир просит вернуть её живой.<\/li><li><strong>Поворот:<\/strong> Графиня — нарисованная крыса, «эскиз» Короля. Если убить Короля — Графиня исчезнет. Если договориться (каменная корона) — Броммир получает друга обратно, а крысы становятся союзниками.<\/li><li><strong>Шляпа контроля:<\/strong> Броммир носит её, не помня откуда. Шляпа позволяет раз в день отдать приказ одному существу (как заклинание «Приказ», СЛ 12). Но каждый раз надевший проходит спасбросок Мудрости СЛ 12: при провале шляпа отдаёт приказ <strong>ему<\/strong> (мастер выбирает). Шляпа — подарок культа Скрытности. Владелец постепенно забывает своё имя.<\/li><\/ul><h3>«Тридцать Иар»<\/h3><ul><li><strong>Кто даёт:<\/strong> настоящая Иара Ноктиль (её можно найти в трущобах — без лица на портретах, её «украли» копии).<\/li><li><strong>Суть:<\/strong> доказать, кто из 31 женщины настоящая. Копии считают себя оригиналом.<\/li><li><strong>Решения:<\/strong> синий берет; вопрос о боли (копии не помнят шрамов); фотография.<\/li><li><strong>Награда:<\/strong> Иара знает, как Сайлас «заканчивает» человека — и как сделать героя «законченным» для Башни.<\/li><\/ul><h3>«Добрый доктор»<\/h3><ul><li><strong>Кто даёт:<\/strong> мать, чей сын после лечения нарисованного Элиаса забыл, что у него был брат.<\/li><li><strong>Суть:<\/strong> вернуть память. Решение — только у настоящего Элиаса (крючок в Акт II) или через краску («вернуть к предыдущему состоянию», 2 заряда).<\/li><\/ul><h3>«Пятна на холсте»<\/h3><ul><li><strong>Кто даёт:<\/strong> Отец Вальдрик Морн.<\/li><li><strong>Суть:<\/strong> «очистить» квартал от «пятна» — семьи настоящих людей, переживших чуму и прячущихся среди нарисованных.<\/li><li><strong>Поворот:<\/strong> если герои согласятся — растёт доверие культа и падает доверие Веспера. Если откажутся — Вальдрик натравит на героев прихожан. Прямой выход на культ Посланца в городе.<\/li><\/ul><h2 id=\"s10-3\">Галерея Портретов<\/h2><p>Зал с портретами всех жителей. Каждый портрет связан с человеком.<\/p><ul><li><strong>Портреты героев<\/strong> в запаснике. Они <strong>не закончены<\/strong>: у каждого недописана одна деталь (глаз, рука, тень).<\/li><li>Если портрет <strong>закончить<\/strong> (Сайлас, или краска 1 заряд) — Башня пропускает героя. Цена: <strong>+2 Мазка<\/strong> сразу.<\/li><li>Если портрет <strong>уничтожить<\/strong> — герой больше не может стать нарисованным, Башня отторгает его навсегда (нужны другие способы входа), а Сайлас воспринимает это как личное оскорбление.<\/li><li>Если портрет <strong>украсть<\/strong> — его можно носить с собой: повреждение портрета ранит героя, но и культ не сможет использовать портрет против него.<\/li><li><strong>Портрет Велиссы<\/strong> — особый: он написан дважды, и вторая версия перечёркнута с надписью «уродство». Связь с существом из картины, которое отвергло её. <em>(Тайна мастеру: это не портрет «с натуры». Велисса — <strong>создание Сайласа<\/strong>: он написал её задолго до Картины, испугался и попытался сжечь. Первая версия — та, что получилась. Вторая — та, которую он пытался сделать «правильной» и бросил. См. раздел 33.)<\/em><\/li><\/ul><h2 id=\"s10-4\">Встреча с существом из картины (сохранено)<\/h2><ul><li>Ума чувствует, что это та самая картина или объект, связанный с ней.<\/li><li>Эстел ощущает, что порождённое картиной существо <strong>необходимо<\/strong>.<\/li><li>Велисса чувствует связь с картиной, но существо отвергает её и называет <strong>уродством<\/strong>.<\/li><li>Тесори ощущает приказ Осириса: существо необходимо убить, и срочно.<\/li><\/ul><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Одна сцена даёт разным персонажам несовместимые интерпретации. Это нужно сохранить: игроки не должны получить одну «правильную» реакцию.<\/p><\/div><h2 id=\"s10-5\">Находки города<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Трость прихожанина<\/strong><\/td><td>Церковь Чистого Холста<\/td><td>Оружие 1 уровня<\/td><\/tr><tr><td><strong>Серп Чистого Холста<\/strong><\/td><td>Тайник Отца Вальдрика за алтарём<\/td><td>Оружие 2 уровня, посеребрённый<\/td><\/tr><tr><td><strong>Праща с красильными шариками<\/strong><\/td><td>Галерея, кладовая уборщика<\/td><td>Оружие 1 уровня; метит невидимое<\/td><\/tr><tr><td><strong>Багор фонарщика<\/strong><\/td><td>Сторожка фонарщика<\/td><td>Оружие 1 уровня<\/td><\/tr><tr><td><strong>Колесцовый пистоль<\/strong><\/td><td>Логово банды Гримвара<\/td><td>Оружие 1 уровня, парирование<\/td><\/tr><tr><td><strong>Святая вода «без примесей»<\/strong> (2)<\/td><td>Церковь<\/td><td>Нарисованное существо, облитое ею, 1 раунд не может атаковать (оно «размывается»)<\/td><\/tr><tr><td><strong>Плащ горожанина<\/strong><\/td><td>Рынок, площадь Мольберта<\/td><td>Нарисованные принимают героя за своего, пока он молчит; Страх нарисованных не растёт от его действий в течение сцены<\/td><\/tr><tr><td><strong>Портретная рамка Морвен<\/strong><\/td><td>Кабинет куратора<\/td><td>Вставленный в неё портрет нельзя испортить, пока рамка цела<\/td><\/tr><tr><td><strong>Бутылка «вина без похмелья»<\/strong><\/td><td>Таверна «Последняя свеча»<\/td><td>Нарисованное вино: +1d4 хита, но к утру у выпившего пятно краски на языке (косметика)<\/td><\/tr><tr><td><strong>Ключи от Галереи<\/strong><\/td><td>У Морвен Блэкхарт (украсть или купить услугой)<\/td><td>Доступ к запасникам и портретам героев<\/td><\/tr><tr><td><strong>Половина фотографии<\/strong><\/td><td>Шкатулка с повозки<\/td><td>Крючок в Мглин<\/td><\/tr><tr><td><strong>Шляпа контроля<\/strong><\/td><td>У Броммира<\/td><td>1 раз в день «Приказ»; риск для владельца<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s10-6\">Тяжёлые выборы города<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Квест «Пятна на холсте»<\/strong><\/td><td>Выдать живых людей, прячущихся среди нарисованных, и получить доступ к культу — или защитить их и получить врага в лице церкви<\/td><\/tr><tr><td><strong>«Тридцать Иар»<\/strong><\/td><td>Доказать, кто настоящая, — значит обречь 30 копий, которые искренне считают себя Иарой. Каждая просит не выдавать её<\/td><\/tr><tr><td><strong>«Добрый доктор»<\/strong><\/td><td>Вернуть сыну память о брате — значит вернуть ему горе. Мать сама не уверена, хочет ли она этого<\/td><\/tr><tr><td><strong>Портреты героев<\/strong><\/td><td>Закончить — Башня откроется, но Сайлас получит власть над героем. Уничтожить — путь в Башню станет труднее, а Сайлас станет врагом<\/td><\/tr><tr><td><strong>Шляпа контроля<\/strong><\/td><td>Отобрать у Броммира: он перестанет забывать себя, но потеряет защиту от крыс и уличных банд. Шляпа нужна ему, чтобы выжить<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s10-1", "Ловушки и опасности города"], ["s10-2", "Побочные квесты Акта I"], ["s10-3", "Галерея Портретов"], ["s10-4", "Встреча с существом из картины (сохранено)"], ["s10-5", "Находки города"], ["s10-6", "Тяжёлые выборы города"]], "text": "Ловушки и опасности города Ловушка Где Как работает Как заметить / обойти Дверь-мазок Любая улица Дверь ведёт не в ту комнату; закрывается за спиной Синий свет; дверная ручка не отбрасывает тени Окно другой погоды Дома на площади Залезть в окно = выйти в другой район под дождём; 1 деление Часов Холста Расследование СЛ 12 — стекло нарисовано Эскиз-переулок Трущобы Переулок из угля; на каждом шаге 1 из 6 — «стирается» кусок, падение Мел, верёвка, идти по закрашенному Толпа двойников Площадь Мольберта 30 Иар окружают и повторяют движения героев; атака = все атакуют Не делать резких движений; синий берет показывает настоящую Свежая краска Улицы после Перекраски Липкое покрытие: труднопроходимая местность; упавший получает 1 Мазок Ждать высыхания (1 час) Колокол Церкви Церковь Звон заставляет нарисованных «замереть», а людей — спасбросок Мудрости СЛ 11 или ошеломлён на 1 раунд Затыкать уши (помеха на Внимательность) Рама-капкан Галерея Пустая рама на стене «рамирует» того, кто перед ней: опутан, 1 Мазок за раунд Сломать раму (КД 12, 10 хитов) Побочные квесты Акта I «Шкатулка с повозки» Кто даёт: выживший с повозки (если ещё не завершён — Гримвар Дакк знает, где шкатулка). Суть: банда Гримвара спрятала шкатулку в катакомбах. Гримвар отдаст её, если герои уберут Короля Крыс с его «склада». Внутри: половина фотографии — настоящий Гравенхольм, улица с домом без окон. Вторая половина — в Мглине. Это главный крючок к Фотографии . «Друг-крыса» Кто даёт: Старый Броммир Пепельный. Суть: Графиня, его крыса, пропала — её «забрал» Король. Броммир просит вернуть её живой. Поворот: Графиня — нарисованная крыса, «эскиз» Короля. Если убить Короля — Графиня исчезнет. Если договориться (каменная корона) — Броммир получает друга обратно, а крысы становятся союзниками. Шляпа контроля: Броммир носит её, не помня откуда. Шляпа позволяет раз в день отдать приказ одному существу (как заклинание «Приказ», СЛ 12). Но каждый раз надевший проходит спасбросок Мудрости СЛ 12: при провале шляпа отдаёт приказ ему (мастер выбирает). Шляпа — подарок культа Скрытности. Владелец постепенно забывает своё имя. «Тридцать Иар» Кто даёт: настоящая Иара Ноктиль (её можно найти в трущобах — без лица на портретах, её «украли» копии). Суть: доказать, кто из 31 женщины настоящая. Копии считают себя оригиналом. Решения: синий берет; вопрос о боли (копии не помнят шрамов); фотография. Награда: Иара знает, как Сайлас «заканчивает» человека — и как сделать героя «законченным» для Башни. «Добрый доктор» Кто даёт: мать, чей сын после лечения нарисованного Элиаса забыл, что у него был брат. Суть: вернуть память. Решение — только у настоящего Элиаса (крючок в Акт II) или через краску («вернуть к предыдущему состоянию», 2 заряда). «Пятна на холсте» Кто даёт: Отец Вальдрик Морн. Суть: «очистить» квартал от «пятна» — семьи настоящих людей, переживших чуму и прячущихся среди нарисованных. Поворот: если герои согласятся — растёт доверие культа и падает доверие Веспера. Если откажутся — Вальдрик натравит на героев прихожан. Прямой выход на культ Посланца в городе. Галерея Портретов Зал с портретами всех жителей. Каждый портрет связан с человеком. Портреты героев в запаснике. Они не закончены : у каждого недописана одна деталь (глаз, рука, тень). Если портрет закончить (Сайлас, или краска 1 заряд) — Башня пропускает героя. Цена: +2 Мазка сразу. Если портрет уничтожить — герой больше не может стать нарисованным, Башня отторгает его навсегда (нужны другие способы входа), а Сайлас воспринимает это как личное оскорбление. Если портрет украсть — его можно носить с собой: повреждение портрета ранит героя, но и культ не сможет использовать портрет против него. Портрет Велиссы — особый: он написан дважды, и вторая версия перечёркнута с надписью «уродство». Связь с существом из картины, которое отвергло её. (Тайна мастеру: это не портрет «с натуры». Велисса — создание Сайласа : он написал её задолго до Картины, испугался и попытался сжечь. Первая версия — та, что получилась. Вторая — та, которую он пытался сделать «правильной» и бросил. См. раздел 33.) Встреча с существом из картины (сохранено) Ума чувствует, что это та самая картина или объект, связанный с ней. Эстел ощущает, что порождённое картиной существо необходимо . Велисса чувствует связь с картиной, но существо отвергает её и называет уродством . Тесори ощущает приказ Осириса: существо необходимо убить, и срочно. Важно Одна сцена даёт разным персонажам несовместимые интерпретации. Это нужно сохранить: игроки не должны получить одну «правильную» реакцию. Находки города Предмет Где Эффект Трость прихожанина Церковь Чистого Холста Оружие 1 уровня Серп Чистого Холста Тайник Отца Вальдрика за алтарём Оружие 2 уровня, посеребрённый Праща с красильными шариками Галерея, кладовая уборщика Оружие 1 уровня; метит невидимое Багор фонарщика Сторожка фонарщика Оружие 1 уровня Колесцовый пистоль Логово банды Гримвара Оружие 1 уровня, парирование Святая вода «без примесей» (2) Церковь Нарисованное существо, облитое ею, 1 раунд не может атаковать (оно «размывается») Плащ горожанина Рынок, площадь Мольберта Нарисованные принимают героя за своего, пока он молчит; Страх нарисованных не растёт от его действий в течение сцены Портретная рамка Морвен Кабинет куратора Вставленный в неё портрет нельзя испортить, пока рамка цела Бутылка «вина без похмелья» Таверна «Последняя свеча» Нарисованное вино: +1d4 хита, но к утру у выпившего пятно краски на языке (косметика) Ключи от Галереи У Морвен Блэкхарт (украсть или купить услугой) Доступ к запасникам и портретам героев Половина фотографии Шкатулка с повозки Крючок в Мглин Шляпа контроля У Броммира 1 раз в день «Приказ»; риск для владельца Тяжёлые выборы города Выбор Почему тяжело Квест «Пятна на холсте» Выдать живых людей, прячущихся среди нарисованных, и получить доступ к культу — или защитить их и получить врага в лице церкви «Тридцать Иар» Доказать, кто настоящая, — значит обречь 30 копий, которые искренне считают себя Иарой. Каждая просит не выдавать её «Добрый доктор» Вернуть сыну память о брате — значит вернуть ему горе. Мать сама не уверена, хочет ли она этого Портреты героев Закончить — Башня откроется, но Сайлас получит власть над героем. Уничтожить — путь в Башню станет труднее, а Сайлас станет врагом Шляпа контроля Отобрать у Броммира: он перестанет забывать себя, но потеряет защиту от крыс и уличных банд. Шляпа нужна ему, чтобы выжить"}, {"id": "s11", "n": 11, "title": "КАТАКОМБЫ И КОРОЛЬ КРЫС", "disp": "Катакомбы и Король Крыс", "group": "Акт I", "html": "<p>Катакомбы явно несоразмерны деревне. Это первая крупная демонстрация того, что геометрия города ненадёжна. Вход — подвал дома 19 в трущобах.<\/p><h2 id=\"s11-1\">Крысиная волна<\/h2><p>Сначала одна крыса, затем две, три и больше. Цель сцены: слегка истощить ресурсы перед появлением босса и создать ощущение, что крыс становится слишком много.<\/p><div class=\"box quote\"><p>KNEEL<\/p><\/div><p>После этого появляется огромное чудовище, собранное из множества крыс и визуально напоминающее одну гигантскую крысу.<\/p><h2 id=\"s11-2\">Король Крыс<\/h2><p><strong>Фаза 1.<\/strong> Волны крыс. Не обязательно делать каждую волну сложной. Основной эффект — давление и истощение.<\/p><p><strong>Фаза 2.<\/strong><\/p><ul><li>Король Крыс появляется как единый организм из множества тел.<\/li><li>Может отделять от себя небольшие стаи.<\/li><li>Поглощает погибших крыс (восстанавливает 1d6 хитов за каждую мёртвую крысу в 3 м).<\/li><li>Реагирует на каменную корону.<\/li><li>После смерти распадается на отдельные тела.<\/li><\/ul><div class=\"tbl\"><table><thead><tr><th>Подготовка<\/th><th>Сигнал<\/th><th>Эффект<\/th><th>Прерывание<\/th><\/tr><\/thead><tbody><tr><td>«Крысиный прилив»<\/td><td>Король встаёт на задние лапы, крысы стекаются к нему<\/td><td>Все в 4,5 м: спасбросок Ловкости СЛ 12, 3d6 колющего, сбит с ног<\/td><td>Огонь по стае у его ног или 10+ урона за раз<\/td><\/tr><tr><td>«KNEEL»<\/td><td>Хор писка складывается в слово<\/td><td>Спасбросок Мудрости СЛ 12, провал — персонаж встаёт на колени (сбит с ног, не может встать 1 ход)<\/td><td>Громкий звук: свисток, колокольчик, выстрел<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s11-3\">Награда<\/h2><p><strong>Каменная корона.<\/strong> Некоторые крысы после её получения становятся дружелюбными или перестают атаковать. Носитель может раз в день призвать стаю крыс (как рой крыс, 1 минута) или узнать от крыс, кто проходил по туннелям.<\/p><h2 id=\"s11-4\">После катакомб<\/h2><p>Герои выходят к горной местности. Перед ними тропа и только что истлевший костёр. Это намёк, что кто-то был здесь буквально недавно. <em>(Канон: у костра ночевала Нерисса Вейл с двумя культистами. В золе — обгоревший листок с символом культа: глаз, перечёркнутый ровной линией.)<\/em><\/p><h2 id=\"s11-5\">Находки катакомб<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Крысобойная лопата<\/strong><\/td><td>Подвал дома 19<\/td><td>Оружие 1 уровня, против роев<\/td><\/tr><tr><td><strong>Ржавый тесак катакомб<\/strong><\/td><td>Кости на развилке<\/td><td>Оружие 1 уровня<\/td><\/tr><tr><td><strong>Зубастый тесак<\/strong> (трансформер)<\/td><td>Тело охотника в тупике с крысиными гнёздами<\/td><td>Оружие 2 уровня<\/td><\/tr><tr><td><strong>Каменная корона<\/strong><\/td><td>Король Крыс<\/td><td>Крысы — союзники<\/td><\/tr><tr><td><strong>Скипетр Крысиного Короля<\/strong><\/td><td>Трон из мусора<\/td><td>Оружие 2 уровня<\/td><\/tr><tr><td><strong>Склад банды Гримвара<\/strong><\/td><td>Сухая ниша<\/td><td>50 зм, 2 бинта, флакон масла, набор отмычек<\/td><\/tr><tr><td><strong>Фонарь охотника<\/strong><\/td><td>Тело охотника<\/td><td>Фонарь, который не гаснет от воды и ветра<\/td><\/tr><tr><td><strong>Мешок с крысиным ядом<\/strong><\/td><td>Ниша крысоловов<\/td><td>Бросок на рой: 2d6 яда; на Короля Крыс — снимает 10 хитов, но злит его<\/td><\/tr><tr><td><strong>Кровь чудовища<\/strong> (1)<\/td><td>Король Крыс<\/td><td>Материал для уникального улучшения<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s11-6\">Тяжёлый выбор катакомб<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Убить Короля Крыс или договориться<\/strong><\/td><td>Убить — Графиня, друг Броммира, исчезнет вместе с ним. Договориться (каменная корона) — тысячи крыс останутся жить под городом, а банда Гримвара не получит свой склад и не отдаст шкатулку<\/td><\/tr><tr><td><strong>Отдать шкатулку Гримвару или вскрыть самим<\/strong><\/td><td>Гримвар обещал её выжившему с повозки. Вскрыв её, герои предают обоих, но первыми получают половину фотографии<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s11-1", "Крысиная волна"], ["s11-2", "Король Крыс"], ["s11-3", "Награда"], ["s11-4", "После катакомб"], ["s11-5", "Находки катакомб"], ["s11-6", "Тяжёлый выбор катакомб"]], "text": "Катакомбы явно несоразмерны деревне. Это первая крупная демонстрация того, что геометрия города ненадёжна. Вход — подвал дома 19 в трущобах. Крысиная волна Сначала одна крыса, затем две, три и больше. Цель сцены: слегка истощить ресурсы перед появлением босса и создать ощущение, что крыс становится слишком много. KNEEL После этого появляется огромное чудовище, собранное из множества крыс и визуально напоминающее одну гигантскую крысу. Король Крыс Фаза 1. Волны крыс. Не обязательно делать каждую волну сложной. Основной эффект — давление и истощение. Фаза 2. Король Крыс появляется как единый организм из множества тел. Может отделять от себя небольшие стаи. Поглощает погибших крыс (восстанавливает 1d6 хитов за каждую мёртвую крысу в 3 м). Реагирует на каменную корону. После смерти распадается на отдельные тела. Подготовка Сигнал Эффект Прерывание «Крысиный прилив» Король встаёт на задние лапы, крысы стекаются к нему Все в 4,5 м: спасбросок Ловкости СЛ 12, 3d6 колющего, сбит с ног Огонь по стае у его ног или 10+ урона за раз «KNEEL» Хор писка складывается в слово Спасбросок Мудрости СЛ 12, провал — персонаж встаёт на колени (сбит с ног, не может встать 1 ход) Громкий звук: свисток, колокольчик, выстрел Награда Каменная корона. Некоторые крысы после её получения становятся дружелюбными или перестают атаковать. Носитель может раз в день призвать стаю крыс (как рой крыс, 1 минута) или узнать от крыс, кто проходил по туннелям. После катакомб Герои выходят к горной местности. Перед ними тропа и только что истлевший костёр. Это намёк, что кто-то был здесь буквально недавно. (Канон: у костра ночевала Нерисса Вейл с двумя культистами. В золе — обгоревший листок с символом культа: глаз, перечёркнутый ровной линией.) Находки катакомб Предмет Где Эффект Крысобойная лопата Подвал дома 19 Оружие 1 уровня, против роев Ржавый тесак катакомб Кости на развилке Оружие 1 уровня Зубастый тесак (трансформер) Тело охотника в тупике с крысиными гнёздами Оружие 2 уровня Каменная корона Король Крыс Крысы — союзники Скипетр Крысиного Короля Трон из мусора Оружие 2 уровня Склад банды Гримвара Сухая ниша 50 зм, 2 бинта, флакон масла, набор отмычек Фонарь охотника Тело охотника Фонарь, который не гаснет от воды и ветра Мешок с крысиным ядом Ниша крысоловов Бросок на рой: 2d6 яда; на Короля Крыс — снимает 10 хитов, но злит его Кровь чудовища (1) Король Крыс Материал для уникального улучшения Тяжёлый выбор катакомб Выбор Почему тяжело Убить Короля Крыс или договориться Убить — Графиня, друг Броммира, исчезнет вместе с ним. Договориться (каменная корона) — тысячи крыс останутся жить под городом, а банда Гримвара не получит свой склад и не отдаст шкатулку Отдать шкатулку Гримвару или вскрыть самим Гримвар обещал её выжившему с повозки. Вскрыв её, герои предают обоих, но первыми получают половину фотографии"}, {"id": "s12", "n": 12, "title": "БАШНЯ — ШПИЛЬ МОЛЬБЕРТА", "disp": "Башня — Шпиль Мольберта", "group": "Акт I", "html": "<p>Башня не просто заперта. Она отторгает присутствие героев. Это должно ощущаться как реакция живого объекта.<\/p><ul><li>Дверь закрывается сама. Символы на стенах меняются.<\/li><li><strong>Голубой глаз<\/strong> появляется в окне — это глаз Сайласа.<\/li><li>Внутри — следы Тесори: сломанный символ Осириса, нацарапанный на ступени.<\/li><li>Чем ближе герои к центру башни, тем сильнее сопротивление пространства.<\/li><\/ul><h2 id=\"s12-1\">Почему Башня не пускает<\/h2><p>Башня — хребет Картины. Она пропускает только <strong>законченное<\/strong>. Герои — незаконченные: у них нет завершённых портретов, и они слишком настоящие.<\/p><div class=\"tbl\"><table><thead><tr><th>Способ войти<\/th><th>Цена<\/th><\/tr><\/thead><tbody><tr><td>Иметь 3+ Мазка<\/td><td>Персонаж уже наполовину нарисован<\/td><\/tr><tr><td>Закончить свой портрет в Галерее<\/td><td>+2 Мазка, Сайлас «владеет» героем (раз за сессию может заставить его замереть на 1 ход)<\/td><\/tr><tr><td>Пройти с Каэлисом (вернув ему голос)<\/td><td>Каэлис остаётся в Башне навсегда<\/td><\/tr><tr><td>Нарисовать дверь краской<\/td><td>1 заряд + 1 Мазок; дверь исчезает через 10 минут<\/td><\/tr><tr><td>Пройти вслед за Тесори (зов Осириса)<\/td><td>Только для того, кто связан с Тесори; Осирис запомнит услугу<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s12-2\">Этажи Башни<\/h2><ol><li><strong>Вестибюль эскизов.<\/strong> Стены — наброски всего города. Если стереть набросок — исчезает настоящий дом в городе (рост Страха нарисованных).<\/li><li><strong>Галерея неудач.<\/strong> Неудавшиеся «живые» эскизы: существо с тремя руками, собака-стул. Они просят их закончить. Бой или жалость.<\/li><li><strong>Лестница-перспектива.<\/strong> Ступени уменьшаются к вершине, герои тоже. Спасбросок Телосложения СЛ 13 или 1 уровень истощения (до выхода из башни).<\/li><li><strong>Комната Тесори.<\/strong> Его следы, разбитый амулет Осириса. На стене — его портрет, написанный Сайласом. Портрет закончен.<\/li><li><strong>Вершина.<\/strong> Огромный мольберт. На нём — <strong>Картина<\/strong>: весь город, а в центре — эта же башня, а на её вершине — крошечная Картина. Сайлас пишет. Его синий глаз видит всё нарисованное.<\/li><\/ol><h2 id=\"s12-3\">Сайлас на вершине<\/h2><p><strong>Разговор (рекомендуемый путь).<\/strong> Сайлас не враждебен: он заинтересован. Он предлагает героям «доводку» — исправить их шрамы, травмы, недостатки. Это настоящая и привлекательная сделка: снять все травмы и 1 изъян — ценой +3 Мазков.<\/p><p><strong>Бой.<\/strong> Сайлас не сражается сам — он рисует. Каждый ход он «дописывает» в комнату одно существо или препятствие. Победить его можно, только испортив Картину рядом с ним (растворитель, огонь, краска) — каждое повреждение холста ранит город (Страх нарисованных +1).<\/p><p><strong>Развязка.<\/strong> Сайлас вписывает себя в Картину и исчезает с холста. Картину можно снять и свернуть. В окне нарисованной башни теперь два силуэта: Сайлас и Тесори.<\/p><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> <strong>Вынос Картины.<\/strong> Чтобы выйти из города, герои должны пронести холст через раму — <strong>таверну «Последняя свеча»<\/strong>. Веспер Мор открывает «заднюю дверь». Снаружи — настоящий Гравенхольм: пустой, гниющий, город после чумы. Камнепад на дороге — настоящие камни. Так начинается Акт II.<\/p><\/div><h2 id=\"s12-4\">Находки Башни<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Хопеш Осириса<\/strong><\/td><td>Комната Тесори<\/td><td>Оружие 4 уровня, уникальное<\/td><\/tr><tr><td><strong>Рама-щит «Паспарту»<\/strong><\/td><td>Галерея неудач<\/td><td>Щит 4 уровня, уникальное<\/td><\/tr><tr><td><strong>Кисть-посох подмастерья<\/strong><\/td><td>Вершина (если Сайлас ушёл в холст)<\/td><td>Оружие 4 уровня, уникальное<\/td><\/tr><tr><td><strong>Цеп маляра<\/strong><\/td><td>Вестибюль эскизов<\/td><td>Оружие 2 уровня<\/td><\/tr><tr><td><strong>Секира подмастерья<\/strong> (трансформер)<\/td><td>Галерея неудач<\/td><td>Оружие 3 уровня<\/td><\/tr><tr><td><strong>Разбитый амулет Осириса<\/strong><\/td><td>Комната Тесори<\/td><td>Если починить (Обитель, переплётчик Ольгерд) — Тесори услышит владельца из Картины<\/td><\/tr><tr><td><strong>Палитра Сайласа<\/strong><\/td><td>Вершина<\/td><td>Сюжетный предмет: с ней 1 заряд краски даёт 2 эффекта сразу (1 раз)<\/td><\/tr><tr><td><strong>Эскиз «Неудачный пёс»<\/strong><\/td><td>Галерея неудач<\/td><td>Если закончить (красный пигмент) — верный пёс-компаньон, нарисованный, 15 хитов<\/td><\/tr><tr><td><strong>Лестничный компас<\/strong><\/td><td>Лестница-перспектива<\/td><td>Показывает настоящий размер вещей; снимает истощение от лестницы<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s12-5\">Тяжёлые выборы Башни<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Сделка Сайласа о «доводке»<\/strong><\/td><td>Снять все травмы и один изъян — ценой +3 Мазков. Для героя с тяжёлой травмой это может быть единственный способ продолжить путь<\/td><\/tr><tr><td><strong>Галерея неудач<\/strong><\/td><td>Неудачные эскизы просят их закончить. Закончить — потратить краску на существо, которое, возможно, станет чудовищем. Отказать — оставить их кричать вечно<\/td><\/tr><tr><td><strong>Стереть набросок дома в Вестибюле<\/strong><\/td><td>Открывается короткий путь наверх, но в городе исчезает настоящий дом вместе с жильцами<\/td><\/tr><tr><td><strong>Оставить Тесори в Картине<\/strong><\/td><td>Вытащить его сейчас — значит сорвать вынос Картины. Оставить — значит, что он будет действовать внутри без героев<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s12-1", "Почему Башня не пускает"], ["s12-2", "Этажи Башни"], ["s12-3", "Сайлас на вершине"], ["s12-4", "Находки Башни"], ["s12-5", "Тяжёлые выборы Башни"]], "text": "Башня не просто заперта. Она отторгает присутствие героев. Это должно ощущаться как реакция живого объекта. Дверь закрывается сама. Символы на стенах меняются. Голубой глаз появляется в окне — это глаз Сайласа. Внутри — следы Тесори: сломанный символ Осириса, нацарапанный на ступени. Чем ближе герои к центру башни, тем сильнее сопротивление пространства. Почему Башня не пускает Башня — хребет Картины. Она пропускает только законченное . Герои — незаконченные: у них нет завершённых портретов, и они слишком настоящие. Способ войти Цена Иметь 3+ Мазка Персонаж уже наполовину нарисован Закончить свой портрет в Галерее +2 Мазка, Сайлас «владеет» героем (раз за сессию может заставить его замереть на 1 ход) Пройти с Каэлисом (вернув ему голос) Каэлис остаётся в Башне навсегда Нарисовать дверь краской 1 заряд + 1 Мазок; дверь исчезает через 10 минут Пройти вслед за Тесори (зов Осириса) Только для того, кто связан с Тесори; Осирис запомнит услугу Этажи Башни Вестибюль эскизов. Стены — наброски всего города. Если стереть набросок — исчезает настоящий дом в городе (рост Страха нарисованных). Галерея неудач. Неудавшиеся «живые» эскизы: существо с тремя руками, собака-стул. Они просят их закончить. Бой или жалость. Лестница-перспектива. Ступени уменьшаются к вершине, герои тоже. Спасбросок Телосложения СЛ 13 или 1 уровень истощения (до выхода из башни). Комната Тесори. Его следы, разбитый амулет Осириса. На стене — его портрет, написанный Сайласом. Портрет закончен. Вершина. Огромный мольберт. На нём — Картина : весь город, а в центре — эта же башня, а на её вершине — крошечная Картина. Сайлас пишет. Его синий глаз видит всё нарисованное. Сайлас на вершине Разговор (рекомендуемый путь). Сайлас не враждебен: он заинтересован. Он предлагает героям «доводку» — исправить их шрамы, травмы, недостатки. Это настоящая и привлекательная сделка: снять все травмы и 1 изъян — ценой +3 Мазков. Бой. Сайлас не сражается сам — он рисует. Каждый ход он «дописывает» в комнату одно существо или препятствие. Победить его можно, только испортив Картину рядом с ним (растворитель, огонь, краска) — каждое повреждение холста ранит город (Страх нарисованных +1). Развязка. Сайлас вписывает себя в Картину и исчезает с холста. Картину можно снять и свернуть. В окне нарисованной башни теперь два силуэта: Сайлас и Тесори. Важно Вынос Картины. Чтобы выйти из города, герои должны пронести холст через раму — таверну «Последняя свеча» . Веспер Мор открывает «заднюю дверь». Снаружи — настоящий Гравенхольм: пустой, гниющий, город после чумы. Камнепад на дороге — настоящие камни. Так начинается Акт II. Находки Башни Предмет Где Эффект Хопеш Осириса Комната Тесори Оружие 4 уровня, уникальное Рама-щит «Паспарту» Галерея неудач Щит 4 уровня, уникальное Кисть-посох подмастерья Вершина (если Сайлас ушёл в холст) Оружие 4 уровня, уникальное Цеп маляра Вестибюль эскизов Оружие 2 уровня Секира подмастерья (трансформер) Галерея неудач Оружие 3 уровня Разбитый амулет Осириса Комната Тесори Если починить (Обитель, переплётчик Ольгерд) — Тесори услышит владельца из Картины Палитра Сайласа Вершина Сюжетный предмет: с ней 1 заряд краски даёт 2 эффекта сразу (1 раз) Эскиз «Неудачный пёс» Галерея неудач Если закончить (красный пигмент) — верный пёс-компаньон, нарисованный, 15 хитов Лестничный компас Лестница-перспектива Показывает настоящий размер вещей; снимает истощение от лестницы Тяжёлые выборы Башни Выбор Почему тяжело Сделка Сайласа о «доводке» Снять все травмы и один изъян — ценой +3 Мазков. Для героя с тяжёлой травмой это может быть единственный способ продолжить путь Галерея неудач Неудачные эскизы просят их закончить. Закончить — потратить краску на существо, которое, возможно, станет чудовищем. Отказать — оставить их кричать вечно Стереть набросок дома в Вестибюле Открывается короткий путь наверх, но в городе исчезает настоящий дом вместе с жильцами Оставить Тесори в Картине Вытащить его сейчас — значит сорвать вынос Картины. Оставить — значит, что он будет действовать внутри без героев"}, {"id": "s13", "n": 13, "title": "АКТ II: ПОЛУОСТРОВ АШГРЕЙ", "disp": "Акт II: полуостров Ашгрей", "group": "Акт II", "html": "<p>Выйдя из Картины, герои попадают в настоящий мир: серый, сырой, опустевший после чумы. Полуостров — кольцо дорог вокруг центрального <strong>Перекрёстка<\/strong>, от которого расходятся пути к четырём локациям ритуала. На горизонте в центре полуострова видно <strong>Обсерваторию<\/strong> и тёмную чашу <strong>Кратера<\/strong>.<\/p><h2 id=\"s13-1\">Общие правила Акта II<\/h2><ul><li><strong>Свободный порядок.<\/strong> Игроки выбирают, куда идти. Сложность растёт не от локации, а от уровня партии и <strong>Часов Культа<\/strong>.<\/li><li><strong>Часы Культа<\/strong> (8 делений). +1 за каждую неделю игрового времени, +2 когда герои покидают локацию, не забрав артефакт. Каждые 2 деления культ забирает один из оставшихся артефактов (нач
