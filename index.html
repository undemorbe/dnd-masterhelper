<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Город, который нарисовали</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: master's reference desk — section rail on the left, the page in the middle, a notebook on the right. Prussian blue = Silas's eye, madder = blood/warnings. */
:root{
  --bg:#E7E6EB; --panel:#F3F2F6; --raised:#FFFFFF; --ink:#1B1922; --muted:#5E5A6B; --line:#CDCAD5;
  --accent:#1E4C7A; --accent-soft:#D6E1EE; --blood:#8E2424; --blood-soft:#F3DEDC;
  --tip:#2F6B52; --tip-soft:#DDEDE4; --spoil:#5A4A8A; --spoil-soft:#E6E1F2; --gold:#8A6A2A; --gold-soft:#F1E8D3;
  --display:"Alegreya SC", "Palatino Linotype", Georgia, serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --rail:270px; --notes:310px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121118; --panel:#1A1922; --raised:#211F2B; --ink:#E6E3EC; --muted:#9C97AA; --line:#302D3C;
  --accent:#86ABDB; --accent-soft:#1F2C40; --blood:#E07A72; --blood-soft:#3A1D1E; --tip:#78C49E; --tip-soft:#18302A;
  --spoil:#B0A2E6; --spoil-soft:#272240; --gold:#D6B46A; --gold-soft:#2E2718; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --panel:#1A1922; --raised:#211F2B; --ink:#E6E3EC; --muted:#9C97AA; --line:#302D3C;
  --accent:#86ABDB; --accent-soft:#1F2C40; --blood:#E07A72; --blood-soft:#3A1D1E; --tip:#78C49E; --tip-soft:#18302A;
  --spoil:#B0A2E6; --spoil-soft:#272240; --gold:#D6B46A; --gold-soft:#2E2718; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:1.25rem;letter-spacing:.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .eye{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--raised);border-color:var(--line);color:var(--ink);font-weight:500}
.search{flex:1 1 220px;min-width:0;display:flex}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}
.chip-btn{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--spoil-soft);border-color:var(--spoil);color:var(--spoil)}
.menu-btn{display:none}
.save-state{font-family:var(--mono);font-size:.72rem;color:var(--muted);white-space:nowrap}

.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--notes);min-height:calc(100% - 58px)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:12px 10px 40px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.rail details{margin-bottom:4px}
.rail summary{cursor:pointer;list-style:none;font-family:var(--display);font-size:1.02rem;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.rail summary::-webkit-details-marker{display:none}
.rail summary:hover{background:var(--raised)}
.rail summary .count{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.nav-item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:5px 8px 5px 14px;border-radius:6px;cursor:pointer;font-size:.92rem;color:var(--ink)}
.nav-item:hover{background:var(--raised)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-item .num{font-family:var(--mono);font-size:.72rem;color:var(--muted);min-width:1.6em}
.nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;align-self:center}
.nav-item .pin{margin-left:auto;color:var(--gold);font-size:.8rem}
.rail .pinned-head{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}

main{min-width:0;padding:24px clamp(16px,3vw,40px) 80px}
.page{max-width:820px;margin:0 auto}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.page h1{font-family:var(--display);font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.15;margin:.3em 0 .4em;color:var(--blood);text-wrap:balance}
.page h2{font-family:var(--display);font-size:1.45rem;margin:1.6em 0 .5em;padding-bottom:.2em;border-bottom:1px solid var(--line);text-wrap:balance;scroll-margin-top:80px}
.page h3{font-size:1.15rem;margin:1.3em 0 .4em;color:var(--accent)}
.page h4{font-size:1rem;margin:1em 0 .3em;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
.page p{margin:.5em 0}
.page ul,.page ol{padding-left:1.4em;margin:.5em 0}
.page li{margin:.2em 0}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.otoc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0 16px;font-size:.92rem}
.otoc b{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.otoc a{display:inline-block;margin:2px 12px 2px 0;text-decoration:none}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{text-align:left;background:var(--panel);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:7px 10px;border-top:1px solid var(--line);vertical-align:top}
tr.rolled td{background:var(--gold-soft)}
.roll-row{display:flex;justify-content:flex-end;margin-top:-6px}
.box{border-radius:8px;padding:10px 14px;margin:12px 0;border-left:4px solid}
.box p{margin:.3em 0}
.box .box-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-right:4px}
.box-li{padding-left:1em;text-indent:-.8em}
.box-li::before{content:"— "}
.box.imp{background:var(--blood-soft);border-color:var(--blood)} .box.imp .box-label{color:var(--blood)}
.box.tip{background:var(--tip-soft);border-color:var(--tip)} .box.tip .box-label{color:var(--tip)}
.box.spoil{background:var(--spoil-soft);border-color:var(--spoil)} .box.spoil .box-label{color:var(--spoil)}
.box.quote{background:var(--gold-soft);border-color:var(--gold);font-style:italic;font-size:1.05rem}
body.players .box.spoil{display:none}
body.players .notes{display:none}
mark{background:var(--gold-soft);color:inherit;outline:1px solid var(--gold);border-radius:2px}

.notes{border-left:1px solid var(--line);background:var(--panel);padding:16px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;display:flex;flex-direction:column;gap:10px}
.notes h3{font-family:var(--display);font-size:1.1rem;margin:0}
.notes .for{font-size:.85rem;color:var(--muted);margin-top:-6px}
.notes textarea{flex:1;min-height:260px;resize:vertical;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);line-height:1.5}
.notes .recent{font-size:.85rem}
.notes .recent button{display:block;background:none;border:0;padding:3px 0;color:var(--accent);cursor:pointer;text-align:left}
.hint{font-size:.82rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--blood);border-color:var(--blood)}
.btn.small{padding:3px 9px;font-size:.85rem}

/* trackers */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.card .sub{font-size:.85rem;color:var(--muted);margin:-4px 0 8px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap}
.trow label{font-size:.92rem}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;padding:0}
.pip.on{background:var(--accent);border-color:var(--accent)}
.pips.red .pip.on{background:var(--blood);border-color:var(--blood)}
.pips.gold .pip.on{background:var(--gold);border-color:var(--gold)}
.pips.violet .pip.on{background:var(--spoil);border-color:var(--spoil)}
.val{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:2.5em;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer;background:var(--panel)}
.chip[data-s="clean"],.chip[data-s="party"]{background:var(--tip-soft);border-color:var(--tip);color:var(--tip)}
.chip[data-s="cracked"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.chip[data-s="enemy"],.chip[data-s="cult"]{background:var(--blood-soft);border-color:var(--blood);color:var(--blood)}
.legend{font-size:.8rem;color:var(--muted);margin-top:6px}
.echo{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:4px 10px;align-items:center;font-size:.85rem}
.echo .pip{width:16px;height:16px}
select.inp,input.inp{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);max-width:100%}
.section-title{font-family:var(--display);font-size:1.6rem;margin:.2em 0 .6em;color:var(--blood)}

/* journal */
.entry{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.entry header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry .date{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.entry h4{margin:0;font-size:1.05rem}
.entry .txt{white-space:pre-wrap;margin:.4em 0}
.form{display:grid;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form .row input{flex:1 1 160px;min-width:0}
.form textarea{min-height:120px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--raised)}

/* tools */
.dice{display:flex;gap:6px;flex-wrap:wrap}
.die{font-family:var(--mono);border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;cursor:pointer}
.die:hover{border-color:var(--accent);color:var(--accent)}
.result{font-family:var(--mono);font-size:2rem;color:var(--accent);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.hist{font-family:var(--mono);font-size:.8rem;color:var(--muted);max-height:140px;overflow:auto}
.init-list{list-style:none;padding:0;margin:8px 0}
.init-list li{display:grid;grid-template-columns:2.4em 1fr 4.5em auto;gap:6px;align-items:center;padding:5px 6px;border-radius:6px}
.init-list li.turn{background:var(--accent-soft)}
.init-list input{width:100%;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-family:var(--mono)}
.music a{display:block;padding:6px 0;border-bottom:1px solid var(--line);text-decoration:none}
.music small{display:block;color:var(--muted)}

.results .res{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer}
.results .res b{font-family:var(--display);font-size:1.05rem}
.results .res .snip{font-size:.88rem;color:var(--muted);margin-top:2px}
.empty{color:var(--muted);font-style:italic}

@media (max-width:1200px){
  .app{grid-template-columns:var(--rail) minmax(0,1fr)}
  .notes{grid-column:2;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:860px){
  .menu-btn{display:inline-block}
  .topbar{position:static}
  .trow .pips .pip{width:20px;height:20px}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .notes{grid-column:1}
  .brand{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="topbar">
  <button class="btn small menu-btn" id="menuBtn" aria-label="Открыть список разделов">Разделы</button>
  <div class="brand"><span class="eye" aria-hidden="true"></span>Город, который нарисовали</div>
  <nav class="tabs" role="tablist" aria-label="Режимы">
    <button class="tab" role="tab" data-view="ref" aria-selected="true">Методичка</button>
    <button class="tab" role="tab" data-view="track" aria-selected="false">Трекеры</button>
    <button class="tab" role="tab" data-view="journal" aria-selected="false">Журнал</button>
    <button class="tab" role="tab" data-view="tools" aria-selected="false">Инструменты</button>
  </nav>
  <div class="search"><input id="q" type="search" placeholder="Поиск по методичке: Корвин, Мазки, ловушки…" aria-label="Поиск"></div>
  <button class="chip-btn" id="playersBtn" aria-pressed="false" title="Скрывает тайны и заметки, чтобы можно было показать экран игрокам">Экран для игроков</button>
  <span class="save-state" id="saveState">загрузка…</span>
</header>

<div class="app">
  <aside class="rail" id="rail" aria-label="Разделы методички"></aside>
  <main id="main"><div class="page" id="page"></div></main>
  <aside class="notes" id="notes" aria-label="Заметки мастера">
    <h3>Заметки к разделу</h3>
    <div class="for" id="notesFor"></div>
    <textarea id="noteText" placeholder="Что случилось на сессии, что поменять, что игроки уже знают…"></textarea>
    <div class="hint" id="noteHint">Сохраняется автоматически.</div>
    <div class="recent" id="recentNotes"></div>
  </aside>
</div>

<script id="data" type="application/json">{"sections": [{"id": "s0", "n": 0, "title": "КАК ПОЛЬЗОВАТЬСЯ МЕТОДИЧКОЙ", "disp": "Как пользоваться методичкой", "group": "Основы", "html": "<p>Документ — рабочий справочник мастера. Его не нужно читать подряд: открывайте нужный раздел перед сессией или прямо во время игры.<\/p><div class=\"tbl\"><table><thead><tr><th>Пометка<\/th><th>Что означает<\/th><\/tr><\/thead><tbody><tr><td><strong>ВАЖНО<\/strong> (красная рамка)<\/td><td>То, что нельзя забыть или потерять в ходе кампании: ключевые правила, крючки, условия.<\/td><\/tr><tr><td><strong>СОВЕТ МАСТЕРУ<\/strong> (зелёная рамка)<\/td><td>Как подать сцену, темп, варианты импровизации.<\/td><\/tr><tr><td><strong>ТАЙНА<\/strong> (фиолетовая рамка)<\/td><td>Правда, которую игроки не должны знать заранее. Раскрывается только через игру.<\/td><\/tr><tr><td><strong>Канон (предложение)<\/strong><\/td><td>Ответы на открытые вопросы, придуманные для этой версии. Если у вас уже есть своя версия — она важнее.<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Партия сейчас находится <strong>в Мастерской художника<\/strong> внутри Города-Картины (Акт I, этап XII старого маршрута). Всё, что касается текущей игры, собрано в разделах <strong>8. Акт I: Город-Картина<\/strong> и <strong>9. Мастерская: здесь и сейчас<\/strong>.<\/p><\/div><h2 id=\"s0-1\">Структура кампании одной строкой<\/h2><p><strong>Акт I<\/strong> — Город-Картина: художник, Фредерик, башня, поиск Картины. → <strong>Акт II<\/strong> — полуостров: четыре локации ритуала, Тихие очаги, Гнездо Вейлов, Фабрика «Прогресс», Некрополь Осириса. → <strong>Акт III<\/strong> — Изнанка Холста: возвращение внутрь Картины. → <strong>Акт IV<\/strong> — Страна фэйри: шёлк, фронт, двор королевы. → <strong>Акт V<\/strong> — Звёздный Колодец и Кратер: ритуал, жертва, выбор финала.<\/p>", "toc": [["s0-1", "Структура кампании одной строкой"]], "text": "Документ — рабочий справочник мастера. Его не нужно читать подряд: открывайте нужный раздел перед сессией или прямо во время игры. Пометка Что означает ВАЖНО (красная рамка) То, что нельзя забыть или потерять в ходе кампании: ключевые правила, крючки, условия. СОВЕТ МАСТЕРУ (зелёная рамка) Как подать сцену, темп, варианты импровизации. ТАЙНА (фиолетовая рамка) Правда, которую игроки не должны знать заранее. Раскрывается только через игру. Канон (предложение) Ответы на открытые вопросы, придуманные для этой версии. Если у вас уже есть своя версия — она важнее. Важно Партия сейчас находится в Мастерской художника внутри Города-Картины (Акт I, этап XII старого маршрута). Всё, что касается текущей игры, собрано в разделах 8. Акт I: Город-Картина и 9. Мастерская: здесь и сейчас . Структура кампании одной строкой Акт I — Город-Картина: художник, Фредерик, башня, поиск Картины. → Акт II — полуостров: четыре локации ритуала, Тихие очаги, Гнездо Вейлов, Фабрика «Прогресс», Некрополь Осириса. → Акт III — Изнанка Холста: возвращение внутрь Картины. → Акт IV — Страна фэйри: шёлк, фронт, двор королевы. → Акт V — Звёздный Колодец и Кратер: ритуал, жертва, выбор финала."}, {"id": "s1", "n": 1, "title": "КОНЦЕПЦИЯ И ТОН", "disp": "Концепция и тон", "group": "Основы", "html": "<p>Герои прибывают на полуостров <strong>Ашгрей<\/strong>, где старый портовый город <strong>Гравенхольм<\/strong> существует в связи с картиной безумного художника <strong>Сайласа Вейла<\/strong>. Сначала это выглядит как проклятие или иллюзия. Постепенно выясняется, что картина не изображает город, а <strong>поддерживает отдельную версию реальности<\/strong>.<\/p><p>Но Картина — лишь первая из пяти частей. За пределами города лежит весь полуостров, отравленный <strong>десятью эмоциями Посланца<\/strong> — существа, когда-то упавшего с неба. Культ Посланца собирает те же пять частей ритуала, что и герои, — и хочет использовать Картину Сайласа, чтобы <strong>переписать не один город, а весь мир<\/strong>.<\/p><h2 id=\"s1-1\">Тон<\/h2><ul><li><strong>Готический хоррор<\/strong>, телесный ужас и психологическая тревога.<\/li><li>Редкие безопасные места должны ощущаться <strong>ценными<\/strong>: таверна, хоспис, зажжённый костёр.<\/li><li>Сюжет раскрывается через <strong>предметы, слухи, документы и противоречивые версии<\/strong> событий.<\/li><li>Монстр не всегда является врагом, NPC не всегда является союзником.<\/li><li>Чем больше герои узнают, тем <strong>менее надёжными<\/strong> становятся пространство и память.<\/li><li>Каждая победа имеет <strong>цену<\/strong>: травму, потерянного NPC, мазок краски на коже, эмоцию, которая теперь живёт в персонаже.<\/li><\/ul><h2 id=\"s1-2\">Главная тема<\/h2><div class=\"box quote\"><p>Можно ли исправить несовершенную реальность, не уничтожив саму реальность?<\/p><\/div><h2 id=\"s1-3\">Три ступени ужаса (принцип всей кампании)<\/h2><div class=\"tbl\"><table><thead><tr><th>Ступень<\/th><th>Акт<\/th><th>Чего боятся игроки<\/th><th>Инструменты мастера<\/th><\/tr><\/thead><tbody><tr><td>Локальный ужас<\/td><td>Акт I<\/td><td>Крыс, странных NPC, тёмных комнат<\/td><td>Ловушки, бой, нехватка света, ранения<\/td><\/tr><tr><td>Ужас пространства<\/td><td>Акт I–II<\/td><td>Того, что мир не подчиняется правилам<\/td><td>Копии, зеркала, двери не туда, ложная память<\/td><\/tr><tr><td>Ужас идеи<\/td><td>Акт II–V<\/td><td>Что кто-то действительно может переписать людей<\/td><td>Выборы без правильного ответа, цена ритуала<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s1-4\">Столпы кампании<\/h2><ol><li><strong>Расследование важнее боя.<\/strong> Бой — это цена ошибки или кульминация, а не основной способ продвижения.<\/li><li><strong>Ресурсы конечны.<\/strong> Свет, бинты, краска, доверие NPC — всё заканчивается.<\/li><li><strong>У каждой фракции своя правда.<\/strong> Сайлас, Элиас, культ, Осирис — у всех есть понятная мотивация.<\/li><li><strong>Игроки могут стать злодеями<\/strong> в глазах мира — и это допустимый исход.<\/li><\/ol>", "toc": [["s1-1", "Тон"], ["s1-2", "Главная тема"], ["s1-3", "Три ступени ужаса (принцип всей кампании)"], ["s1-4", "Столпы кампании"]], "text": "Герои прибывают на полуостров Ашгрей , где старый портовый город Гравенхольм существует в связи с картиной безумного художника Сайласа Вейла . Сначала это выглядит как проклятие или иллюзия. Постепенно выясняется, что картина не изображает город, а поддерживает отдельную версию реальности . Но Картина — лишь первая из пяти частей. За пределами города лежит весь полуостров, отравленный десятью эмоциями Посланца — существа, когда-то упавшего с неба. Культ Посланца собирает те же пять частей ритуала, что и герои, — и хочет использовать Картину Сайласа, чтобы переписать не один город, а весь мир . Тон Готический хоррор , телесный ужас и психологическая тревога. Редкие безопасные места должны ощущаться ценными : таверна, хоспис, зажжённый костёр. Сюжет раскрывается через предметы, слухи, документы и противоречивые версии событий. Монстр не всегда является врагом, NPC не всегда является союзником. Чем больше герои узнают, тем менее надёжными становятся пространство и память. Каждая победа имеет цену : травму, потерянного NPC, мазок краски на коже, эмоцию, которая теперь живёт в персонаже. Главная тема Можно ли исправить несовершенную реальность, не уничтожив саму реальность? Три ступени ужаса (принцип всей кампании) Ступень Акт Чего боятся игроки Инструменты мастера Локальный ужас Акт I Крыс, странных NPC, тёмных комнат Ловушки, бой, нехватка света, ранения Ужас пространства Акт I–II Того, что мир не подчиняется правилам Копии, зеркала, двери не туда, ложная память Ужас идеи Акт II–V Что кто-то действительно может переписать людей Выборы без правильного ответа, цена ритуала Столпы кампании Расследование важнее боя. Бой — это цена ошибки или кульминация, а не основной способ продвижения. Ресурсы конечны. Свет, бинты, краска, доверие NPC — всё заканчивается. У каждой фракции своя правда. Сайлас, Элиас, культ, Осирис — у всех есть понятная мотивация. Игроки могут стать злодеями в глазах мира — и это допустимый исход."}, {"id": "s2", "n": 2, "title": "ГЛАВНАЯ ТАЙНА И КАНОН МИРА", "disp": "Главная тайна и канон мира", "group": "Основы", "html": "<p>Сайлас Вейл создал картину города. В какой-то момент картина перестала быть обычным произведением искусства. Она начала принимать воспоминания, эмоции и образы и превращать их в физическую реальность.<\/p><h2 id=\"s2-1\">Лестница раскрытия<\/h2><ol><li>Герои замечают небольшие несоответствия (тень не туда, окно с другой погодой).<\/li><li>Они встречают существ, похожих на элементы картины.<\/li><li>Один NPC может существовать в нескольких версиях (два Фредерика).<\/li><li>Фотографии и рисунки начинают меняться.<\/li><li>Герои находят записи художника.<\/li><li>Выясняется, что <strong>камнепад при высадке был мазком кисти<\/strong> — дорога назад «закрашена».<\/li><li>Выясняется связь города с эмоциями Посланца.<\/li><li>Появляется связь между Сайласом и Элиасом.<\/li><li>Становится ясно, что город — не иллюзия, а <strong>отдельная реальность<\/strong>, и в ней живут люди.<\/li><li>Финальный вопрос меняется с «как выбраться?» на «что делать с этой реальностью?»<\/li><\/ol><h2 id=\"s2-2\">Канон (предложение): что произошло на самом деле<\/h2><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Около сорока лет назад на полуостров Ашгрей упал <strong>Посланец<\/strong> — существо из-за звёзд, пришедшее с вестью, которую человеческий разум не смог вместить. Люди не поняли его. Посланец не умер, а <strong>раскололся на десять эмоций<\/strong> — по одной на каждое слово своей вести (см. раздел 6). Пять <strong>Великих<\/strong>: Обжорство, Гнев, Зависть, Скрытность и <strong>Тоска<\/strong>, о которой культ не знает. Пять <strong>Тихих<\/strong>: Страх, Гордыня, Оцепенение, Желание и Нежность.<\/p><p>Из небесного железа, оставшегося в кратере, охотники выковали ритуальный кинжал, а мать братьев Вейл — <strong>Ирена Вейл<\/strong>, астроном, первой спустившаяся в кратер, — получила «касание» Посланца. Его унаследовали её сыновья.<\/p><p><strong>Сайлас<\/strong> унаследовал способность <strong>добавлять<\/strong> — его кисть делает изображённое реальным. <strong>Элиас<\/strong> унаследовал способность <strong>возвращать<\/strong> — его прикосновение возвращает вещь к тому, какой она была «на самом деле». Две половины одного дара.<\/p><p>Пять лет назад Гравенхольм опустошила чума. Сайлас, движимый Тоской, нарисовал город заново — <strong>таким, каким он должен был быть<\/strong>: без болезни, без грязи, без смерти. Картина «приняла» город. Настоящий Гравенхольм опустел и рассыпается, а нарисованный живёт внутри холста.<\/p><p>Элиас лечил выживших. Часть пациентов умерла у него на руках без видимой причины. Он записывал их в <strong>журнал смертей<\/strong>. Правда: это были <strong>нарисованные<\/strong> люди, вышедшие из картины. Его дар «вернул их к тому, какими они были на самом деле», — то есть в краску. Элиас подозревает это и боится узнать наверняка.<\/p><\/div><h2 id=\"s2-3\">Канон (предложение): ответы на открытые вопросы<\/h2><div class=\"tbl\"><table><thead><tr><th>Вопрос<\/th><th>Предлагаемый ответ<\/th><th>Когда раскрывать<\/th><\/tr><\/thead><tbody><tr><td>Кто такой Посланец?<\/td><td>Существо со звёзд, упавшее 40 лет назад; его «весть» — это эмоции, разошедшиеся по острову.<\/td><td>Акт V, Обсерватория<\/td><\/tr><tr><td>Что такое культ?<\/td><td>Секта «Равных»: хочет собрать эмоции обратно и «дослушать весть», переписав всех людей одинаковыми.<\/td><td>Постепенно, Акт II<\/td><\/tr><tr><td>Почему эмоции становятся физическими?<\/td><td>Это слова вести Посланца; каждая ищет тело. Рядом с краской Сайласа или в сильном переживании они его обретают — иногда в виде живого существа (Велисса, Кисточка).<\/td><td>Акт II<\/td><\/tr><tr><td>Почему башня отторгает героев?<\/td><td>Башня — «хребет» Картины. Она пропускает только <strong>нарисованное<\/strong>. Герои слишком настоящие.<\/td><td>Акт I, Мастерская<\/td><\/tr><tr><td>Чей голубой глаз в окне?<\/td><td>Сайласа. Он потерял глаз и нарисовал себе новый — синий, «видящий всё изображённое».<\/td><td>Акт I, Башня<\/td><\/tr><tr><td>Кто управляет крысами?<\/td><td>Король Крыс — первый неудачный «живой» эскиз Сайласа; крысы — его мазки.<\/td><td>Акт I, Катакомбы<\/td><\/tr><tr><td>Почему несколько Фредериков?<\/td><td>Фредерик пытался вписать себя в картину. Вписалась <strong>идеальная<\/strong> версия; настоящий остался «излишком», и Сайлас заморозил его.<\/td><td>Акт I, Мастерская<\/td><\/tr><tr><td>Что показывает фотография?<\/td><td>Настоящий Гравенхольм в день перед «перерисовкой». Единственное объективное изображение.<\/td><td>Акт II, Дом «Терпение»<\/td><\/tr><tr><td>Как связаны три вида записей?<\/td><td>Каждая описывает одно и то же событие (рождение Картины) с трёх сторон: кисть, скальпель, вера.<\/td><td>Акт II, Обитель Переписчиков<\/td><\/tr><tr><td>Кто в клетке?<\/td><td><strong>Кисточка<\/strong> — первое живое существо, нарисованное Сайласом: лисёнок с хвостом-кистью и одним синим глазом. Носитель Тихой эмоции <strong>Нежность<\/strong>.<\/td><td>Акт II, Зверинец<\/td><\/tr><tr><td>Что если зверька выпустить?<\/td><td>Он убежит к ближайшему холсту и «впишет» себя обратно. Его можно приманить краской.<\/td><td>Акт II–III<\/td><\/tr><tr><td>Кого требует жертва?<\/td><td>«Того, кто был и нарисован, и настоящим». Вариантов несколько (см. раздел Финала).<\/td><td>Акт V<\/td><\/tr><tr><td>Можно ли без жертвы?<\/td><td>Да, но тогда цену платит сама реальность (см. концовки).<\/td><td>Акт V<\/td><\/tr><tr><td>Кто такой Осирис?<\/td><td>Бог суда над мёртвыми. Нарисованные не умирают «правильно» — для Осириса это ересь против смерти.<\/td><td>Акт I–III, через Тесори<\/td><\/tr><tr><td>Кто создал Велиссу?<\/td><td>Сайлас — задолго до Картины. Он написал <strong>Желание<\/strong>, испугался и посмотрел на солнце; так он потерял глаз.<\/td><td>Акт I–II, раздел 33<\/td><\/tr><tr><td>Что за чудовища нападают на страну фэйри?<\/td><td>Тихие эмоции, прежде всего <strong>Страх<\/strong>, просачиваются в страну фэйри через Белую чащу.<\/td><td>Акт II, Белая чаща<\/td><\/tr><tr><td>Кто первым понял, что город в картине?<\/td><td><strong>Веспер Мор.<\/strong> Его таверна стоит на раме и существует в обоих мирах.<\/td><td>Акт I, поздно<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Не раскрывайте эти ответы списком. Каждая строка таблицы — это отдельная находка: письмо, оговорка NPC, деталь картины. Если игроки придумали более интересную версию — смело заменяйте канон.<\/p><\/div>", "toc": [["s2-1", "Лестница раскрытия"], ["s2-2", "Канон (предложение): что произошло на самом деле"], ["s2-3", "Канон (предложение): ответы на открытые вопросы"]], "text": "Сайлас Вейл создал картину города. В какой-то момент картина перестала быть обычным произведением искусства. Она начала принимать воспоминания, эмоции и образы и превращать их в физическую реальность. Лестница раскрытия Герои замечают небольшие несоответствия (тень не туда, окно с другой погодой). Они встречают существ, похожих на элементы картины. Один NPC может существовать в нескольких версиях (два Фредерика). Фотографии и рисунки начинают меняться. Герои находят записи художника. Выясняется, что камнепад при высадке был мазком кисти — дорога назад «закрашена». Выясняется связь города с эмоциями Посланца. Появляется связь между Сайласом и Элиасом. Становится ясно, что город — не иллюзия, а отдельная реальность , и в ней живут люди. Финальный вопрос меняется с «как выбраться?» на «что делать с этой реальностью?» Канон (предложение): что произошло на самом деле Тайна · только для мастера Около сорока лет назад на полуостров Ашгрей упал Посланец — существо из-за звёзд, пришедшее с вестью, которую человеческий разум не смог вместить. Люди не поняли его. Посланец не умер, а раскололся на десять эмоций — по одной на каждое слово своей вести (см. раздел 6). Пять Великих : Обжорство, Гнев, Зависть, Скрытность и Тоска , о которой культ не знает. Пять Тихих : Страх, Гордыня, Оцепенение, Желание и Нежность. Из небесного железа, оставшегося в кратере, охотники выковали ритуальный кинжал, а мать братьев Вейл — Ирена Вейл , астроном, первой спустившаяся в кратер, — получила «касание» Посланца. Его унаследовали её сыновья. Сайлас унаследовал способность добавлять — его кисть делает изображённое реальным. Элиас унаследовал способность возвращать — его прикосновение возвращает вещь к тому, какой она была «на самом деле». Две половины одного дара. Пять лет назад Гравенхольм опустошила чума. Сайлас, движимый Тоской, нарисовал город заново — таким, каким он должен был быть : без болезни, без грязи, без смерти. Картина «приняла» город. Настоящий Гравенхольм опустел и рассыпается, а нарисованный живёт внутри холста. Элиас лечил выживших. Часть пациентов умерла у него на руках без видимой причины. Он записывал их в журнал смертей . Правда: это были нарисованные люди, вышедшие из картины. Его дар «вернул их к тому, какими они были на самом деле», — то есть в краску. Элиас подозревает это и боится узнать наверняка. Канон (предложение): ответы на открытые вопросы Вопрос Предлагаемый ответ Когда раскрывать Кто такой Посланец? Существо со звёзд, упавшее 40 лет назад; его «весть» — это эмоции, разошедшиеся по острову. Акт V, Обсерватория Что такое культ? Секта «Равных»: хочет собрать эмоции обратно и «дослушать весть», переписав всех людей одинаковыми. Постепенно, Акт II Почему эмоции становятся физическими? Это слова вести Посланца; каждая ищет тело. Рядом с краской Сайласа или в сильном переживании они его обретают — иногда в виде живого существа (Велисса, Кисточка). Акт II Почему башня отторгает героев? Башня — «хребет» Картины. Она пропускает только нарисованное . Герои слишком настоящие. Акт I, Мастерская Чей голубой глаз в окне? Сайласа. Он потерял глаз и нарисовал себе новый — синий, «видящий всё изображённое». Акт I, Башня Кто управляет крысами? Король Крыс — первый неудачный «живой» эскиз Сайласа; крысы — его мазки. Акт I, Катакомбы Почему несколько Фредериков? Фредерик пытался вписать себя в картину. Вписалась идеальная версия; настоящий остался «излишком», и Сайлас заморозил его. Акт I, Мастерская Что показывает фотография? Настоящий Гравенхольм в день перед «перерисовкой». Единственное объективное изображение. Акт II, Дом «Терпение» Как связаны три вида записей? Каждая описывает одно и то же событие (рождение Картины) с трёх сторон: кисть, скальпель, вера. Акт II, Обитель Переписчиков Кто в клетке? Кисточка — первое живое существо, нарисованное Сайласом: лисёнок с хвостом-кистью и одним синим глазом. Носитель Тихой эмоции Нежность . Акт II, Зверинец Что если зверька выпустить? Он убежит к ближайшему холсту и «впишет» себя обратно. Его можно приманить краской. Акт II–III Кого требует жертва? «Того, кто был и нарисован, и настоящим». Вариантов несколько (см. раздел Финала). Акт V Можно ли без жертвы? Да, но тогда цену платит сама реальность (см. концовки). Акт V Кто такой Осирис? Бог суда над мёртвыми. Нарисованные не умирают «правильно» — для Осириса это ересь против смерти. Акт I–III, через Тесори Кто создал Велиссу? Сайлас — задолго до Картины. Он написал Желание , испугался и посмотрел на солнце; так он потерял глаз. Акт I–II, раздел 33 Что за чудовища нападают на страну фэйри? Тихие эмоции, прежде всего Страх , просачиваются в страну фэйри через Белую чащу. Акт II, Белая чаща Кто первым понял, что город в картине? Веспер Мор. Его таверна стоит на раме и существует в обоих мирах. Акт I, поздно Совет мастеру Не раскрывайте эти ответы списком. Каждая строка таблицы — это отдельная находка: письмо, оговорка NPC, деталь картины. Если игроки придумали более интересную версию — смело заменяйте канон."}, {"id": "s3", "n": 3, "title": "РИТУАЛ И ПЯТЬ АРТЕФАКТОВ", "disp": "Ритуал и пять артефактов", "group": "Основы", "html": "<p>Для завершения главного ритуала необходимо собрать <strong>пять элементов<\/strong>. Каждый находится в <strong>своей локации<\/strong>, и каждую внешнюю локацию отравляет <strong>одна эмоция Посланца<\/strong>. Культ ищет те же предметы — это гонка.<\/p><div class=\"tbl\"><table><thead><tr><th>Артефакт<\/th><th>Локация<\/th><th>Эмоция локации<\/th><th>Назначение в ритуале<\/th><th>Сюжетный смысл<\/th><\/tr><\/thead><tbody><tr><td><strong>Картина<\/strong><\/td><td>Город-Картина (Гравенхольм на холсте), вершина Башни<\/td><td>Тоска (скрытая)<\/td><td>Связывает созданный мир с реальностью<\/td><td>Воля Сайласа<\/td><\/tr><tr><td><strong>Фотография<\/strong><\/td><td>Мглин, доходный дом «Терпение»<\/td><td>Скрытность<\/td><td>Показывает мир «каким он был»; якорь памяти<\/td><td>Память и объективность<\/td><\/tr><tr><td><strong>Записи (триптих)<\/strong><\/td><td>Обитель Переписчиков<\/td><td>Зависть<\/td><td>Три версии истины: кисть, скальпель, вера<\/td><td>Художник / медицина / культ<\/td><\/tr><tr><td><strong>Клетка со зверьком<\/strong><\/td><td>Зверинец «Ненасытная Луна»<\/td><td>Обжорство<\/td><td>Живой ключ: то, что живёт и в картине, и в мире<\/td><td>Жизнь внутри картины<\/td><\/tr><tr><td><strong>Кинжал + жертва<\/strong><\/td><td>Карьер «Глотка» и Бастион Охотников<\/td><td>Гнев<\/td><td>Разрез между мирами; цена изменения<\/td><td>Цена изменения<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Порядок Акта II <strong>свободный<\/strong>. Игроки сами выбирают, куда идти после города. Сложность локаций подстраивайте по уровню партии (см. Roadmap). Культ всегда опережает героев <strong>на одну локацию<\/strong>: если герои медлят, культ забирает артефакт первым, и его придётся отбивать.<\/p><\/div><h2 id=\"s3-1\">Как работает ритуал (для мастера)<\/h2><ol><li><strong>Картина<\/strong> кладётся на землю Кратера Посланца — холст «узнаёт» место, откуда пришла сила.<\/li><li><strong>Фотография<\/strong> прикладывается к холсту: Картина вспоминает, каким был мир до неё.<\/li><li><strong>Записи<\/strong> читаются вслух тремя голосами (художник / врач / культист). Кто читает — тот и определяет, какая версия истины станет основой.<\/li><li><strong>Зверёк<\/strong> выпускается на холст и становится «проводником» между мирами.<\/li><li><strong>Кинжал<\/strong> делает разрез. Через разрез уходит жертва — и только тогда изменение становится необратимым.<\/li><\/ol><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Ритуал — это не кнопка «победа». Каждый шаг — это решение. Кто читает записи? Чью фотографию кладут? Кто держит кинжал? Пусть каждый игрок отвечает за одну часть.<\/p><\/div><h2 id=\"s3-2\">Флакон краски<\/h2><p>Отдельный редкий предмет. Настоящая краска Сайласа позволяет воздействовать на картину и всё нарисованное: дорисовать, стереть или изменить небольшой элемент. Запас ограничен <strong>(рекомендация: 5 зарядов на всю кампанию)<\/strong>.<\/p><div class=\"tbl\"><table><thead><tr><th>Заряды<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Нарисовать проход (дверь в стене, мост через провал)<\/td><\/tr><tr><td>1<\/td><td>Стереть небольшой объект (замок, решётку, одно нарисованное существо мелкого размера)<\/td><\/tr><tr><td>1<\/td><td>Изменить символ, надпись, цвет предмета<\/td><\/tr><tr><td>2<\/td><td>Вернуть объект или NPC к предыдущему состоянию<\/td><\/tr><tr><td>3<\/td><td>Изменить часть пространства (комнату, улицу)<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждое использование краски даёт персонажу <strong>1 Мазок<\/strong> (см. механику «Мазки»). Краска не бесплатна: она медленно делает героя частью картины.<\/p><\/div>", "toc": [["s3-1", "Как работает ритуал (для мастера)"], ["s3-2", "Флакон краски"]], "text": "Для завершения главного ритуала необходимо собрать пять элементов . Каждый находится в своей локации , и каждую внешнюю локацию отравляет одна эмоция Посланца . Культ ищет те же предметы — это гонка. Артефакт Локация Эмоция локации Назначение в ритуале Сюжетный смысл Картина Город-Картина (Гравенхольм на холсте), вершина Башни Тоска (скрытая) Связывает созданный мир с реальностью Воля Сайласа Фотография Мглин, доходный дом «Терпение» Скрытность Показывает мир «каким он был»; якорь памяти Память и объективность Записи (триптих) Обитель Переписчиков Зависть Три версии истины: кисть, скальпель, вера Художник / медицина / культ Клетка со зверьком Зверинец «Ненасытная Луна» Обжорство Живой ключ: то, что живёт и в картине, и в мире Жизнь внутри картины Кинжал + жертва Карьер «Глотка» и Бастион Охотников Гнев Разрез между мирами; цена изменения Цена изменения Важно Порядок Акта II свободный . Игроки сами выбирают, куда идти после города. Сложность локаций подстраивайте по уровню партии (см. Roadmap). Культ всегда опережает героев на одну локацию : если герои медлят, культ забирает артефакт первым, и его придётся отбивать. Как работает ритуал (для мастера) Картина кладётся на землю Кратера Посланца — холст «узнаёт» место, откуда пришла сила. Фотография прикладывается к холсту: Картина вспоминает, каким был мир до неё. Записи читаются вслух тремя голосами (художник / врач / культист). Кто читает — тот и определяет, какая версия истины станет основой. Зверёк выпускается на холст и становится «проводником» между мирами. Кинжал делает разрез. Через разрез уходит жертва — и только тогда изменение становится необратимым. Совет мастеру Ритуал — это не кнопка «победа». Каждый шаг — это решение. Кто читает записи? Чью фотографию кладут? Кто держит кинжал? Пусть каждый игрок отвечает за одну часть. Флакон краски Отдельный редкий предмет. Настоящая краска Сайласа позволяет воздействовать на картину и всё нарисованное: дорисовать, стереть или изменить небольшой элемент. Запас ограничен (рекомендация: 5 зарядов на всю кампанию) . Заряды Эффект 1 Нарисовать проход (дверь в стене, мост через провал) 1 Стереть небольшой объект (замок, решётку, одно нарисованное существо мелкого размера) 1 Изменить символ, надпись, цвет предмета 2 Вернуть объект или NPC к предыдущему состоянию 3 Изменить часть пространства (комнату, улицу) Важно Каждое использование краски даёт персонажу 1 Мазок (см. механику «Мазки»). Краска не бесплатна: она медленно делает героя частью картины."}, {"id": "s4", "n": 4, "title": "СЕМЬЯ ВЕЙЛ", "disp": "Семья Вейл", "group": "Основы", "html": "<h2 id=\"s4-1\">Сайлас Вейл — Художник<\/h2><ul><li>Безумный художник и создатель Картины. Около 45 лет. Левый глаз — нарисованный, <strong>ярко-синий<\/strong>.<\/li><li>Пытается сделать мир таким, каким считает правильным. Видит несовершенство как источник страдания.<\/li><li>Его действия одновременно <strong>чудовищны и рациональны<\/strong>: он искренне спас город от чумы.<\/li><li>Говорит о людях как о композиции: «вы слишком много места занимаете в кадре».<\/li><li>Сейчас находится <strong>на вершине Башни<\/strong> и продолжает дорисовывать город.<\/li><\/ul><div class=\"box quote\"><p>Сайлас Вейл рисовал людей так, как хотел их видеть.<\/p><\/div><p><strong>Чего хочет:<\/strong> закончить Картину — сделать её «настоящей» и закрыть раму, чтобы никто не мог её испортить.<\/p><p><strong>Чего боится:<\/strong> что Элиас прав, и нарисованные люди — не люди.<\/p><p><strong>Слабость:<\/strong> любит свою работу больше людей; на комплимент его картине реагирует как ребёнок.<\/p><h2 id=\"s4-2\">Элиас Вейл — Врач<\/h2><ul><li>Брат-близнец Сайласа. Врач. Спокоен, вежлив, холоден.<\/li><li>Наблюдает за людьми и их травмами. Ведёт <strong>журнал смертей<\/strong>.<\/li><li>Предпочитает обычную медицину своей способности. Боится узнать её настоящую природу.<\/li><li>Держит <strong>Хоспис «Тихая палата»<\/strong> у Перекрёстка — за пределами Города-Картины. Это главный хаб Акта II.<\/li><li>В самом городе есть <strong>Нарисованный Элиас<\/strong> — каким его хотел видеть брат: тёплый, улыбчивый, исцеляющий безупречно.<\/li><\/ul><div class=\"box quote\"><p>Элиас Вейл лечил людей такими, какими они были.<\/p><\/div><p><strong>Чего хочет:<\/strong> понять, кого убивает его лечение. Остановить брата, но не убивать его.<\/p><p><strong>Чего боится:<\/strong> своей руки.<\/p><p><strong>Механическая роль:<\/strong> единственный, кто снимает <strong>тяжёлые травмы<\/strong> и <strong>Мазки<\/strong> (см. Механики). Каждое лечение даром — с побочным эффектом.<\/p><h2 id=\"s4-3\">Нерисса Вейл — Сводная сестра<\/h2><ul><li>Тифлинг, младшая сводная сестра братьев (дочь Ирены от второго брака). Ни одного дара не унаследовала — и ненавидит это.<\/li><li>Член культа Посланца, «Голос Равных». Именно она привела культ к Картине.<\/li><li><strong>Повторяющийся антагонист<\/strong> Акта II: появляется в каждой локации чуть раньше героев.<\/li><li>Её боль понятна: «Почему им двоим — всё, а мне — ничего?» Идеальный проводник идеи Равных.<\/li><\/ul><h2 id=\"s4-4\">Центральная связь<\/h2><p>Сайлас исправляет реальность <strong>извне<\/strong>, через искусство. Элиас сохраняет человека <strong>изнутри<\/strong>, через медицину. Нерисса хочет, чтобы <strong>ни у кого<\/strong> не было дара. Их конфликт не обязан быть конфликтом добра и зла — это семейная драма, разыгранная на масштабе мира.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Если Элиас коснётся Картины своим даром, она «вернётся к тому, какой была» — к пустому холсту. Весь нарисованный город исчезнет. Это одна из возможных концовок, и Элиас догадывается об этом к Акту III.<\/p><\/div>", "toc": [["s4-1", "Сайлас Вейл — Художник"], ["s4-2", "Элиас Вейл — Врач"], ["s4-3", "Нерисса Вейл — Сводная сестра"], ["s4-4", "Центральная связь"]], "text": "Сайлас Вейл — Художник Безумный художник и создатель Картины. Около 45 лет. Левый глаз — нарисованный, ярко-синий . Пытается сделать мир таким, каким считает правильным. Видит несовершенство как источник страдания. Его действия одновременно чудовищны и рациональны : он искренне спас город от чумы. Говорит о людях как о композиции: «вы слишком много места занимаете в кадре». Сейчас находится на вершине Башни и продолжает дорисовывать город. Сайлас Вейл рисовал людей так, как хотел их видеть. Чего хочет: закончить Картину — сделать её «настоящей» и закрыть раму, чтобы никто не мог её испортить. Чего боится: что Элиас прав, и нарисованные люди — не люди. Слабость: любит свою работу больше людей; на комплимент его картине реагирует как ребёнок. Элиас Вейл — Врач Брат-близнец Сайласа. Врач. Спокоен, вежлив, холоден. Наблюдает за людьми и их травмами. Ведёт журнал смертей . Предпочитает обычную медицину своей способности. Боится узнать её настоящую природу. Держит Хоспис «Тихая палата» у Перекрёстка — за пределами Города-Картины. Это главный хаб Акта II. В самом городе есть Нарисованный Элиас — каким его хотел видеть брат: тёплый, улыбчивый, исцеляющий безупречно. Элиас Вейл лечил людей такими, какими они были. Чего хочет: понять, кого убивает его лечение. Остановить брата, но не убивать его. Чего боится: своей руки. Механическая роль: единственный, кто снимает тяжёлые травмы и Мазки (см. Механики). Каждое лечение даром — с побочным эффектом. Нерисса Вейл — Сводная сестра Тифлинг, младшая сводная сестра братьев (дочь Ирены от второго брака). Ни одного дара не унаследовала — и ненавидит это. Член культа Посланца, «Голос Равных». Именно она привела культ к Картине. Повторяющийся антагонист Акта II: появляется в каждой локации чуть раньше героев. Её боль понятна: «Почему им двоим — всё, а мне — ничего?» Идеальный проводник идеи Равных. Центральная связь Сайлас исправляет реальность извне , через искусство. Элиас сохраняет человека изнутри , через медицину. Нерисса хочет, чтобы ни у кого не было дара. Их конфликт не обязан быть конфликтом добра и зла — это семейная драма, разыгранная на масштабе мира. Тайна · только для мастера Если Элиас коснётся Картины своим даром, она «вернётся к тому, какой была» — к пустому холсту. Весь нарисованный город исчезнет. Это одна из возможных концовок, и Элиас догадывается об этом к Акту III."}, {"id": "s5", "n": 5, "title": "ТЕСОРИ — ЧЕХОВСКОЕ РУЖЬЁ", "disp": "Тесори — чеховское ружьё", "group": "Основы", "html": "<p>Тесори ушёл в Башню вместе с частью текущего события. Его не нужно возвращать сразу. После ухода он становится NPC с <strong>отложенным сюжетным эффектом<\/strong>.<\/p><ul><li>Появляется через следы, звуки, предметы и последствия.<\/li><li>Может наблюдать за событиями из Башни.<\/li><li>Может совершить действие, которое партия заметит только позже.<\/li><li>Возвращается в критический момент.<\/li><li>Его <strong>приказ Осириса<\/strong> может конфликтовать с решениями партии.<\/li><\/ul><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Ключевая идея: когда партия вынесет Картину из города, <strong>Тесори останется внутри холста<\/strong>. Он буквально будет у героев в руках — и сможет действовать изнутри Картины в течение всего Акта II.<\/p><\/div><h2 id=\"s5-1\">Как Тесори проявляет себя (по актам)<\/h2><div class=\"tbl\"><table><thead><tr><th>Момент<\/th><th>Проявление<\/th><\/tr><\/thead><tbody><tr><td>Акт I, мастерская<\/td><td>На свежем эскизе башни появляется фигура в его плаще. Через час — уже в другой позе.<\/td><\/tr><tr><td>Акт I, вынос картины<\/td><td>На холсте видно окно башни, в окне — Тесори. Он поднимает руку.<\/td><\/tr><tr><td>Акт II, любая локация<\/td><td>Ночью на холсте появляются новые детали: Тесори рисует (или его заставляют рисовать) подсказки.<\/td><\/tr><tr><td>Акт II, середина<\/td><td>Мазок на холсте перечёркнут — Тесори уничтожил что-то в городе по приказу Осириса. Нарисованный NPC, которого партия знала, исчез.<\/td><\/tr><tr><td>Акт III<\/td><td>Суд Осириса в ратуше: герои могут оспорить приказ и вернуть Тесори<\/td><\/tr><tr><td>Акт V, финал<\/td><td>Тесори выходит через разрез кинжала. Решает ли он судьбу ритуала сам — зависит от отношений с партией.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s5-2\">Приказ Осириса<\/h2><div class=\"box quote\"><p>Нарисованное не умирает. То, что не умирает, не может быть судимо. То, что не может быть судимо, — должно быть уничтожено.<\/p><\/div><p>Осирис не злой: он <strong>хранитель порядка смерти<\/strong>. Нарисованные люди, которые «умирают» и возвращаются копиями, — для него ересь. Тесори может прийти к выводу, что приказ жесток, — или что Осирис прав.<\/p>", "toc": [["s5-1", "Как Тесори проявляет себя (по актам)"], ["s5-2", "Приказ Осириса"]], "text": "Тесори ушёл в Башню вместе с частью текущего события. Его не нужно возвращать сразу. После ухода он становится NPC с отложенным сюжетным эффектом . Появляется через следы, звуки, предметы и последствия. Может наблюдать за событиями из Башни. Может совершить действие, которое партия заметит только позже. Возвращается в критический момент. Его приказ Осириса может конфликтовать с решениями партии. Важно Ключевая идея: когда партия вынесет Картину из города, Тесори останется внутри холста . Он буквально будет у героев в руках — и сможет действовать изнутри Картины в течение всего Акта II. Как Тесори проявляет себя (по актам) Момент Проявление Акт I, мастерская На свежем эскизе башни появляется фигура в его плаще. Через час — уже в другой позе. Акт I, вынос картины На холсте видно окно башни, в окне — Тесори. Он поднимает руку. Акт II, любая локация Ночью на холсте появляются новые детали: Тесори рисует (или его заставляют рисовать) подсказки. Акт II, середина Мазок на холсте перечёркнут — Тесори уничтожил что-то в городе по приказу Осириса. Нарисованный NPC, которого партия знала, исчез. Акт III Суд Осириса в ратуше: герои могут оспорить приказ и вернуть Тесори Акт V, финал Тесори выходит через разрез кинжала. Решает ли он судьбу ритуала сам — зависит от отношений с партией. Приказ Осириса Нарисованное не умирает. То, что не умирает, не может быть судимо. То, что не может быть судимо, — должно быть уничтожено. Осирис не злой: он хранитель порядка смерти . Нарисованные люди, которые «умирают» и возвращаются копиями, — для него ересь. Тесори может прийти к выводу, что приказ жесток, — или что Осирис прав."}, {"id": "s6", "n": 6, "title": "ФРАКЦИИ И ГЛАВНЫЙ КОНФЛИКТ", "disp": "Фракции и главный конфликт", "group": "Основы", "html": "<h2 id=\"s6-1\">Культ Посланца («Равные»)<\/h2><p>Культ связан с распространением эмоций Посланца по острову. Его корни глубже, чем кажется: основан выжившими из первой экспедиции к кратеру. Эмоции постепенно становятся самостоятельными силами и порождают физические проявления.<\/p><p><strong>Лидер:<\/strong> <strong>Малрик Угасший<\/strong>, «Равный». Человек без лица — он стёр его сам, чтобы ни чем не отличаться.<\/p><p><strong>Идея:<\/strong> уравнять всех, уничтожить индивидуальные различия, убрать исключительность. Собрать эмоции Посланца в одном месте, дорисовать Картину Сайласа поверх всего мира и сделать людей <strong>одинаковыми<\/strong>: без боли, без зависти, без гения.<\/p><div class=\"box quote\"><p>Если все супергерои — никто не супергерой.<\/p><\/div><p>Это напрямую перекликается с Сайласом: оба считают несовершенство проблемой, но Сайлас хочет <strong>идеала<\/strong>, а Малрик — <strong>равенства<\/strong>. Сайлас рисует лучших людей. Малрик хочет одного человека, повторённого миллион раз.<\/p><h3>Сосуды — четыре наместника культа<\/h3><div class=\"tbl\"><table><thead><tr><th>Сосуд<\/th><th>Эмоция<\/th><th>Локация<\/th><th>Кто это<\/th><\/tr><\/thead><tbody><tr><td>Зефер Ноктрейн<\/td><td>Скрытность<\/td><td>Мглин, дом «Терпение»<\/td><td>Управляющий доходным домом. Тот, кого никто не помнит.<\/td><\/tr><tr><td>Брат Варис Тенелист<\/td><td>Зависть<\/td><td>Обитель Переписчиков<\/td><td>Настоятель-копиист, переписавший себе чужое лицо.<\/td><\/tr><tr><td>Лукреция Морвейл<\/td><td>Обжорство<\/td><td>Зверинец «Ненасытная Луна»<\/td><td>Хозяйка зверинца, коллекционирующая и поедающая редкости.<\/td><\/tr><tr><td>Корвин Блэкторн<\/td><td>Гнев<\/td><td>Бастион Охотников и карьер<\/td><td>Лорд-охотник, владелец карьера и рабов. <strong>Бывший хозяин Эстела.<\/strong><\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s6-2\">Другие силы<\/h2><div class=\"tbl\"><table><thead><tr><th>Сила<\/th><th>Чего хочет<\/th><th>Отношение к героям<\/th><\/tr><\/thead><tbody><tr><td>Сайлас Вейл<\/td><td>Закончить Картину и закрыть раму<\/td><td>Интерес художника к «новым моделям»<\/td><\/tr><tr><td>Элиас Вейл и хоспис<\/td><td>Понять и остановить, не убивая<\/td><td>Союзник, но со своими границами<\/td><\/tr><tr><td>Осирис (через Тесори)<\/td><td>Уничтожить всё нарисованное<\/td><td>Покровитель Тесори; может стать врагом<\/td><\/tr><tr><td>Нарисованные горожане<\/td><td>Продолжать жить<\/td><td>Растущий страх перед героями — «теми, кто хочет нас стереть»<\/td><\/tr><tr><td>Охотники Бастиона<\/td><td>Охотиться, держать порядок через страх<\/td><td>Наёмники, могут быть наняты обеими сторонами<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s6-3\">Посланец и десять эмоций<\/h2><p>Посланец принёс людям <strong>весть из десяти слов<\/strong>. Люди не смогли её вместить, и весть раскололась: каждое слово стало отдельной <strong>эмоцией<\/strong>, а каждая эмоция ищет, в ком или в чём ей жить. Эмоции делятся на <strong>Великие<\/strong> (у них есть Сосуды-наместники и свои земли) и <strong>Тихие<\/strong> (слабее, бродят, прячутся в местах, существах — и в героях).<\/p><div class=\"tbl\"><table><thead><tr><th>Эмоция<\/th><th>Слово<\/th><th>Где живёт / Сосуд<\/th><th>Проявление<\/th><th>Как выглядит заражённый<\/th><th>Отзывается в ком<\/th><\/tr><\/thead><tbody><tr><td><strong>Тоска<\/strong><br>Великая, скрытая<\/td><td>«Вы»<\/td><td>Город-Картина / <strong>Сайлас<\/strong><\/td><td>Желание переделать мир «как должно быть»<\/td><td>Пишет, строит, чертит; не может остановиться<\/td><td>Велисса (её создатель)<\/td><\/tr><tr><td><strong>Скрытность<\/strong><br>Великая<\/td><td>«несовершенны»<\/td><td>Мглин / <strong>Зефер Ноктрейн<\/strong><\/td><td>Исчезновение, подмена, ложная память<\/td><td>Его не замечают; на фото — пусто<\/td><td>Эстел (маска весельчака)<\/td><\/tr><tr><td><strong>Зависть<\/strong><br>Великая<\/td><td>«не»<\/td><td>Обитель / <strong>Варис Тенелист<\/strong><\/td><td>Копирование чужих свойств<\/td><td>Повторяет чужие жесты; черты лица «сползают» к чужим<\/td><td>—<\/td><\/tr><tr><td><strong>Обжорство<\/strong><br>Великая<\/td><td>«меняется»<\/td><td>Зверинец / <strong>Лукреция Морвейл<\/strong><\/td><td>Поглощение тел, предметов, пространства<\/td><td>Ест не переставая, ест то, что не еда<\/td><td>—<\/td><\/tr><tr><td><strong>Гнев<\/strong><br>Великая<\/td><td>«Неизменное»<\/td><td>Карьер / <strong>Корвин Блэкторн<\/strong><\/td><td>Агрессия, власть, разрушение<\/td><td>Вены светятся, любое слово — оскорбление<\/td><td>Эстел, Ума<\/td><\/tr><tr><td><strong>Страх<\/strong><br>Тихая<\/td><td>«поэтому»<\/td><td>Белая чаща / <strong>Пастух<\/strong><\/td><td>Чудовища, бегство, то, что прячется за деревьями<\/td><td>Не моргает, слышит шаги за спиной<\/td><td>Ума (её страна)<\/td><\/tr><tr><td><strong>Гордыня<\/strong><br>Тихая<\/td><td>«Совершенное»<\/td><td>Сад Статуй / <strong>Генерал Мрамор<\/strong><\/td><td>Застывание в лучшей позе, жажда памятника<\/td><td>Кожа мраморнеет, говорит о себе в третьем лице<\/td><td>Ума<\/td><\/tr><tr><td><strong>Оцепенение<\/strong><br>Тихая<\/td><td>«мертво»<\/td><td>Ледяная мельница / <strong>Мельник<\/strong><\/td><td>Холод, бесчувствие, остановка времени<\/td><td>Иней на ресницах, не плачет и не смеётся<\/td><td>Эстел (его холодность)<\/td><\/tr><tr><td><strong>Желание<\/strong><br>Тихая<\/td><td>«живы»<\/td><td>Воплощение — <strong>Велисса<\/strong><\/td><td>Очарование, искушение, тяга<\/td><td>Не может отвести взгляд, забывает, зачем пришёл<\/td><td>Велисса<\/td><\/tr><tr><td><strong>Нежность<\/strong><br>Тихая<\/td><td>«и»<\/td><td>Воплощение — <strong>Кисточка<\/strong><\/td><td>Привязанность, забота, связь<\/td><td>Тянется к слабым, отдаёт последнее<\/td><td>Тот, кто несёт клетку<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Полная весть Посланца:<\/strong> «<strong>Вы<\/strong> — <strong>несовершенны<\/strong>, <strong>и<\/strong> <strong>поэтому<\/strong> <strong>живы<\/strong>. <strong>Совершенное<\/strong> <strong>не<\/strong> <strong>меняется<\/strong>. <strong>Неизменное<\/strong> — <strong>мертво<\/strong>.» Каждое слово — одна эмоция в порядке таблицы: Тоска, Скрытность, Нежность, Страх, Желание, Гордыня, Зависть, Обжорство, Гнев, Оцепенение.<\/p><\/div><h2 id=\"s6-4\">Как культ читает весть<\/h2><p>Культ знает пять Великих эмоций (кроме Тоски) и часть Тихих. Без «Вы», «и» и «живы» — без Тоски, Нежности и Желания — весть звучит как приговор: «…несовершенны… поэтому… Совершенное не меняется. Неизменное — мертво». Малрик понял её так: <strong>несовершенство нужно убрать, а людей сделать одинаковыми и неизменными<\/strong>.<\/p><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Культу для ритуала нужны <strong>все<\/strong> эмоции. Поэтому он охотится не только за артефактами, но и за <strong>Сайласом<\/strong> (Тоска), <strong>Кисточкой<\/strong> (Нежность) и <strong>Велиссой<\/strong> (Желание). Велисса — цель культа, хотя сама об этом ещё не знает.<\/p><\/div><h2 id=\"s6-5\">Слова Вести (трекер кампании)<\/h2><p>Каждый раз, когда партия <strong>разрешает<\/strong> эмоцию — побеждает её Сосуд или примиряет его, — она получает <strong>Слово Вести<\/strong>. Отмечайте на отдельном листе.<\/p><div class=\"tbl\"><table><thead><tr><th>Как получено<\/th><th>Слово звучит<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td>Мирное разрешение (Сосуд освобождён, эмоция успокоена)<\/td><td><strong>Чисто<\/strong><\/td><td>Каждый герой получает вдохновение; в финале слово можно прочитать без проверки<\/td><\/tr><tr><td>Победа силой<\/td><td><strong>Надтреснуто<\/strong><\/td><td>Слово есть, но в финале нужна проверка Харизмы СЛ 15, чтобы его произнести<\/td><\/tr><tr><td>Слово забрал культ<\/td><td><strong>У врага<\/strong><\/td><td>Малрик произносит его в своей версии ритуала<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Собрав <strong>все десять слов чисто<\/strong>, партия открывает концовку <strong>«Услышать Весть»<\/strong> (см. раздел 32): эмоции возвращаются на место, чудовища по всему миру — включая страну фэйри — затихают. Это самая трудная и самая светлая концовка.<\/p><\/div>", "toc": [["s6-1", "Культ Посланца («Равные»)"], ["s6-2", "Другие силы"], ["s6-3", "Посланец и десять эмоций"], ["s6-4", "Как культ читает весть"], ["s6-5", "Слова Вести (трекер кампании)"]], "text": "Культ Посланца («Равные») Культ связан с распространением эмоций Посланца по острову. Его корни глубже, чем кажется: основан выжившими из первой экспедиции к кратеру. Эмоции постепенно становятся самостоятельными силами и порождают физические проявления. Лидер: Малрик Угасший , «Равный». Человек без лица — он стёр его сам, чтобы ни чем не отличаться. Идея: уравнять всех, уничтожить индивидуальные различия, убрать исключительность. Собрать эмоции Посланца в одном месте, дорисовать Картину Сайласа поверх всего мира и сделать людей одинаковыми : без боли, без зависти, без гения. Если все супергерои — никто не супергерой. Это напрямую перекликается с Сайласом: оба считают несовершенство проблемой, но Сайлас хочет идеала , а Малрик — равенства . Сайлас рисует лучших людей. Малрик хочет одного человека, повторённого миллион раз. Сосуды — четыре наместника культа Сосуд Эмоция Локация Кто это Зефер Ноктрейн Скрытность Мглин, дом «Терпение» Управляющий доходным домом. Тот, кого никто не помнит. Брат Варис Тенелист Зависть Обитель Переписчиков Настоятель-копиист, переписавший себе чужое лицо. Лукреция Морвейл Обжорство Зверинец «Ненасытная Луна» Хозяйка зверинца, коллекционирующая и поедающая редкости. Корвин Блэкторн Гнев Бастион Охотников и карьер Лорд-охотник, владелец карьера и рабов. Бывший хозяин Эстела. Другие силы Сила Чего хочет Отношение к героям Сайлас Вейл Закончить Картину и закрыть раму Интерес художника к «новым моделям» Элиас Вейл и хоспис Понять и остановить, не убивая Союзник, но со своими границами Осирис (через Тесори) Уничтожить всё нарисованное Покровитель Тесори; может стать врагом Нарисованные горожане Продолжать жить Растущий страх перед героями — «теми, кто хочет нас стереть» Охотники Бастиона Охотиться, держать порядок через страх Наёмники, могут быть наняты обеими сторонами Посланец и десять эмоций Посланец принёс людям весть из десяти слов . Люди не смогли её вместить, и весть раскололась: каждое слово стало отдельной эмоцией , а каждая эмоция ищет, в ком или в чём ей жить. Эмоции делятся на Великие (у них есть Сосуды-наместники и свои земли) и Тихие (слабее, бродят, прячутся в местах, существах — и в героях). Эмоция Слово Где живёт / Сосуд Проявление Как выглядит заражённый Отзывается в ком Тоска Великая, скрытая «Вы» Город-Картина / Сайлас Желание переделать мир «как должно быть» Пишет, строит, чертит; не может остановиться Велисса (её создатель) Скрытность Великая «несовершенны» Мглин / Зефер Ноктрейн Исчезновение, подмена, ложная память Его не замечают; на фото — пусто Эстел (маска весельчака) Зависть Великая «не» Обитель / Варис Тенелист Копирование чужих свойств Повторяет чужие жесты; черты лица «сползают» к чужим — Обжорство Великая «меняется» Зверинец / Лукреция Морвейл Поглощение тел, предметов, пространства Ест не переставая, ест то, что не еда — Гнев Великая «Неизменное» Карьер / Корвин Блэкторн Агрессия, власть, разрушение Вены светятся, любое слово — оскорбление Эстел, Ума Страх Тихая «поэтому» Белая чаща / Пастух Чудовища, бегство, то, что прячется за деревьями Не моргает, слышит шаги за спиной Ума (её страна) Гордыня Тихая «Совершенное» Сад Статуй / Генерал Мрамор Застывание в лучшей позе, жажда памятника Кожа мраморнеет, говорит о себе в третьем лице Ума Оцепенение Тихая «мертво» Ледяная мельница / Мельник Холод, бесчувствие, остановка времени Иней на ресницах, не плачет и не смеётся Эстел (его холодность) Желание Тихая «живы» Воплощение — Велисса Очарование, искушение, тяга Не может отвести взгляд, забывает, зачем пришёл Велисса Нежность Тихая «и» Воплощение — Кисточка Привязанность, забота, связь Тянется к слабым, отдаёт последнее Тот, кто несёт клетку Тайна · только для мастера Полная весть Посланца: « Вы — несовершенны , и поэтому живы . Совершенное не меняется . Неизменное — мертво .» Каждое слово — одна эмоция в порядке таблицы: Тоска, Скрытность, Нежность, Страх, Желание, Гордыня, Зависть, Обжорство, Гнев, Оцепенение. Как культ читает весть Культ знает пять Великих эмоций (кроме Тоски) и часть Тихих. Без «Вы», «и» и «живы» — без Тоски, Нежности и Желания — весть звучит как приговор: «…несовершенны… поэтому… Совершенное не меняется. Неизменное — мертво». Малрик понял её так: несовершенство нужно убрать, а людей сделать одинаковыми и неизменными . Важно Культу для ритуала нужны все эмоции. Поэтому он охотится не только за артефактами, но и за Сайласом (Тоска), Кисточкой (Нежность) и Велиссой (Желание). Велисса — цель культа, хотя сама об этом ещё не знает. Слова Вести (трекер кампании) Каждый раз, когда партия разрешает эмоцию — побеждает её Сосуд или примиряет его, — она получает Слово Вести . Отмечайте на отдельном листе. Как получено Слово звучит Эффект Мирное разрешение (Сосуд освобождён, эмоция успокоена) Чисто Каждый герой получает вдохновение; в финале слово можно прочитать без проверки Победа силой Надтреснуто Слово есть, но в финале нужна проверка Харизмы СЛ 15, чтобы его произнести Слово забрал культ У врага Малрик произносит его в своей версии ритуала Совет мастеру Собрав все десять слов чисто , партия открывает концовку «Услышать Весть» (см. раздел 32): эмоции возвращаются на место, чудовища по всему миру — включая страну фэйри — затихают. Это самая трудная и самая светлая концовка."}, {"id": "s7", "n": 7, "title": "ГЕРОИ И ЗЛОДЕИ", "disp": "Герои и злодеи", "group": "Основы", "html": "<p>Важный эксперимент кампании: постепенно сделать игроков злодеями в глазах NPC, а некоторых «монстров» показать как потенциальных героев.<\/p><div class=\"box quote\"><p>Героем делает не то, что он спасает мир. Важно, кто решил, что мир вообще нужно спасать именно таким.<\/p><\/div><h2 id=\"s7-1\">Как это реализовать на практике<\/h2><ul><li><strong>Шкала Страха нарисованных<\/strong> (0–5). Растёт, когда герои уничтожают нарисованных существ, крадут портреты, используют растворитель. При 3 — горожане запирают двери. При 5 — город собирает ополчение против героев.<\/li><li>Нарисованные NPC <strong>искренне счастливы<\/strong>. Их доводы надо подавать честно: «Я был мёртв. Теперь моя дочь жива. Кто вы такие, чтобы это отнять?»<\/li><li>Монстры-эмоции иногда <strong>защищают<\/strong> людей: Гнев защищает рабов в карьере, Скрытность прячет беглецов.<\/li><li>Сайлас понятен: его методы чудовищны, но цели — нет.<\/li><\/ul><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> К Акту V у игроков должно быть минимум <strong>два NPC, которых они любят и которые исчезнут<\/strong> при «простом» решении (уничтожить картину). Иначе финальный выбор будет пустым.<\/p><\/div>", "toc": [["s7-1", "Как это реализовать на практике"]], "text": "Важный эксперимент кампании: постепенно сделать игроков злодеями в глазах NPC, а некоторых «монстров» показать как потенциальных героев. Героем делает не то, что он спасает мир. Важно, кто решил, что мир вообще нужно спасать именно таким. Как это реализовать на практике Шкала Страха нарисованных (0–5). Растёт, когда герои уничтожают нарисованных существ, крадут портреты, используют растворитель. При 3 — горожане запирают двери. При 5 — город собирает ополчение против героев. Нарисованные NPC искренне счастливы . Их доводы надо подавать честно: «Я был мёртв. Теперь моя дочь жива. Кто вы такие, чтобы это отнять?» Монстры-эмоции иногда защищают людей: Гнев защищает рабов в карьере, Скрытность прячет беглецов. Сайлас понятен: его методы чудовищны, но цели — нет. Важно К Акту V у игроков должно быть минимум два NPC, которых они любят и которые исчезнут при «простом» решении (уничтожить картину). Иначе финальный выбор будет пустым."}, {"id": "s8", "n": 8, "title": "АКТ I: ГОРОД-КАРТИНА", "disp": "Акт I: Город-Картина", "group": "Акт I", "html": "<p><strong>Гравенхольм на холсте.<\/strong> Уровни 1–4. Артефакт: <strong>Картина<\/strong>. Скрытая эмоция: <strong>Тоска<\/strong>.<\/p><p>Город выглядит как идеальная открытка: чистые улицы, свежая краска, вежливые люди. Но вблизи видно, что кирпичи нарисованы одним движением кисти, у некоторых прохожих нет обратной стороны, а в переулках, куда Сайлас «не смотрел», мир остаётся эскизом углём.<\/p><h2 id=\"s8-1\">Что уже произошло (старт кампании)<\/h2><ol><li>Корабль высаживает героев на полуострове.<\/li><li>Происходит <strong>камнепад<\/strong> — дорога назад отрезана. <em>(Тайна: это был мазок кисти — герои вошли в Картину.)<\/em><\/li><li>Герои приходят в таверну <strong>«Последняя свеча»<\/strong>, знакомятся с местными и <strong>Веспером Мором<\/strong>.<\/li><li>На выходе из города находят разбитую повозку. Выживший просит найти людей, которые спрятали <strong>шкатулку<\/strong>.<\/li><li>Герои идут в деревню, собирают улики. След приводит к <strong>дому художника<\/strong>.<\/li><li>Бой с художником и копиями <strong>или<\/strong> уход в канализацию; трущобы, подвал дома 19, катакомбы, Король Крыс.<\/li><li>Город, башня (отторгает героев), голубой глаз в окне. Тесори уходит в Башню.<\/li><li><strong>Сейчас: партия в Мастерской художника.<\/strong><\/li><\/ol><h2 id=\"s8-2\">Маршрут Акта I<\/h2><div class=\"tbl\"><table><thead><tr><th>Этап<\/th><th>Локация<\/th><th>Главное событие<\/th><th>Статус<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>Полуостров<\/td><td>Высадка и камнепад<\/td><td>пройдено<\/td><\/tr><tr><td>II<\/td><td>Таверна «Последняя свеча»<\/td><td>Веспер Мор и первые слухи<\/td><td>пройдено<\/td><\/tr><tr><td>III<\/td><td>Разбитая повозка<\/td><td>Шкатулка и загадочный свидетель<\/td><td>пройдено / открыт крючок<\/td><\/tr><tr><td>IV<\/td><td>Деревня<\/td><td>Расследование<\/td><td>пройдено<\/td><\/tr><tr><td>V<\/td><td>Дом художника<\/td><td>Первый контакт с искусством<\/td><td>пройдено<\/td><\/tr><tr><td>VI<\/td><td>Трущобы<\/td><td>След бандитов<\/td><td>по ходу игры<\/td><\/tr><tr><td>VII<\/td><td>Подвал дома 19<\/td><td>Вход в катакомбы<\/td><td>по ходу игры<\/td><\/tr><tr><td>VIII<\/td><td>Катакомбы<\/td><td>Крысы и Король Крыс<\/td><td>по ходу игры<\/td><\/tr><tr><td>IX<\/td><td>Горная тропа<\/td><td>Погасший костёр<\/td><td>по ходу игры<\/td><\/tr><tr><td>X<\/td><td>Город<\/td><td>Иллюзии, культ, картины<\/td><td>идёт<\/td><\/tr><tr><td>XI<\/td><td>Башня<\/td><td>Линия Тесори<\/td><td>открыто<\/td><\/tr><tr><td><strong>XII<\/strong><\/td><td><strong>Мастерская<\/strong><\/td><td><strong>Сайлас, Фредерик и флакон краски<\/strong><\/td><td><strong>СЕЙЧАС<\/strong><\/td><\/tr><tr><td>XIII<\/td><td>Галерея Портретов<\/td><td>Портреты героев<\/td><td>далее<\/td><\/tr><tr><td>XIV<\/td><td>Башня (вход)<\/td><td>Картина и Сайлас<\/td><td>кульминация Акта I<\/td><\/tr><tr><td>XV<\/td><td>Таверна на раме<\/td><td>Вынос Картины из города<\/td><td>выход в Акт II<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s8-3\">Правило города: Часы Холста<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Город <strong>перерисовывается<\/strong>. Ведите счётчик <strong>Часы Холста<\/strong> из 6 делений. +1 деление за каждую долгую передышку в городе, за громкий бой на улицах и за каждое уничтожение нарисованного NPC. Когда счётчик полон — наступает <strong>Ночь Перекраски<\/strong>, и счётчик обнуляется.<\/p><\/div><p><strong>Ночь Перекраски:<\/strong> улицы меняют расположение (новая карта района), один нарисованный NPC «исправлен» и забывает героев, уничтоженные нарисованные объекты возвращаются, а у каждого героя, спавшего в городе, — спасбросок Мудрости СЛ 12, при провале <strong>+1 Мазок<\/strong>.<\/p><h2 id=\"s8-4\">Районы города<\/h2><div class=\"tbl\"><table><thead><tr><th>Район<\/th><th>Что здесь<\/th><th>Музыка<\/th><\/tr><\/thead><tbody><tr><td>Площадь Мольберта<\/td><td>Идеальный рынок, двойники, нарисованный Элиас<\/td><td>Улицы / Bloodborne ambient<\/td><\/tr><tr><td>Трущобы и дом 19<\/td><td>Неотрисованный квартал углём; банда Гримвара; спуск в катакомбы<\/td><td>Эмбиент<\/td><\/tr><tr><td>Катакомбы<\/td><td>Крысы, Король Крыс, бездомный Броммир<\/td><td>Катакомбы<\/td><\/tr><tr><td>Церковь Чистого Холста<\/td><td>Отец Вальдрик Морн, молитвы о «непорочном полотне»<\/td><td>Церковь<\/td><\/tr><tr><td>Галерея Портретов<\/td><td>Портреты всех горожан — и героев<\/td><td>Внутри здания<\/td><\/tr><tr><td>Мастерская Сайласа<\/td><td>Текущая сцена<\/td><td>Внутри здания<\/td><\/tr><tr><td>Шпиль Мольберта (Башня)<\/td><td>Картина, Сайлас, Тесори, голубой глаз<\/td><td>Hunter Nightmare<\/td><\/tr><tr><td>Таверна «Последняя свеча»<\/td><td>Безопасное место, стоит на раме картины<\/td><td>Отдых<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s8-5\">Ключевые NPC Акта I<\/h2><h3>Веспер Мор — бармен «Последней свечи»<\/h3><ul><li>Человек, около 60. Сухие руки, шрам от ошейника на шее (скрыт шарфом).<\/li><li>Наблюдает, знает больше, чем говорит. Не врёт — просто не договаривает.<\/li><li><strong>Правда:<\/strong> бывший раб карьера «Глотка», сбежал 20 лет назад. Таверна стоит на раме Картины и существует в обоих мирах. Веспер первым понял, что город нарисован, — и решил не вмешиваться.<\/li><li><strong>Функция:<\/strong> безопасная точка, слухи, торговля, выход из Картины в Акт II.<\/li><li><strong>Реплика:<\/strong> «Я наливаю всем, кто платит. Даже тем, у кого нет тени.»<\/li><\/ul><h3>Фредерик — подмастерье (две версии)<\/h3><ul><li><strong>Фредерик из мастерской:<\/strong> красный перстень, палетка «синий-красный-зелёный», идеальная улыбка, идеальная память. Это <strong>нарисованная<\/strong> версия — тот, кем Фредерик мечтал быть.<\/li><li><strong>Фредерик из холодильника:<\/strong> настоящий, исхудавший, замёрзший. Сайлас «отложил» его как лишний материал. Помнит всё плохое, что вычеркнул из себя.<\/li><li>В здании 1 Фредерик носил <strong>зелёный перстень и синий берет<\/strong> — значит, когда-то был третий набросок (см. «Мастерская»).<\/li><li>Ни одна версия не знает наверняка, кто оригинал.<\/li><\/ul><h3>Каэлис Воронья Тень — помощник художника<\/h3><ul><li>Полуэльф, немой, трёт пигменты. Вокруг него всегда вороны.<\/li><li>Связь с Сайласом: единственный <strong>настоящий<\/strong> человек, которого Сайлас пустил в мастерскую. Пишет записки углём.<\/li><li>Может стать проводником в Башню, если герои вернут ему голос (голос забрал Сайлас — нарисован на холсте в мастерской как птица в клетке).<\/li><\/ul><h3>Нарисованный Элиас — «добрый доктор»<\/h3><ul><li>Лечит на площади бесплатно. Лечение работает идеально — но пациенты забывают и <strong>саму боль, и то, что её вызвало<\/strong> (умершего ребёнка, предательство).<\/li><li>Искренне не понимает, почему это плохо.<\/li><li><strong>Крючок<\/strong> к настоящему Элиасу: у нарисованного есть письмо от брата, адресованное «Элиасу настоящему».<\/li><\/ul><h3>Отец Вальдрик Морн — священник Церкви Чистого Холста<\/h3><ul><li>Проповедует, что мир — полотно, которое надо очистить от «пятен». Пятна — это несовершенные люди. И чужаки.<\/li><li>Тайный информатор культа Посланца в городе.<\/li><li>Его храм — единственное место, где <strong>нарисованные слышат молитву<\/strong> (связь с порогом прерывания «Молитва» у Фредерика из холодильника).<\/li><\/ul><h3>Морвен Блэкхарт — куратор Галереи Портретов<\/h3><ul><li>Человек, элегантная, в перчатках. Продаёт портреты горожан тем, кто хочет «поправить» соседа.<\/li><li>Портрет связан с человеком: испорченный портрет — испорченный человек.<\/li><li><strong>Крючок:<\/strong> в запасниках Галереи висят <strong>портреты героев<\/strong>, начатые в день их высадки.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок<\/th><\/tr><\/thead><tbody><tr><td>Дрейвен Нокс<\/td><td>Мужчина с меткой охотника на рабов<\/td><td>Бежал из карьера «Глотка». Знает дорогу к Бастиону. Метка «горит», когда рядом Гнев.<\/td><\/tr><tr><td>Гримвар Дакк<\/td><td>Дварф, главарь трущобной банды<\/td><td>Это его люди спрятали шкатулку с повозки. Отдаст её за услугу в катакомбах.<\/td><\/tr><tr><td>Старый Броммир Пепельный<\/td><td>Бездомный дварф с крысой Графиней<\/td><td>Друг крыс. Может говорить с Королём Крыс. Носит Шляпу контроля — и не помнит, где взял.<\/td><\/tr><tr><td>Селена Морвейн (портрет)<\/td><td>Девушка на старой фотографии в мастерской<\/td><td>Её портрет плачет. Настоящая Селена — фотограф в Мглине (крючок в Акт II).<\/td><\/tr><tr><td>Иара Ноктиль<\/td><td>Дроу, натурщица Сайласа<\/td><td>Позировала для «идеальной горожанки». Теперь по городу ходят 30 женщин с её лицом.<\/td><\/tr><tr><td>Бальрик Чёрный Камень<\/td><td>Кузнец квартала<\/td><td>Улучшения +1 и +2. Его горн — нарисованный, но жар настоящий.<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s8-6\">Основная сюжетная линия Акта I<\/h2><ol><li><strong>Мастерская:<\/strong> узнать, что Картины здесь нет; найти флакон краски; разобраться с Фредериками; понять, почему Башня отторгает героев.<\/li><li><strong>Галерея Портретов:<\/strong> найти свои портреты. Решить: уничтожить их, забрать или дать Сайласу закончить.<\/li><li><strong>Вход в Башню:<\/strong> способы попасть внутрь — стать «достаточно нарисованным» (3+ Мазка), надеть законченный портрет как маску, провести Каэлиса, использовать краску на двери.<\/li><li><strong>Вершина Башни:<\/strong> Сайлас за мольбертом. Картина-в-картине. Тесори. Голубой глаз. Разговор — или бой.<\/li><li><strong>Вынос Картины:<\/strong> холст свёрнут, город остаётся внутри. Выход через раму в таверне Веспера. Снаружи — настоящий, пустой и разрушенный Гравенхольм.<\/li><\/ol><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Сайласа <strong>не обязательно убивать<\/strong>. Рекомендация: в первом столкновении он уходит в собственную картину (вписывает себя в холст), и герои выносят Картину <strong>вместе с ним внутри<\/strong>. Это даёт кампании живого антагониста-союзника на весь Акт II.<\/p><\/div>", "toc": [["s8-1", "Что уже произошло (старт кампании)"], ["s8-2", "Маршрут Акта I"], ["s8-3", "Правило города: Часы Холста"], ["s8-4", "Районы города"], ["s8-5", "Ключевые NPC Акта I"], ["s8-6", "Основная сюжетная линия Акта I"]], "text": "Гравенхольм на холсте. Уровни 1–4. Артефакт: Картина . Скрытая эмоция: Тоска . Город выглядит как идеальная открытка: чистые улицы, свежая краска, вежливые люди. Но вблизи видно, что кирпичи нарисованы одним движением кисти, у некоторых прохожих нет обратной стороны, а в переулках, куда Сайлас «не смотрел», мир остаётся эскизом углём. Что уже произошло (старт кампании) Корабль высаживает героев на полуострове. Происходит камнепад — дорога назад отрезана. (Тайна: это был мазок кисти — герои вошли в Картину.) Герои приходят в таверну «Последняя свеча» , знакомятся с местными и Веспером Мором . На выходе из города находят разбитую повозку. Выживший просит найти людей, которые спрятали шкатулку . Герои идут в деревню, собирают улики. След приводит к дому художника . Бой с художником и копиями или уход в канализацию; трущобы, подвал дома 19, катакомбы, Король Крыс. Город, башня (отторгает героев), голубой глаз в окне. Тесори уходит в Башню. Сейчас: партия в Мастерской художника. Маршрут Акта I Этап Локация Главное событие Статус I Полуостров Высадка и камнепад пройдено II Таверна «Последняя свеча» Веспер Мор и первые слухи пройдено III Разбитая повозка Шкатулка и загадочный свидетель пройдено / открыт крючок IV Деревня Расследование пройдено V Дом художника Первый контакт с искусством пройдено VI Трущобы След бандитов по ходу игры VII Подвал дома 19 Вход в катакомбы по ходу игры VIII Катакомбы Крысы и Король Крыс по ходу игры IX Горная тропа Погасший костёр по ходу игры X Город Иллюзии, культ, картины идёт XI Башня Линия Тесори открыто XII Мастерская Сайлас, Фр
