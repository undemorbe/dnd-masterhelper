су отвергли<\/td><td>Помеха на Харизму, СЛ заклинаний −2 до короткой передышки<\/td><\/tr><tr><td>Ума отправила рапорт<\/td><td>Приказ командования; невыполнение — жетон Недоверия<\/td><\/tr><tr><td>Найден материал<\/td><td>Сохранить для улучшения<\/td><\/tr><tr><td>Оружие улучшено<\/td><td>Небольшой числовой рост + новое тактическое свойство<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [], "text": "Ситуация Правило Враг начинает подготовку Явно опишите опасность и условие прерывания; положите жетон Игрок прерывает подготовку Враг пропускает следующий ход, без реакций; союзник рядом — Удар в открытую рану Выстрел во время подготовки Спасбросок Телосложения врага против СЛ стрелка Подготовленная обычная атака попала Двойной бросок урона Персонаж получил урон в ближнем бою Возврат крови: 1d4 за попадание до конца следующего хода Персонаж упал до 0 хитов Автоматическая малая травма Три травмы 1 уровень истощения Использована краска −1 заряд, +1 Мазок 3 Мазка Башня пропускает Долгая передышка в городе +1 к Часам Холста Часы Холста полны Ночь Перекраски Ушли из локации без артефакта Часы Культа +2 Провал против эмоции +1 Отголосок; при 3 — Одержимость Уничтожен нарисованный NPC Страх нарисованных +1; Часы Холста +1 Эмоция разрешена мирно Слово Вести «чисто» + вдохновение всем Эмоция разрешена силой Слово Вести «надтреснуто» Корвин рядом с Эстелом Печать: Зуд → Жжение → Зов Эстел искренне проявил чувство Оттепель +1 Велиссу отвергли Помеха на Харизму, СЛ заклинаний −2 до короткой передышки Ума отправила рапорт Приказ командования; невыполнение — жетон Недоверия Найден материал Сохранить для улучшения Оружие улучшено Небольшой числовой рост + новое тактическое свойство"}, {"id": "s44", "n": 44, "title": "ROADMAP КАМПАНИИ", "disp": "Roadmap кампании", "group": "Roadmap", "html": "<p>Ориентир по темпу: <strong>одна сессия ≈ 3–4 часа<\/strong>. Числа сессий — примерные, подстраивайте под свою группу. Уровни выдаются за <strong>вехи<\/strong> (milestone), а не за опыт.<\/p><h2 id=\"s44-1\">Пять актов одной таблицей<\/h2><div class=\"tbl\"><table><thead><tr><th>Акт<\/th><th>Название<\/th><th>Уровни<\/th><th>Сессии (примерно)<\/th><th>Суть<\/th><th>Финальная веха акта<\/th><\/tr><\/thead><tbody><tr><td><strong>I<\/strong><\/td><td>Город-Картина<\/td><td>1–4<\/td><td>1–14<\/td><td>Художник, Фредерик, Башня, поиск Картины<\/td><td>Картина вынесена; Тесори и Сайлас внутри<\/td><\/tr><tr><td><strong>II<\/strong><\/td><td>Полуостров Ашгрей<\/td><td>4–9<\/td><td>15–45<\/td><td>4 артефакта, 3 Тихих очага, Гнездо Вейлов, Фабрика, Некрополь<\/td><td>Четыре артефакта (у героев или у культа); Перо Истины<\/td><\/tr><tr><td><strong>III<\/strong><\/td><td>Изнанка Холста<\/td><td>9–11<\/td><td>43–52<\/td><td>Возвращение в Картину: Перекрашенный город, Подмалёвок, Отвергнутые, Суд Осириса<\/td><td>Тесори свободен или повержен; известно, как залатать холст<\/td><\/tr><tr><td><strong>IV<\/strong><\/td><td>Страна фэйри<\/td><td>11–13<\/td><td>53–64<\/td><td>Застава, Шёлковые сады, фронт, Сумеречный двор<\/td><td>Картина залатана; Ухо Посланца; судьба Умы<\/td><\/tr><tr><td><strong>V<\/strong><\/td><td>Звёздный Колодец<\/td><td>13–15<\/td><td>65–74<\/td><td>Обсерватория, Ровное, Кратер, Остов Посланца<\/td><td>Ритуал и выбор концовки<\/td><\/tr><tr><td>—<\/td><td>Эпилог<\/td><td>15<\/td><td>75<\/td><td>Последствия<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> <strong>Короткий маршрут (≈50 сессий):<\/strong> Акт II без Некрополя и одного Тихого очага; Акт III — только Подмалёвок и Суд; Акт IV — только Шёлковые сады и Сумеречный двор; Акт V без Остова (если не идёте на «Услышать Весть»).<\/p><\/div><h2 id=\"s44-2\">Общая карта по частям<\/h2><div class=\"tbl\"><table><thead><tr><th>Акт<\/th><th>Часть<\/th><th>Локация<\/th><th>Уровень<\/th><th>Главная веха<\/th><\/tr><\/thead><tbody><tr><td><strong>I<\/strong><\/td><td>1<\/td><td>Высадка, таверна, повозка, деревня<\/td><td>1<\/td><td>Пройдено<\/td><\/tr><tr><td>I<\/td><td>2<\/td><td>Дом художника, трущобы, катакомбы, Король Крыс<\/td><td>1–2<\/td><td>Пройдено / в процессе<\/td><\/tr><tr><td>I<\/td><td>3<\/td><td><strong>Мастерская<\/strong> (сейчас) + сцена «Разделённый холст»<\/td><td>2–3<\/td><td>Флакон краски, Фредерики, <strong>Узы партии<\/strong><\/td><\/tr><tr><td>I<\/td><td>4<\/td><td>Галерея Портретов, побочные квесты города<\/td><td>3<\/td><td>Портреты героев, доступ в Башню<\/td><\/tr><tr><td>I<\/td><td>5<\/td><td><strong>Башня, Сайлас, Картина<\/strong><\/td><td>3–4<\/td><td>Картина в руках<\/td><\/tr><tr><td>I→II<\/td><td>6<\/td><td>Вынос через таверну, настоящий Гравенхольм<\/td><td>4<\/td><td>Шок: город снаружи пуст<\/td><\/tr><tr><td><strong>II<\/strong><\/td><td>7<\/td><td>Хоспис «Тихая палата»<\/td><td>4<\/td><td>Хаб открыт; журнал смертей<\/td><\/tr><tr><td>II<\/td><td>8<\/td><td>Мглин и дом «Терпение»<\/td><td>4–5<\/td><td>Фотография; мать Эстела<\/td><\/tr><tr><td>II<\/td><td>9<\/td><td>Тихий очаг: Белая чаща<\/td><td>5–6<\/td><td>Пастух; линия Умы<\/td><\/tr><tr><td>II<\/td><td>10<\/td><td>Обитель Переписчиков<\/td><td>5–6<\/td><td>Записи; оригинал летописи<\/td><\/tr><tr><td>II<\/td><td>11<\/td><td>Гнездо Вейлов<\/td><td>6–7<\/td><td>Дневник Ирены; письмо Нериссе<\/td><\/tr><tr><td>II<\/td><td>12<\/td><td>Тихий очаг: Ледяная мельница<\/td><td>6<\/td><td>Оттепель Эстела<\/td><\/tr><tr><td>II<\/td><td>13<\/td><td>Зверинец «Ненасытная Луна»<\/td><td>6–7<\/td><td>Клетка; сестра Эстела; фэйри-ребёнок<\/td><\/tr><tr><td>II<\/td><td>14<\/td><td>Тихий очаг: Сад Статуй<\/td><td>6–7<\/td><td>Искушение Умы<\/td><\/tr><tr><td>II<\/td><td>15<\/td><td>Карьер «Глотка» и Бастион<\/td><td>7–8<\/td><td>Мастихин; Корвин<\/td><\/tr><tr><td>II<\/td><td>15½<\/td><td><strong>Фабрика «Прогресс»<\/strong><\/td><td>7–9<\/td><td>Пифия; забастовка; котёл «Сердце»<\/td><\/tr><tr><td>II<\/td><td>16<\/td><td>Некрополь Осириса<\/td><td>8–9<\/td><td>Перо Истины; голос Тесори<\/td><\/tr><tr><td><strong>III<\/strong><\/td><td>17<\/td><td>Вход в Картину; Перекрашенный Гравенхольм<\/td><td>9<\/td><td>Сопротивление; Вальдрик<\/td><\/tr><tr><td>III<\/td><td>18<\/td><td>Подмалёвок<\/td><td>9–10<\/td><td>Правда о мёртвых; Сайлас и Элиас<\/td><\/tr><tr><td>III<\/td><td>19<\/td><td>Галерея Отвергнутых<\/td><td>10<\/td><td>Велисса-Законченная; наброски героев<\/td><\/tr><tr><td>III<\/td><td>20<\/td><td>Суд Осириса<\/td><td>10–11<\/td><td>Тесори; судьба нарисованных<\/td><\/tr><tr><td><strong>IV<\/strong><\/td><td>21<\/td><td>Застава Шипов<\/td><td>11<\/td><td>Допрос; вход в страну фэйри<\/td><\/tr><tr><td>IV<\/td><td>22<\/td><td>Шёлковые сады<\/td><td>11–12<\/td><td>Картина залатана; Велисса «дома»<\/td><\/tr><tr><td>IV<\/td><td>23<\/td><td>Выжженная опушка<\/td><td>12<\/td><td>Фронт; развернуть ли Картину<\/td><\/tr><tr><td>IV<\/td><td>24<\/td><td>Сумеречный двор<\/td><td>12–13<\/td><td>Ухо Посланца; трибунал Умы; Ирена<\/td><\/tr><tr><td><strong>V<\/strong><\/td><td>25<\/td><td>Обсерватория «Звёздный Колодец»<\/td><td>13<\/td><td>Ночь Звезды; правда о вести<\/td><\/tr><tr><td>V<\/td><td>26<\/td><td>Лагерь Равных «Ровное»<\/td><td>13–14<\/td><td>Нерисса; будущее мира<\/td><\/tr><tr><td>V<\/td><td>27<\/td><td>Кратер Посланца, ритуал, Малрик<\/td><td>14<\/td><td>Жертва, финальный бой<\/td><\/tr><tr><td>V<\/td><td>28<\/td><td>Остов Посланца (по необходимости)<\/td><td>14–15<\/td><td>«Услышать Весть»<\/td><\/tr><tr><td>—<\/td><td>29<\/td><td>Эпилог<\/td><td>15<\/td><td>Судьбы<\/td><\/tr><\/tbody><\/table><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Порядок Акта II свободный. Рекомендуемый для нарастания сложности приведён выше. Если партия идёт иначе — масштабируйте хиты и СЛ (у каждого босса два значения хитов).<\/p><\/div><h2 id=\"s44-3\">Масштабирование по уровню<\/h2><div class=\"tbl\"><table><thead><tr><th>Уровень партии<\/th><th>Хиты босса<\/th><th>СЛ спасбросков<\/th><th>Обычные враги<\/th><\/tr><\/thead><tbody><tr><td>4<\/td><td>Нижнее значение<\/td><td>12–13<\/td><td>3–4 слабых<\/td><\/tr><tr><td>5–6<\/td><td>Нижнее + 20%<\/td><td>13–14<\/td><td>4–6, один элитный<\/td><\/tr><tr><td>7–8<\/td><td>Верхнее значение<\/td><td>14–15<\/td><td>2–3 элитных<\/td><\/tr><tr><td>9–11<\/td><td>Верхнее + 25%<\/td><td>15–16<\/td><td>Элитные + фаза Сосуда<\/td><\/tr><tr><td>12–15<\/td><td>Верхнее + 50%<\/td><td>16–18<\/td><td>Элитные отряды, у боссов по 2–3 фазы<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s44-4\">Вехи актов<\/h2><div class=\"tbl\"><table><thead><tr><th>Акт<\/th><th>Что обязательно должно случиться<\/th><\/tr><\/thead><tbody><tr><td>I<\/td><td>Город нарисован (хотя бы подозрение); флакон краски найден; решение о Фредериках записано; партия поговорила с Сайласом; <strong>Узы партии<\/strong> созданы или провалены; Тесори остаётся в Картине; Картина вынесена<\/td><\/tr><tr><td>II<\/td><td>Элиас и журнал смертей; Нерисса раскрыта; каждый Сосуд побеждён, спасён или ушёл с артефактом; цель культа — уравнение; у партии 2+ любимых NPC, которые исчезнут при «Стереть»<\/td><\/tr><tr><td>III<\/td><td>Партия видит последствия Акта I; правда Подмалёвка; суд над нарисованными; путь к шёлку<\/td><\/tr><tr><td>IV<\/td><td>Картина залатана (или нет — и тогда разрез её порвёт); судьба Уха Посланца; судьба Умы перед двором<\/td><\/tr><tr><td>V<\/td><td>Правда о вести; выбор жертвы и чтецов записей; финальный бой; концовка<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s44-5\">Вехи личных линий<\/h2><div class=\"tbl\"><table><thead><tr><th>Герой<\/th><th>Акт I<\/th><th>Акт II<\/th><th>Акт III<\/th><th>Акт IV<\/th><th>Акт V<\/th><\/tr><\/thead><tbody><tr><td><strong>Эстел<\/strong><\/td><td>«К. Б.» и серпы на эскизе<\/td><td>Мать, сестра, отец; Корвин; Оттепель<\/td><td>Свой набросок в Галерее<\/td><td>«Чей ты?» на заставе<\/td><td>Зал Гнева; судьба печати и Мастихина<\/td><\/tr><tr><td><strong>Велисса<\/strong><\/td><td>Встречает создателя<\/td><td>Узнаёт, что она — Желание; попытка похищения<\/td><td>Велисса-Законченная; сердце на весах<\/td><td>Шёлковые сады; «перетканная» Велисса<\/td><td>Зал Желания; контракт феи<\/td><\/tr><tr><td><strong>Ума<\/strong><\/td><td>Картина — тот самый артефакт<\/td><td>Правда о чудовищах; дети; приказы<\/td><td>Набросок «без ошибки»<\/td><td>Фронт, трибунал, Ухо<\/td><td>Зал Гордыни; Картина — домой или в Кратер<\/td><\/tr><tr><td><strong>Тесори<\/strong><\/td><td>Уходит в Башню<\/td><td>Действует изнутри; голос в Некрополе<\/td><td>Суд Осириса<\/td><td>«Ты пришёл судить нас?»<\/td><td>Выходит через разрез или стоит рядом<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s44-6\">Нити, которые тянутся через всю кампанию<\/h2><div class=\"tbl\"><table><thead><tr><th>Нить<\/th><th>Начало<\/th><th>Середина<\/th><th>Развязка<\/th><\/tr><\/thead><tbody><tr><td><strong>Сайлас<\/strong><\/td><td>Мастерская, Башня, уход в холст<\/td><td>Подмалёвок: слабый и честный<\/td><td>Жертва, союзник или «Новый художник»<\/td><\/tr><tr><td><strong>Элиас<\/strong><\/td><td>Нарисованная копия, письмо<\/td><td>Хоспис, журнал; встреча с братом в Подмалёвке<\/td><td>Может стереть Картину даром<\/td><\/tr><tr><td><strong>Нерисса<\/strong><\/td><td>Письмо в мастерской, погасший костёр<\/td><td>Гнездо Вейлов, письмо матери<\/td><td>Ровное: жертва культа или союзник<\/td><\/tr><tr><td><strong>Ирена Вейл<\/strong><\/td><td>Упоминания<\/td><td>Дневник в Гнезде; угольная Ирена в Подмалёвке<\/td><td>Звездочёт королевы; возможная жертва<\/td><\/tr><tr><td><strong>Веспер Мор<\/strong><\/td><td>Таверна на раме<\/td><td>Прошлое в карьере; сторож холста в Акте III<\/td><td>Свидетель финала<\/td><\/tr><tr><td><strong>Фредерик<\/strong><\/td><td>Две версии, выбор<\/td><td>Третий Фредерик в Галерее Отвергнутых<\/td><td>Возможная жертва<\/td><\/tr><tr><td><strong>Слова Вести<\/strong><\/td><td>—<\/td><td>Собираются за каждую разрешённую эмоцию<\/td><td>10 чистых слов + Ухо = «Услышать Весть»<\/td><\/tr><tr><td><strong>Часы Культа<\/strong><\/td><td>—<\/td><td>Растут с каждой задержкой<\/td><td>Сколько Сосудов и уравненных в финале<\/td><\/tr><tr><td><strong>Страх нарисованных<\/strong><\/td><td>Растёт от действий в городе<\/td><td>Ополчение Чистоты в Акте III<\/td><td>Влияет на «Исправить» и Суд<\/td><\/tr><tr><td><strong>Узы партии<\/strong><\/td><td>Групповой портрет<\/td><td>Ранги растут от личных сцен<\/td><td>Прерывания боссов в Остове<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s44-7\">Таймеры кампании (сводка)<\/h2><div class=\"tbl\"><table><thead><tr><th>Таймер<\/th><th>Шкала<\/th><th>Что происходит при заполнении<\/th><\/tr><\/thead><tbody><tr><td>Часы Холста<\/td><td>6<\/td><td>Ночь Перекраски в городе<\/td><\/tr><tr><td>Часы Культа<\/td><td>8<\/td><td>Каждые 2 деления культ забирает артефакт<\/td><\/tr><tr><td>Последнее блюдо (Зверинец)<\/td><td>3 ночи<\/td><td>Лукреция съедает Кисточку<\/td><\/tr><tr><td>Ночь Звезды (Обсерватория)<\/td><td>Объявляет Эларис<\/td><td>Окно для ритуала; после — культ проводит его сам<\/td><\/tr><tr><td>Нападение на хранителя холста (Акт III)<\/td><td>1d6 раз в день, на 1<\/td><td>Культ атакует того, кто сторожит Картину снаружи<\/td><\/tr><tr><td>Неделя у фэйри (Акт IV)<\/td><td>1 неделя = 1 день снаружи<\/td><td>Часы Культа идут медленнее<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s44-8\">Ближайшие сессии: план<\/h2><ol><li><strong>Сессия «Мастерская»:<\/strong> сцена сплочения <strong>«Разделённый холст»<\/strong> → Групповой портрет и Узы; решение о Фредериках, загадка палетки, флакон краски, письмо Нериссы, список «моделей». Личные крючки: эскиз «К. Б.» (Эстел), обгоревший холст (Велисса), фэйский шёлк (Ума).<\/li><li><strong>Сессия «Город»:<\/strong> Галерея Портретов, один побочный квест (рекомендация — «Шкатулка» или «Тридцать Иар»), рост Часов Холста.<\/li><li><strong>Сессия «Башня»:<\/strong> вход, этажи, Сайлас, Картина, хопеш Тесори. Сайлас узнаёт Велиссу; Ума видит Картину.<\/li><li><strong>Сессия «Рама»:<\/strong> вынос Картины, прощание с городом, Веспер, настоящий Гравенхольм. Поворотная точка кампании.<\/li><\/ol><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Сохраняйте финальный принцип: начать с <strong>локального хоррора<\/strong> (крысы, странные NPC, художник), перейти к <strong>ужасу пространства<\/strong> (копии, зеркала, башня, Мглин), затем раскрыть <strong>ужас идеи<\/strong> (кто-то может переписывать людей). В финале — выбор, а не одна правильная кнопка.<\/p><\/div><div class=\"box quote\"><p>Можно ли исправить несовершенную реальность, не уничтожив саму реальность?<\/p><\/div>", "toc": [["s44-1", "Пять актов одной таблицей"], ["s44-2", "Общая карта по частям"], ["s44-3", "Масштабирование по уровню"], ["s44-4", "Вехи актов"], ["s44-5", "Вехи личных линий"], ["s44-6", "Нити, которые тянутся через всю кампанию"], ["s44-7", "Таймеры кампании (сводка)"], ["s44-8", "Ближайшие сессии: план"]], "text": "Ориентир по темпу: одна сессия ≈ 3–4 часа . Числа сессий — примерные, подстраивайте под свою группу. Уровни выдаются за вехи (milestone), а не за опыт. Пять актов одной таблицей Акт Название Уровни Сессии (примерно) Суть Финальная веха акта I Город-Картина 1–4 1–14 Художник, Фредерик, Башня, поиск Картины Картина вынесена; Тесори и Сайлас внутри II Полуостров Ашгрей 4–9 15–45 4 артефакта, 3 Тихих очага, Гнездо Вейлов, Фабрика, Некрополь Четыре артефакта (у героев или у культа); Перо Истины III Изнанка Холста 9–11 43–52 Возвращение в Картину: Перекрашенный город, Подмалёвок, Отвергнутые, Суд Осириса Тесори свободен или повержен; известно, как залатать холст IV Страна фэйри 11–13 53–64 Застава, Шёлковые сады, фронт, Сумеречный двор Картина залатана; Ухо Посланца; судьба Умы V Звёздный Колодец 13–15 65–74 Обсерватория, Ровное, Кратер, Остов Посланца Ритуал и выбор концовки — Эпилог 15 75 Последствия — Совет мастеру Короткий маршрут (≈50 сессий): Акт II без Некрополя и одного Тихого очага; Акт III — только Подмалёвок и Суд; Акт IV — только Шёлковые сады и Сумеречный двор; Акт V без Остова (если не идёте на «Услышать Весть»). Общая карта по частям Акт Часть Локация Уровень Главная веха I 1 Высадка, таверна, повозка, деревня 1 Пройдено I 2 Дом художника, трущобы, катакомбы, Король Крыс 1–2 Пройдено / в процессе I 3 Мастерская (сейчас) + сцена «Разделённый холст» 2–3 Флакон краски, Фредерики, Узы партии I 4 Галерея Портретов, побочные квесты города 3 Портреты героев, доступ в Башню I 5 Башня, Сайлас, Картина 3–4 Картина в руках I→II 6 Вынос через таверну, настоящий Гравенхольм 4 Шок: город снаружи пуст II 7 Хоспис «Тихая палата» 4 Хаб открыт; журнал смертей II 8 Мглин и дом «Терпение» 4–5 Фотография; мать Эстела II 9 Тихий очаг: Белая чаща 5–6 Пастух; линия Умы II 10 Обитель Переписчиков 5–6 Записи; оригинал летописи II 11 Гнездо Вейлов 6–7 Дневник Ирены; письмо Нериссе II 12 Тихий очаг: Ледяная мельница 6 Оттепель Эстела II 13 Зверинец «Ненасытная Луна» 6–7 Клетка; сестра Эстела; фэйри-ребёнок II 14 Тихий очаг: Сад Статуй 6–7 Искушение Умы II 15 Карьер «Глотка» и Бастион 7–8 Мастихин; Корвин II 15½ Фабрика «Прогресс» 7–9 Пифия; забастовка; котёл «Сердце» II 16 Некрополь Осириса 8–9 Перо Истины; голос Тесори III 17 Вход в Картину; Перекрашенный Гравенхольм 9 Сопротивление; Вальдрик III 18 Подмалёвок 9–10 Правда о мёртвых; Сайлас и Элиас III 19 Галерея Отвергнутых 10 Велисса-Законченная; наброски героев III 20 Суд Осириса 10–11 Тесори; судьба нарисованных IV 21 Застава Шипов 11 Допрос; вход в страну фэйри IV 22 Шёлковые сады 11–12 Картина залатана; Велисса «дома» IV 23 Выжженная опушка 12 Фронт; развернуть ли Картину IV 24 Сумеречный двор 12–13 Ухо Посланца; трибунал Умы; Ирена V 25 Обсерватория «Звёздный Колодец» 13 Ночь Звезды; правда о вести V 26 Лагерь Равных «Ровное» 13–14 Нерисса; будущее мира V 27 Кратер Посланца, ритуал, Малрик 14 Жертва, финальный бой V 28 Остов Посланца (по необходимости) 14–15 «Услышать Весть» — 29 Эпилог 15 Судьбы Совет мастеру Порядок Акта II свободный. Рекомендуемый для нарастания сложности приведён выше. Если партия идёт иначе — масштабируйте хиты и СЛ (у каждого босса рыть ужас идеи (кто-то может переписывать людей). В финале — выбор, а не одна правильная кнопка. Можно ли исправить несовершенную реальность, не уничтожив саму реальность?"}], "music": [{"scene": "Шота / максимальное напряжение", "url": "https://www.youtube.com/watch?v=luxZl7ZP7tM", "where": "Buckshot, Игорный шатёр"}, {"scene": "Крыса / Iron Crown", "url": "https://www.youtube.com/watch?v=rH6iIqHoQm0", "where": "Король Крыс, Арена Ям"}, {"scene": "Костёр / рассвет / Majula", "url": "https://www.youtube.com/watch?v=EpSoGZa3Hrw", "where": "Костёр путников, эпилог"}, {"scene": "Улицы / Bloodborne ambient", "url": "https://www.youtube.com/watch?v=5HrCFzXZHbQ&amp;t=29s", "where": "Город-Картина"}, {"scene": "Hunter Nightmare", "url": "https://www.youtube.com/watch?v=TM1rMLhHPac&amp;t=99s", "where": "Башня, Бастион"}, {"scene": "Внутри здания", "url": "https://www.youtube.com/watch?v=ZrISamYZCR0", "where": "Мастерская, Галерея, дом «Терпение»"}, {"scene": "Катакомбы", "url": "https://www.youtube.com/watch?v=kxqJuc1HHbg", "where": "Катакомбы"}, {"scene": "Пещеры", "url": "https://www.youtube.com/watch?v=MxsWuxrzzZo", "where": "Карьер «Глотка», шахты"}, {"scene": "Эмбиент", "url": "https://www.youtube.com/watch?v=Jg_QwWE_5cY", "where": "Трущобы, дороги"}, {"scene": "Отдых", "url": "https://www.youtube.com/watch?v=adoHMLCikPA", "where": "Таверна, хоспис"}, {"scene": "Отдых 2", "url": "https://www.youtube.com/watch?v=6nlBKO1OM44&amp;list=TLPQMjEwNDIwMjZZhUTV_fm75A&amp;index=5", "where": "Мансарда Селены"}, {"scene": "Ambient набор", "url": "https://www.youtube.com/watch?v=5Vtdebr3fb0", "where": "Обитель, Зверинец (фон)"}, {"scene": "Церковь", "url": "https://www.youtube.com/watch?v=ObtCjrUA3n8", "where": "Церковь Чистого Холста, Часовня Мастихина"}, {"scene": "Библиотека", "url": "https://www.youtube.com/watch?v=rneRXmwp8fQ", "where": "Обитель Переписчиков, Обсерватория"}, {"scene": "Туман / гром", "url": "https://www.youtube.com/watch?v=9c1ZRl_3XbI", "where": "Мглин, Кратер"}, {"scene": "Сильный бой", "url": "https://www.youtube.com/watch?v=Q3lQFLrImT0", "where": "Боссы-Сосуды"}]}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const S = D.sections;
const byId = Object.fromEntries(S.map(s=>[s.id,s]));
const $ = (sel,root=document)=>root.querySelector(sel);
const esc = t => String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function key(title){let h=0;for(const c of title){h=(h*31+c.codePointAt(0))>>>0}return 'k'+h.toString(36)}
S.forEach(s=>s.key=key(s.title));

/* ---------- storage: db capability, localStorage fallback ---------- */
const local = {
  get(k,d){try{const v=localStorage.getItem('gkn.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('gkn.'+k,JSON.stringify(v));return true}catch(e){return false}}
};
const store = {mode:'local', db:null, notes:local.get('notes',{}), trackers:local.get('trackers',null), journal:local.get('journal',[]), prefs:local.get('prefs',{pinned:[]})};
const saveState = $('#saveState');
function setStatus(t){saveState.textContent=t}
function modeLabel(){return store.mode==='db'?'сохранено в артефакте':store.mode==='file'?'сохранено в папке dnd':'только в этом браузере'}

const chains = {};
function queueWrite(path, data){
  if(store.mode==='file'){
    const prev=chains[path]||Promise.resolve(); setStatus('сохраняю…');
    chains[path]=prev.then(()=>fetch('api/store?path='+encodeURIComponent(path),{method:data===null?'DELETE':'PUT',headers:{'Content-Type':'application/json'},body:data===null?undefined:JSON.stringify(data)}))
      .then(r=>{if(!r.ok) throw {code:r.status}; setStatus(modeLabel())}).catch(e=>setStatus('не сохранилось: сервер не отвечает'));
    return;
  }
  if(store.mode!=='db') return;
  const prev = chains[path]||Promise.resolve();
  setStatus('сохраняю…');
  chains[path] = prev.then(()=>store.db.doc(path).set(data)).then(()=>setStatus(modeLabel())).catch(e=>{setStatus('не сохранилось: '+(e&&e.code||'ошибка'))});
}
function persistLocal(){local.set('notes',store.notes);local.set('trackers',store.trackers);local.set('journal',store.journal);local.set('prefs',store.prefs)}
const timers={};
function debounce(id,fn,ms){clearTimeout(timers[id]);timers[id]=setTimeout(fn,ms)}

function saveNote(k,text){
  store.notes[k]={text,updatedAt:Date.now()};
  if(store.mode==='db'||store.mode==='file') debounce('n'+k,()=>queueWrite('notes/'+k,store.notes[k]),700);
  else {local.set('notes',store.notes);setStatus(modeLabel())}
  renderRailDots(); renderRecent();
}
function saveTrackers(){
  if(store.mode==='db'||store.mode==='file') debounce('trk',()=>queueWrite('state/trackers',store.trackers),500);
  else {local.set('trackers',store.trackers);setStatus(modeLabel())}
}
function savePrefs(){
  if(store.mode==='db'||store.mode==='file') queueWrite('state/prefs',store.prefs);
  else local.set('prefs',store.prefs);
}
function saveEntry(e){
  const i=store.journal.findIndex(x=>x.id===e.id); if(i>=0) store.journal[i]=e; else store.journal.push(e);
  if(store.mode==='db'||store.mode==='file') queueWrite('journal/'+e.id,e); else {local.set('journal',store.journal);setStatus(modeLabel())}
}
function deleteEntry(id){
  store.journal=store.journal.filter(x=>x.id!==id);
  if(store.mode==='db'){store.db.doc('journal/'+id).delete().catch(()=>setStatus('не удалилось'))} else if(store.mode==='file') queueWrite('journal/'+id,null); else local.set('journal',store.journal);
}

async function connect(){
  let db=null;
  try{ if(window.claude && window.claude.use) db = await window.claude.use('db'); }catch(e){db=null}
  if(!db){ await connectFile(); return; }
  store.db=db; store.mode='db'; setStatus(modeLabel());
  db.collection('notes').onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{const v=d.data(); if(v) m[d.id]=v});
    store.notes=m; renderRailDots(); renderRecent();
    const ta=$('#noteText'); if(document.activeElement!==ta && ta.dataset.key){ ta.value=(m[ta.dataset.key]||{}).text||'' }
  }, ()=>setStatus('заметки недоступны'));
  db.doc('state/trackers').onSnapshot(s=>{
    if(s.exists){ store.trackers=mergeDefaults(s.data()); if(view==='track' && !trackerFocus()) renderTrackers(); }
  }, ()=>{});
  db.doc('state/prefs').onSnapshot(s=>{ if(s.exists){ store.prefs=Object.assign({pinned:[]},s.data()); renderRail(); } }, ()=>{});
  db.collection('journal').onSnapshot(snap=>{
    store.journal=snap.docs.map(d=>d.data()).filter(Boolean);
    if(view==='journal' && !editingEntry) renderJournal();
  }, ()=>{});
}
async function connectFile(){
  if(location.protocol==='file:'){setStatus(modeLabel());return}
  try{
    const r=await fetch('api/store',{cache:'no-store'}); if(!r.ok) throw 0;
    const all=await r.json(); store.mode='file';
    const notes={},journal=[];
    for(const [p,v] of Object.entries(all)){
      const [c,id]=p.split('/');
      if(c==='notes') notes[id]=v; else if(c==='journal') journal.push(v);
      else if(p==='state/trackers') store.trackers=mergeDefaults(v);
      else if(p==='state/prefs') store.prefs=Object.assign({pinned:[]},v);
    }
    store.notes=notes; store.journal=journal;
    setStatus(modeLabel()); renderRail();
    if(view==='ref') go(current); else setView(view);
  }catch(e){ setStatus(modeLabel()) }
}
function trackerFocus(){const a=document.activeElement;return a && a.closest && a.closest('#page') && (a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA')}

/* ---------- trackers model ---------- */
const EMOTIONS=['Тоска','Скрытность','Зависть','Обжорство','Гнев','Страх','Гордыня','Оцепенение','Желание','Нежность'];
const WORDS=[['Тоска','Вы'],['Скрытность','несовершенны'],['Нежность','и'],['Страх','поэтому'],['Желание','живы'],['Гордыня','Совершенное'],['Зависть','не'],['Обжорство','меняется'],['Гнев','Неизменное'],['Оцепенение','мертво']];
const ARTS=['Картина','Фотография','Записи','Клетка со зверьком','Кинжал'];
function defaults(){return {
  act:'Акт I', location:'Мастерская художника',
  clocks:{canvas:0,cult:0,fear:0,feast:0}, flask:5,
  words:Object.fromEntries(WORDS.map(w=>[w[0],'none'])),
  arts:Object.fromEntries(ARTS.map(a=>[a,'none'])),
  pcs:{
    estel:{mazki:0,seal:'Тихая',thaw:0,echo:{}},
    velissa:{mazki:2,choice:'Не решено',echo:{}},
    uma:{mazki:0,distrust:0,kids:0,rank:'Лейтенант',echo:{}},
    tesori:{status:'В Картине'}
  },
  bonds:{ev:0,vu:0,ue:0,portrait:'Не создан'}
}}
function mergeDefaults(v){const d=defaults(); if(!v) return d;
  const out=Object.assign(d,JSON.parse(JSON.stringify(v)));
  for(const k of ['clocks','words','arts','bonds']) out[k]=Object.assign(defaults()[k],v[k]||{});
  out.pcs=Object.assign(defaults().pcs,v.pcs||{});
  for(const p of Object.keys(defaults().pcs)) out.pcs[p]=Object.assign(defaults().pcs[p],(v.pcs||{})[p]||{});
  return out}
store.trackers=mergeDefaults(store.trackers);

/* ---------- navigation ---------- */

/* roll on dX tables */
function addRollButtons(root){
  root.querySelectorAll('.tbl').forEach(t=>{
    const th=t.querySelector('th'); if(!th) return;
    const m=th.textContent.trim().match(/^(?:1?d)(\d+)$/i); if(!m) return;
    const sides=+m[1]; const rows=[...t.querySelectorAll('tbody tr')];
    const wrap=document.createElement('div'); wrap.className='roll-row';
    const b=document.createElement('button'); b.className='btn small'; b.textContent='Бросить d'+sides;
    b.addEventListener('click',()=>{const r=1+Math.floor(Math.random()*sides);rows.forEach(x=>x.classList.remove('rolled'));
      const row=rows.find(x=>{const c=x.cells[0].textContent.trim();if(c==String(r))return true;const mm=c.match(/^(\d+)\D+(\d+)$/);return mm&&r>=+mm[1]&&r<=+mm[2]});
      b.textContent='Выпало '+r+' · бросить ещё'; if(row){row.classList.add('rolled');row.scrollIntoView({block:'nearest',behavior:'smooth'})}});
    wrap.appendChild(b); t.after(wrap);
  });
}

/* ---------- search ---------- */
const q=$('#q');
q.addEventListener('input',()=>debounce('search',runSearch,180));
function norm(t){return t.toLowerCase().replace(/ё/g,'е')}
function runSearch(){
  const term=q.value.trim(); if(term.length<2){ if(view==='ref') renderSection(current||S[0].id); return }
  const nt=norm(term);
  const res=[];
  S.forEach(s=>{const hay=norm(s.title+' '+s.text);let i=hay.indexOf(nt),c=0,first=-1;while(i>=0){c++;if(first<0)first=i;i=hay.indexOf(nt,i+nt.length)}
    const note=((store.notes[s.key]||{}).text||''); const inNote=norm(note).includes(nt);
    if(c||inNote){const src=s.title+' '+s.text;const st=Math.max(0,first-70);res.push({s,c,inNote,snip:first>=0?(st?'…':'')+src.slice(st,first+nt.length+90)+'…':''})}});
  res.sort((a,b)=>b.c-a.c);
  view='ref'; document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view==='ref')));
  page.innerHTML=`<div class="crumbs">Поиск</div><h1>«${esc(term)}»</h1><div class="hint">${res.length?`Найдено в ${res.length} разделах`:'Ничего не найдено. Попробуйте другое слово или часть слова.'}</div>
   <div class="results">${res.map(r=>`<button class="res" data-id="${r.s.id}"><b>${esc(cap(r.s.title))}</b> <span class="hint">${r.c} совп.${r.inNote?' · есть в заметках':''}</span><div class="snip">${hl(esc(r.snip),term)}</div></button>`).join('')}</div>`;
  page.querySelectorAll('.res').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.id,term);const m=page.querySelector('mark');if(m) m.scrollIntoView({block:'center'})}));
}
function hl(html,term){const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[её]/gi,'[её]'),'gi');return html.replace(re,m=>'<mark>'+m+'</mark>')}
function markText(root,term){
  const re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[её]/gi,'[её]'),'gi');
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(w.nextNode()) if(re.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
  nodes.forEach(n=>{re.lastIndex=0;const f=document.createDocumentFragment();let last=0,m;const v=n.nodeValue;while((m=re.exec(v))){f.append(v.slice(last,m.index));const mk=document.createElement('mark');mk.textContent=m[0];f.append(mk);last=m.index+m[0].length}f.append(v.slice(last));n.replaceWith(f)});
  const first=root.querySelector('mark'); if(first) setTimeout(()=>first.scrollIntoView({block:'center'}),30);
}

function evalDice(expr){
  const s=expr.replace(/\s+/g,'').toLowerCase().replace(/д/g,'d'); if(!/^[0-9d+\-]+$/.test(s)) return null;
  let total=0,parts=[];const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g;let m,used=0;
  while((m=re.exec(s))){used+=m[0].length;if(m[3]){const c=+(m[2]||1),f=+m[3];if(c>100||f>1000)return null;const r=[];for(let i=0;i<c;i++)r.push(roll(f));const sum=r.reduce((a,b)=>a+b,0);const sg=m[1]==='-'?-1:1;total+=sg*sum;parts.push((m[1]||'')+c+'d'+f+'['+r.join(',')+']')}else{const sg=m[4]==='-'?-1:1;total+=sg*(+m[5]);parts.push((m[4]||'+')+m[5])}}
  if(used!==s.length) return null; return {total,detail:parts.join(' ')};
}
function pushHist(label,res){diceHist.unshift(label+' → '+res);diceHist=diceHist.slice(0,20);local.set('dice',diceHist)}
function renderTools(){
  const cheat=S.find(s=>s.title.startsWith('ШПАРГАЛКА'));
  page.innerHTML=`<div class="crumbs">За столом</div><h1>Инструменты</h1>
  <div class="grid">
    <section class="card"><h3>Кости</h3>
      <div class="dice">${[4,6,8,10,12,20,100].map(n=>`<button class="die" data-d="${n}">d${n}</button>`).join('')}</div>
      <div class="dice" style="margin-top:8px"><button class="die" data-adv="1">d20 с преимуществом</button><button class="die" data-adv="-1">d20 с помехой</button></div>
      <form id="exprF" class="row" style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="expr" placeholder="2d6+3" style="flex:1;min-width:0" aria-label="Формула броска"><button class="btn">Бросить</button></form>
      <div class="result" id="dRes">—</div><div class="hint" id="dDet">&nbsp;</div>
      <div class="hist" id="dHist">${diceHist.map(esc).join('<br>')}</div>
    </section>
    <section class="card"><h3>Инициатива</h3>
      <form id="iniF" style="display:flex;gap:6px;flex-wrap:wrap"><input class="inp" id="iniN" placeholder="Имя" style="flex:1 1 120px;min-width:0" aria-label="Имя"><input class="inp" id="iniV" type="number" placeholder="Иниц." style="width:5.5em" aria-label="Инициатива"><button class="btn">Добавить</button></form>
      <ul class="init-list" id="iniL"></ul>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn small" id="iniNext">Следующий ход</button><button class="btn small" id="iniSort">Сортировать</button><button class="btn small" id="iniClr">Очистить</button></div>
      <div class="hint" style="margin-top:6px">Хиты можно править прямо в списке.</div>
    </section>
    <section class="card music"><h3>Музыка</h3>${D.music.map(m=>`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.scene)}<small>${esc(m.where)}</small></a>`).join('')}</section>
  </div>
  ${cheat?`<h2 class="section-title" style="margin-top:28px">Шпаргалка мастера</h2><div>${cheat.html}</div>`:''}`;
  page.querySelectorAll('.die').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.d){const n=+b.dataset.d,r=roll(n);$('#dRes').textContent=r;$('#dDet').textContent='d'+n;pushHist('d'+n,r)}
    else{const a=roll(20),c=roll(20),adv=b.dataset.adv==='1';const r=adv?Math.max(a,c):Math.min(a,c);$('#dRes').textContent=r;$('#dDet').textContent=(adv?'преимущество':'помеха')+' ['+a+', '+c+']';pushHist('d20 '+(adv?'преим.':'помеха'),r)}
    $('#dHist').innerHTML=diceHist.map(esc).join('<br>')}));
  $('#exprF').addEventListener('submit',e=>{e.preventDefault();const x=$('#expr').value;const r=evalDice(x);if(!r){$('#dDet').textContent='Не понял формулу. Пример: 2d6+3 или 1d20-1';return}$('#dRes').textContent=r.total;$('#dDet').textContent=r.detail;pushHist(x,r.total);$('#dHist').innerHTML=diceHist.map(esc).join('<br>')});
  const L=$('#iniL');
  function drawInit(){L.innerHTML=init.map((c,i)=>`<li class="${i===turn?'turn':''}"><span class="val" style="text-align:left">${esc(c.v)}</span><span>${esc(c.n)}</span><input type="text" value="${esc(c.hp||'')}" data-i="${i}" placeholder="хиты" aria-label="Хиты ${esc(c.n)}"><button class="btn small" data-rm="${i}" aria-label="Убрать ${esc(c.n)}">×</button></li>`).join('')||'<li class="empty">Добавьте участников боя.</li>';local.set('init',init);local.set('turn',turn)}
  drawInit();
  $('#iniF').addEventListener('submit',e=>{e.preventDefault();const n=$('#iniN').value.trim();if(!n)return;init.push({n,v:$('#iniV').value||roll(20),hp:''});$('#iniN').value='';$('#iniV').value='';drawInit()});
  L.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){init.splice(+b.dataset.rm,1);if(turn>=init.length)turn=0;drawInit()}});
  L.addEventListener('input',e=>{const i=e.target.dataset.i;if(i!=null){init[+i].hp=e.target.value;local.set('init',init)}});
  $('#iniNext').addEventListener('click',()=>{if(init.length){turn=(turn+1)%init.length;drawInit()}});
  $('#iniSort').addEventListener('click',()=>{init.sort((a,b)=>(+b.v)-(+a.v));turn=0;drawInit()});
  $('#iniClr').addEventListener('click',()=>{init=[];turn=0;drawInit()});
  addRollButtons(page);
  $('#notesFor').textContent='Общие заметки кампании'; const ta=$('#noteText'); ta.dataset.key='general'; ta.value=(store.notes.general||{}).text||'';
}

/* ---------- players mode ---------- */
const pb=$('#playersBtn');
function setPlayers(on){document.body.classList.toggle('players',on);pb.setAttribute('aria-pressed',String(on));local.set('players',on)}
pb.addEventListener('click',()=>setPlayers(pb.getAttribute('aria-pressed')!=='true'));
setPlayers(!!local.get('players',false));

/* ---------- boot ---------- */
const start=(location.hash||'').slice(1);
current=byId[start]?start:(local.get('last',null)&&byId[local.get('last',null)]?local.get('last',null):(S.find(s=>s.title.startsWith('МАСТЕРСКАЯ'))||S[0]).id);
go(current);
setStatus(modeLabel());
connect();
})();
</script>
</body></html>
