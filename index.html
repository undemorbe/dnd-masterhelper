ка к «Услышать Весть»<\/td><\/tr><tr><td><strong>Письмо Ирены к Нериссе<\/strong><\/td><td>Комната Нериссы<\/td><td>Поворот линии Нериссы<\/td><\/tr><tr><td><strong>Первая краска<\/strong> (1 заряд)<\/td><td>Оранжерея, банка с меткой «И.»<\/td><td>Как заряд флакона, но <strong>без Мазка<\/strong><\/td><\/tr><tr><td><strong>Яблоко с нарисованной яблони<\/strong> (3)<\/td><td>Сад<\/td><td>Восстанавливает 2d8 хитов и снимает 1 уровень истощения; не портится<\/td><\/tr><tr><td><strong>Линза первого телескопа<\/strong><\/td><td>Чердак<\/td><td>Ключ к Обсерватории<\/td><\/tr><tr><td><strong>Скальпель Элиаса (детский)<\/strong><\/td><td>Детская<\/td><td>Кинжал 1d4; хирургическое; Элиас заплачет, увидев его<\/td><\/tr><tr><td><strong>Кисть Сайласа (детская)<\/strong><\/td><td>Детская<\/td><td>Фокус для заклинаний; 1 раз в день — нарисовать мелкий предмет, который существует 1 минуту<\/td><\/tr><tr><td><strong>Список целей культа<\/strong><\/td><td>Подвал<\/td><td>Часы Культа −2<\/td><\/tr><tr><td><strong>Мантия Равного<\/strong><\/td><td>Подвал<\/td><td>Носитель неотличим от культиста, пока молчит; но 1 Отголосок Зависти за каждый день ношения<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-10\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Маленький Сайлас<\/strong><\/td><td>Нарисованный ребёнок, который не знает, что он нарисован. Забрать — он выцветет вне дома. Оставить — культ использует его как заложника против настоящего Сайласа. Стереть — милосердие или убийство?<\/td><\/tr><tr><td><strong>Нерисса: письмо<\/strong><\/td><td>Отдать письмо — шанс спасти её, но и риск: если она прочитает его в гневе, может решить, что мать её <strong>не любила<\/strong><\/td><\/tr><tr><td><strong>Роль Эстела<\/strong><\/td><td>Дом даёт Эстелу семью. Если он доиграет роль до конца, дом предложит <strong>остаться<\/strong> — по-настоящему. Это почти то, чего он хотел<\/td><\/tr><tr><td><strong>Сжечь дом<\/strong><\/td><td>Штаб культа уничтожен, Часы Культа −3. Но вместе с домом сгорят нянька Грета (она не уйдёт) и всё, что помнит о семье Вейл<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s19-11\">Личные крючки<\/h2><ul><li><strong>Эстел:<\/strong> роль «сына»; детские рисунки — похожие он рисовал для сестры.<\/li><li><strong>Велисса:<\/strong> клетка в подвале сделана под неё — по размеру крыльев. В оранжерее — банка краски, которой её писали.<\/li><li><strong>Ума:<\/strong> на звёздных картах Ирены отмечена Белая чаща как «место, где весть уходит к фэйри».<\/li><\/ul>", "toc": [["s19-1", "Атмосфера"], ["s19-2", "Правило локации: Роли"], ["s19-3", "Зоны"], ["s19-4", "Ключевые NPC"], ["s19-5", "Ловушки"], ["s19-6", "Сюжетные линии"], ["s19-7", "Квесты"], ["s19-8", "Мини-босс: Дом Вейлов"], ["s19-9", "Находки"], ["s19-10", "Тяжёлые выборы"], ["s19-11", "Личные крючки"]], "text": "Тип: сюжетная локация Акта II. Эмоции: Тоска и Зависть (семейные). Рекомендуемый уровень: 6–8. Музыка: Внутри здания, Библиотека, Туман / гром. Родовое поместье семьи Вейл на скале у края Кратера. Здесь выросли Сайлас и Элиас, сюда вернулась Нерисса. Дом пуст сорок лет — и всё это время ждёт свою семью . Сейчас в подвалах поместья — штаб культа Равных на полуострове. Тайна · только для мастера После падения Посланца Ирена Вейл сделала дом своей лабораторией. Касание Посланца пропитало стены: дом помнит , кто в нём жил, и пытается снова собрать семью. Любой, кто переступит порог, получает в доме роль . Нерисса использует это: здесь она снова «младшая дочь», которую наконец любят, — дом даёт ей то, чего не дала мать. Атмосфера Накрытый на пятерых стол; еда свежая, хотя никто не готовил. Детские рисунки на стенах: на одних кисть, на других скальпель. На рисунках Нериссы нет ничего — пустые листы. Часы во всех комнатах показывают время падения Посланца. В саду цветёт нарисованная яблоня — первое, что маленький Сайлас «оживил». Её яблоки не гниют. Правило локации: Роли Важно При входе каждый герой получает от дома роль (мастер выбирает или бросает 1d6): 1 — сын-художник, 2 — сын-врач, 3 — младшая дочь, 4 — мать, 5 — слуга, 6 — гость. Пока герой играет роль , дом к нему добр: двери открываются, ловушки спят. Если герой выходит из роли (атакует члена «семьи», отказывается сесть за стол, говорит «я не ваш»), — спасбросок Мудрости СЛ 14. Провал: 1 Отголосок Тоски и дом становится враждебным в этой комнате. Совет мастеру Роли — отличный инструмент для ролевой игры. Пусть Эстел, ищущий семью, получит роль «сына», и пусть дом будет ему настоящей семьёй . Это ловушка, которую он захочет не заметить. Зоны Зона Что там Опасность Столовая Стол на пятерых; портрет семьи, где лица Ирены и мужа закрашены Ужин: кто ест, тот получает роль навсегда (спасбросок Харизмы СЛ 14) Детская Две колыбели — с вырезанной кистью и со скальпелем; третья, сломанная, в углу Игрушки-нарисованные, просят поиграть Кабинет Ирены Звёздные карты, образцы краски из кратера, дневник Охрана культа; запертый сейф Комната Нериссы Сожжённые портреты братьев; её единственный рисунок — пустая рама Нерисса (если дома) Оранжерея Нарисованная яблоня, банки с первой краской Ожившие растения Подвал-часовня Штаб культа: карты, список артефактов, клетка для Велиссы Культисты, Равные без лиц Чердак-обсерватория Первый телескоп Ирены Ключ к Обсерватории «Звёздный Колодец» Ключевые NPC Нерисса Вейл — дома Здесь Нерисса уязвима : дом зовёт её «доченькой», и она не может себя заставить уйти. Она хранит письмо матери , которое так и не вскрыла. Что хочет: чтобы братья признали её. Чтобы мать её увидела. Культ обещал, что после Уравнения «больше никто не будет любим сильнее». Нянька Грета Человек, очень старая, почти слепая. Вырастила всех троих детей. Жива и живёт в домике садовника. Помнит, как Ирена вернулась из кратера «с чужим светом в глазах». Помнит, как маленький Сайлас нарисовал ей птицу, и та улетела. Функция: рассказывает о семье; знает, где Ирена спрятала дневник; любит Нериссу, но боится её. Второстепенные NPC NPC Кто Крючок / функция Маленький Сайлас Нарисованный мальчик лет восьми — автопортрет, оживший случайно Играет в детской. Знает, где спрятана «первая краска». Не знает, что он нарисован. Квартирмейстер Ордо Культист, лицо стёрто наполовину Хранит список целей культа: Велисса, Кисточка, Сайлас. Можно подкупить или запугать. Слуга-без-лица Равный, бывший дворецкий Всё ещё подаёт на стол. Если назвать его по имени (найти в книге слуг), он вспоминает себя и помогает Телескоп «Ирена» Механизм с голосом Отвечает на вопросы только тем, у кого роль «мать» Ловушки Ловушка Описание Обход Семейный ужин Кто ест за столом — роль становится постоянной до конца сцены, даже вне дома (спасбросок Харизмы СЛ 14) Есть «понарошку» (Ловкость рук СЛ 13) Колыбельная В детской играет музыкальная шкатулка. Спасбросок Мудрости СЛ 13 или персонаж засыпает на 1 минуту Сломать шкатулку; заткнуть уши Пустая рама Нериссы Смотрящий в раму видит себя «никем» — 1d10 психического урона и помеха на следующую проверку Завесить; Нерисса может «снять» эффект Сейф Ирены Открывается звёздной картой (Обсерватория) или кровью Вейла. Ошибка — вспышка 4d6 излучения Кровь Сайласа (с холста), Элиаса или Нериссы Часы падения Все часы бьют разом: на 1 раунд время останавливается для всех, кроме «членов семьи» Иметь роль; Мастихин режет остановку Сюжетные линии Дневник Ирены. Ирена знала, что эмоций десять и что весть — предупреждение. Она пыталась собрать их с любовью , а не силой, и не успела. Её дневник даёт партии подсказку к концовке «Услышать Весть». Письмо матери. Нерисса не вскрывала письмо 30 лет. В нём Ирена пишет, что дар не передала Нериссе специально , чтобы уберечь её: «Я хотела, чтобы хоть одна из моих детей была просто живой». Если Нерисса его прочитает — её линия поворачивает. Клетка для Велиссы. Культ готов к похищению. Сорвать подготовку — значит выиграть время; не заметить — Велиссу попытаются похитить в ближайшую передышку. Ключ к Обсерватории. Без первого телескопа Ирены Эларис не сможет точно рассчитать Ночь Звезды. Без него ритуал придётся проводить наугад. Квесты Квест Кто даёт Суть Награда «Дневник Ирены» (основной) Нянька Грета Найти дневник в сейфе Знание о десяти эмоциях; подсказка к «Услышать Весть» «Доченька» Дом Убедить Нериссу вскрыть письмо Нерисса колеблется или переходит на сторону героев «Цели культа» Квартирмейстер Ордо Выкрасть список и планы культа Часы Культа −2 «Маленький Сайлас» — Решить, что делать с нарисованным ребёнком См. тяжёлые выборы «Ключ к звёздам» Телескоп «Ирена» Снять линзу первого телескопа Точная дата ритуала Мини-босс: Дом Вейлов Параметр Значение Хиты 120 (сам дом; урон наносится по «сердцу» — портрету семьи в столовой) Особенность В каждой комнате 1 раз за раунд дом атакует мебелью, дверьми, лестницей (+7, 2d8 дробящего) Подготовка «Семейный сбор»: дом запирает все двери и стягивает всех в столовую. Если не прервать — каждый герой без роли получает 3d10 психического урона Прерывание Кто-то с ролью «мать» или «сын» говорит дому: «Мы дома». Или портрет семьи пробит Мастихином Надлом Каждое правдивое слово о семье Вейл, сказанное в столовой, — жетон Надлома Находки Предмет Где Эффект Дневник Ирены Сейф Сюжетный; подсказка к «Услышать Весть» Письмо Ирены к Нериссе Комната Нериссы Поворот линии Нериссы Первая краска (1 заряд) Оранжерея, банка с меткой «И.» Как заряд флакона, но без Мазка Яблоко с нарисованной яблони (3) Сад Восстанавливает 2d8 хитов и снимает 1 уровень истощения; не портится Линза первого телескопа Чердак Ключ к Обсерватории Скальпель Элиаса (детский) Детская Кинжал 1d4; хирургическое; Элиас заплачет, увидев его Кисть Сайласа (детская) Детская Фокус для заклинаний; 1 раз в день — нарисовать мелкий предмет, который существует 1 минуту Список целей культа Подвал Часы Культа −2 Мантия Равного Подвал Носитель неотличим от культиста, пока молчит; но 1 Отголосок Зависти за каждый день ношения Тяжёлые выборы Выбор Почему тяжело Маленький Сайлас Нарисованный ребёнок, который не знает, что он нарисован. Забрать — он выцветет вне дома. Оставить — культ использует его как заложника против настоящего Сайласа. Стереть — милосердие или убийство? Нерисса: письмо Отдать письмо — шанс спасти её, но и риск: если она прочитает его в гневе, может решить, что мать её не любила Роль Эстела Дом даёт Эстелу семью. Если он доиграет роль до конца, дом предложит остаться — по-настоящему. Это почти то, чего он хотел Сжечь дом Штаб культа уничтожен, Часы Культа −3. Но вместе с домом сгорят нянька Грета (она не уйдёт) и всё, что помнит о семье Вейл Личные крючки Эстел: роль «сына»; детские рисунки — похожие он рисовал для сестры. Велисса: клетка в подвале сделана под неё — по размеру крыльев. В оранжерее — банка краски, которой её писали. Ума: на звёздных картах Ирены отмечена Белая чаща как «место, где весть уходит к фэйри»."}, {"id": "s20", "n": 20, "title": "НЕКРОПОЛЬ ОСИРИСА", "disp": "Некрополь Осириса", "group": "Акт II", "html": "<p><strong>Тип:<\/strong> сюжетная локация Акта II (линия Тесори). <strong>Эмоция:<\/strong> нет — здесь властвует смерть. <strong>Рекомендуемый уровень:<\/strong> 7–9. <strong>Музыка:<\/strong> Церковь, Пещеры, Hunter Nightmare.<\/p><p>Полузатопленный храмовый город на южном побережье. Сотни лет назад сюда приплывали жрецы Осириса хоронить королей. Сейчас вода заливает нижние залы дважды в сутки, и только верхние галереи остаются сухими. Здесь Осирис <strong>ближе всего<\/strong> к миру живых — и здесь можно с ним говорить.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Осирис отдал Тесори приказ потому, что нарисованные <strong>сломали цикл смерти<\/strong>: они умирают и возвращаются копиями, а их сердца нельзя взвесить. Для бога суда это не зло, а дыра в мироздании. В некрополе хранится <strong>Перо Истины<\/strong> — им Осирис когда-то мерил сердца. Тот, кто его держит, может <strong>объявить живым<\/strong> то, что Осирис считал мёртвым. Это единственный способ отменить приказ, не убивая Тесори.<\/p><\/div><h2 id=\"s20-1\">Атмосфера<\/h2><ul><li>Солёная вода по щиколотку, плеск в темноте, запах ладана и водорослей.<\/li><li>Статуи с головами шакалов смотрят на воду; у одной из них лицо Тесори.<\/li><li>Скарабеи из лазурита ползают по стенам — живые.<\/li><li>Во время прилива слышно, как под водой кто-то читает имена.<\/li><\/ul><h2 id=\"s20-2\">Правило локации: Взвешивание<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> В некрополе ведите для каждого героя <strong>Тяжесть сердца<\/strong> (0–5). +1 за ложь, сказанную в храме; +1 за убийство разумного существа в храме; +1 за нарушенное слово, данное за всю кампанию (мастер может напомнить). −1 за правду, которая стоила персонажу чего-то. В Зале Весов: при Тяжести 3+ сердце перевешивает — <strong>Пожиратель<\/strong> выбирает этого героя первой целью.<\/p><\/div><p><strong>Прилив:<\/strong> каждые 4 часа нижние залы затопляет на 1 час. Застигнутые водой — спасбросок Телосложения СЛ 13 каждый раунд или 1d10 урона (удушье).<\/p><h2 id=\"s20-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><th>Опасность<\/th><\/tr><\/thead><tbody><tr><td>Лестница Имён<\/td><td>Ступени, на каждой — имя умершего<\/td><td>Ступени с именами нарисованных — пустые; наступивший проваливается<\/td><\/tr><tr><td>Зал Шакалов<\/td><td>Статуи-судьи<\/td><td>Оживают, если в зале солгать<\/td><\/tr><tr><td>Затопленная галерея<\/td><td>Саркофаги под водой<\/td><td>Прилив; утопленники<\/td><\/tr><tr><td>Ладья Душ<\/td><td>Каменная лодка на подземной реке<\/td><td>Перевозчик берёт плату — воспоминание<\/td><\/tr><tr><td>Скрипторий Мёртвых<\/td><td>Книга, где записаны все умершие острова<\/td><td>Здесь нет имён нарисованных: их смерть не записана<\/td><\/tr><tr><td>Зал Весов<\/td><td>Огромные весы, Перо Истины<\/td><td>Пожиратель<\/td><\/tr><tr><td>Комната Паладина<\/td><td>Гробница предшественника Тесори<\/td><td>Призрак Сет-Хара<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s20-4\">Ключевые NPC<\/h2><h3>Жрица Анхесет<\/h3><ul><li>Последняя живая служительница Осириса на острове. Очень старая, кожа как пергамент, глаза подведены чёрным.<\/li><li>Знает Тесори: он учился здесь, прежде чем получил приказ.<\/li><li>Считает приказ справедливым — но признаёт, что Осирис <strong>может ошибаться<\/strong>, если ему предъявить доказательство.<\/li><li><strong>Что хочет:<\/strong> чтобы порядок смерти был восстановлен. Ей всё равно как — уничтожением или признанием нарисованных живыми.<\/li><\/ul><h3>Сет-Хар — призрак паладина<\/h3><ul><li>Паладин Осириса, исполнивший похожий приказ сто лет назад: уничтожил деревню «неправильно мёртвых». Не может уйти — его сердце перевешивает.<\/li><li>Предупреждает: «Тесори станет мной. Я был прав по закону и проклят по сути.»<\/li><li>Если героям удастся облегчить его сердце (найти выживших из той деревни — их потомки живут в Мглине), он уходит и оставляет свой <strong>щит<\/strong>.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Крючок / функция<\/th><\/tr><\/thead><tbody><tr><td>Перевозчик<\/td><td>Безликий лодочник Ладьи Душ<\/td><td>Перевозит за воспоминание. Знает имена всех, кого перевёз, — включая мать Эстела, которую он <strong>не перевозил<\/strong>: значит, она жива<\/td><\/tr><tr><td>Нарисованная утопленница<\/td><td>Девушка из Города-Картины, попавшая сюда после «смерти»<\/td><td>Не может ни умереть, ни вернуться. Просит героев решить её судьбу<\/td><\/tr><tr><td>Писец Мертвых<\/td><td>Мумия за книгой<\/td><td>Вписывает имя в Книгу Мёртвых — за плату. Вписанный нарисованный получает <strong>настоящую смерть<\/strong> (и покой)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s20-5\">Ловушки<\/h2><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Ступени нарисованных<\/td><td>Ступени без имён проваливаются: 3d6 дробящего, падение в воду<\/td><td>Внимательность СЛ 14; идти только по именам<\/td><\/tr><tr><td>Шакалы<\/td><td>Ложь в Зале Шакалов: статуи атакуют (2 статуи, по 40 хитов, +8, 2d10)<\/td><td>Не лгать; молчать<\/td><\/tr><tr><td>Прилив<\/td><td>См. правило<\/td><td>Знать расписание (Анхесет)<\/td><\/tr><tr><td>Рой скарабеев<\/td><td>Лазуритовые жуки пожирают плоть: 2d6 в начале хода в рое<\/td><td>Огонь; соль Палимпсеста<\/td><\/tr><tr><td>Ложная дверь<\/td><td>Нарисованная на камне дверь для душ. Живой, прошедший сквозь неё, — на 1 минуту «мёртв» (недееспособен, но видит души)<\/td><td>Не проходить; или пройти намеренно, чтобы поговорить с мёртвыми<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s20-6\">Сюжетные линии<\/h2><ol><li><strong>Перо Истины.<\/strong> Добыть Перо можно, лишь пройдя Взвешивание. Перо одноразово: им можно объявить живым <strong>одно<\/strong> нарисованное существо или <strong>один<\/strong> город целиком, если доказательства достаточно весомы (см. Суд Осириса, Акт III).<\/li><li><strong>Голос Тесори.<\/strong> Через разбитый амулет Осириса (из Башни, починенный в Обители) здесь Тесори слышно ясно. Он может сказать, где он в Картине и что приказ сделал с ним.<\/li><li><strong>Книга Мёртвых.<\/strong> Здесь можно дать нарисованным <strong>настоящую смерть<\/strong> — покой вместо бесконечных копий. Для кого-то это милосердие.<\/li><\/ol><h2 id=\"s20-7\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Перо Истины» (основной)<\/td><td>Анхесет<\/td><td>Пройти Взвешивание<\/td><td>Перо Истины<\/td><\/tr><tr><td>«Деревня Сет-Хара»<\/td><td>Сет-Хар<\/td><td>Найти потомков уничтоженной деревни<\/td><td>Щит Сет-Хара; урок для Тесори<\/td><\/tr><tr><td>«Утопленница»<\/td><td>Нарисованная утопленница<\/td><td>Дать ей покой или вернуть в Картину<\/td><td>Покой: Тяжесть −1 всем. Возврат: она станет союзницей в Акте III<\/td><\/tr><tr><td>«Голос из холста»<\/td><td>Анхесет<\/td><td>Починить амулет и поговорить с Тесори<\/td><td>Тесори узнаёт, что приказ можно оспорить<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s20-8\">Босс: Пожиратель Сердец<\/h2><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>140 (уровень 7) / 180 (уровень 9)<\/td><\/tr><tr><td>КД<\/td><td>16<\/td><\/tr><tr><td>Облик<\/td><td>Крокодилья пасть, львиное тело, задние ноги гиппопотама. Из пасти пахнет пеплом<\/td><\/tr><tr><td>Атака<\/td><td>Укус 3d10 колющего; хвост 2d8 дробящего, сбивает с ног<\/td><\/tr><tr><td>Подготовка<\/td><td>«Поглощение сердца»: выбирает героя с наибольшей Тяжестью. Если не прервать — 6d10 некротического урона, а при падении до 0 хитов герой не может быть стабилизирован обычными средствами<\/td><\/tr><tr><td>Прерывание<\/td><td>Цель говорит вслух <strong>правду, которую скрывала от партии<\/strong>. Или кто-то кладёт на весы Перо до удара<\/td><\/tr><tr><td>Надлом<\/td><td>Каждая сказанная в бою правда снижает Тяжесть говорящего на 1 и даёт жетон Надлома<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s20-9\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Перо Истины<\/strong><\/td><td>Зал Весов<\/td><td>Объявить одно нарисованное существо или город живым в глазах Осириса (одноразово)<\/td><\/tr><tr><td><strong>Щит Сет-Хара<\/strong><\/td><td>Комната Паладина<\/td><td>Щит +1; 1 раз в день — реакцией отменить некротический урон по союзнику<\/td><\/tr><tr><td><strong>Анх из лазурита<\/strong><\/td><td>Саркофаг верховного жреца<\/td><td>1 раз: персонаж, упавший до 0 хитов, вместо этого остаётся с 1 хитом<\/td><\/tr><tr><td><strong>Мазь бальзамировщика<\/strong> (3)<\/td><td>Скрипторий Мёртвых<\/td><td>Снимает 1 малую травму без лекаря<\/td><\/tr><tr><td><strong>Скарабей в смоле<\/strong><\/td><td>Затопленная галерея<\/td><td>Если раздавить — 1 минуту сопротивление некротическому урону<\/td><\/tr><tr><td><strong>Погребальная маска<\/strong><\/td><td>Гробница<\/td><td>Носитель не может лгать, но и не может быть обманут ложью (знает, когда ему лгут)<\/td><\/tr><tr><td><strong>Свиток имён деревни<\/strong><\/td><td>Скрипторий Мёртвых<\/td><td>Квест Сет-Хара<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s20-10\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Для кого Перо<\/strong><\/td><td>Перо одно. Объявить живой <strong>Велиссу<\/strong>? <strong>Весь нарисованный город<\/strong>? <strong>Фредерика<\/strong>? Город требует доказательства на суде, а Велисса — нет<\/td><\/tr><tr><td><strong>Книга Мёртвых<\/strong><\/td><td>Вписать нарисованную утопленницу — она обретёт покой и исчезнет. Не вписать — она будет вечно стоять в воде. Её решение: «Я не знаю. Решите вы»<\/td><\/tr><tr><td><strong>Правда в бою<\/strong><\/td><td>Прерывание Пожирателя требует вслух сказать то, что скрываешь от партии. Ума — о ребёнке. Эстел — о том, что он хочет убить Корвина. Велисса — о «питомцах»<\/td><\/tr><tr><td><strong>Приказ Тесори<\/strong><\/td><td>Анхесет говорит: приказ можно отменить, но тогда Тесори <strong>потеряет покровителя<\/strong> и силу, данную Осирисом. Спросите игрока Тесори (если он вернётся)<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s20-1", "Атмосфера"], ["s20-2", "Правило локации: Взвешивание"], ["s20-3", "Зоны"], ["s20-4", "Ключевые NPC"], ["s20-5", "Ловушки"], ["s20-6", "Сюжетные линии"], ["s20-7", "Квесты"], ["s20-8", "Босс: Пожиратель Сердец"], ["s20-9", "Находки"], ["s20-10", "Тяжёлые выборы"]], "text": "Тип: сюжетная локация Акта II (линия Тесори). Эмоция: нет — здесь властвует смерть. Рекомендуемый уровень: 7–9. Музыка: Церковь, Пещеры, Hunter Nightmare. Полузатопленный храмовый город на южном побережье. Сотни лет назад сюда приплывали жрецы Осириса хоронить королей. Сейчас вода заливает нижние залы дважды в сутки, и только верхние галереи остаются сухими. Здесь Осирис ближе всего к миру живых — и здесь можно с ним говорить. Тайна · только для мастера Осирис отдал Тесори приказ потому, что нарисованные сломали цикл смерти : они умирают и возвращаются копиями, а их сердца нельзя взвесить. Для бога суда это не зло, а дыра в мироздании. В некрополе хранится Перо Истины — им Осирис когда-то мерил сердца. Тот, кто его держит, может объявить живым то, что Осирис считал мёртвым. Это единственный способ отменить приказ, не убивая Тесори. Атмосфера Солёная вода по щиколотку, плеск в темноте, запах ладана и водорослей. Статуи с головами шакалов смотрят на воду; у одной из них лицо Тесори. Скарабеи из лазурита ползают по стенам — живые. Во время прилива слышно, как под водой кто-то читает имена. Правило локации: Взвешивание Важно В некрополе ведите для каждого героя Тяжесть сердца (0–5). +1 за ложь, сказанную в храме; +1 за убийство разумного существа в храме; +1 за нарушенное слово, данное за всю кампанию (мастер может напомнить). −1 за правду, которая стоила персонажу чего-то. В Зале Весов: при Тяжести 3+ сердце перевешивает — Пожиратель выбирает этого героя первой целью. Прилив: каждые 4 часа нижние залы затопляет на 1 час. Застигнутые водой — спасбросок Телосложения СЛ 13 каждый раунд или 1d10 урона (удушье). Зоны Зона Что там Опасность Лестница Имён Ступени, на каждой — имя умершего Ступени с именами нарисованных — пустые; наступивший проваливается Зал Шакалов Статуи-судьи Оживают, если в зале солгать Затопленная галерея Саркофаги под водой Прилив; утопленники Ладья Душ Каменная лодка на подземной реке Перевозчик берёт плату — воспоминание Скрипторий Мёртвых Книга, где записаны все умершие острова Здесь нет имён нарисованных: их смерть не записана Зал Весов Огромные весы, Перо Истины Пожиратель Комната Паладина Гробница предшественника Тесори Призрак Сет-Хара Ключевые NPC Жрица Анхесет Последняя живая служительница Осириса на острове. Очень старая, кожа как пергамент, глаза подведены чёрным. Знает Тесори: он учился здесь, прежде чем получил приказ. Считает приказ справедливым — но признаёт, что Осирис может ошибаться , если ему предъявить доказательство. Что хочет: чтобы порядок смерти был восстановлен. Ей всё равно как — уничтожением или признанием нарисованных живыми. Сет-Хар — призрак паладина Паладин Осириса, исполнивший похожий приказ сто лет назад: уничтожил деревню «неправильно мёртвых». Не может уйти — его сердце перевешивает. Предупреждает: «Тесори станет мной. Я был прав по закону и проклят по сути.» Если героям удастся облегчить его сердце (найти выживших из той деревни — их потомки живут в Мглине), он уходит и оставляет свой щит . Второстепенные NPC NPC Кто Крючок / функция Перевозчик Безликий лодочник Ладьи Душ Перевозит за воспоминание. Знает имена всех, кого перевёз, — включая мать Эстела, которую он не перевозил : значит, она жива Нарисованная утопленница Девушка из Города-Картины, попавшая сюда после «смерти» Не может ни умереть, ни вернуться. Просит героев решить её судьбу Писец Мертвых Мумия за книгой Вписывает имя в Книгу Мёртвых — за плату. Вписанный нарисованный получает настоящую смерть (и покой) Ловушки Ловушка Описание Обход Ступени нарисованных Ступени без имён проваливаются: 3d6 дробящего, падение в воду Внимательность СЛ 14; идти только по именам Шакалы Ложь в Зале Шакалов: статуи атакуют (2 статуи, по 40 хитов, +8, 2d10) Не лгать; молчать Прилив См. правило Знать расписание (Анхесет) Рой скарабеев Лазуритовые жуки пожирают плоть: 2d6 в начале хода в рое Огонь; соль Палимпсеста Ложная дверь Нарисованная на камне дверь для душ. Живой, прошедший сквозь неё, — на 1 минуту «мёртв» (недееспособен, но видит души) Не проходить; или пройти намеренно, чтобы поговорить с мёртвыми Сюжетные линии Перо Истины. Добыть Перо можно, лишь пройдя Взвешивание. Перо одноразово: им можно объявить живым одно нарисованное существо или один город целиком, если доказательства достаточно весомы (см. Суд Осириса, Акт III). Голос Тесори. Через разбитый амулет Осириса (из Башни, починенный в Обители) здесь Тесори слышно ясно. Он может сказать, где он в Картине и что приказ сделал с ним. Книга Мёртвых. Здесь можно дать нарисованным настоящую смерть — покой вместо бесконечных копий. Для кого-то это милосердие. Квесты Квест Кто даёт Суть Награда «Перо Истины» (основной) Анхесет Пройти Взвешивание Перо Истины «Деревня Сет-Хара» Сет-Хар Найти потомков уничтоженной деревни Щит Сет-Хара; урок для Тесори «Утопленница» Нарисованная утопленница Дать ей покой или вернуть в Картину Покой: Тяжесть −1 всем. Возврат: она станет союзницей в Акте III «Голос из холста» Анхесет Починить амулет и поговорить с Тесори Тесори узнаёт, что приказ можно оспорить Босс: Пожиратель Сердец Параметр Значение Хиты 140 (уровень 7) / 180 (уровень 9) КД 16 Облик Крокодилья пасть, львиное тело, задние ноги гиппопотама. Из пасти пахнет пеплом Атака Укус 3d10 колющего; хвост 2d8 дробящего, сбивает с ног Подготовка «Поглощение сердца»: выбирает героя с наибольшей Тяжестью. Если не прервать — 6d10 некротического урона, а при падении до 0 хитов герой не может быть стабилизирован обычными средствами Прерывание Цель говорит вслух правду, которую скрывала от партии . Или кто-то кладёт на весы Перо до удара Надлом Каждая сказанная в бою правда снижает Тяжесть говорящего на 1 и даёт жетон Надлома Находки Предмет Где Эффект Перо Истины Зал Весов Объявить одно нарисованное существо или город живым в глазах Осириса (одноразово) Щит Сет-Хара Комната Паладина Щит +1; 1 раз в день — реакцией отменить некротический урон по союзнику Анх из лазурита Саркофаг верховного жреца 1 раз: персонаж, упавший до 0 хитов, вместо этого остаётся с 1 хитом Мазь бальзамировщика (3) Скрипторий Мёртвых Снимает 1 малую травму без лекаря Скарабей в смоле Затопленная галерея Если раздавить — 1 минуту сопротивление некротическому урону Погребальная маска Гробница Носитель не может лгать, но и не может быть обманут ложью (знает, когда ему лгут) Свиток имён деревни Скрипторий Мёртвых Квест Сет-Хара Тяжёлые выборы Выбор Почему тяжело Для кого Перо Перо одно. Объявить живой Велиссу ? Весь нарисованный город ? Фредерика ? Город требует доказательства на суде, а Велисса — нет Книга Мёртвых Вписать нарисованную утопленницу — она обретёт покой и исчезнет. Не вписать — она будет вечно стоять в воде. Её решение: «Я не знаю. Решите вы» Правда в бою Прерывание Пожирателя требует вслух сказать то, что скрываешь от партии. Ума — о ребёнке. Эстел — о том, что он хочет убить Корвина. Велисса — о «питомцах» Приказ Тесори Анхесет говорит: приказ можно отменить, но тогда Тесори потеряет покровителя и силу, данную Осирисом. Спросите игрока Тесори (если он вернётся)"}, {"id": "s21", "n": 21, "title": "ТИХИЕ ОЧАГИ", "disp": "Тихие очаги", "group": "Акт II", "html": "<p>Тихие эмоции слабее Великих, у них нет наместников в культе и нет частей ритуала. Зато они ближе к героям: каждая отзывается в ком-то из партии. Тихие очаги — это <strong>короткие локации на 1–2 сессии<\/strong>, которые встречаются на дорогах Акта II между большими локациями. Их можно пропустить, но тогда Слова Вести останутся неполными, а у Умы, Эстела и Велиссы не будет своих сцен.<\/p><div class=\"tbl\"><table><thead><tr><th>Очаг<\/th><th>Эмоция<\/th><th>Слово<\/th><th>Где<\/th><th>Уровень<\/th><th>Чей очаг<\/th><\/tr><\/thead><tbody><tr><td>Белая чаща<\/td><td>Страх<\/td><td>«поэтому»<\/td><td>Лес у границы со страной фэйри, между Мглином и Обителью<\/td><td>4–6<\/td><td><strong>Ума<\/strong><\/td><\/tr><tr><td>Сад Статуй<\/td><td>Гордыня<\/td><td>«Совершенное»<\/td><td>Заброшенное поместье на холмах у Бастиона<\/td><td>5–7<\/td><td><strong>Ума<\/strong><\/td><\/tr><tr><td>Ледяная мельница<\/td><td>Оцепенение<\/td><td>«мертво»<\/td><td>Замёрзшие солончаки к северу от Зверинца<\/td><td>5–7<\/td><td><strong>Эстел<\/strong>, Велисса<\/td><\/tr><tr><td>— (носитель)<\/td><td>Желание<\/td><td>«живы»<\/td><td>Велисса<\/td><td>вся кампания<\/td><td><strong>Велисса<\/strong><\/td><\/tr><tr><td>— (носитель)<\/td><td>Нежность<\/td><td>«и»<\/td><td>Кисточка<\/td><td>после Зверинца<\/td><td>вся партия<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s21-1\">Белая чаща — Страх<\/h2><p>Берёзовый лес, где стволы белые, как кость, а листья не шумят. Здесь тонкая граница с <strong>страной фэйри<\/strong>: кольца грибов, тропы, которые ведут «на ту сторону». Именно через Белую чащу чудовища уходят в родную страну Умы.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Пастух<\/strong> — мальчик лет десяти в маске оленя, сбежавший из чумного Гравенхольма. Он так боялся, что Страх стал его <strong>стадом<\/strong>: всё, чего он пугается, оживает и бродит за ним. Чтобы спастись, он <strong>гонит чудовищ прочь — за границу, в страну фэйри<\/strong>. Нападения на родину Умы устраивает не армия и не злой бог, а испуганный ребёнок.<\/p><\/div><h3>Правило очага: За спиной<\/h3><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый час в чаще — спасбросок Мудрости СЛ 13. Провал: <strong>1 Отголосок Страха<\/strong>, и за спиной персонажа начинает идти <strong>его личный страх<\/strong> (мастер описывает шаги, дыхание, голос). Оглянуться — значит дать страху тело: появляется враг. Не оглядываться — помеха на Внимательность до конца часа. Факел или фонарь показывает, что за спиной <strong>никого нет<\/strong>, но только пока горит.<\/p><\/div><h3>Кто здесь<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Пастух<\/strong><\/td><td>Мальчик в маске оленя<\/td><td>Источник Страха. Убегает от героев. Говорит только из-за деревьев.<\/td><\/tr><tr><td><strong>Капитан Ирвель<\/strong><\/td><td>Фэйри, командир Умы<\/td><td>Пришёл с патрулём через грибное кольцо. Приказ: найти «источник» и уничтожить. Не знает, что это ребёнок.<\/td><\/tr><tr><td><strong>Совиный старик<\/strong><\/td><td>Отшельник-друид<\/td><td>Живёт в дупле. Знает, что «стадо» слушается только того, кто перестал бояться.<\/td><\/tr><tr><td><strong>Беглые охотники<\/strong><\/td><td>Отряд Бастиона<\/td><td>Охотятся на фэйри ради крыльев (связь с Залом Трофеев).<\/td><\/tr><\/tbody><\/table><\/div><h3>Ловушки и опасности<\/h3><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Тропа-петля<\/td><td>Тропа возвращает к той же берёзе с зарубкой. Через три круга — 1 уровень истощения<\/td><td>Идти с закрытыми глазами за тем, кто держит верёвку; мел на стволах не помогает — зарубки «переползают»<\/td><\/tr><tr><td>Знакомый голос<\/td><td>Из чащи зовёт кто-то близкий (сестра Эстела, офицер Умы, Сайлас для Велиссы). Спасбросок Мудрости СЛ 13 или персонаж уходит на голос<\/td><td>Связать; заткнуть уши; ответить голосу по имени<\/td><\/tr><tr><td>Оленьи капканы<\/td><td>Капканы охотников на фэйри: 2d6 колющего, опутан, спасбросок Силы СЛ 13<\/td><td>Внимательность СЛ 14<\/td><\/tr><tr><td>Грибное кольцо<\/td><td>Наступивший переносится на «ту сторону» на 1d4 часа. Для Умы и Велиссы — <strong>дом зовёт<\/strong>, спасбросок Харизмы СЛ 12, чтобы вернуться<\/td><td>Обойти; посыпать солью<\/td><\/tr><\/tbody><\/table><\/div><h3>Мини-босс: Стадо<\/h3><p>Существо из всех страхов партии. Оно меняет форму: для Эстела — клетка и серпы, для Умы — падающий ребёнок, для Велиссы — огонь и солнце.<\/p><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>60 (уровень 4) / 90 (уровень 6)<\/td><\/tr><tr><td>Подготовка<\/td><td>«Паника»: все в 9 м — спасбросок Мудрости СЛ 14, провал: испуганы и тратят ход на бегство<\/td><\/tr><tr><td>Прерывание<\/td><td>Персонаж <strong>называет вслух свой страх<\/strong> (реальный, о персонаже), выходит вперёд и не отступает<\/td><\/tr><tr><td>Надлом<\/td><td>Каждый герой, назвавший страх, даёт жетон Надлома. При трёх жетонах Стадо распадается на обычных лесных зверей<\/td><\/tr><\/tbody><\/table><\/div><h3>Решения<\/h3><div class=\"tbl\"><table><thead><tr><th>Решение<\/th><th>Итог<\/th><th>Слово «поэтому»<\/th><\/tr><\/thead><tbody><tr><td>Успокоить Пастуха: показать, что его не накажут, забрать с собой (в хоспис к Элиасу)<\/td><td>Стадо исчезает. Нападения на страну фэйри <strong>уменьшаются вдвое<\/strong>. Ирвель недоволен: «Ты пожалела врага.»<\/td><td>Чисто<\/td><\/tr><tr><td>Убить Пастуха (приказ Ирвеля)<\/td><td>Нападения прекращаются, но Ума получает <strong>1 Отголосок Страха<\/strong> и кошмары. Ирвель доволен. Для Умы это повтор её старой ошибки: снова ребёнок, который «не полетел».<\/td><td>Надтреснуто<\/td><\/tr><tr><td>Уйти, оставив всё как есть<\/td><td>Нападения продолжаются. Ирвель запоминает отказ.<\/td><td>Не получено<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s21-2\">Сад Статуй — Гордыня<\/h2><p>Заброшенное поместье героя старой войны на холмах. В саду — сотни мраморных статуй в лучших позах: полководцы, поэты, красавицы, дети с наградами. Все они — <strong>живые люди<\/strong>, застывшие в момент своей гордости.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Хозяин поместья, <strong>Генерал Октавиан Мрамор<\/strong>, спас полуостров от набега сорок лет назад и не смог пережить, что его забыли. Гордыня Посланца дала ему то, о чём он мечтал: стать памятником. Теперь он предлагает то же самое всем, кто приходит. Для Умы, которая хочет, чтобы её ставили в пример «прапраправнукам», это зеркало и искушение.<\/p><\/div><h3>Правило очага: Пьедестал<\/h3><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый раз, когда персонаж получает <strong>критическое попадание, побеждает в состязании или получает похвалу<\/strong>, — спасбросок Телосложения СЛ 13. Провал: <strong>1 Отголосок Гордыни<\/strong> и окаменение части тела (скорость −3 м до конца сцены). При 3 провалах подряд персонаж застывает статуей. Расколдовать можно, если <strong>кто-то искренне его не похвалит, а пожалеет<\/strong> (или растворителем — но это больно: 2d6).<\/p><\/div><h3>Кто здесь<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Генерал Мрамор<\/strong><\/td><td>Живая статуя, Сосуд Гордыни<\/td><td>Встречает героев с почестями. Предлагает Уме «звание, которое не отнять».<\/td><\/tr><tr><td><strong>Агата-скульптор<\/strong><\/td><td>Старуха, вдова мастера<\/td><td>Когда-то вырезала настоящие статуи. Знает, как снять окаменение. Ненавидит генерала.<\/td><\/tr><tr><td><strong>Адъютант Брен<\/strong><\/td><td>Статуя у ворот<\/td><td>Шепчет, кто из статуй ещё в сознании. Просит его освободить.<\/td><\/tr><tr><td><strong>Статуя-ребёнок<\/strong><\/td><td>Девочка с медалью «за лучший полёт»<\/td><td>Фэйри-ребёнок, застывший на пике прыжка. Ума её узнает: такие медали дают кадетам её страны.<\/td><\/tr><\/tbody><\/table><\/div><h3>Ловушки<\/h3><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Аллея аплодисментов<\/td><td>Статуи хлопают, когда проходишь мимо. Спасбросок Мудрости СЛ 13 или ошеломлён на 1 раунд (персонаж «принимает овации»)<\/td><td>Идти, опустив голову; сделать что-то нелепое<\/td><\/tr><tr><td>Пустой пьедестал<\/td><td>Надпись: «Здесь будет ваше имя». Вставший на него — правило Пьедестала с помехой<\/td><td>Не вставать; поставить на него чужой предмет<\/td><\/tr><tr><td>Зеркало триумфа<\/td><td>Показывает персонажа в момент его будущей славы. Кто смотрит дольше раунда — не хочет уходить<\/td><td>Разбить; закрыть тканью<\/td><\/tr><tr><td>Табличка с именем<\/td><td>Таблички на постаментах меняются на имена героев<\/td><td>Стереть имя — Агата говорит, что это «отказ от памятника» и защищает от окаменения<\/td><\/tr><\/tbody><\/table><\/div><h3>Мини-босс: Генерал Мрамор<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>90 (уровень 5) / 120 (уровень 7)<\/td><\/tr><tr><td>КД<\/td><td>18 (мрамор)<\/td><\/tr><tr><td>Подготовка<\/td><td>«Парадный удар»: генерал принимает торжественную позу и объявляет цель. Если не прервать — 4d10 дробящего и окаменение цели на 1 раунд<\/td><\/tr><tr><td>Прерывание<\/td><td><strong>Равнодушие:<\/strong> все герои в ход подготовки отворачиваются от него и не атакуют. Гордыня не выносит, когда на неё не смотрят. Альтернатива — дробящий урон 20+<\/td><\/tr><tr><td>Надлом<\/td><td>Каждое «отворачивание» и каждый удар по его <strong>постаменту<\/strong> (а не по нему) — жетон Надлома<\/td><\/tr><\/tbody><\/table><\/div><h3>Решения<\/h3><div class=\"tbl\"><table><thead><tr><th>Решение<\/th><th>Итог<\/th><th>Слово «Совершенное»<\/th><\/tr><\/thead><tbody><tr><td>Убедить генерала, что его помнят (найти в Обители или у Веспера летопись о его подвиге)<\/td><td>Генерал сходит с постамента и стареет за минуту. Статуи оживают.<\/td><td>Чисто<\/td><\/tr><tr><td>Разбить генерала<\/td><td>Статуи остаются статуями, Агата их освободит за месяц<\/td><td>Надтреснуто<\/td><\/tr><tr><td>Ума принимает звание<\/td><td>Ума получает навсегда +1 к Запугиванию и Убеждению с солдатами, но её мраморная копия остаётся в саду, и <strong>Генерал может говорить с ней через статую<\/strong> до конца кампании<\/td><td>Не получено<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s21-3\">Ледяная мельница — Оцепенение<\/h2><p>Замёрзшие солончаки к северу от Зверинца. Посреди белой пустоши стоит ветряная мельница, крылья которой крутятся без ветра. Вокруг — деревня, где жители <strong>стоят на улицах и спят стоя<\/strong>, покрытые инеем. Они не умерли: они просто перестали чувствовать.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> <strong>Мельник Хальвар<\/strong> потерял жену и дочь во время чумы. Он смолол своё горе в муку, а муку — в лёд. Оцепенение Посланца сделало то, о чём он просил: чтобы больше ничего не болело. Для Эстела, который годами учился быть холодным, чтобы выжить, это прямое зеркало: «Вот куда ведёт твоя хладнокровность».<\/p><\/div><h3>Правило очага: Тепло<\/h3><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый час на холоде — спасбросок Телосложения СЛ 13 или 1 уровень истощения. <strong>Огонь не греет<\/strong> — это холод внутри. Согревает только <strong>настоящее чувство<\/strong>: игрок описывает искреннее воспоминание, страх, радость или признание своего персонажа (не меньше пары предложений). Тогда персонаж снимает 1 уровень истощения и получает <strong>Тепло<\/strong> — до конца часа он защищён. Персонаж с 1+ Отголоском Оцепенения не может согреться сам: ему нужно, чтобы чувство рассказал <strong>другой<\/strong> персонаж о нём.<\/p><\/div><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Этот очаг держится на ролевой игре. Подготовьте игрокам вопросы: «Что Эстел помнит о сестре?», «Когда Ума в последний раз плакала?», «Чего Велисса боится больше солнца?» Хороший ответ стоит дороже любой проверки.<\/p><\/div><h3>Кто здесь<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td><strong>Мельник Хальвар<\/strong><\/td><td>Сосуд Оцепенения<\/td><td>Вежлив, пуст, говорит ровным голосом. Предлагает героям «смолоть» их боль.<\/td><\/tr><tr><td><strong>Девочка, которая не плачет<\/strong><\/td><td>Призрак дочери мельника<\/td><td>Появляется у колодца. Хочет, чтобы отец заплакал. Видна только тем, у кого есть Тепло.<\/td><\/tr><tr><td><strong>Стоящие<\/strong><\/td><td>Жители деревни<\/td><td>Можно разбудить чувством. Разбуженный сначала кричит от боли, потом благодарит.<\/td><\/tr><tr><td><strong>Торговец из Зверинца<\/strong><\/td><td>Обмороженный беглец<\/td><td>Сбежал от Лукреции. Знает тайный вход в её личную коллекцию.<\/td><\/tr><\/tbody><\/table><\/div><h3>Ловушки<\/h3><div class=\"tbl\"><table><thead><tr><th>Ловушка<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Мучной снег<\/td><td>Белая пыль с мельницы: вдохнувший теряет одно чувство (вкус, боль, страх) на день. Боль — значит, мастер скрывает хиты<\/td><td>Маска чумного доктора; мокрая ткань<\/td><\/tr><tr><td>Ледяной колокол<\/td><td>Звонит, если рядом громко смеются или плачут. Все Стоящие поворачиваются и идут на звук<\/td><td>Чувствовать тихо<\/td><\/tr><tr><td>Жернов<\/td><td>Внутри мельницы. Упавший — 4d10 дробящего, теряет 1 воспоминание (как Забвение)<\/td><td>Акробатика СЛ 14<\/td><\/tr><tr><td>Тонкий лёд<\/td><td>Солончаки под снегом. Провалившийся — 2d6 холода в ход<\/td><td>Шест, верёвка<\/td><\/tr><\/tbody><\/table><\/div><h3>Мини-босс: Ледяной жернов (Мельник)<\/h3><div class=\"tbl\"><table><thead><tr><th>Параметр<\/th><th>Значение<\/th><\/tr><\/thead><tbody><tr><td>Хиты<\/td><td>80 (уровень 5) / 110 (уровень 7)<\/td><\/tr><tr><td>Сопротивление<\/td><td>Холод, психический урон, все попытки испугать или очаровать<\/td><\/tr><tr><td>Подготовка<\/td><td>«Безмолвие»: крылья мельницы останавливаются. Если не прервать — все в 18 м теряют реакции и бонусные действия на 2 раунда, получают 3d8 холода<\/td><\/tr><tr><td>Прерывание<\/td><td>Заставить его <strong>почувствовать<\/strong>: показать дочь, зеркало Велиссы (показывает его желание), Нежность Кисточки, рассказ Эстела о сестре<\/td><\/tr><tr><td>Надлом<\/td><td>Каждое прерывание — Хальвар роняет одну слезу; при трёх слезах лёд трескается, и бой можно закончить разговором<\/td><\/tr><\/tbody><\/table><\/div><h3>Решения<\/h3><div class=\"tbl\"><table><thead><tr><th>Решение<\/th><th>Итог<\/th><th>Слово «мертво»<\/th><\/tr><\/thead><tbody><tr><td>Мельник заплакал<\/td><td>Деревня просыпается. Хальвар остаётся жить с болью — и благодарит. Эстел получает <strong>ключ к своей слабости<\/strong> (см. раздел 33)<\/td><td>Чисто<\/td><\/tr><tr><td>Разрушить мельницу<\/td><td>Холод уходит, жители оттаивают, но Хальвар умирает<\/td><td>Надтреснуто<\/td><\/tr><tr><td>Эстел соглашается «смолоть» свою боль<\/td><td>Эстел больше никогда не боится и не страдает. Он также больше не может получить вдохновение и не помнит лица сестры<\/td><td>Не получено<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s21-4\">Желание и Нежность — носители<\/h2><p><strong>Желание<\/strong> живёт в <strong>Велиссе<\/strong>. Его Слово («живы») получают не в бою: оно звучит, когда Велисса <strong>принимает решение о своей незаконченности<\/strong> (см. раздел 33). Если Велиссу похитит культ, слово окажется «у врага».<\/p><p><strong>Нежность<\/strong> живёт в <strong>Кисточке<\/strong>. Слово («и») звучит чисто, если партия <strong>хоть раз выпустит Кисточку из клетки по доброй воле и он вернётся сам<\/strong>. Для этого нужна сцена доверия: накормить, не запирать на ночь, защитить от Лукреции или Нериссы. Если Кисточку только перевозят в клетке до самого ритуала — слово надтреснуто.<\/p><h2 id=\"s21-5\">Находки Тихих очагов<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Очаг<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Маска оленя Пастуха<\/strong><\/td><td>Белая чаща<\/td><td>Звери и чудовища Страха не нападают первыми на носителя; носитель получает помеху на спасброски от испуга<\/td><\/tr><tr><td><strong>Фэйский плащ<\/strong><\/td><td>Белая чаща (Ирвель)<\/td><td>Преимущество на Скрытность в лесу<\/td><\/tr><tr><td><strong>Совиное перо<\/strong><\/td><td>Белая чаща (Совиный старик)<\/td><td>1 раз: видеть в темноте 1 час, включая цвета<\/td><\/tr><tr><td><strong>Медаль «за лучший полёт»<\/strong><\/td><td>Сад Статуй<\/td><td>Ума: если вручить спасённому ребёнку — Уза с ним; фэйри-ребёнок становится её «эхом»<\/td><\/tr><tr><td><strong>Мраморная пыль<\/strong><\/td><td>Сад Статуй<\/td><td>Бросок: цель скована (−3 м скорости) на 1 раунд<\/td><\/tr><tr><td><strong>Резец Агаты<\/strong><\/td><td>Сад Статуй<\/td><td>Снимает окаменение; оружие 1d4 колющий, против каменных существ +1d6<\/td><\/tr><tr><td><strong>Мешок «тёплой муки»<\/strong><\/td><td>Ледяная мельница<\/td><td>Хлеб из неё снимает 1 Отголосок Оцепенения<\/td><\/tr><tr><td><strong>Ледяной жернов (осколок)<\/strong><\/td><td>Ледяная мельница<\/td><td>Материал: свойство «Морозное» (+1d4 холода, замедление)<\/td><\/tr><tr><td><strong>Колокольчик Стоящих<\/strong><\/td><td>Ледяная мельница<\/td><td>Будит спящего, очарованного или оцепеневшего союзника<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s21-1", "Белая чаща — Страх"], ["s21-2", "Сад Статуй — Гордыня"], ["s21-3", "Ледяная мельница — Оцепенение"], ["s21-4", "Желание и Нежность — носители"], ["s21-5", "Находки Тихих очагов"]], "text": "Тихие эмоции слабее Великих, у них нет наместников в культе и нет частей ритуала. Зато они ближе к героям: каждая отзывается в ком-то из партии. Тихие очаги — это короткие локации на 1–2 сессии , которые встречаются на дорогах Акта II между большими локациями. Их можно пропустить, но тогда Слова Вести останутся неполными, а у Умы, Эстела и Велиссы не будет своих сцен. Очаг Эмоция Слово Где Уровень Чей очаг Белая чаща Страх «поэтому» Лес у границы со страной фэйри, между Мглином и Обителью 4–6 Ума Сад Статуй Гордыня «Совершенное» Заброшенное поместье на холмах у Бастиона 5–7 Ума Ледяная мельница Оцепенение «мертво» Замёрзшие солончаки к северу от Зверинца 5–7 Эстел , Велисса — (носитель) Желание «живы» Велисса вся кампания Велисса — (носитель) Нежность «и» Кисточка после Зверинца вся партия Белая чаща — Страх Берёзовый лес, где стволы белые, как кость, а листья не шумят. Здесь тонкая граница с страной фэйри : кольца грибов, тропы, которые ведут «на ту сторону». Именно через Белую чащу чудовища уходят в родную страну Умы. Тайна · только для мастера Пастух — мальчик лет десяти в маске оленя, сбежавший из чумного Гравенхольма. Он так боялся, что Страх стал его стадом : всё, чего он пугается, оживает и бродит за ним. Чтобы спастись, он гонит чудовищ прочь — за границу, в страну фэйри . Нападения на родину Умы устраивает не армия и не злой бог, а испуганный ребёнок. Правило очага: За спиной Важно Каждый час в чаще — спасбросок Мудрости СЛ 13. Провал: 1 Отголосок Страха , и за спиной персонажа начинает идти его личный страх (мастер описывает шаги, дыхание, голос). Оглянуться — значит дать страху тело: появляется враг. Не оглядываться — помеха на Внимательность до конца часа. Факел или фонарь показывает, что за спиной никого нет , но только пока горит. Кто здесь NPC Кто Функция Пастух Мальчик в маске оленя Источник Страха. Убегает от героев. Говорит только из-за деревьев. Капитан Ирвель Фэйри, командир Умы Пришёл с патрулём через грибное кольцо. Приказ: найти «источник» и уничтожить. Не знает, что это ребёнок. Совиный старик Отшельник-друид Живёт в дупле. Знает, что «стадо» слушается только того, кто перестал бояться. Беглые охотники Отряд Бастиона Охотятся на фэйри ради крыльев (связь с Залом Трофеев). Ловушки и опасности Ловушка Описание Обход Тропа-петля Тропа возвращает к той же берёзе с зарубкой. Через три круга — 1 уровень истощения Идти с закрытыми глазами за тем, кто держит верёвку; мел на стволах не помогает — зарубки «переползают» Знакомый голос Из чащи зовёт кто-то близкий (сестра Эстела, офицер Умы, Сайлас для Велиссы). Спасбросок Мудрости СЛ 13 или персонаж уходит на голос Связать; заткнуть уши; ответить голосу по имени Оленьи капканы Капканы охотников на фэйри: 2d6 колющего, опутан, спасбросок Силы СЛ 13 Внимательность СЛ 14 Грибное кольцо Наступивший переносится на «ту сторону» на 1d4 часа. Для Умы и Велиссы — дом зовёт , спасбросок Харизмы СЛ 12, чтобы вернуться Обойти; посыпать солью Мини-босс: Стадо Существо из всех страхов партии. Оно меняет форму: для Эстела — клетка и серпы, для Умы — падающий ребёнок, для Велиссы — огонь и солнце. Параметр Значение Хиты 60 (уровень 4) / 90 (уровень 6) Подготовка «Паника»: все в 9 м — спасбросок Мудрости СЛ 14, провал: испуганы и тратят ход на бегство Прерывание Персонаж называет вслух свой страх (реальный, о персонаже), выходит вперёд и не отступает Надлом Каждый герой, назвавший страх, даёт жетон Надлома. При трёх жетонах Стадо распадается на обычных лесных зверей Решения Решение Итог Слово «поэтому» Успокоить Пастуха: показать, что его не накажут, забрать с собой (в хоспис к Элиасу) Стадо исчезает. Нападения на страну фэйри уменьшаются вдвое . Ирвель недоволен: «Ты пожалела врага.» Чисто Убить Пастуха (приказ Ирвеля) Нападения прекращаются, но Ума получает 1 Отголосок Страха и кошмары. Ирвель доволен. Для Умы это повтор её старой ошибки: снова ребёнок, который «не полетел». Надтреснуто Уйти, оставив всё как есть Нападения продолжаются. Ирвель запоминает отказ. Не получено Сад Статуй — Гордыня Заброшенное поместье героя старой войны на холмах. В саду — сотни мраморных статуй в лучших позах: полководцы, поэты, красавицы, дети с наградами. Все они — живые люди , застывшие в момент своей гордости. Тайна · только для мастера Хозяин поместья, Генерал Октавиан Мрамор , спас полуостров от набега сорок лет назад и не смог пережить, что его забыли. Гордыня Посланца дала ему то, о чём он мечтал: стать памятником. Теперь он предлагает то же самое всем, кто приходит. Для Умы, которая хочет, чтобы её ставили в пример «прапраправнукам», это зеркало и искушение. Правило очага: Пьедестал Важно Каждый раз, когда персонаж получает критическое попадание, побеждает в состязании или получает похвалу , — спасбросок Телосложения СЛ 13. Провал: 1 Отголосок Гордыни и окаменение части тела (скорость −3 м до конца сцены). При 3 провалах подряд персонаж застывает статуей. Расколдовать можно, если кто-то искренне его не похвалит, а пожалеет (или растворителем — но это больно: 2d6). Кто здесь NPC Кто Функция Генерал Мрамор Живая статуя, Сосуд Гордыни Встречает героев с почестями. Предлагает Уме «звание, которое не отнять». Агата-скульптор Старуха, вдова мастера Когда-то вырезала настоящие статуи. Знает, как снять окаменение. Ненавидит генерала. Адъютант Брен Статуя у ворот Шепчет, кто из статуй ещё в сознании. Просит его освободить. Статуя-ребёнок Девочка с медалью «за лучший полёт» Фэйри-ребёнок, застывший на пике прыжка. Ума её узнает: такие медали дают кадетам её страны. Ловушки Ловушка Описание Обход Аллея аплодисментов Статуи хлопают, когда проходишь мимо. Спасбросок Мудрости СЛ 13 или ошеломлён на 1 раунд (персонаж «принимает овации») Идти, опустив голову; сделать что-то нелепое Пустой пьедестал Надпись: «Здесь будет ваше имя». Вставший на него — правило Пьедестала с помехой Не вставать; поставить на него чужой предмет Зеркало триумфа Показывает персонажа в момент его будущей славы. Кто смотрит дольше раунда — не хочет уходить Разбить; закрыть тканью Табличка с именем Таблички на постаментах меняются на имена героев Стереть имя — Агата говорит, что это «отказ от памятника» и защищает от окаменения Мини-босс: Генерал Мрамор Параметр Значение Хиты 90 (уровень 5) / 120 (уровень 7) КД 18 (мрамор) Подготовка «Парадный удар»: генерал принимает торжественную позу и объявляет цель. Если не прервать — 4d10 дробящего и окаменение цели на 1 раунд Прерывание Равнодушие: все герои в ход подготовки отворачиваются от него и не атакуют. Гордыня не выносит, когда на неё не смотрят. Альтернатива — дробящий урон 20+ Надлом Каждое «отворачивание» и каждый удар по его постаменту (а не по нему) — жетон Надлома Решения Решение Итог Слово «Совершенное» Убедить генерала, что его помнят (найти в Обители или у Веспера летопись о его подвиге) Генерал сходит с постамента и стареет за минуту. Статуи оживают. Чисто Разбить генерала Статуи остаются статуями, Агата их освободит за месяц Надтреснуто Ума принимает звание Ума получает навсегда +1 к Запугиванию и Убеждению с солдатами, но её мраморная копия остаётся в саду, и Генерал может говорить с ней через статую до конца кампании Не получено Ледяная мельница — Оцепенение Замёрзшие солончаки к северу от Зверинца. Посреди белой пустоши стоит ветряная мельница, крылья которой крутятся без ветра. Вокруг — деревня, где жители стоят на улицах и спят стоя , покрытые инеем. Они не умерли: они просто перестали чувствовать. Тайна · только для мастера Мельник Хальвар потерял жену и дочь во время чумы. Он смолол своё горе в муку, а муку — в лёд. Оцепенение Посланца сделало то, о чём он просил: чтобы больше ничего не болело. Для Эстела, который годами учился быть холодным, чтобы выжить, это прямое зеркало: «Вот куда ведёт твоя хладнокровность». Правило очага: Тепло Важно Каждый час на холоде — спасбросок Телосложения СЛ 13 или 1 уровень истощения. Огонь не греет — это холод внутри. Согревает только настоящее чувство : игрок описывает искреннее воспоминание, страх, радость или признание своего персонажа (не меньше пары предложений). Тогда персонаж снимает 1 уровень истощения и получает Тепло — до конца часа он защищён. Персонаж с 1+ Отголоском Оцепенения не может согреться сам: ему нужно, чтобы чувство рассказал другой персонаж о нём. Совет мастеру Этот очаг держится на ролевой игре. Подготовьте игрокам вопросы: «Что Эстел помнит о сестре?», «Когда Ума в последний раз плакала?», «Чего Велисса боится больше солнца?» Хороший ответ стоит дороже любой проверки. Кто здесь NPC Кто Функция Мельник Хальвар Сосуд Оцепенения Вежлив, пуст, говорит ровным голосом. Предлагает героям «смолоть» их боль. Девочка, которая не плачет Призрак дочери мельника Появляется у колодца. Хочет, чтобы отец заплакал. Видна только тем, у кого есть Тепло. Стоящие Жители деревни Можно разбудить чувством. Разбуженный сначала кричит от боли, потом благодарит. Торговец из Зверинца Обмороженный беглец Сбежал от Лукреции. Знает тайный вход в её личную коллекцию. Ловушки Ловушка Описание Обход Мучной снег Белая пыль с мельницы: вдохнувший теряет одно чувство (вкус, боль, страх) на день. Боль — значит, мастер скрывает хиты Маска чумного доктора; мокрая ткань Ледяной колокол Звонит, если рядом громко смеются или плачут. Все Стоящие поворачиваются и идут на звук Чувствовать тихо Жернов Внутри мельницы. Упавший — 4d10 дробящего, теряет 1 воспоминание (как Забвение) Акробатика СЛ 14 Тонкий лёд Солончаки под снегом. Провалившийся — 2d6 холода в ход Шест, верёвка Мини-босс: Ледяной жернов (Мельник) Параметр Значение Хиты 80 (уровень 5) / 110 (уровень 7) Сопротивление Холод, психический урон, все попытки испугать или очаровать Подготовка «Безмолвие»: крылья мельницы останавливаются. Если не прервать — все в 18 м теряют реакции и бонусные действия на 2 раунда, получают 3d8 холода Прерывание Заставить его почувствовать : показать дочь, зеркало Велиссы (показывает его желание), Нежность Кисточки, рассказ Эстела о сестре Надлом Каждое прерывание — Хальвар роняет одну слезу; при трёх слезах лёд трескается, и бой можно закончить разговором Решения Решение Итог Слово «мертво» Мельник заплакал Деревня просыпается. Хальвар остаётся жить с болью — и благодарит. Эстел получает ключ к своей слабости (см. раздел 33) Чисто Разрушить мельницу Холод уходит, жители оттаивают, но Хальвар умирает Надтреснуто Эстел соглашается «смолоть» свою боль Эстел больше никогда не боится и не страдает. Он также больше не может получить вдохновение и не помнит лица сестры Не получено Желание и Нежность — носители Желание живёт в Велиссе . Его Слово («живы») получают не в бою: оно звучит, когда Велисса принимает решение о своей незаконченности (см. раздел 33). Если Велиссу похитит культ, слово окажется «у врага». Нежность живёт в Кисточке . Слово («и») звучит чисто, если партия хоть раз выпустит Кисточку из клетки по доброй воле и он вернётся сам . Для этого нужна сцена доверия: накормить, не запирать на ночь, защитить от Лукреции или Нериссы. Если Кисточку только перевозят в клетке до самого ритуала — слово надтреснуто. Находки Тихих очагов Предмет Очаг Эффект Маска оленя Пастуха Белая чаща Звери и чудовища Страха не нападают первыми на носителя; носитель получает помеху на спасброски от испуга Фэйский плащ Белая чаща (Ирвель) Преимущество на Скрытность в лесу Совиное перо Белая чаща (Совиный старик) 1 раз: видеть в темноте 1 час, включая цвета Медаль «за лучший полёт» Сад Статуй Ума: если вручить спасённому ребёнку — Уза с ним; фэйри-ребёнок становится её «эхом» Мраморная пыль Сад Статуй Бросок: цель скована (−3 м скорости) на 1 раунд Резец Агаты Сад Статуй Снимает окаменение; оружие 1d4 колющий, против каменных существ +1d6 Мешок «тёплой муки» Ледяная мельница Хлеб из неё снимает 1 Отголосок Оцепенения Ледяной жернов (осколок) Ледяная мельница Материал: свойство «Морозное» (+1d4 холода, замедление) Колокольчик Стоящих Ледяная мельница Будит спящего, очарованного или оцепеневшего союзника"}, {"id": "s22", "n": 22, "title": "АКТ III: ИЗНАНКА ХОЛСТА", "disp": "Акт III: Изнанка Холста", "group": "Акт III", "html": "<p><strong>Уровни:<\/strong> 9–11. <strong>Где:<\/strong> внутри Картины. <strong>Главный вопрос акта:<\/strong> что на самом деле внутри города, который герои несли с собой весь Акт II?<\/p><h2 id=\"s22-1\">Почему герои возвращаются в Картину<\/h2><p>К концу Акта II Картина <strong>болеет<\/strong>. Эларис (или Элиас) показывает героям: холст темнеет по краям, краска трескается, сквозь трещины проступает серый уголь. Причины:<\/p><ol><li><strong>Поглощённые эмоции.<\/strong> Каждый раз, когда партия побеждала Сосуд, Картина, лежавшая рядом, <strong>втягивала остатки его эмоции<\/strong> (это свойство Тоски). Внутри города теперь бродят Обжорство, Гнев, Зависть и Скрытность.<\/li><li><strong>Тесори.<\/strong> По приказу Осириса он «судит» нарисованных и стирает виновных. Город теряет жителей.<\/li><li><strong>Подмалёвок.<\/strong> Сайлас писал город поверх эскиза чумного Гравенхольма. Краска истончилась, и <strong>мёртвые проступают<\/strong> наружу.<\/li><\/ol><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Если не войти в Картину, она не выдержит разреза Мастихина в финале: холст порвётся, а город и все, кто в нём, погибнут. Ритуал станет невозможен (кроме концовки «Стереть»).<\/p><\/div><h2 id=\"s22-2\">Как войти<\/h2><div class=\"tbl\"><table><thead><tr><th>Способ<\/th><th>Условие<\/th><th>Цена<\/th><\/tr><\/thead><tbody><tr><td>Через Велиссу<\/td><td>Велисса касается холста и «открывает» его изнутри<\/td><td>Велисса +1 Мазок (не снимается)<\/td><\/tr><tr><td>Через Кисточку<\/td><td>Отпустить Кисточку на холст и идти за ним<\/td><td>Кисточка может не вернуться без доверия (см. Слово «и»)<\/td><\/tr><tr><td>Через раму Веспера<\/td><td>Развернуть Картину в таверне «Последняя свеча» (или в хосписе с Веспером)<\/td><td>Веспер остаётся снаружи сторожить<\/td><\/tr><tr><td>3+ Мазков<\/td><td>Герой просто шагает в холст<\/td><td>Обычные правила Мазков<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s22-3\">Правила акта<\/h2><ul><li><strong>Время.<\/strong> 1 день внутри = 1 час снаружи. Но Часы Холста внутри идут вдвое быстрее (+2 за долгую передышку).<\/li><li><strong>Снаружи.<\/strong> Холст кто-то сторожит (Элиас, Талисса, Веспер, Шаэл, Дрейвен — кого партия оставит). Раз в игровой день внутри бросьте 1d6: на 1 культ нападает на хранителя. Город сотрясается, улицы меняются, а если хранитель проиграет — Картину похитят, и герои окажутся <strong>внутри холста в руках культа<\/strong>.<\/li><li><strong>Страх нарисованных<\/strong> сохраняется с Акта I. Каждое деление — встреча с ополчением горожан.<\/li><\/ul><div class=\"box tip\"><p><span class=\"box-label\">Совет мастеру<\/span> Акт III — время платить по счетам. Каждое решение Акта I (Фредерик, портреты, «Пятна на холсте», Король Крыс) должно отозваться здесь.<\/p><\/div>", "toc": [["s22-1", "Почему герои возвращаются в Картину"], ["s22-2", "Как войти"], ["s22-3", "Правила акта"]], "text": "Уровни: 9–11. Где: внутри Картины. Главный вопрос акта: что на самом деле внутри города, который герои несли с собой весь Акт II? Почему герои возвращаются в Картину К концу Акта II Картина болеет . Эларис (или Элиас) показывает героям: холст темнеет по краям, краска трескается, сквозь трещины проступает серый уголь. Причины: Поглощённые эмоции. Каждый раз, когда партия побеждала Сосуд, Картина, лежавшая рядом, втягивала остатки его эмоции (это свойство Тоски). Внутри города теперь бродят Обжорство, Гнев, Зависть и Скрытность. Тесори. По приказу Осириса он «судит» нарисованных и стирает виновных. Город теряет жителей. Подмалёвок. Сайлас писал город поверх эскиза чумного Гравенхольма. Краска истончилась, и мёртвые проступают наружу. Важно Если не войти в Картину, она не выдержит разреза Мастихина в финале: холст порвётся, а город и все, кто в нём, погибнут. Ритуал станет невозможен (кроме концовки «Стереть»). Как войти Способ Условие Цена Через Велиссу Велисса касается холста и «открывает» его изнутри Велисса +1 Мазок (не снимается) Через Кисточку Отпустить Кисточку на холст и идти за ним Кисточка может не вернуться без доверия (см. Слово «и») Через раму Веспера Развернуть Картину в таверне «Последняя свеча» (или в хосписе с Веспером) Веспер остаётся снаружи сторожить 3+ Мазков Герой просто шагает в холст Обычные правила Мазков Правила акта Время. 1 день внутри = 1 час снаружи. Но Часы Холста внутри идут вдвое быстрее (+2 за долгую передышку). Снаружи. Холст кто-то сторожит (Элиас, Талисса, Веспер, Шаэл, Дрейвен — кого партия оставит). Раз в игровой день внутри бросьте 1d6: на 1 культ нападает на хранителя. Город сотрясается, улицы меняются, а если хранитель проиграет — Картину похитят, и герои окажутся внутри холста в руках культа . Страх нарисованных сохраняется с Акта I. Каждое деление — встреча с ополчением горожан. Совет мастеру Акт III — время платить по счетам. Каждое решение Акта I (Фредерик, портреты, «Пятна на холсте», Король Крыс) должно отозваться здесь."}, {"id": "s23", "n": 23, "title": "ПЕРЕКРАШЕННЫЙ ГРАВЕНХОЛЬМ", "disp": "Перекрашенный Гравенхольм", "group": "Акт III", "html": "<p>Город, который герои знали, стал другим. Ночи Перекраски шли без остановки. Районы захвачены поглощёнными эмоциями, в мэрии заседает суд Тесори, а Отец Вальдрик объявил <strong>Крестовый поход Чистоты<\/strong> против «пятен» — и против героев.<\/p><h2 id=\"s23-1\">Районы<\/h2><div class=\"tbl\"><table><thead><tr><th>Район<\/th><th>Что стало<\/th><th>Кто правит<\/th><\/tr><\/thead><tbody><tr><td>Площадь Мольберта<\/td><td>Рынок закрыт, на площади виселица из рам: здесь «стирают» пятна<\/td><td>Отец Вальдрик, «Бургомистр Чистоты»<\/td><\/tr><tr><td>Трущобы<\/td><td>Голодный квартал: дома «едят» жильцов (остаток Обжорства)<\/td><td>Тень Лукреции — нарисованный обжора<\/td><\/tr><tr><td>Порт<\/td><td>Красные огни, драки (остаток Гнева); здесь прячутся живые люди<\/td><td>Гримвар Дакк, теперь лидер сопротивления<\/td><\/tr><tr><td>Галерея<\/td><td>Все портреты поменялись лицами (остаток Зависти)<\/td><td>Морвен Блэкхарт, сошедшая с ума<\/td><\/tr><tr><td>Туманный квартал<\/td><td>Новый район: улицы, которых никто не помнит (остаток Скрытности)<\/td><td>Никто — или кто-то, кого никто не помнит<\/td><\/tr><tr><td>Таверна «Последняя свеча»<\/td><td>Единственное безопасное место внутри<\/td><td>Нарисованный Веспер (копия настоящего)<\/td><\/tr><tr><td>Мэрия<\/td><td>Суд Осириса<\/td><td>Тесори<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s23-2\">Знакомые NPC — что с ними стало<\/h2><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Если в Акте I…<\/th><th>…то сейчас<\/th><\/tr><\/thead><tbody><tr><td>Фредерик<\/td><td>Остался нарисованный<\/td><td>Стал правой рукой Вальдрика: «Я идеален, значит, я чист»<\/td><\/tr><tr><td>Фредерик<\/td><td>Освобождён настоящий<\/td><td>Прячется в порту, ведёт людей Гримвара<\/td><\/tr><tr><td>Фредерик<\/td><td>Слит в одного<\/td><td>Единственный, кто видит одновременно краску и уголь. Проводник в Подмалёвок<\/td><\/tr><tr><td>Иара Ноктиль<\/td><td>Копии раскрыты<\/td><td>30 Иар объявлены «пятнами» и ждут казни на площади<\/td><\/tr><tr><td>Броммир и Графиня<\/td><td>Король Крыс жив<\/td><td>Крысы — армия сопротивления<\/td><\/tr><tr><td>Нарисованный Элиас<\/td><td>—<\/td><td>Лечит раненых сопротивления. Пациенты забывают, за что сражаются<\/td><\/tr><tr><td>Каэлис<\/td><td>Голос возвращён<\/td><td>Он в Башне у Сайласа — или его стёр Тесори<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s23-3\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Виселица из рам»<\/td><td>Гримвар<\/td><td>Спасти 30 Иар (или тех, кого ждёт казнь)<\/td><td>Сопротивление — союзник; Страх нарисованных −2<\/td><\/tr><tr><td>«Бургомистр Чистоты»<\/td><td>—<\/td><td>Свергнуть Вальдрика: выдать его связь с культом горожанам<\/td><td>Площадь освобождена; Часы Холста −2<\/td><\/tr><tr><td>«Голодный квартал»<\/td><td>Броммир<\/td><td>Изгнать остаток Обжорства<\/td><td>Трущобы снова живы<\/td><\/tr><tr><td>«Улица, которой нет»<\/td><td>Нарисованный Веспер<\/td><td>Найти в Туманном квартале пропавших жителей<\/td><td>Нарисованный Веспер узнаёт правду о себе<\/td><\/tr><tr><td>«Тень Сосуда»<\/td><td>—<\/td><td>Каждый остаток эмоции — бледная копия побеждённого Сосуда. Победить её<\/td><td>Слово Вести, если раньше оно было «надтреснуто», становится чистым<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s23-4\">Ловушки и опасности<\/h2><div class=\"tbl\"><table><thead><tr><th>Опасность<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Ополчение Чистоты<\/td><td>2d4 горожан с растворителем: 1d6 урона + 1 Мазок при попадании<\/td><td>Плащ горожанина; репутация<\/td><\/tr><tr><td>Едящий дом<\/td><td>Двери трущоб захлопываются и «жуют»: 3d6 дробящего<\/td><td>Огонь, растворитель, корона крыс<\/td><\/tr><tr><td>Красный порт<\/td><td>Каждый, кто видит драку, получает 1 жетон Ярости<\/td><td>Не смотреть; Узы «Вперёд!» отменяют<\/td><\/tr><tr><td>Лица Галереи<\/td><td>Посмотревший на портрет получает чужое лицо на час<\/td><td>Синий берет<\/td><\/tr><tr><td>Двойная Перекраска<\/td><td>Улица перерисовывается во время боя; все на ней — спасбросок Ловкости СЛ 15 или «застывают» в краске на 1 раунд<\/td><td>Стоять на перекрёстке (они не перерисовываются)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s23-5\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Знамя сопротивления<\/strong><\/td><td>Порт<\/td><td>Союзники в 9 м — преимущество на спасброски от испуга<\/td><\/tr><tr><td><strong>Ряса Чистоты<\/strong><\/td><td>Церковь<\/td><td>Ополчение принимает героя за своего<\/td><\/tr><tr><td><strong>Растворитель (бочонок)<\/strong><\/td><td>Склад Вальдрика<\/td><td>10 применений; огромный рост Страха нарисованных при использовании на горожанах<\/td><\/tr><tr><td><strong>Портрет-оберег<\/strong><\/td><td>Галерея (Морвен)<\/td><td>Пока портрет цел, носитель не может получить чужое лицо<\/td><\/tr><tr><td><strong>Кинжал из рамы<\/strong><\/td><td>Площадь, виселица<\/td><td>+1 кинжал; против нарисованных +1d6<\/td><\/tr><tr><td><strong>Лаковый пузырёк<\/strong> (2)<\/td><td>Мастерская Бальрика<\/td><td>Покрыть нарисованное существо лаком: оно не может быть изменено Перекраской 1 день<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s23-6\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Правда о «пятнах»<\/strong><\/td><td>Вальдрик лжёт, но горожане ему верят. Разоблачить его — сказать городу, что он нарисован. Многие сломаются<\/td><\/tr><tr><td><strong>30 Иар<\/strong><\/td><td>Спасти всех — некуда их деть, и они начнут бороться за одно имя. Спасти одну — 29 погибнут<\/td><\/tr><tr><td><strong>Нарисованный Веспер<\/strong><\/td><td>Он не знает, что он копия. Если рассказать — он может отказаться быть безопасным местом<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s23-1", "Районы"], ["s23-2", "Знакомые NPC — что с ними стало"], ["s23-3", "Квесты"], ["s23-4", "Ловушки и опасности"], ["s23-5", "Находки"], ["s23-6", "Тяжёлые выборы"]], "text": "Город, который герои знали, стал другим. Ночи Перекраски шли без остановки. Районы захвачены поглощёнными эмоциями, в мэрии заседает суд Тесори, а Отец Вальдрик объявил Крестовый поход Чистоты против «пятен» — и против героев. Районы Район Что стало Кто правит Площадь Мольберта Рынок закрыт, на площади виселица из рам: здесь «стирают» пятна Отец Вальдрик, «Бургомистр Чистоты» Трущобы Голодный квартал: дома «едят» жильцов (остаток Обжорства) Тень Лукреции — нарисованный обжора Порт Красные огни, драки (остаток Гнева); здесь прячутся живые люди Гримвар Дакк, теперь лидер сопротивления Галерея Все портреты поменялись лицами (остаток Зависти) Морвен Блэкхарт, сошедшая с ума Туманный квартал Новый район: улицы, которых никто не помнит (остаток Скрытности) Никто — или кто-то, кого никто не помнит Таверна «Последняя свеча» Единственное безопасное место внутри Нарисованный Веспер (копия настоящего) Мэрия Суд Осириса Тесори Знакомые NPC — что с ними стало NPC Если в Акте I… …то сейчас Фредерик Остался нарисованный Стал правой рукой Вальдрика: «Я идеален, значит, я чист» Фредерик Освобождён настоящий Прячется в порту, ведёт людей Гримвара Фредерик Слит в одного Единственный, кто видит одновременно краску и уголь. Проводник в Подмалёвок Иара Ноктиль Копии раскрыты 30 Иар объявлены «пятнами» и ждут казни на площади Броммир и Графиня Король Крыс жив Крысы — армия сопротивления Нарисованный Элиас — Лечит раненых сопротивления. Пациенты забывают, за что сражаются Каэлис Голос возвращён Он в Башне у Сайласа — или его стёр Тесори Квесты Квест Кто даёт Суть Награда «Виселица из рам» Гримвар Спасти 30 Иар (или тех, кого ждёт казнь) Сопротивление — союзник; Страх нарисованных −2 «Бургомистр Чистоты» — Свергнуть Вальдрика: выдать его связь с культом горожанам Площадь освобождена; Часы Холста −2 «Голодный квартал» Броммир Изгнать остаток Обжорства Трущобы снова живы «Улица, которой нет» Нарисованный Веспер Найти в Туманном квартале пропавших жителей Нарисованный Веспер узнаёт правду о себе «Тень Сосуда» — Каждый остаток эмоции — бледная копия побеждённого Сосуда. Победить её Слово Вести, если раньше оно было «надтреснуто», становится чистым Ловушки и опасности Опасность Описание Обход Ополчение Чистоты 2d4 горожан с растворителем: 1d6 урона + 1 Мазок при попадании Плащ горожанина; репутация Едящий дом Двери трущоб захлопываются и «жуют»: 3d6 дробящего Огонь, растворитель, корона крыс Красный порт Каждый, кто видит драку, получает 1 жетон Ярости Не смотреть; Узы «Вперёд!» отменяют Лица Галереи Посмотревший на портрет получает чужое лицо на час Синий берет Двойная Перекраска Улица перерисовывается во время боя; все на ней — спасбросок Ловкости СЛ 15 или «застывают» в краске на 1 раунд Стоять на перекрёстке (они не перерисовываются) Находки Предмет Где Эффект Знамя сопротивления Порт Союзники в 9 м — преимущество на спасброски от испуга Ряса Чистоты Церковь Ополчение принимает героя за своего Растворитель (бочонок) Склад Вальдрика 10 применений; огромный рост Страха нарисованных при использовании на горожанах Портрет-оберег Галерея (Морвен) Пока портрет цел, носитель не может получить чужое лицо Кинжал из рамы Площадь, виселица +1 кинжал; против нарисованных +1d6 Лаковый пузырёк (2) Мастерская Бальрика Покрыть нарисованное существо лаком: оно не может быть изменено Перекраской 1 день Тяжёлые выборы Выбор Почему тяжело Правда о «пятнах» Вальдрик лжёт, но горожане ему верят. Разоблачить его — сказать городу, что он нарисован. Многие сломаются 30 Иар Спасти всех — некуда их деть, и они начнут бороться за одно имя. Спасти одну — 29 погибнут Нарисованный Веспер Он не знает, что он копия. Если рассказать — он может отказаться быть безопасным местом"}, {"id": "s24", "n": 24, "title": "ПОДМАЛЁВОК", "disp": "Подмалёвок", "group": "Акт III", "html": "<p>Под краской города лежит <strong>эскиз углём<\/strong> — Гравенхольм в день чумы. Здесь всё серое, тихое и мёртвое. Сквозь трещины Картины герои проваливаются <strong>вниз<\/strong>, в подмалёвок.<\/p><div class=\"box spoil\"><p><span class=\"box-label\">Тайна · только для мастера<\/span> Сайлас рисовал горожан <strong>с мёртвых<\/strong>. Каждый нарисованный житель — это лицо умершего от чумы, «исправленное» кистью. Под каждым нарисованным домом лежит настоящий, с телами. Сайлас прячется здесь и <strong>бесконечно закрашивает<\/strong> проступающих мертвецов, но уголь проступает быстрее, чем он пишет.<\/p><\/div><h2 id=\"s24-1\">Атмосфера<\/h2><ul><li>Звуков нет. Шаги не слышны. Даже собственный голос звучит как шёпот.<\/li><li>Небо — бумага. Иногда по нему проходит гигантская тень кисти.<\/li><li>Угольные силуэты мёртвых стоят там, где их застала чума: у колодца, в очереди к врачу, у детской кроватки.<\/li><li>Иногда сверху капает краска — живой город над головой.<\/li><\/ul><h2 id=\"s24-2\">Правило локации: Уголь<\/h2><div class=\"box imp\"><p><span class=\"box-label\">Важно<\/span> Каждый час в подмалёвке — спасбросок Телосложения СЛ 14 или персонаж становится <strong>угольным<\/strong>: его цвета исчезают, Мазки не действуют, но он видит мёртвых и может с ними говорить. Угольный персонаж получает помеху на атаки, но <strong>угольные мертвецы не нападают<\/strong> на него. Цвет возвращается, если коснуться живой краски (флакон, красный пигмент, Кисточка).<\/p><\/div><h2 id=\"s24-3\">Зоны<\/h2><div class=\"tbl\"><table><thead><tr><th>Зона<\/th><th>Что там<\/th><\/tr><\/thead><tbody><tr><td>Чумная очередь<\/td><td>Сотни угольных людей стоят к дому врача. В доме — <strong>молодой Элиас<\/strong> (угольный эскиз), он лечит, лечит, лечит<\/td><\/tr><tr><td>Колодец<\/td><td>Источник чумы. На дне — первая банка краски, которую Ирена принесла из кратера<\/td><\/tr><tr><td>Детская кроватка<\/td><td>Угольная семья. Над ней — нарисованная версия этой же семьи, сверху, в живом городе<\/td><\/tr><tr><td>Мастерская-в-эскизе<\/td><td>Сайлас, закрашивающий мертвецов<\/td><\/tr><tr><td>Яма<\/td><td>Общая могила. Здесь проступает уголь быстрее всего<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s24-4\">Ключевые NPC<\/h2><h3>Сайлас в подмалёвке<\/h3><ul><li>Измождён, руки в краске до локтей, синий глаз воспалён.<\/li><li>Здесь он не всемогущ: каждый мазок требует сил.<\/li><li><strong>Он слабее и честнее<\/strong>, чем на вершине Башни. Здесь с ним можно по-настоящему говорить.<\/li><li><strong>Что хочет:<\/strong> чтобы мёртвые не проступали. Чтобы никто не узнал, что город стоит на кладбище.<\/li><li><strong>Реплика:<\/strong> «Я не мог их спасти. Я мог только сделать так, чтобы они не были мёртвыми.»<\/li><\/ul><h3>Угольная Ирена<\/h3><ul><li>Эскиз матери Сайласа, сделанный им в детстве. Говорит его детскими словами.<\/li><li>Знает, чем закончить Картину правильно: «Холст надо <strong>залатать шёлком, из которого он соткан<\/strong>». Это ведёт в Акт IV.<\/li><\/ul><h3>Второстепенные NPC<\/h3><div class=\"tbl\"><table><thead><tr><th>NPC<\/th><th>Кто<\/th><th>Функция<\/th><\/tr><\/thead><tbody><tr><td>Угольный Гравенхольмец<\/td><td>Мертвец, чьё лицо носит знакомый героям нарисованный NPC<\/td><td>Просит: «Скажи ему, что я его прощаю» или «Верни мне моё лицо»<\/td><\/tr><tr><td>Молодой Элиас (эскиз)<\/td><td>Угольный<\/td><td>Повторяет: «Я опоздал». Если настоящий Элиас увидит его — ключевая сцена братьев<\/td><\/tr><tr><td>Девочка у колодца<\/td><td>Первая умершая<\/td><td>Знает, что чума пришла с краской. Ирена принесла её не со зла<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s24-5\">Квесты<\/h2><div class=\"tbl\"><table><thead><tr><th>Квест<\/th><th>Кто даёт<\/th><th>Суть<\/th><th>Награда<\/th><\/tr><\/thead><tbody><tr><td>«Залатать холст» (основной)<\/td><td>Угольная Ирена<\/td><td>Узнать, как спасти Картину<\/td><td>Путь в страну фэйри<\/td><\/tr><tr><td>«Лицо мертвеца»<\/td><td>Угольный гравенхольмец<\/td><td>Передать слова живому двойнику наверху<\/td><td>Нарисованный NPC узнаёт правду. Решение — его<\/td><\/tr><tr><td>«Колодец»<\/td><td>Девочка<\/td><td>Достать первую банку краски<\/td><td>Первая краска (без Мазков, 2 заряда)<\/td><\/tr><tr><td>«Братья»<\/td><td>—<\/td><td>Привести Элиаса (через Узы или раму) к Сайласу в подмалёвок<\/td><td>Сайлас и Элиас говорят впервые за 40 лет<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s24-6\">Опасности<\/h2><div class=\"tbl\"><table><thead><tr><th>Опасность<\/th><th>Описание<\/th><th>Обход<\/th><\/tr><\/thead><tbody><tr><td>Проступающие<\/td><td>Угольные мертвецы выходят из стен, если рядом есть цвет: 2d8 некротического<\/td><td>Стать угольным (правило локации)<\/td><\/tr><tr><td>Мазок сверху<\/td><td>Тень кисти Сайласа закрашивает участок: спасбросок Ловкости СЛ 15 или персонаж «закрашен» — перенесён наверх, в живой город<\/td><td>Уйти с тени; Сайлас может остановить кисть<\/td><\/tr><tr><td>Яма<\/td><td>Падающий в яму — 4d10 некротического и 1 уровень истощения<\/td><td>Верёвка; угольные мертвецы помогают выбраться угольному персонажу<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s24-7\">Находки<\/h2><div class=\"tbl\"><table><thead><tr><th>Предмет<\/th><th>Где<\/th><th>Эффект<\/th><\/tr><\/thead><tbody><tr><td><strong>Первая краска Ирены<\/strong><\/td><td>Колодец<\/td><td>2 заряда без Мазков<\/td><\/tr><tr><td><strong>Угольный карандаш Сайласа<\/strong><\/td><td>Мастерская-в-эскизе<\/td><td>Нарисовать на стене дверь, которая работает 1 раз (в подмалёвке — без цены)<\/td><\/tr><tr><td><strong>Повязка чумного врача<\/strong><\/td><td>Дом Элиаса<\/td><td>Иммунитет к болезням; преимущество против некротического урона<\/td><\/tr><tr><td><strong>Пепел колодца<\/strong><\/td><td>Колодец<\/td><td>Материал: свойство «Угольное» — +1d6 против нарисованных, но не работает против угольных<\/td><\/tr><tr><td><strong>Список умерших<\/strong><\/td><td>Яма<\/td><td>Все имена — для Книги Мёртвых (Некрополь)<\/td><\/tr><\/tbody><\/table><\/div><h2 id=\"s24-8\">Тяжёлые выборы<\/h2><div class=\"tbl\"><table><thead><tr><th>Выбор<\/th><th>Почему тяжело<\/th><\/tr><\/thead><tbody><tr><td><strong>Рассказать городу, на чём он стоит<\/strong><\/td><td>Правда разрушит веру горожан в свою жизнь. Ложь сохранит их счастье и предаст мёртвых<\/td><\/tr><tr><td><strong>Отдать мёртвым их лица<\/strong><\/td><td>Угольный мертвец может забрать лицо у нарисованного двойника: двойник исчезает, мертвец обретает покой<\/td><\/tr><tr><td><strong>Сайлас: помочь или остановить<\/strong><\/td><td>Помочь закрашивать — город проживёт дольше. Остановить — мёртвые проступят, и город станет честным кладбищем<\/td><\/tr><\/tbody><\/table><\/div>", "toc": [["s24
